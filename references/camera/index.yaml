# カメラ技法の目録 — 機械が読む一覧
#
# ⚠️ **これは検査（L53）のための目録である。** 人が読む解説はここには書かない——
#    **配布物は目録だけであり、二重に書けば片方だけ直して食い違う。**
#
# ⚠️ **出所。** 100項目は「AI動画のカメラワーク100選」のカード4枚を
#    書き起こしたもの。`physical` はその書き起こしからの写しであり、**速度・焦点距離・尺は
#    実務の目安である**——検索で裏が取れたのは定義と原理だけである。
#
# ⚠️ **`status: draft` は全件である。** `roles`・`functions`・`directing` は
#    **私が一般論の映画作法から当てた設計案**であり、作品の実測ではない。
#    文法目録の `provisional` と同じ心持で、**仮置きを正典と呼ばない。**
#    作品の `role` が目録と違ったときは、**作品が勝つ**——目録を直す。
#
# ⚠️ **`roles` は「使える役割の集合」であって、決定ではない。**
#    1つの技法が複数の role に使える。**1対1に潰した表は嘘になる。**
#
# ⚠️ **`travels` は「設計上、カメラの位置が変わるか」である。**
#    回転（パン・チルト・ロール）と画角（ズーム）は false。手ぶれ・手持ちも false
#    ——技法そのものが移動を要求しないからである。**これも draft の判断である。**
#
# ⚠️ **`motion_pattern` は配列である。** `停止・微細運動` のように2つを持つものがあり、
#    `機械・乗物` のように名前自体が `・` を含むものがある。
#    **綴りを割る前に、13の名に丸ごと当てる**（L53 がそうする）。
#
# ⚠️ **`grammars` は配列である。** 0枚・1枚・2枚がある。`confidence` は
#    ◎＝定義上ほぼ必然、○＝一般論でよく組む、△＝候補。

