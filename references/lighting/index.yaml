# 光の演出の目録 — 機械が読む一覧
#
# ⚠️ **これは検査（L55・L56）のための目録である。** 人が読む解説はここには書かない。
#
# ⚠️ **出所。** 100項目は「AI動画で使える 光の演出 100選」のカード4枚を書き起こしたもの。
#    **原図のカードには名前と英名しか無い**——説明の文は原図に無いので、この目録にも無い。
#    ここに在る `roles`・`functions`・`grammars`・`directing` は**私（設計者）の当てはめ**であり、
#    作品の実測ではない。`kind` だけは原図の区分（1/4〜4/4 と各ページの脚注）から来ている。
#
# ⚠️ **`status: draft` は全件である。** 作品の使い方が目録と違えば、**作品が勝つ**——
#    食い違ったら目録を直す。
#
# ⚠️ **`kind` は「この光を誰が作るか」である。** 灯＝現場の照明、自然＝太陽・空・水、
#    光学＝レンズと絞り、編集＝後処理。⚠️ **デジタル生成では「現場」が無い**——
#    区別は作業の分担ではなく、**何が起きているか**として読む。
#    ⚠️ **原図の4/4 は「編集で足す光」と一括りに名乗るが、中身は 編集10・光学14・自然1 に割れる**
#    （081 光芒は霧が要るので現場である）。**ページの名を、そのまま `kind` にしない。**
#
# ⚠️ **`name` は一意でない。** 原図で 42 と 43 が同じ「強い明暗差」である（43 の英名は
#    `Low contrast`——原図の誤植である）。**写しの側で直さない**——`en` と `source` で区別する。
#    043 の `name` は設計の表が付けた「強い明暗差（低）」である。
#
# ⚠️ **文法は `light-as-actor` だけが当たる（9件）。** このカードは
#    `references/grammars/index.yaml` で `status: provisional` である——
#    **○ は「一般論でよく組む」であって、正典ではない。**
#
# ⚠️ **`roles` は「使える役割の集合」であって、決定ではない。** 1対1に潰さない。
#
# ⚠️ **運動の型は無い。** 光はカメラでも身体でも物でもない——カメラ目録にあった
#    `motion_pattern` の列が、この目録には丸ごと無い。柱は `kind` である。

