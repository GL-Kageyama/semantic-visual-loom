# 構図の目録 — 機械が読む一覧
#
# ⚠️ **これは検査（L57）のための目録である。** 人が読む解説はここには書かない——
#    **配布物は目録だけであり、二重に書けば片方だけ直して食い違う。**
#
# ⚠️ **出所。** 100項目は「AI画像の構図100選」のカード4枚を書き起こしたもの。
#    `name`・`en`・`physical` は転記からの写しである（`physical` はカードの説明の一行）。
#
# ⚠️ **`status: draft` は全件である。** `roles`・`functions`・`grammars`・`directing` は
#    **私が一般論の構図論から当てた設計案**であり、作品の実測ではない。
#    作品の `role` が目録と違ったときは、**作品が勝つ**——目録を直す。
#
# ⚠️ **`twin` は「この技法を、もう1つの目録が持っている」という宣言である。**
#    `en` を二重に持たない——**twin を持つ項目は `en` を持たず、`en` を持つ項目は
#    twin を持たない。** 片方だけ直して、もう片方が腐るのを防ぐ。
#    ⚠️ **重なりは29件あり、これは欠陥ではない**（カメラの一覧の 026–050 と 064–075 は、
#    もともと構図の項目である）。**`en` の重複を禁じる規則ではない。**
#
# ⚠️ **`kind` は原図の副題が名乗る3つ**（構図・画角・配置）である。
#    ⚠️ **光の `kind`（灯・自然・光学・編集）とは別の問いである**——あちらは「誰が作るか」、
#    こちらは「その名が何を指すか」。**同じ鍵を、層がそれぞれの語彙で読む。**
#
# ⚠️ **`family` は原図のページ割りである**（基本の配置 001–025／視点と切り取り 026–050／
#    奥行きと見せ方 051–075／関係と強調 076–100）。
#
# ⚠️ **`population_hint` は2件だけ持つ。** 「一つだけの構図」と「群衆の構図」——
#    **画面の人数をその名が決めてしまう2件である**（`L58` が記録の `population` と照合する）。
#
# ⚠️ **`source` は原図の番号を逐語で残す。** 1〜25 は1〜2桁、26〜99 は2桁、100 は3桁。

