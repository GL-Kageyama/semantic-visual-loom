# 画風の目録 — 機械が読む一覧
#
# ⚠️ **これは検査（`L59`）のための目録であり、カードではない。** 様式カードは
#    `references/styles/*.md`（このリポジトリ）と隣の `distill-essence-engine` に在る。
#    ここに並ぶのは**名前**であって、絵の作り方の指示ではない。
#
# ⚠️ **出所。** 100項目は「AI画風の名前 100選」のカード4枚を書き起こしたもの。
#    `name` は転記から、`en` と `medium` と `star` は解剖（`画風100選_解剖.md`）から写した。
#    `en` は解剖の `EN:` の行の逐語である——**生成器へ貼る句**であり、名前ではない。
#
# ⚠️ **`family` は原図の章の名である**（絵画・伝統の表現 001–025／線画・版画・手描き 026–050／
#    イラスト・グラフィック 051–075／立体・素材・世界観 076–100）。25件ずつ4章。
#
# ⚠️ **`star` は解剖が付けた「名前の通りやすさ」である**（3が最も通る）。
#    3＝媒材名として英語に定着、2＝語はあるが曖昧、1＝英語に同じ言い方が無い。
#    ⚠️ **これは生成の実測ではなく、解剖の見立てである。**
#
# ⚠️ **`medium` は解剖の `分解:` の「媒材」を逐語で持つ。** 語彙は頭の語で見る——
#    `（`・`・`・`または` より前が **手描き／版／写真／デジタル／立体／複合／任意** の
#    どれかであること。⚠️ **頭の6つは様式カードの `Medium` と同じ語彙である**
#    （同じことを2つの語で言わない）。⚠️ **`任意` はこの目録の7つ目**——
#    098 レトロフューチャーと 100 ドリーミーは**媒材を決めない名**であり、
#    解剖がそう書いている（`媒材=任意`）。**空欄ではない。**
#
# ⚠️ **`card` は「同じものを指す様式カード」である**（解剖 §5 の「直」21件）。
#    無ければ `null`——**100件のうちの62件がカードを持たない。これは欠陥ではない。**
#    名前が在ることはカードが在ることではないが、**カードが無いことは使えないことでもない。**
#    ⚠️ **`near_card` は「隣の技法」である**（「近」17件）。`gap` に解剖が書いたずれを持つ
#    ——**同じものではない。** `card` に入れない（入れると同一だと名乗ることになる）。
#
# ⚠️ **`source` は原図の番号を逐語で残す。** 1〜25 は2桁、26〜100 は3桁（`01`〜`100`）。
#
# ⚠️ **`status: draft` は全件である。** 見立てであり、作品の実測ではない。

