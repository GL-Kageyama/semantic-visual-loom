# 制作台帳 — 『白地図』第1章「暖簾」（hakuchizu）
#
# **連続性（世界の状態）と開示（観客の知識の状態）を同じファイルに持つ。**
# ⚠️ **二つに割ってはならない**——参照集合も禁制集合も、この一点から導かれる（`CLAUDE.md`）。
#
# ⚠️ ここにあるのは**設計**である。**生成の記録ではない**——記録は `takes/` に在る。
#    台帳は「世界がどうなっているか」を持ち、「何が生成されたか」は持たない。
#
# ⚠️ **人物の事実は、ここに複製しない。** 呼ばれ方・生活・関係は
#    `soul-voice-teller/examples/hakuchizu/構想/characters.md` と `world.md` に在る。
#    このファイルが持つのは**カメラが要る語彙だけ**である——キーと、identity の意図と、禁制。
#
# ⚠️ **この作品は一話しか撮っていない。** 台帳は**その一話に要る語彙だけ**を持つ
#    ——先の章の人物（澪）も、先の章の場所も、ここには無い。
#    **無いことは「まだ書いていない」であると同時に「この話に出さない」である**（下の `disclosure`）。
#
# ⚠️ **`place` は地理である。** かつて habits の `place`（＝その話の記名の現場）を写すかどうかを
#    検討したが、**写さなかった**——あちらの規約は**あちらの法**（名は呼ばれた回数でできている）
#    から出ている。**この作品の法は「覚えている者の解像度でしか場所は存在しない」であり、
#    話に一つの「現場」を要求しない。** ⚠️ **機構を写すと質が落ちる**（決定 2026-09-22）。
#    ゆえに `place` は**そのショットが起きる場所の鍵**であり、話に一つではない。

characters:
  灯:
    # この話の唯一の立っている人物。**全11ショットのうち8本に居る**
    # （S01・S03・S05 には居ない——下の `locations` の註を見よ）。
    # ⚠️ **2026-09-22 に数え直した**（`specs/video/*.md` の `REF_CHARACTER: 灯.identity` は8本。
    # 初稿は「9本」と書いていた——**S01 を落として数えていた**）。
    # 台帳は `構想/characters.md`（灯——歩く・払う・決して娘の顔を渡さない）。
    identity: >-
      灯（あかり）。**顔は描かない**——背中と、輪郭と、白くなる手で示す。
      `hakuchizu-akari-character-sheet`（`distill-essence-engine/examples/hakuchizu/`）が
      この作品の人物基準である: 正面・斜め・横の頭部は**空白の白い紙のまま**置かれ、
      呼び出しの註が「顔は描かない——背中・輪郭・白くなる手で示す」と書く。
      年齢は**鈍らせる**（鋭くしない）。落ち影は置かない。背景の情景は置かない。
      白くなることは**紙の白への同化**として示す（グラデーションにしない）。
      ⚠️ **輪郭のパーツは残す。** のっぺらぼうにはしない——
      この作品の Negative は `no featureless blank face` を持つ（`bible.negative_base`）。
      ⚠️ **画像はまだ一枚も生成していない。** この identity は**意図であって資産ではない。**
    states:
      # ⚠️ **状態の鍵が時刻でないのは、この作品の衣装が時刻で決まらないからである。**
      #    決定するのは**支払いの前後**である——ゆえに鍵はそれである。
      #    ⚠️ **`wardrobe` は使わない。** 衣装は出典に一行も無い——
      #       出典が書くのは**手**である（「灯の指先が、すこし白くなる」）。
      #       **無い欄を埋めない。**
      支払いの前:
        note: "指先はまだ色を持っている。影は薄く伸びていて、まだ色を持っている。"
      支払いのあと:
        note: >-
          指先が、すこし白くなる（草稿 L25）。白くなるのは**端から**であって、
          面で薄くなるのではない——**紙の白への同化**である。
          ⚠️ **影はまだ色を持っている。** 灯の身体だけが白へ寄る。
    negatives:
      # 出所: `hakuchizu-akari-character-sheet/prompt.md`、および共通ネガティブ。
      - "no fully rendered face for 灯"
      - "no featureless blank face"
      - "no identifying clothing or hairstyle"

  暖簾の店の主:
    # ⚠️ **この人物は、この話で一度も画面に立たない。** 覚えられているだけである。
    #    ゆえに `identity` が指す先は**設定画ではなく、草稿の一行**である（下）。
    # 出所: 草稿 L11「灯は店の主の顔を知らない。名も知らない。けれど薬缶の音だけは知っている。
    #       主の後ろ姿も、灯は覚えている。……腰の曲がりかたを、灯は顔よりはっきり覚えている。」
    #       ／`構想/characters.md`——名も顔も無い、手触りの人物。
    identity: >-
      名も、顔も、無い。**それは省略ではなく、この作品の人物の定義である**——
      灯が覚えているのは手触りであって、顔ではない。
      覚えられているものは三つ: **押し上げる手の甲の白い粉**（昼になるまで落ちない）、
      **腰の曲がりかた**（湯を沸かすとき、片手で薬缶を持ち上げ、もう片方の手を腰に当てる）、
      **薬缶の音**（この時間に鳴る）。
      ⚠️ **設定画は無い。** 作らない——作れば、この人物は顔を持ち、
      **この話は別の話になる。**
    negatives:
      - "no fully rendered face for 暖簾の店の主"
      - "no legible name for the shopkeeper"
      - "no figure of the shopkeeper in frame (a hand and a bent back may be remembered)"

locations:
  通り:
    # 第1章の通り。**灯が二十年、おなじ順で歩く道。**
    # S01・S02・S03・S04・S05 の場所である。
    # 出所: 草稿 L1・L3・L5。
    base: >-
      hakuchizu-mionomachi-street（白紙に戻った下町の通り。石畳、閉じた雨戸、
      二階のベランダ、のれんの店の手前まで）
      ⚠️ **まだ無い。意図であって資産ではない。**
      ⚠️ **画像の基準は `hakuchizu-art-board/prompt.md` である**——
      「1つの場所 × 1つの状態（覚えられている状態）。人物なし。時刻なし。方向性の光なし。
      **この板が固定する「状態」は、色そのものである。**」
    geography: >-
      灯の二十年の順路の前半——**暖簾の店からはじめて、路地を抜け、広場を渡り、橋を越える**
      （草稿 L3）。⚠️ **この11ショットが撮るのはその最初の一区画だけである**——
      店の前までの通り。**路地・広場・橋はこの章では撮らない。**
      ⚠️ **道のりは撮らずに、順路は §7 と §15 が持つ。**

  暖簾の店の前:
    # **この話の山が起きる場所。** S06〜S11 の場所である。
    # 出所: 草稿 L9・L15・L17・L23・L25。
    base: >-
      hakuchizu-mionomachi-noren-shop（のれんの店の前。棒に掛かった暖簾、閉じた戸、
      隣家の二階のベランダ）
      ⚠️ **まだ無い。意図であって資産ではない。**
      ⚠️ **カメラは店の奥へ入らない**（§10 と §16 の MUST NOT）。
      **取引は布ごしに起きる**——ゆえに内装の基準画像は要らない。
    geography: >-
      通りの側に面した店。**隣家の二階のベランダが、同じ画のうちに入る**——
      S10 の「ひとつ減る」はそこで起きる（下の `disclosure` の註）。
      暖簾は棒に掛かり、**房が下へ垂れている**（草稿 L9・L15）。
    states:
      # ⚠️ **`states` の鍵が時刻でないのは、この場所の状態が時刻で決まらないからである。**
      #    決定するのは**色が戻ったかどうか**である。
      白:
        note: >-
          暖簾は白い。**風が吹いても白は揺れない——白は風を知らない**（草稿 L9）。
          布の房も白のまま垂れている。ジグソー: この状態の暖簾は**無地である**——
          ⚠️ **下の `props.暖簾` の註を見よ**（線が在るか無いかは、S07 が決める）。
      朱が戻った:
        note: >-
          朱。茜に近い朱。**染めて二度目の冬を越した、褪せた赤**（草稿 L11）。
          日が当たるほうの房は白っぽく、日陰の房はまだ濃い。
          ⚠️ **塗り終えた平坦な朱布ではない**——塗り終えたのは S08 の終わりであり、
          **絵の具はまだ乾いていない**（草稿 L23）。
          ⛔ **この状態から、布は風を知る**（2026-09-22 の著者の裁定・第三）。
          **色の戻ったところだけが、風を受けてたなびく**——
          ⚠️ **白いままの部分は、12秒のあいだ1つも動かない**（`props.暖簾.appearance`）。
          ⚠️ **風は弱い。** **押されて、少し流れて、戻る**——
          **乾いた旗にしない**（はためかせない、膨らませない、鳴らさない）。
          ⚠️ **S09 は、この布が風を受けて一度鳴る1本である**（草稿 L17
          「色の戻った暖簾を風が押す。朱が揺れる」）。
          ⛔ **S11 で、布は動かなくなる**——草稿 L25「朱は白のなかにひとつ残って、動かなくなる」。

props:
  暖簾:
    # この話の中心の物。**白 → 線 → 朱**、と三度姿を変える。
    # 出所: 草稿 L9（白・風を知らない）／L11（朱だったこと・褪せかた）／
    #       L15（にじみ・布の目・藍の房・絵の具の盛り上がり）／L23（まだ乾いていない）。
    appearance: >-
      棒に掛かった一枚の布。房が数本、下へ垂れている。
      **白いあいだ、布は無地である**——⚠️ **ここが S07 の分岐点である。**
      草稿は「白の下には人がいた気配が透けている」と書く（水の跡・自転車の形・洗濯物の形）が、
      **暖簾そのものについては「白い」としか書かない。**
      ゆえに**採った読み**: 白い暖簾に**何も描かれていない**。S07 が**置く**のは
      **薄い鉛筆の格子**である——`hakuchizu-imageboard/01-1` の下層が言う
      「**薄い鉛筆グリッド**」であり、**地図の経緯線（地の構造）であって、図ではない。**
      ⛔ **2026-09-22 の著者の裁定（第二）: 暖簾の上に、具体的なモチーフは重ならない。**
      **ゆえに桝目の中には、何も描かない**——図は1つも載らない（魚も包みも、落とした）。
      ⚠️ **旧い読み（「差し出す手・受け取る手・下げられた頭」）は、ここで偽になった。**
      それは**私が `visible thin pencil line art` を「手と頭の絵」と読んだ誤り**である
      （`PLAN.md` §4-e の註）。
      ⚠️ **`hakuchizu-imageboard/01-1` の共通様式は「線画だけの領域を作らない」と言う**——
      **格子は図ではないので、この一行と衝突しない**（裁定・第二）。
      ⛔ **2026-09-22 の著者の指示で、S08 の文字列から格子が外れた**
      （`projects/hakuchizu/PLAN.md` §4-g・`specs/video/hakuchizu-ch01-seg08.md` §20）。
      ⚠️ **ゆえに「格子は S07 が置き、S08 の色はその上に載る」という読みは、いま未決である**——
      **S07 の側は、こちらから書き換えていない**（著者の裁定を仰いでいる）。
      朱が戻ったあとの姿は `locations.暖簾の店の前.states.朱が戻った` が持つ。
      ⛔ **布は、色が戻ったところから風を知る**——
      **動くのは、色の着いたところだけである**（下の `locations.暖簾の店の前.states.朱が戻った`）。
    negative:
      - "no fully-painted flat vermilion cloth"
      - "no legible text on the noren"
      - "no shop name on the noren"

  白い形:
    # **白の下に透けている、人がいた気配。** S03・S04・S10 が使う。
    # 出所: 草稿 L5——「白の下には、人がいた気配が透けている」「自転車の形をした白が
    #       壁にもたれて立っている」「白い洗濯物の形がいくつも並んで、風に揺れることもない」
    #       「かつて自転車の上を猫が歩いていくのを、灯は何度も見た。猫はもういない」。
    appearance: >-
      三つある。**自転車の形をした白**（閉じた雨戸の前に、壁にもたれて立っている。
      その上を猫が歩いていたが、猫はもういない）、**白い洗濯物の形**（二階のベランダに
      いくつも吊るされ、風に揺れない）、そして**夜明け前に撒かれた水の跡**（→ `水の跡` が持つ）。
      ⚠️ **白は形であって、輪郭線ではない。** 物が白に置き換わっているのであって、
      物の絵が白いのではない。**影も光も持たない。**
    negative:
      - "no visible person among the white shapes"
      - "no cat in frame"

  水の跡:
    # S03 の主題。**白のなかで唯一動くもの。**
    # 出所: 草稿 L5——「いま灯が踏んでいる石畳には、夜明け前に誰かが水を撒いた。
    #       白の下で水の跡が乾いていく。乾いた境が、かすかに濃い。」
    appearance: >-
      石畳の上に撒かれた水。**白の下で乾いていく。** 乾いたところと乾いていないところの
      **境が、かすかに濃い**——それがこのショットで動く唯一のものである。
      ⚠️ **撒いた者は出さない。** 水の跡だけが残る。
    negative:
      - "no figure sprinkling water"

  薬缶:
    # ⚠️ **この物は、この話で一度も「在る物」として画面に出ない。**
    #    出典は音と、覚えられている形としてだけ書く。
    # 出所: 草稿 L11「この時間になると店の奥で薬缶が鳴った。湯の音が通りまで届いて、
    #       湯気の匂いが白のなかにすこしだけ通った」「薬缶を火からおろす音」／
    #       L17「店の奥から、なにかが沸く音がする。薬缶だった。二十年、この時間に薬缶が鳴る。」
    appearance: >-
      **音である。** この時間に鳴る。湯の音は通りまで届き、湯気の匂いが白のなかに通る。
      覚えられている形は二つ——**持ち上げる手**（片手で薬缶を持ち上げ、
      もう片方の手を腰に当てる）と、**火からおろす音**。
      ⚠️ **湯気はまだ白い**（草稿 L17——「湯気の匂いも、店の奥の暖かさも、まだ白のままだった」）。
    negative:
      - "no visible kettle as a present object"
      - "no visible stove or fire"

disclosure:
  # ⚠️ **変化点だけを持つ。全ショットは並べない**（`schemas/ledger.schema.json`）。
  #    変化点の間は、直前の状態が続く。
  #
  # ⚠️ **この話の開示の芯は「代価」である。** 順序は4点である——
  #    ① 戻すのは、思い出すことである（S07。**色の話から手続きの話へ**）
  #    ② 覚えていることが色を戻す（世界の法・S08）
  #    ③ 戻すことは、払うことでもある（S10）
  #    ④ 何を払ったかを、灯自身がもう名指せない（S11）
  #    ⚠️ **①は後から足した。** 当初は3点であり、**山の直前が開示の空白だった**——
  #       空いていたのは「灯が何をしているか」である。**S08 の色は支払いの結果**であるのに、
  #       支払いの行為そのものが画面に一度も置かれていなかった。
  #       **点を足したのは山を説明するためではなく、S08 を説明なしで読めるようにするためである。**
  #    ⚠️ **この4点は、この話の外の秘密を漏らさない**——
  #       澪（娘）も、写真的な四角も、第10章の逆転も、ここでは開かない。

  - shot: hakuchizu-ch01-seg07
    # 白 → 線。**覚えている形が、布の上に置かれる。**
    # 出所: 草稿 L13「灯は、暖簾の下で交わされたやりとりを思い出す。」
    # ⚠️ **値は `思い出された` である。** この一点で、この話は**色の話から手続きの話へ**移る——
    #    ここから先、朱は**戻るもの**ではなく、**灯が思い出して置くもの**になる。
    #    ⚠️ **色そのものは、まだ戻らない。** このショットが置くのは**格子**である
    #    （`props.暖簾.appearance` の註——白い暖簾に図は無く、**薄い鉛筆の格子**が S07 で置かれる）。
    #    ⚠️ **この読みは発明である。** 草稿は「思い出す」と書き、**何が画に変わるかは書かない。**
    暖簾.下のやりとり: 思い出された
    # ⛔ **`changed` である**（2026-09-22 に `covered` から上げた）。
    # ⚠️ **上げた理由。** このショットが置くものが「両手と下げた頭の線」から
    #    **「薄い鉛筆の格子」**へ変わった（著者の裁定・第二。`PLAN.md` §4-e）。
    #    **格子は、新しい危険を持ち込む**——**「布＋等間隔の格子」は、
    #    モデルにとって チェック柄（ギンガム・タータン）の語彙に最も近い。**
    #    ⚠️ **そして、その危険は床に無い。** `bible.negative_base` の15節にも、
    #    `video-spec` カードの `Negative` にも、**柄を禁じる語が1つも無い。**
    #    **ゆえに4節を足した**: `no checkered pattern` ／ `no plaid` ／
    #    `no printed textile pattern` ／ `no checkerboard`。
    # ⚠️ **旧い註（`covered` の理由）は、ここで偽になった。** 旧文——
    #    「動かす必要が無い。線そのものを禁じる語は、この作品の床に無い。足すものが無い。」
    #    **線を置くかぎりは正しかった。** **格子を置いた時点で、足すものが生まれた。**
    # ⚠️ **S08〜S11 も同じ4節を持つ**（S09〜S11 は3本で同一の集合を保つ）。
    # ⛔ **2026-09-22、S08 の側から格子が外れた**（著者の指示。seg08 の註を見よ）。
    #    ⚠️ **この1本（S07）は、いまも格子を変化として持っている。**
    #    **去就は未決である**——**著者の裁定を仰いでいる**（§20 の申し送り1）。
    #    ⛔ **この1本の `changed` と4節は、格子が残るかぎり正しい。**
    #    **格子が外れるなら、危険（柄）も外れる**——**そのときは、この位置も動く。**
    negative: changed

  - shot: hakuchizu-ch01-seg08
    # 白 → 朱。**覚えていることが色を戻す**——世界の法が、初めて実演される。
    # 出所: 草稿 L15「思い出したぶんだけ、白のなかから色が立ち上がる。……色が白を喰い戻す。」
    # ⚠️ **値は `戻った` であって、`塗られた` ではない。** 「塗られた」は誰かが塗ったことになり、
    #    この話では**灯が思い出した**のである。**語が、行為者を決めてしまう。**
    暖簾.朱: 戻った
    # **`changed` である**——§18 の Negative がここで動く。
    # ⚠️ **動きかたは「入れ替え」である。** 節が2つ入れ替わる——
    #    **出る**: `no fully-painted flat vermilion cloth`
