  - 暖簾の店の主
  - 近所の者
  - 猫                # 草稿 L5「かつて自転車の上を猫が歩いていくのを、灯は何度も見た。**猫はもういない。**」
                      # ⚠️ **もう居ないものを、白の下から出さない。** これはこの一話で一度も緩まない。
  - 澪
  - 数字
  - 写真的な四角
  - 灯の顔

attached:
  - 灯.identity
  - 灯.states.支払いの前
  - 灯.negatives
  - 通り.base
  - 通り.geography
  - 白い形.appearance
  - 白い形.negative

disclosure_state:
  暖簾.朱: 白
  暖簾.下のやりとり: 未
  灯.支払い: 未
  灯.渡した声: 持っている
