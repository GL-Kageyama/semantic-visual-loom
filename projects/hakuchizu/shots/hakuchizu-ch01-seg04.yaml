# 『白地図』第1章「暖簾」 / 所作 / motion —— 白い自転車の形を避け、歩く線がひとつ曲がる
#
# **出典** 本文は `soul-voice-teller/examples/hakuchizu/草稿/draft_01-1_暖簾.md` の L5 中ほど。
# ⚠️ **この記録は①breakdown の側であり、§1–20 を持たない。**
#
# ⚠️ **この1本の変化は「避けること」ではない。** 変化は**線**である——
#    灯の歩く線が、**一点で曲がり、また戻る。**
#    草稿 L5「灯はその白を避けて歩く。**避けるのが癖になっていた。**」
#    ⚠️ **「避けている」を撮ると、この1本は「障害物をよける人」の1本になる。**
#    **癖であること**は、**避けたあとに線が元へ戻ること**でしか出ない。
#
# ⚠️ **この1本は、自転車を一度も「自転車」として見せない。**
#    草稿——「いまは**自転車の形をした白**が壁にもたれて立っている」。
#    ⚠️ **白は形であって、輪郭線ではない**（`ledger.props.白い形.appearance`）。
#    **自転車の絵を白く塗るのではない**——自転車が白に置き換わっている。

shot: hakuchizu-ch01-seg04
spec: specs/video/hakuchizu-ch01-seg04.md
key_image: specs/image/hakuchizu-ch01-seg04.md

unit:
  before: 閉じた雨戸の前に、白い自転車の形がもたれて立っている。**灯の歩く線は、まっすぐである。**
  after: >-
    線がひとつ曲がった。**曲がったことは、線の側に残っている**——
    灯が通り過ぎたあとも、白の上の線は、そこだけ少しだけ外へふくらんでいる。

# 所作——**この一変化は、身ぶりである。**
role: 所作

place: 通り
time: 朝
mode: motion
duration: 5s

motion:
  subject: 灯の歩く線と、その線が避ける白い自転車の形
  quality: >-
    **速さは変わらない。** 避けるあいだも、歩調は落ちない——**二十年、そうしてきたからである。**
    草稿 L5「避けるのが癖になっていた」——**癖は、意識を要さない。**
    ⚠️ **ゆえにこの1本は、灯が自転車を見る画を持たない。** 見なくても避けられることが、癖である。
    ⚠️ **避けかたは小さい。** 大回りをしない——**線が一度それて、すぐ戻る**、それだけである。
  law: >-
    `gouache-abstract` の物理。**線は、置かれたものである**——
    灯が歩く線は、**薄い鉛筆の線**として白の上に置かれ、その線が**一点で外へ曲がる。**
    ⚠️ **曲がった線は、消えない。** この様式の法は「**a stroke covers what it crosses,
    and the revision stays visible**」——**ゆえに癖は、通りの側に蓄積する。**
    ⚠️ **灯の足元に影を置かない。** 影は S02 の主題である——
    **この1本の主題は線であって、影ではない。**

beats:
  - range: 0-2s
    density: sparse
    what: >-
      白い通り。**閉じた雨戸の前に、白い自転車の形**が壁にもたれて立っている。
      ⚠️ **自転車として描かない。** 形だけが白く、**影も光も持たない**——
      草稿 L5「いまは自転車の形をした白が壁にもたれて立っている」。
  - range: 2-3s
    density: held
    what: >-
      灯の線が、白い形の手前で**外へそれる。** 草稿 L5「灯はその白を避けて歩く」。
      ⚠️ **この1秒が、この1本の核である。** それる幅は**狭い**——
      **避けていることが観客に読める最小の幅**であって、それ以上ではない。
  - range: 3-5s
    density: sparse
    what: >-
      線が戻る。**通り過ぎたあとの線は、またまっすぐである。**
      ⚠️ **戻る速さが、癖を語る。** ためらえば、この1本は「気にしている人」の1本になる——
      **草稿は「癖になっていた」と書く。癖は、ためらわない。**

reference_set:
  - 灯.identity
  - 灯.states.支払いの前
  - 灯.negatives
  - 通り.base
  - 通り.geography
  - 白い形.appearance
  - 白い形.negative

