# 『白地図』第1章「暖簾」 / 反応 / motion —— 音が戻る。布が鳴り、奥で薬缶が鳴る
#
# **出典** 本文は `soul-voice-teller/examples/hakuchizu/草稿/draft_01-1_暖簾.md` の L15・L17。
# ⚠️ **この記録は①breakdown の側であり、§1–20 を持たない。**
#
# ⚠️ **この1本の変化は「音が戻ること」である。そして、戻らないものが画の縁を決める。**
#    世界の法——「**白は音を持たない。** 白のなかに音は無い——
#    **音が戻るのは、色が戻ったところからである。**」（`bible.world.rules`）
#    ⚠️ **ゆえにこの1本は、S08 の直後にしか置けない。** 色が戻ったところから音が戻る——
#    **この1本は、法の順序そのものを実演している。**
#
# ⚠️ **この1本の縁（ここで止まる）は、草稿 L17 の一行が決めている。**
#    「**湯気の匂いも、店の奥の暖かさも、まだ白のままだった。**」
#    ——**音は戻り、匂いと暖かさは戻らない。** ゆえにこの1本は、
#    **戻ってきたものの一覧ではなく、戻らなかったものの一覧で終わる。**
#
# ⚠️ **くぐる者は来ない。** 草稿 L17「揺れる朱の下を、**誰かがくぐるはずだった**」——
#    ⚠️ **「はずだった」を画にする方法は、揺れの下を空のまま置くことである。**
#    待たせる、という演出をしない——**この1本は、待つのではなく、来なかったことを写す。**

shot: hakuchizu-ch01-seg09
spec: specs/video/hakuchizu-ch01-seg09.md
key_image: specs/image/hakuchizu-ch01-seg09.md

unit:
  before: >-
    朱い布が垂れている。**鳴っていない**——S08 の終わりの状態である。
    色は戻ったが、**音はまだ来ていない。** 白は音を持たない。
  after: >-
    布が風を受けて、**ぱさりと鳴った。** 朱が揺れた。奥で**薬缶**が鳴り、
    湯の音が白のなかをひとつずつ満たしていく。
    ⚠️ **戻らなかったもの——湯気の匂いも、店の奥の暖かさも、まだ白のままである**（草稿 L17）。
    ⚠️ **揺れる朱の下を、誰も通らなかった。**

# 反応——**この一変化は、灯の側で起きる。**
# ⚠️ **灯は動かない。** 反応は**聞くこと**であり、この作品で灯は音に身体を向けない——
#    **二十年、おなじ順で来ている者が、音ごときで振り向くはずがない。**
role: 反応

place: 暖簾の店の前
time: 朝
mode: motion
duration: 7s

motion:
  subject: 風に押されて一度だけ鳴る朱い布
  quality: >-
    **一度だけである。** ぱさり、で終わる——翻らない、はためかない、鳴りつづけない。
    ⚠️ **草稿は「ぱさりと鳴る」と一行しか書かない。** その一行の長さが、この1本の長さである。
    ⚠️ **同じ風を、S06 は受けている。** S06 では布が答えず、ここでは布が鳴る——
    **風の強さは変えていない。** 変わったのは布のほうである（S06 の註を見よ）。
    ⚠️ **揺れの下には、誰も通らない。** 布が持ち上がりかけて、戻る——
    **「くぐるはずだった」は、空のまま置かれた石畳が語る。**
  law: >-
    `gouache-abstract` の物理。**布は置かれた一筆である**——
    揺れることは、**房の線が、一度だけ別の位置に置き直されること**である。
    ⚠️ **前の線は消えない。** この様式の法「**the revision stays visible**」——
    **ゆえに揺れは、布の側に一度ぶんだけ残る。** 二度は揺れない。
    ⚠️ **音は、この様式の物理の外にある。** 音を画で描かない——
    **鳴ることは、布の縁が動くことで示される。** 音そのものは §14 が負う。

beats:
  - range: 0-2s
    density: sparse
    what: >-
      朱い布。**鳴っていない。** 房が下へ垂れている。
      ⚠️ **この2秒は必要である。** 鳴る前の無音を置かなければ、
      **ぱさりは効果音になる**——**無音のあとにしか、音は戻らない。**
  - range: 2-3s
    density: dense
    what: >-
      風が来る。**布が鳴る。** 朱が揺れる。草稿 L15「布が風を受けて、**ぱさりと鳴る**。
      **白のなかにはなかった音だった。**」
      ⚠️ **この1秒が、この作品でいちばん短い出来事である。** 密度は `dense`——
      **短く、濃い。** 山（S08）の12秒とは、配分の仕方が逆である。
  - range: 3-5s
    density: held
    what: >-
      揺れの下は**空である。** 石畳が白いまま見えている。
      草稿 L17「揺れる朱の下を、**誰かがくぐるはずだった。**」
      ⚠️ **布の下辺が、奥からの空気で内側へ少し吸われる**——**戸が開く気配**である（草稿 L15）。
      **気配は画にしない。** 画にするのは、**布が内側へ動くことだけ**である。
      ⚠️ **カメラは越えない**（§16 の MUST NOT——`PLAN.md` §0-f）。
  - range: 5-7s
    density: sparse
    what: >-
      奥で**薬缶**が鳴る。草稿 L17「二十年、この時間に薬缶が鳴る。
      **湯の音が白のなかをひとつずつ満たしていく。**」
      ⚠️ **薬缶は画に出ない**（`ledger.props.薬缶`——**音と、覚えられている形だけである**）。
      ⚠️ **そして匂いは来ない。** 暖かさも来ない——
      **この1本は、戻らなかったものの側で終わる。**

reference_set:
  - 灯.identity
  - 灯.states.支払いの前      # ⚠️ **支払いはまだ済んでいない。** 指先はまだ色を持っている。
  - 灯.negatives
  - 暖簾の店の前.base
  - 暖簾の店の前.geography
  - 暖簾の店の前.states.朱が戻った
  - 暖簾.appearance
  - 暖簾.negative
  - 薬缶.appearance
  - 薬缶.negative

forbidden_set:
  - 暖簾の店の主
  - 近所の者
  - 猫
  - 澪
  - 数字
  - 写真的な四角
  - 灯の顔
  - 店の内側
  - くぐる者             # ⚠️ **この1本の主題である。** 出せば、来なかったことごと消える。
  - 薬缶                 # ⚠️ **物として出さない。** 出典は音と、覚えられている形しか書かない。
  - 湯気                 # 草稿 L17「湯気の匂いも……**まだ白のままだった**」。**白のままのものを、白から出さない。**

attached:
  - 灯.identity
  - 灯.states.支払いの前
  - 灯.negatives
  - 暖簾の店の前.base
  - 暖簾の店の前.geography
  - 暖簾の店の前.states.朱が戻った
  - 暖簾.appearance
  - 暖簾.negative
  - 薬缶.appearance
  - 薬缶.negative

disclosure_state:
  暖簾.朱: 戻った
  暖簾.下のやりとり: 思い出された
  灯.支払い: 未
  灯.渡した声: 持っている
