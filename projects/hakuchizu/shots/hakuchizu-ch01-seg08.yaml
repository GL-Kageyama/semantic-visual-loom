# 『白地図』第1章「暖簾」 / 運動（作画） / motion —— 白い布が、朱になる
#
# **出典** 本文は `soul-voice-teller/examples/hakuchizu/草稿/draft_01-1_暖簾.md` の L15。
# ⚠️ **この記録は①breakdown の側であり、§1–20 を持たない。**
#
# ⛰️ **この1本が山である。** 依頼——「暖簾に色が入ってくるシーンに盛り上がりを持って行って欲しい」。
#    ⚠️ **盛り上がりは、この1本を大きくすることで作っていない。**
#       **手前の3段（S06 の8秒・S07 の9秒・S08 の `FROM` の3秒）で作っている。**
#       この1本が長いのは、**作った盛り上がりを受け止める側だからである。**（`PLAN.md` §1）
#
# ⛔ **2026-09-22 の著者の裁定（第三）**——「**０８は色が入って、暖簾がたなびくこと。
#    演出があるとすれば、そのたなびき方**」。
#    ⚠️ **ゆえにこの1本の変化は、2つではない。** **色が戻り、布はじめて風を覚える**——
#       **1つの出来事の、表と裏である**（`motion.quality` の註）。
#    ⛔ **法**——**動くのは、色の着いたところだけである。**
#       **白いままの部分は、12秒のあいだ1つも動かない**（草稿 L9「白は風を知らない」＝ S06）。
#    ⚠️ **草稿 L15 は「布が風を受けて、ぱさりと鳴る」と書くが、この1本は鳴らさない**——
#       **音は S09 の1つの変化である**（`specs/video/hakuchizu-ch01-seg08.md` §14・§20）。
#
# ⛔ **2026-09-22、著者が初回の採用候補（`specs/video/08_20260922-041d36….mp4`）を観て、
#    2つを指示した**——「**「灯」を外すなら、ついでに「格子」も外そう**」、
#    および「**「灯」という文字を外すだけね、人物は外さない**」。
#    ⚠️ **ゆえに、この1本の文字列から①名の字②格子が外れ、色の器は布の目に戻った。**
#    ⛔ **そして著者が、同じ日のうちにこの指示を正した**——「**人物は外さないを勘違いしている。／
#       全体からは外さないという意味。／０８に人物は不要**」。
#    ⚠️ **「人物は外さない」は、作品から外すなという意味だった**——**この1本に人物は要らない。**
#       **ゆえに、この1本の画から人が外れ、`灯.identity` の添付も外れた**（下の `reference_set`）。
#       **灯は、作品からは外れていない**（`specs/video/hakuchizu-ch01-seg08.md` §3・§20）。
#
# ⚠️ **この1本だけが `transformation` を名乗る**（`PLAN.md` §0-b）。
#    理由——**色が戻ることは、この文法そのものである。**
#    切らない・過程を置かない・主体は1つ・戻りは決定である。
#    ⚠️ **隣の S09（布が鳴る）には使わない。** あれは**音が来る**ことであって、
#       物質が変わることではない。**文法を、変化していないショットに着せない。**
#    ⚠️ **布の動きは、第2の変化ではない。** **色の到着の、証拠である**——
#       ゆえに `ACT_STREAM` を4つ目に立てない（§9 の註）。
#
# ⚠️ **`Style Motion` の第一の法が、この1本の法である。**
#    `gouache-abstract`: 「**The stroke is the event, and gouache is opaque.**
#    A stroke covers what it crosses, so motion is a hand returning to a shape and revising it
#    — and the revision stays visible.」
#    草稿 L15「**色が白を喰い戻す。**」——**この一文の実演である。**

shot: hakuchizu-ch01-seg08
spec: specs/video/hakuchizu-ch01-seg08.md
key_image: specs/image/hakuchizu-ch01-seg08.md

unit:
  before: >-
    白い布（S07 の終わりの状態）。房は白いまま垂れている。**色はどこにも無い。**
    ⛔ **この1本の文字列は、布の上に何も載せない**（2026-09-22 の著者の指示）——
    **旧い行は「薄い鉛筆の格子だけが浮かんでいる」だった。**
    ⚠️ **S07 の1枚が格子を持っていれば、最初のコマは添付からそれを引き継ぐ**
    （`specs/video/hakuchizu-ch01-seg08.md` §20 の申し送り1）。
  after: >-
    朱。**茜に近い朱。染めて二度目の冬を越した、褪せた赤**（草稿 L11）。
    日が当たるほうの房は白っぽく、日陰の房はまだ濃い。房は藍。
    ⚠️ **まだ乾いていない**（草稿 L23）——**指の腹に、絵の具の重さが残る。**
    ⚠️ **たなびきは、落ち着いている。** **布は、また垂れている**——
    **白いままの部分は、12秒のあいだ1つも動かなかった。**

# 運動（作画）——**この一変化は、運動である。そして運動そのものが画である。**
# ⚠️ **限定 `作画` を使う。** 目録の `運動` の行が名前を持たないので、
#    **データが先に名を書く**（`rolemap.MOTION_PATTERNS`。`L15` は限定の側も引く）。
#    **色が走ることは、この作品で唯一「描かれること」が出来事である1本である。**
role: 運動（作画）

place: 暖簾の店の前
time: 朝
mode: motion
duration: 12s

motion:
  # ⚠️ **主体は1つである**（`transformation` の `one change one subject`）。
  #    **主体は朱である。** ⚠️ **布の動きは、朱の到着の証拠であって、第2の主体ではない。**
  #    藍の房も同じ一変化のうちである（**色が戻る**という1つの出来事の、別の面）。
  subject: 白い布の上に戻ってくる朱
  quality: >-
    **速くならない。** 12秒かけて、白が朱になる——
    ⚠️ **「一瞬で色づく」を撮らない。** 一瞬で色づけば、それは**手品**である。
    この色は**灯が二十年かけて覚えたものであり、その速さで戻る。**
    ⚠️ **にじみは、布の目に沿って走る。** 放射状に広がらない——
    草稿 L15「白の底から朱がにじみ、**にじんだ朱が布の目に沿って走り**」。
    ⚠️ **布の目が、色の器である。** 布の外へは色が行かない。
    ⛔ **旧い行は「S07 で浮かんだ格子が、色の器である」だった**——
    **2026-09-22 の著者の指示で、格子はこの1本の文字列から外れた**（上の註）。
    ⚠️ **順は、下から上へ、一列ずつである。** **列を飛ばさない、布の外へ出ない。**
    ⚠️ **戻る朱は、褪せている。** 新しい朱ではない——草稿 L11「日が当たるほうの房は
    白っぽく、日陰の房は、まだ濃い朱だった」。**褪せかたまで戻る。**
    ⛔ **同じ1つの出来事の裏で、布が風を覚える**（著者の裁定・第三）。
    **たなびき方は、5つである**——
    ① **色の着いたところだけが動く。** **白いままの部分は、1つも動かない**
    （草稿 L9「白は風を知らない」＝ S06 が、この1本の前提である）。
    ② **下からである。** 動けるのは、棒に留められていない**裾**だけである。
    ③ **色に遅れる。** **色が先で、布が後である**——**たなびきは、色の先頭を追い越さない。**
    ④ **濡れて重い。** **押されて、少し流れて、戻る**——**乾いた旗のように鳴らず、
    はためかず、膨らまない**（草稿 L23「朱はまだ乾いていない」）。**風は弱い。**
    ⑤ **一方向である。** **往復しない、波打たない、震えない。**
    ⚠️ **9-11秒で、たなびきは落ち着く**——**終わりに、布はまた垂れている。**
    ⛔ **S09 の「一度だけ揺れる」を、ここで先に使わない。**
  law: >-
    `gouache-abstract` の物理。**絵の具は不透明である**——
    色が白を喰い戻すことは、**一筆が、それが横切るものを覆うこと**である。
    ⚠️ **覆われた白は、透けない。** 水彩のように下が透けるなら、それは別の様式である。
    ⚠️ **修正は残る**（the revision stays visible）——ゆえに**にじみの輪郭は消えない。**
    草稿 L15「絵の具の**盛り上がり**が白の上に載って乾いていく」——**色は面ではなく、物である。**
    ⚠️ **布もまた物である。** **濡れた布の重さで、たなびく**——**水のように流れない。**

# ⚠️ **`transformation` の5項は、この記録には欄を持たない。**
#    記録の側の欄は `unit` / `role` / `motion` / `beats` であり、
#    **文法は §9 `ACTION` と §11 `MOTION` が負う**（`references/formats/transformation.md`）。
#    ⚠️ **この記録に `transformation:` という欄を足してはならない**——
#    `schemas/shot-record.schema.json` は `additionalProperties: false` であり、
#    **足せば、この1本は形の層で落ちる。**
#    **対応だけをここに書き、本体は §9・§11 に置く:**
#      `FROM` → `beats` の 0-3s ／ `unit.before`
#      `TO` → `beats` の 11-12s ／ `unit.after`
#      `TRIGGER` → `beats` の 0-3s（**すでに置かれている**——S07 の 7-9s）
#      `KEEP` → `motion.quality`（構図・**白いままの部分**）と §16 の MUST NOT
#      `DURATION` → `duration`（12s。**この作品で最長**）
#
# ⚠️ **トリガーは「来る」ものではない。** すでに置かれている——
#    **S07 の7-9秒で、灯は思い出し終えている。**
#    ゆえにこの1本の0-3秒は、**トリガーが引かれるのを待つのではなく、結果が来るのを待つ3秒である。**

beats:
  - range: 0-3s
    density: held
    what: >-
      **`FROM`。** 白い布。**何も起きない。**
      ⚠️ **この3秒は、支払いの直前の静止である。** 手前の S06（8秒）と S07（9秒）で
      作った溜めの、**最後の3秒**である。**ここを削れば、山は山でなくなる。**
      ⚠️ **白いあいだ、布は風を知らない**——**この3秒、布は1つも動かない**（S06 と同じである）。
  - range: 3-5s
    density: sparse
    what: >-
      白の底から、朱がにじみはじめる。**最初の一筆が置かれる。**
      草稿 L15「**白の底から朱がにじみ**」。
      ⚠️ **どこから始まるかが演出である**——**いちばん下の列**である。
      **思い出の順に、色が来る。** **下から上へ、一列ずつ。**
      ⛔ **そして、その一筆の裾だけが、はじめて風を受ける**——**ひとつ、小さく動く。**
      ⚠️ **白いままの部分は、ここでも動かない。**
  - range: 5-9s
    density: held
    what: >-
      **`CORE`。** にじんだ朱が、布の目に沿って走る。草稿 L15「**色が白を喰い戻す。**」
      ⚠️ **この4秒が、12秒のうちの33%である。** `video-spec` の §8 は
      **尺を不均等に配れ**と言う——**この1本の不均等の在り処が、この4秒である。**
      ⚠️ **たなびきは、色に遅れて、上へ移る**——**動くのは、色の着いたところだけである。**
      ⚠️ **カメラはここで一度だけ漂う**（下の `§10` の註）。
      **この作品で動くカメラは、この1本のこの4秒だけである。**
  - range: 9-11s
    density: held
    what: >-
      **藍の房が下へ垂れる。** 草稿 L15「**藍の房が下へ垂れて、絵の具の盛り上がりが
      白の上に載って乾いていく**」——ただし**乾ききらない**。
      ⚠️ **房は「下へ垂れる」であって、「染まる」ではない。**
      染まるは面の話であり、垂れるは**物が下へ着く**話である。**この作品の色は物である。**
      ⚠️ **たなびきが、落ち着いていく**——**濡れた布の落ち着きかたで、ゆっくり止まる。**
      ⚠️ **房は、いちばん最後まで動く**——**自由な端であり、しかも濡れている。**
  - range: 11-12s
    density: sparse
    what: >-
      **`TO`。** 朱。**まだ乾いていない。**
      ⚠️ **この1秒は、色を見せる1秒ではない。** **濡れていることを見せる1秒である**——
      草稿 L23 はこの濡れを**指の腹**で確かめる。**ゆえに濡れは、S11 まで保たなければならない。**
      ⚠️ **布は、また垂れている。** **最後に動いているのは、房である**——
      **S09 の「一度だけ揺れる」は、そこで新しく来る風である。**

reference_set:
  - 暖簾の店の前.base
  - 暖簾の店の前.geography
  - 暖簾の店の前.states.朱が戻った
  - 暖簾.appearance
  - 暖簾.negative
#
# ⛔ **`灯.identity`・`灯.negatives` が、この1本から落ちている**
#    （2026-09-22 の著者の裁定——「**０８に人物は不要**」）。
#    ⚠️ **この1本に人物は居ない。** **添付は、写る者の基準を渡す欄である**——
#       **写らない者に、基準は要らない**（`specs/video/hakuchizu-ch01-seg08.md` §3 の註）。
#    ⚠️ **7つから5つになった。** **`attached` も同時に落としている**——
#       **`L6` は両方向に突き合わせる。**
#    ⚠️ **灯は、この作品からは外れていない**——**S06・S07 に写り、台帳の `灯.identity` は生き、
#       `forbidden_set` の `灯の顔` も §18 の Negative の2節も、そのままである。**

# ⚠️ **`暖簾.negative` はここに在るが、§18 はそのうち1節を落とす。**
#    **台帳の `disclosure`（seg08 の `negative: changed`）がその記録である。**
forbidden_set:
  - 暖簾の店の主
  - 近所の者
  - 猫
  - 澪
  - 数字
  - 写真的な四角
  - 灯の顔
  - 店の内側
  - 布の上の顔         # ⚠️ **布の上には、何も載せない**——色だけである（2026-09-22 の著者の指示）。
  - 布の上の字         # ⛔ **初回の採用候補で、画の左下に「灯」の字が描かれた**（§20 の記録）。
  - 平坦に塗り終えた朱 # ⚠️ **この1本の主題の裏返しである**（`no flat vermilion without pigment body`）。
  - 乾ききった朱       # 草稿 L23「朱は**まだ乾いていない**」。
  - 乾いた旗のような布 # ⛔ **布は動くが、濡れている**——**はためかせない、膨らませない、鳴らさない。**
                       #    ⚠️ **弱い風である。布は、風に持っていかれない**（著者・2026-09-22）。
  - 白いままの布の動き # ⛔ **この1本の第一の法である**——**動くのは、色の着いたところだけ。**

attached:
  - 暖簾の店の前.base
  - 暖簾の店の前.geography
  - 暖簾の店の前.states.朱が戻った
  - 暖簾.appearance
  - 暖簾.negative
# ⚠️ **上の `reference_set` と同じ5つである**（`L6`）。**灯の2つは、ここにも無い。**

# ⚠️ **§10 の註——この1本だけが、カメラの身振りを1つ使う。**
#    様式カードは「**It holds still, or drifts once.**」と定める（`gouache-abstract`）。
#    ⚠️ **この作品は、その「一度」をこの1本に使う。** 理由——
#    ① **漂いは有限の資源である。** 11本のうち1本しか使えない。
#       ならば**使うなら、いちばん大きい出来事の上で使う。**
#    ② **核の4秒に、カメラが一度だけ漂う。** **一方向へ、ゆっくり**——
#       ⛔ **色を追わない。色に速さを合わせない**——**速さを合わせれば、色は画のなかで止まって見える。**
#       ⚠️ **たなびきは、カメラの身振りを1つも増やさない**（著者の裁定・第三）。
#    ③ ⚠️ **他の10本は、この身振りを1度も使わない。** 使えば、
#       **山の1本が、他の1本と同じ身振りを持つことになる。**
#    ⚠️ **`L33` がこの欄を読む**（`skills/staging/cards.yaml`）——**禁じるのではなく、認めて書く。**

disclosure_state:
  暖簾.朱: 戻った
  暖簾.下のやりとり: 思い出された
  灯.支払い: 未
  灯.渡した声: 持っている
