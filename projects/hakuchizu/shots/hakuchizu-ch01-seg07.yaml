# 『白地図』第1章「暖簾」 / モンタージュ / motion —— 白い布の上に、薄い鉛筆の格子が浮かぶ
#
# **出典** 本文は `soul-voice-teller/examples/hakuchizu/草稿/draft_01-1_暖簾.md` の L11・L13・L21。
# ⚠️ **この記録は①breakdown の側であり、§1–20 を持たない。**
#
# ⚠️ **この1本の変化は「薄い鉛筆の格子が白に浮かぶこと」である。色はまだ来ない。**
#    草稿はこの工程を一度も名指さない——**ゆえに下層を見せること自体は、いまも発明である**（下の註）。
#    ⚠️ **ただし、浮かぶものはこちらの創作ではない**——**様式が既に持っている下層である。**
#
# ⚠️ **切らない。** `モンタージュ` と名乗るが、**カットを1つも使わない。**
#    覚えている形は、**すべて同じ一枚の布の上に、順に置かれる。**
#    理由——
#    ① **1ショットは1変化である。** 切れば、この1本は**3つの変化の寄せ集め**になる。
#    ② **この作品の山（S08）は `transformation` であり、その文法は「切らない・過程を置かない・
#       一つの主体」である。** 直前の1本が切っていれば、**山の文法が浮く。**
#    ③ **様式そのものが「切らない」を要求している**——`gouache-abstract` の
#       `Motion character`: 「**The camera is one page of a sketchbook.**」
#       **一枚の紙の上で、形が置き換わる。** 切ることは、頁を破ることである。
#
# ⚠️ **下層と上層を2本に分けたのは、この作品の様式が既に持っている工程を2本に分けたことである。**
#    `hakuchizu-imageboard/01-1` の共通様式は、白い町を
#    「**薄い鉛筆グリッドの線画を構造として残し**、その上に作品固有の四色が
#    **薄塗りのウォッシュ**で戻る」と書いている——**下層がグリッド、上層が色。**
#    S07 はその下層であり、S08 は上層である。
#    ⚠️ **下層だけを9秒見せることは、いまも発明である**（`PLAN.md` §1 の註）。
#    **草稿は色の話しか書かない。** ⚠️ **ただし、載るものは様式のものである**——
#    **こちらが作った図ではない。**
#
# ⛔ **2026-09-22 の著者の裁定（第二）**——「**暖簾の上に、具体的なモチーフは重ならない**」。
#    **ゆえに布に載るのは格子であって、形ではない。手も、頭も、品も、描かない。**
#    ⚠️ **旧版はここに「両手と下げた頭」を置いていた**——**`visible thin pencil line art` を
#    「図」と読んだ誤りである**（`PLAN.md` §4-e）。
#    ⚠️ **`hakuchizu-imageboard/01-1` の「線画だけの領域を作らない」は、まだ註のままである。**
#    採った読みは「**その註はイメージボードのパネルの話である**」——
#    ボードは**手彩色の古地図**という成果物であり、線だけのパネルはその同一性を割る。
#    ⚠️ **映画では、白は「まだ塗られていない地」そのものである**（草稿が全編そう書いている）。
#    **この1本は、依然として線だけの9秒である**——**裁定はここを閉じていない**（`PLAN.md` §1）。

shot: hakuchizu-ch01-seg07
spec: specs/video/hakuchizu-ch01-seg07.md
key_image: specs/image/hakuchizu-ch01-seg07.md

unit:
  before: >-
    白い無地の布。房が数本、下へ垂れている。**布の上には何も無い**——
    草稿 L9 の状態のままである。**まだ何も思い出されていない。**
  after: >-
    布の上に、**薄い鉛筆の格子**が浮かんでいる——**地図の経緯線である。**
    ⚠️ **桝目の中は、空である。** ⛔ **図は1つも描かれない**（裁定の註）。
    ⛔ **草稿 L13 は「店の前で、近所の者がものをやりとりしていた」と書くが、
    そのやりとりは布の上に絵にならない**——**覚えている者が見ていないものは、布に載らない。**
    ⚠️ **色はどこにも無い。** 格子は**布の上に在るが、布はまだ白い**。

# モンタージュ——**この一変化は、複数の線が順に置かれることである。**
# ⚠️ **切らずに置くことが、この種別の実装である**（上の註）。
role: モンタージュ

place: 暖簾の店の前
time: 朝
mode: motion
duration: 9s

motion:
  subject: 白い布の上に、順に浮かんでいく薄い鉛筆の格子
  quality: >-
    **おなじ順で、おなじぶんだけ。** 草稿 L21「二十年、灯はそれを、**おなじ順で、
    おなじぶんだけ**繰り返してきた」——
    ⚠️ **ゆえに線は、まとめて現れない。** 一本ずつである。
    ⚠️ **そして順が決まっている。** **布を縦に走る線 → 布を横に走る線。**
    **この順は、この1本では入れ替わらない**——入れ替われば、それは思い出ではなく編集である。
    ⚠️ **速さは一定である。** 急がない——**二十年かけて覚えたものが、9秒で置き直される。**
  law: >-
    `gouache-abstract` の物理。**線は鉛筆であり、絵の具ではない**——
    線は**色を持たない**。にじまない、太らない、盛り上がらない。
    ⚠️ **ゆえにこの1本は、様式の下層を9秒間だけ見せる。**
    この様式は「**visible thin pencil line art**」の上に薄塗りのウォッシュを置く
    （`bible.world.visual_language.art_direction`）——**この1本は、その下の層である。**
    ⚠️ **その下層は、図ではなく、地の構造である**——
    `hakuchizu-imageboard/01-1` は「**薄い鉛筆グリッドの線画**」と書く。
    **地図の経緯線が、ここで先に置かれる。**
    ⚠️ **線を消さない。** この様式の法は「**the revision stays visible**」——
    置かれた格子は**置かれたまま残る**。
    ⛔ **旧い行は「置かれたまま残り、S08 の色の下に読める」だった。**
    ⚠️ **2026-09-22 の著者の指示で、S08 の文字列から格子が外れた**——
    **ゆえに、この格子が S08 へ渡るかは未決である**（著者の裁定を仰いでいる）。
    ⛔ **この1本は、いまも格子を変化として持っている**（**こちらからは書き換えていない**）。
    **申し送りは `specs/video/hakuchizu-ch01-seg08.md` §20 の1点目。**

beats:
  - range: 0-2s
    density: sparse
    what: >-
      白い布。**何も無い。** 最初の線が浮かぶ——**布を縦に走る1本。**
      ⛔ **布に載るのは格子だけである**（2026-09-22 の著者の裁定・第二。`ACT_GRID_FIRST`——
      `specs/video/hakuchizu-ch01-seg07.md` §9 の註）。**手も、頭も、品も、描かない。**
      ⚠️ **旧版はここに「差し出す手」を置いていた**——**`visible thin pencil line art` を
      「図」と読んだ誤りである**（`PLAN.md` §4-e）。
      ⚠️ **布を汚さない。** 線は**布の上に在るのであって、布に染みているのではない。**
  - range: 2-5s
    density: held
    what: >-
      **縦の線が、1本ずつ増える。** 同じ間隔で、同じ順で。
      ⚠️ **布が、桝目に割れていく**（`ACT_GRID_DOWN`）。
      ⚠️ **桝目は空である。** 割れるのは**布**であって、**枠ではない。**
      ⚠️ **名を呼ばない。** 草稿 L13「**名を呼ぶかわりに**、そうして店と家が、
      二十年、静かにつながっていた」——`no lettering` はこの作品の主題でもある。
  - range: 5-7s
    density: sparse
    what: >-
      **横の線が入り、桝目が閉じる**（`ACT_GRID_ACROSS`）。
      ⚠️ **この2秒で、観客は「布が覚えている」ことを知る**——
      **布は、この町で唯一、まだ何かを覚えている面である。**
      ⚠️ **この格子が S08 の色の器になる**——**というのが、裁定（第二）の読みだった。**
      ⛔ **2026-09-22 の著者の指示で、S08 の色の器は布の目に戻った。**
      **ゆえに、この行はいま未決である**（上の `motion.law` の註・§20 の申し送り1）。
  - range: 7-9s
    density: held
    what: >-
      **格子が止まる。** 色は来ない。布は白いままである。
      ⚠️ **この2秒が、山への溜めである。** `transformation` の `TRIGGER`
      （灯が思い出し終えること）が、**この2秒で画面に置かれている**——
      **S08 の12秒は、この静止のあとにはじまる。**

