  - 暖簾.appearance
  - 暖簾.negative

forbidden_set:
  - 暖簾の店の主       # ⚠️ 覚えられているのは**腰の曲がりかた**であって、姿ではない（草稿 L11）。
                      #    **布の上に店主を描かない**——描けば、この話は別の話になる。
  - 近所の者           # ⚠️ 台帳に鍵を作らない（`PLAN.md` §2）。**布に載るのは格子だけである。**
  - 猫
  - 澪
  - 数字
  - 写真的な四角
  - 灯の顔
  - 店の内側           # `PLAN.md` §0-f——**カメラは店の奥へ入らない。**
  - 布の上の顔         # ⚠️ **格子は図を持たない。** ゆえに顔も描かれない——
                      #    **節は残す。** ⛔ **`L10` の `covered` のためではない**——
                      #    **この1本は `changed` である**（2026-09-22 の裁定で
                      #    `no checkered pattern` 以下の4節が入った。`disclosure`）。
                      #    ⚠️ **残す理由は、法が続いていることである**——
                      #    **S06 が布の上から人を降ろし、S07 も降ろしたままである。**
  - 布の柄としての格子   # ⛔ **この1本の格子は、柄ではない**——**地図の経緯線である。**
                      #    `no checkered pattern`・`no plaid`・`no printed textile pattern`・
                      #    `no checkerboard` の4節がこれである（`L10` の `changed`）。
                      #    ⚠️ **「布＋等間隔の格子」は、モデルにとってチェック柄の語彙にいちばん近い。**

