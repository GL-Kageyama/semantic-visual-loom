# 『白地図』第1章「暖簾」 / 総覧 / still —— 朝の光が列を渡りきり、白はどこも同じ白になる
#
# **出典** 本文は `soul-voice-teller/examples/hakuchizu/草稿/draft_01-1_暖簾.md` の L7。
# ⚠️ **この記録は①breakdown の側であり、§1–20 を持たない。**
#
# ⚠️ **この1本に人は立たない**（S01・S03 と同じ）。ゆえに `reference_set` に人物の鍵が無い。
#
# ⚠️ **計画書から変えた一点。** `PLAN.md` の表はこの1本を
#    「**灯は雨戸の列を数えずに通り過ぎる**」と書いていた。**採らなかった。**
#    理由は二つ——
#    ① `mode: still` は**主題が止まる**ことを意味する（スキーマ）。
#       **歩く灯を主題に置けば、この1本は `still` ではなくなる。**
#    ② **「数えない」は、行動ではなく画で示せる。** ——
#       草稿 L7「**数字は町を戻さない。数字を覚えても、暖簾の朱は戻らない。**」
#       ⚠️ **数えられないことは、白がどこも同じ白になることで示される。**
#       **単位が無ければ、数は始まらない。** 灯が数えないことを撮るより、
#       **数えられない白**を撮るほうが、この法に近い。
#    ⚠️ **`PLAN.md` の表も同じ日に直した。**（直さなければ、計画書が嘘になる。）

shot: hakuchizu-ch01-seg05
spec: specs/video/hakuchizu-ch01-seg05.md
key_image: specs/image/hakuchizu-ch01-seg05.md

unit:
  before: >-
    白い雨戸が、一列に並んでいる。**手前のほうはまだ薄暗く、奥はもっと暗い**——
    暗さの差が、列に**ひとつずつ**という数え方を与えている。
  after: >-
    朝の光が列を渡りきった。**白はどこも同じ白である。**
    ⚠️ **暗さの差が消えたので、列は単位を失った**——**数えられない。**
    草稿 L7「数字は町を戻さない」。

# 総覧——**この一変化は、全体を見ることである。**
# ⚠️ **`総覧` は「広い画」ではない。** 広ければ総覧なのではない——
#    **列ぜんたいが一度に主題になる**ことがこの種別である。
#    ゆえに**寄りの画を1枚も挟まない。**
role: 総覧

place: 通り
time: 朝
mode: still
duration: 6s

motion:
  # ⚠️ **`mode: still` でも `motion` は要る**（`L16`・スキーマ）。
  #    **止まるのは主題であって、画面ではない。光は動く。**
  subject: 白い雨戸の列の上を渡っていく朝の光
  quality: >-
    **光は速まらない。** 6秒のあいだに、光は列の手前から奥までを渡る——
    それだけである。⚠️ **影は動かない。** この様式は方向性の光を持たない
    （`bible.world.visual_language.art_direction`——`no directional light`）。
    **ゆえに「光が動く」は、明るさが変わることで示される**——**影が伸びるのではない。**
  law: >-
    `gouache-abstract` の物理。**白は紙そのものである。**
    光が渡ることは、**紙がまだ塗られていないことを、どこでも同じに確かめること**である。
    ⚠️ **光沢を作らない。** 白は**照らない**——照れば、この1本は「光る町」の1本になる。
    ⚠️ **黄土や金彩をここに置かない。** この1本に色はまだ1つも無い。

beats:
  - range: 0-2s
    density: sparse
    what: >-
      白い雨戸の列。**手前が明るく、奥が暗い。** その差が、列に**順序**を与えている——
      草稿 L7「このあたりの家は、もう十年も空いている」。
      ⚠️ **雨戸に番号を置かない。** `no legible signage` は床である——
      **数える手がかりを、画の側に置かない。**
  - range: 2-4s
    density: held
    what: >-
      光が奥へ渡る。**暗さの差が、少しずつ縮む。**
      ⚠️ **この2秒が、この1本の核である。** 差が縮むにつれて、
      **列は「並んでいるもの」から「続いている面」へ変わる。**
  - range: 4-6s
    density: sparse
    what: >-
      光が列を渡りきる。**白はどこも同じ白になる**——
      草稿 L7「数字は町を戻さない。数字を覚えても、暖簾の朱は戻らない」。
      ⚠️ **数える者が居ないのではなく、数える単位が無い。**
      この1本は、**数を失う**ことを撮っている。

reference_set:
  - 通り.base
  - 通り.geography
  - 白い形.appearance
  - 白い形.negative

forbidden_set:
  - 灯                # ⚠️ S01・S03 と同じく、この1本に立たない（上の註を見よ）。
  - 暖簾の店の主
  - 近所の者
  - 猫
  - 澪
  - 数字              # **この1本の主題が「数は戻らない」である以上、数を画に置けない。**
  - 写真的な四角

attached:
  - 通り.base
  - 通り.geography
  - 白い形.appearance
  - 白い形.negative

disclosure_state:
  暖簾.朱: 白
  暖簾.下のやりとり: 未
  灯.支払い: 未
  灯.渡した声: 持っている
