# 『白地図』第1章「暖簾」 / 離脱 / motion —— 朱を置いて、灯はそこを離れる
#
# **出典** 本文は `soul-voice-teller/examples/hakuchizu/草稿/draft_01-1_暖簾.md` の L23・L25・L27。
# ⚠️ **この記録は①breakdown の側であり、§1–20 を持たない。**
#
# ⚠️ **この1本の変化は「そこに居なくなること」である。**
#    草稿 L25「朱の暖簾をうしろに置く。**朱は白のなかにひとつ残って、動かなくなる。**」
#    ⚠️ **画が変わるのは、置かれたものではなく、置いた者が消えるからである。**
#    ゆえにこの1本は、**この作品で唯一「人が画から出ていく」1本**である
#    （S02 は人が画に入ってくる1本であり、**この2本は対である**）。
#
# ⚠️ **触れることが、この1本の始まりである。**
#    草稿 L23「灯は暖簾に手を伸ばす。触れる。**朱はまだ乾いていない。**
#    指の腹に、**絵の具の重さ**が残る。」
#    ⚠️ **S08 の §18 が「乾いた朱にするな」と禁じていたのは、この1本のためである。**
#    **S08 の12秒が保った濡れを、この1本の指が確かめる。**
#
# ⚠️ **払った声の名を、この映画も呼ばない。**
#    草稿 L27「いま渡した声は、なんと呼ばれていた声だったのか。
#    **それを灯はまだ思い出せないでいる。**」——これがこの話のフックである。
#    ⛔ **この開示点を画は負っていない。** 負っているのは**この映画の側の保留**である——
#    **この作品は台詞もナレーションも持たず**（`PLAN.md` §0-e）、
#    **渡した声の名を、どこでも一度も呼ばない。**
#    ⚠️ **観客が名を呼べないことは、灯が名を呼べないことと同じ形をしている。**
#    ⚠️ **これは判断であって、確かめられたことではない。** 検査は `disclosure_state` しか見ない——
#    **画が負っていない開示点が1つある、と記録しておく**（穴のまま置く）。

shot: hakuchizu-ch01-seg11
spec: specs/video/hakuchizu-ch01-seg11.md
key_image: specs/image/hakuchizu-ch01-seg11.md

unit:
  before: >-
    灯は朱い暖簾の前に立っている。**手はまだ朱に触れていない。**
    朱は濡れたままである。S10 で、白がひとつ減った。
  after: >-
    灯はもうそこにいない。**朱は白のなかにひとつ残って、動かなくなる**（草稿 L25）。
    白の上に、**灯の影だけが薄く伸びている**——**影はまだ色を持っている。**
    ⚠️ **指先は、すこし白くなっている。**

# 離脱——**この一変化は、場からの退出である。**
# ⚠️ **目録の15種のうち、`離脱` は実測で出た3種のひとつである**（`rolemap.ROLES`）。
#    **この作品は、その名を必要とする。**
role: 離脱

place: 暖簾の店の前
time: 朝
mode: motion
duration: 9s

motion:
  subject: 朱い暖簾から離れて、次の白へ歩きだす灯
  quality: >-
    **速さは、二十年おなじである。** 草稿 L25「灯は歩きだす」——
    ⚠️ **別れの速さにしない。** 立ち止まりもしない、振り返りもしない——
    草稿 L21「灯はそれが、**いやではなかった。**」
    ⚠️ **触れかたが、この1本の勘所である。** 短く、確かめるように触れる——
    **草稿 L23 が触れている時間について書くのは、絵の具の重さだけである。**
    ⚠️ **手を離すとき、朱は引かれない。** 布は灯についてこない——
    **置いていくとは、そういうことである。**
  law: >-
    `gouache-abstract` の物理。**朱は物であり、濡れている**——
    指の腹に残るのは**絵の具の重さ**であって、汚れではない。
    ⚠️ **指先が白くなることを、グラデーションで描かない。**
    白くなるのは**端から**であり、**紙の白への同化**である
    （`ledger.characters.灯.states.支払いのあと` の註）。
    ⚠️ **そして影だけが色を持ったまま残る。** この非対称——
    **身体は白へ寄り、影は色を持ちつづける**——が、この1本の最後の画である。
    草稿 L25「白の上に、**灯の影だけが薄く伸びている。影はまだ色を持っていた。**」

beats:
  - range: 0-2s
    density: dense
    what: >-
      **触れる。** 指の腹が朱に着く。**絵の具の重さが残る。** 朱はまだ乾いていない。
      草稿 L23「触れる。朱はまだ乾いていない。指の腹に、絵の具の重さが残る。」
      ⚠️ **この2秒が、S08 の12秒の受け取りである。** 濡れは、ここで確かめられるために保たれた。
  - range: 2-5s
    density: held
    what: >-
      **`CORE`。** 手が離れる。**置いていく。**
      草稿 L23「灯はそれを、**持っていくことはできない。置いていく。**
      **置いた朱は、もう白に戻らない。**」
      ⚠️ **この3秒が、9秒のうちの33%である。** `video-spec` の §8 の不均等——
      **この1本の核は「離すこと」である**（触れることでも、歩くことでもない）。
      ⚠️ **朱は布から離れない。** 灯の手が離れるのである——**順序を逆に撮らない。**
  - range: 5-7s
    density: held
    what: >-
      **しばらく、暖簾の前に立つ。** 草稿 L23「灯はしばらく、暖簾の前に立つ。
      **二十年ぶりに、朱い暖簾の前で、灯は立っていた。**」
      ⚠️ **この2秒は、この作品の最後の静止である。** 動くのは朱の濡れだけである。
  - range: 7-9s
    density: sparse
    what: >-
      **歩きだす。** 朱をうしろに置く。**朱は白のなかにひとつ残って、動かなくなる。**
      草稿 L25「町はすこし色を取り戻した。**灯の指先が、すこし白くなる。**
      白の上に、灯の影だけが薄く伸びている。**影はまだ色を持っていた。**」
      ⚠️ **この2秒に、声を1つも置かない。** 名前を呼ばない——上の註を見よ。
      ⚠️ **最後の画は、朱と、白と、影である。** 灯はもう画の外にいる。

reference_set:
  - 灯.identity
  - 灯.states.支払いのあと
  - 灯.negatives
  - 暖簾の店の前.base
  - 暖簾の店の前.geography
  - 暖簾の店の前.states.朱が戻った
  - 暖簾.appearance
  - 暖簾.negative
  - 白い形.appearance
  - 白い形.negative

forbidden_set:
  - 暖簾の店の主
  - 近所の者
  - 猫
  - 澪
  - 数字
  - 写真的な四角
  - 灯の顔
  - 店の内側
  - くぐる者
  - 呼ばれる名       # ⚠️ **この話のフックである。** 呼べば、灯が失ったものが戻る。
  - 立ち止まる灯     # ⚠️ **振り返らない。** 草稿 L21「灯はそれが、いやではなかった」。

attached:
  - 灯.identity
  - 灯.states.支払いのあと
  - 灯.negatives
  - 暖簾の店の前.base
  - 暖簾の店の前.geography
  - 暖簾の店の前.states.朱が戻った
  - 暖簾.appearance
  - 暖簾.negative
  - 白い形.appearance
  - 白い形.negative

disclosure_state:
  暖簾.朱: 戻った
  暖簾.下のやりとり: 思い出された
  灯.支払い: 済んだ
  灯.渡した声: 名を失った
