# 『白地図』第1章「暖簾」 / 開示 / still —— 払い終える。白にいちばん近かったものが、ひとつ減る
#
# **出典** 本文は `soul-voice-teller/examples/hakuchizu/草稿/draft_01-1_暖簾.md` の L19・L21。
# ⚠️ **この記録は①breakdown の側であり、§1–20 を持たない。**
#
# ⚠️ **この1本の変化は、運動ではない。** ゆえに `mode: still` である。
#    草稿 L19「ただ、うしろのほうで、**いちばん白に近かったものがひとつ減った。**」
#    ⚠️ **減ることは、動くことではない。** 消えるものは、どこかへ行かない——
#    **その形の上に紙が戻るだけである**（S01 と同じ法）。
#    **「減る」を運動として撮れば、この1本は「何かが飛び去る」1本になる。**
#
# ⛔ **減るものを「隣家の二階のベランダ」に置いたのは発明である**（要承認）。
#    草稿は「**うしろのほうで**」と書く。**だが1ショットは1場所である**——
#    `place` は `暖簾の店の前` であり、**うしろの通りは画の外である。**
#    ゆえに**減るものは、同じ画のうちに在るものでなければならない。**
#    草稿 L5 が、洗濯物を**この町の白がいちばん多く積まれている場所**として既に置いている——
#    **「いちばん白に近かったもの」が、いちばん白が多い場所にあるのは、発明ではなく帰結である。**
#    ⚠️ **それでも、どこの白が減ったかを草稿は書かない。** 台帳の同じ註を見よ。
#
# ⚠️ **この1本が開示するのは「払いが起きたこと」だけである。**
#    草稿 L19「**なにを渡したのか、灯はまだ言えない。**……**それがなにかは、あとで判る。**」
#    ⚠️ **ゆえに観客は、何が減ったのかを名指せない。** 名指せるのは**白がひとつ減ったこと**だけである。
#    **名指せないことは、この1本の欠陥ではない。この1本の内容である。**

shot: hakuchizu-ch01-seg10
spec: specs/video/hakuchizu-ch01-seg10.md
key_image: specs/image/hakuchizu-ch01-seg10.md

unit:
  before: >-
    二階のベランダに、白い洗濯物の形がいくつも並んで吊るされている。
    **そのなかに、いちばん白に近いものがひとつある**——**他の白より、少しだけ白い。**
  after: >-
    **ひとつ減った。** 吊るされていた場所が空いている——**紐だけが残っている。**
    ⚠️ **減ったのは、いちばん白に近かったものである。** 残りはまだ白い。
    ⚠️ **灯はそれを数えない**（草稿 L19「灯はそれを数えない。数えても、渡したものは戻らない」）。

# 開示——**この一変化は、観客の知の状態を変える。**
# ⚠️ **観客が知るのは「払いが起きた」ことだけである。** 何を払ったかは、まだ知らない。
role: 開示

place: 暖簾の店の前
time: 朝
mode: still
duration: 6s

motion:
  # ⚠️ **`still` でも `motion` は要る**（`L16`）。**止まるのは主題であって、画面ではない。**
  #    ⚠️ **この1本では、主題そのものが「減る」である。** ゆえに
  #    **この欄が書いているのは「動かないこと」である**——珍しいが、これが正しい。
  subject: 二階のベランダの白い形のうち、いちばん白に近いもの（それが紙に戻る）
  quality: >-
    **減りかたは、動かない。** 薄くならない、飛ばない、揺れない——
    **ある瞬間まで在って、次の瞬間には無い。** ⚠️ **拍を置かない。**
    ⚠️ **減るのは、この1本のうち一度だけである。**
    草稿 L19「**ものがひとつ減った**」——ひとつ、である。
    ⚠️ **他の白は動かない。** 揺れない（草稿 L5「風に揺れることもない」）、
    薄くもならない——**減ったものだけが減る。**
  law: >-
    `gouache-abstract` の物理。**減ることは、その形の上に紙が戻ることである**——
    S01 と同じ法である（`shots/hakuchizu-ch01-seg01.yaml` の `motion.law`）。
    ⚠️ **絵の具を弾き飛ばさない。** この様式に飛沫は無い——
    **戻るのは紙であって、絵の具がどこかへ行くのではない。**
    ⚠️ **跡を残さない。** 残るのは**紐と、空いた間隔**だけである。
    ⚠️ **`no visible person among the white shapes`**——**減るのは白であって、人ではない。**
    この1本が「誰かが居なくなった」に見えたら、それは別の話である。

beats:
  - range: 0-2s
    density: held
    what: >-
      二階のベランダ。**白い形がいくつも並んでいる。** そのひとつが、**少しだけ白い。**
      ⚠️ **差は小さくする。** **「いちばん白に近い」は、いちばん白いことではない**——
      草稿 L19 の語は「白に近い」である。**近いものは、まだ白になっていない。**
  - range: 2-3s
    density: dense
    what: >-
      **減る。** 吊るされていた場所が空く。**紐だけが残る。**
      ⚠️ **この1秒が、この1本の変化である。** 6秒のうちの1秒——
      **山（S08）と同じ配分の仕方である**（短い核を、長い溜めで挟む）。
  - range: 3-4s
    density: held
    what: >-
      空いた場所。**他の白は動かない。** 灯も動かない。
      ⚠️ **この1秒は、観客が「何が減ったのか分からない」ことを確かめる1秒である。**
      **分からないことが、この1本の内容である**（上の註）。
  - range: 4-6s
    density: sparse
    what: >-
      灯は**立っている**。動かない。**数えない**——
      草稿 L19「灯はそれを数えない。**数えても、渡したものは戻らない。**」
      ⚠️ **数えないことは、S05 と同じ法の上にある。** あちらは**数えられない白**であり、
      こちらは**数えない者**である。⚠️ **この2本は対である**——`PLAN.md` §1 の S05 の註を見よ。

reference_set:
  - 灯.identity
  - 灯.states.支払いのあと    # ⚠️ **支払いは、この1本で済む**（`ledger.disclosure` の2点目）。
  - 灯.negatives
  - 暖簾の店の前.base
  - 暖簾の店の前.geography
  - 暖簾の店の前.states.朱が戻った
  - 暖簾.appearance
  - 暖簾.negative
  - 白い形.appearance
  - 白い形.negative

forbidden_set:
  - 暖簾の店の主
  - 近所の者
  - 猫
  - 澪
  - 数字              # ⚠️ **この1本の主題は「数えない」である。数を画に置けない。**
  - 写真的な四角
  - 灯の顔
  - 店の内側
  - くぐる者
  - 減る白の正体      # ⚠️ **何が減ったのかを描かない。** 名指せないことが、この1本の内容である。

attached:
  - 灯.identity
  - 灯.states.支払いのあと
  - 灯.negatives
  - 暖簾の店の前.base
  - 暖簾の店の前.geography
  - 暖簾の店の前.states.朱が戻った
  - 暖簾.appearance
  - 暖簾.negative
  - 白い形.appearance
  - 白い形.negative

disclosure_state:
  暖簾.朱: 戻った
  暖簾.下のやりとり: 思い出された
  灯.支払い: 済んだ
  灯.渡した声: 持っている
