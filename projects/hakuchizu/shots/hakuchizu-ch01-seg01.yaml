# 『白地図』第1章「暖簾」 / 情景 / motion —— 戻りかけの色が消え、通りが完全な白になる
#
# **出典**
#   本文は `soul-voice-teller/examples/hakuchizu/草稿/draft_01-1_暖簾.md` の L1。
#   世界の法は `構想/world.md`、絵の基準は `distill-essence-engine/examples/hakuchizu/`。
#
# ⚠️ **この記録は①breakdown の側であり、§1–20 を持たない。** 仕様は `spec:` の先である。
#
# ⚠️ **このショットは「一話の一部」ではない。** 一話を11に割った最初の1本である。
#    切ったのは**変化**であって、行数でも秒数でもない——
#    草稿の27行は、11の「一つの変化」に割れる（`PLAN.md` §1）。
#
# ⚠️ **この1本は `灯` を画面に出さない。** 出るのは**色そのもの**である。
#    ⚠️ ゆえに `reference_set` に人物の鍵が1つも無い——**これは省き忘れではない。**

shot: hakuchizu-ch01-seg01

# 動画の仕様（§1–20 を持つ）。**§18 の見出しがモデルを名乗る**——この一枚は
# **`18. WAN 3.0 PROMPT MAPPING`** である（`L18` が読む）。
spec: specs/video/hakuchizu-ch01-seg01.md

# 画像の仕様（§1–20 を持たない・7欄と `Negative` を持つ）。**動画の最初のコマではない**——
# 「このショットの見せ場の1枚」であり、**添付（参照画像）として**動画へ渡る（決定 2026-09-13）。
key_image: specs/image/hakuchizu-ch01-seg01.md

unit:
  before: >-
    通りに、戻りかけの色がまだ残っている。朱と群青の名残が、屋根と戸の上で
    夜を越えかけている——**濃く塗った色ほど、まだ薄くなりきっていない。**
  after: >-
    色はどこにも無い。通りは完全な白で、その白の上に朝の光だけが薄く積もっている。
    ⚠️ **町は動いていない。動いたのは色である。**

# 情景——**この一変化は、世界の法が最初に実演されることである。**
# ⚠️ **人物のショットではない。** 誰も立たない。**立たないことは、この1本の仕事である。**
role: 情景

# **地理である**（habits の「記名の現場」ではない。`PLAN.md` §0-g）。
place: 通り

# ⚠️ **夜明け前である。** 草稿 L1「朝のうちに戻ることもあれば、灯が一晩眠るあいだに戻ることもある」
#    ——この1本は**その「朝のうち」の側**であり、朝の光はまだ**積もりはじめたところ**である。
time: 夜明け前

mode: motion

duration: 6s

motion:
  subject: 戻りかけの朱と群青の名残
  quality: >-
    **薄くなり、消える。** 夜のあいだに薄くなった色が、朝の光の下で残りを失う。
    ⚠️ **速くならない。** 消えることは、この1本では**出来事ではなく経過**である——
    だから4秒を、ほぼ均さずに使う。**濃い色から先に、順に。**
  law: >-
    `gouache-abstract` の物理。**絵の具は不透明である**——薄くなることは、
    **紙が上から戻ってくること**であって、色が透けていくことではない。
    ⚠️ **水彩のぼかしにしない。** この様式の色は**置かれたものであって、滲んだものではない。**
    ⚠️ 様式カードの中身は `distill-essence-engine` にある。ここに置くのは**名前だけ**である。

beats:
  - range: 0-2s
    density: held
    what: >-
      通り。戻りかけの色が、まだ屋根と戸の上にある。**朱が先に薄くなっている**——
      草稿 L1「戻りかけの色ほど早く消えて、濃く塗った朱や群青ほど、夜までかかって薄くなる」。
      ⚠️ **この2秒は色を数えるための2秒である。** 数えられること自体が、この町の法である。
  - range: 2-4s
    density: sparse
    what: >-
      朱の名残が消える。**消えた場所には、もう何も無い**——跡も、輪郭も、影も置かれない。
      ⚠️ **「消えていく」を動きとして見せない。** 見せるのは**残っているものが減ること**である。
  - range: 4-6s
    density: sparse
    what: >-
      群青の名残が消える。通りは白だけになる。朝の光が白の上に薄く積もりはじめ、
      **白は光を受けても白のままである**（色を持たない——草稿 L3「白は音を持たない」の視覚側）。

# ⚠️ **`reference_set` の鍵は、すべて `ledger.yaml` に在る。**（`L8`）
#    ⚠️ **人物の鍵が1つも無い。** この1本に人は立たない——
#       **`attached` にも同じく人物が無い**のが正しい（`L6` が突き合わせる）。
reference_set:
  - 通り.base
  - 通り.geography

# ⚠️ **この一話に居ない者を、名で禁じる。** 省略すれば、モデルは「他の誰か」を描く。
#    ⚠️ **この一覧は手で書いた。** 台帳から機械で導いたものではない——**ずれる。**
#    ⚠️ **`灯` を禁じるのは、この1本が人物を持たないからである**（他の10本は持つ）。
forbidden_set:
  - 灯                # この1本に立たない。出れば、白の1本ではなくなる。
  - 暖簾の店の主
  - 近所の者          # 台帳に鍵を作らない（`PLAN.md` §2）。**物々交換は手と形で見せる。**
  - 猫                # 草稿 L5「猫はもういない」。**もう居ないものを、白の下から出さない。**
  - 澪                # 第1章に居ない。
  - 数字              # 草稿 L7「数字は町を戻さない」。数は白を戻さない。
  - 写真的な四角      # 第4章以降のモチーフ。**第1話には出ない。**

# ⚠️ **`attached` は宣言であって記録ではない。**（`hitosara` の同じ註）
#    **生成は一度も走っていない**（`PLAN.md` §0-h）——ゆえにここにあるのは
#    「何を添付するつもりか」であって、「何を添付したか」ではない。
#    **記録はテイクの側に在る**（`take.params.references`）。⚠️ **`takes/` はまだ無い。**
attached:
  - 通り.base
  - 通り.geography

# ⚠️ **台帳の `disclosure` と対である。**（`L7`）
#    ⚠️ **4つの属性を、11本すべてが持つ。** 部分的に書くと、
#       「書いていない属性は食い違いではない」規則（`L7`）によって**検査から落ちる**——
#       落ちたことは註に出るが、**註は読まれないと消える。**
#    ⚠️ **この1本では、色が最初に白へ戻る。** 観客がこの時点で知るのは
#       **「この町の色は戻り、そして消える」という法だけ**である——
#       暖簾の朱も、支払いも、渡した声も、**まだ何も起きていない。**
disclosure_state:
  暖簾.朱: 白
  暖簾.下のやりとり: 未
  灯.支払い: 未
  灯.渡した声: 持っている
