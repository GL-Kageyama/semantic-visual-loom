# 『白地図』第1章「暖簾」 / 質感 / motion —— 水の跡が乾き、乾いた境だけが残る
#
# **出典** 本文は `soul-voice-teller/examples/hakuchizu/草稿/draft_01-1_暖簾.md` の L5 前半。
# ⚠️ **この記録は①breakdown の側であり、§1–20 を持たない。**
#
# ⚠️ **この1本に人は立たない。** 草稿 L5「通りに人影はない」——
#    そして**この1本が撮るのは、人影が無いことの質感である。**
#    ⚠️ **そこに居るのは水の跡だけ**であり、撒いた者は**最後まで出ない。**
#
# ⚠️ **この1本は「白のなかで唯一動くもの」である。**
#    草稿 L3「白は音を持たない」——ゆえに**この1本にも音は無い**（§14）。
#    **動くのは水の跡だけであり、それは音を立てない。**

shot: hakuchizu-ch01-seg03
spec: specs/video/hakuchizu-ch01-seg03.md
key_image: specs/image/hakuchizu-ch01-seg03.md

unit:
  before: 石畳の上に、夜明け前に撒かれた水がまだ残っている。**乾いたところと、乾いていないところの差が、まだ読める。**
  after: >-
    水は乾いた。**残っているのは、乾いた境の濃さだけである**——
    水そのものはどこにも無く、境だけがまだ濃い。

# 質感——**この一変化は、面ではなく、質である。**
role: 質感

place: 通り
time: 朝
mode: motion
duration: 7s

motion:
  subject: 石畳の上で乾いていく水の跡と、その乾いた境
  quality: >-
    **乾く速さは、一定である。** 速まらない——**この1本は、誰も急いでいない7秒である。**
    ⚠️ **動くのは「境」である。** 水は減るが、**水が動くのではない。**
    だからカメラが追うのは**境の線**であって、水たまりではない。
    ⚠️ **草稿 L5「乾いた境が、かすかに濃い」**——**かすかに、である。**
    強くすると、この1本は「水が乾く」ではなく「濃い線が現れる」になる。
  law: >-
    `gouache-abstract` の物理。**水の跡は絵の具である**——
    乾くことは、**薄いウォッシュが紙に吸われて、輪郭だけが濃く残ること**である。
    ⚠️ **濡れて光る面を作らない。** この様式に光沢は無い（カードの `avoid` が
    `gloss` を禁じている）。**「まだ濡れている」は、色の濃さで示す。**

beats:
  - range: 0-2s
    density: sparse
    what: >-
      石畳。水の跡がまだ広い。**乾いたところと乾いていないところの差が、はっきり読める。**
      ⚠️ **撒いた者を探す画にしない。** カメラは**下を向いている**——
      誰が撒いたかは、この作品のどこでも明かされない。
  - range: 2-5s
    density: held
    what: >-
      境が動く。**水の側が縮み、乾いた側が広がる。**
      ⚠️ **この3秒は、この作品でいちばん静かな3秒である。** 音も、人も、風も無い。
      **白のなかで、水だけが時間を持っている。**
  - range: 5-7s
    density: sparse
    what: >-
      水はもう無い。**境だけが、かすかに濃く残っている。**
      草稿 L5 の一行が、この1本の終わりの画である——
      **「乾いた境が、かすかに濃い」。**

reference_set:
  - 通り.base
  - 通り.geography
  - 水の跡.appearance
  - 水の跡.negative

forbidden_set:
  - 灯                # この1本に立たない。
  - 暖簾の店の主
  - 近所の者
  - 猫
  - 澪
  - 数字
  - 写真的な四角
  - 水を撒く者        # 草稿は撒いた者を名指さない。**名指せば、この1本は人物の1本になる。**

attached:
  - 通り.base
  - 通り.geography
  - 水の跡.appearance
  - 水の跡.negative

disclosure_state:
  暖簾.朱: 白
  暖簾.下のやりとり: 未
  灯.支払い: 未
  灯.渡した声: 持っている
