# 『白地図』第1章「暖簾」 / 運動 / motion —— 足音が白を踏み、生まれた影がもう消えている
#
# **出典** 本文は `soul-voice-teller/examples/hakuchizu/草稿/draft_01-1_暖簾.md` の L3。
# ⚠️ **この記録は①breakdown の側であり、§1–20 を持たない。**
#
# ⚠️ **この1本の変化は「歩くこと」ではない。** 変化は**影の寿命**である——
#    踏まれたところに影が生まれ、**それが消える前に、次の一歩が来る。**
#    草稿 L3「踏んだところからわずかに影が生まれて、また消える」。
#    ⚠️ **「歩いている」を撮ると、この1本は何も言わない1本になる。**
#
# ⚠️ **順路は画面に出ない。** 草稿 L3「暖簾の店からはじめて、路地を抜け、広場を渡り、橋を越える」
#    ——**この順路を撮るのは §7 と §15 であって、カメラではない。**
#    ⚠️ **路地も広場も橋も、この章では撮らない**（`PLAN.md` §1 の11本の外にある）。

shot: hakuchizu-ch01-seg02
spec: specs/video/hakuchizu-ch01-seg02.md
key_image: specs/image/hakuchizu-ch01-seg02.md

unit:
  before: 白い通りに、まだ誰の足音も無い。踏まれていない白だけがある。
  after: >-
    足音が白を踏み、踏んだところに影が生まれ、**その影はもう消えている。**
    通りの白は、踏まれた回数だけ少ない影を持つ。

# 運動——**この一変化は、運動そのものである。**
# ⚠️ **`role: 運動` に限定を付けない。** 影は「作画」で動くが、
#    この1本の主体は**影ではなく足音**である（`rolemap.MOTION_PATTERNS` の13のうち、
#    当てはまる限定が1つも無い——**無理に当てはめない**）。
role: 運動

place: 通り
time: 朝
mode: motion
duration: 8s

motion:
  subject: 灯の足音と、それが白の上に作る影
  quality: >-
    **二十年おなじ速さである。** 速くも遅くもならない——草稿 L3「二十年、順番は変わらない」。
    ⚠️ **影は生まれて、消える。** 消えるのは**次の一歩が来る前**である。
    ゆえに画面には、**常に影がひとつ以下**しか無い。
    ⚠️ **これは演出である。** 影が2つ見えた瞬間、この町は2人分の記憶を持つことになる。
  law: >-
    `gouache-abstract` の物理。**影は色であって、光ではない**——
    影が生まれることは、**紙の上に濃い一筆が置かれること**であり、
    消えることは**その一筆が紙に戻ること**である。
    ⚠️ **ぼかさない。** この様式の影は**縁を持つ**。

beats:
  - range: 0-2s
    density: sparse
    what: 白い通り。足音が遠くから来る。**まだ影は無い**——影は踏んだところにしか生まれない。
  - range: 2-5s
    density: held
    what: >-
      足音が白を踏む。踏んだところに影が生まれ、**同じ歩調のまま、すぐ消える。**
      ⚠️ **この3秒は、影の寿命を観客の身体に入れるための3秒である**——
      ここで覚えられた速さが、8本あとの山で効く。
  - range: 5-8s
    density: sparse
    what: >-
      影の生まれて消えることが、**歩調の一部になる。** 数えられる速さになる。
      ⚠️ **この1本は、最後まで誰の顔も出さない**——出るのは白と、足音と、影である。

reference_set:
  - 灯.identity
  - 灯.states.支払いの前
  - 灯.negatives
  - 通り.base
  - 通り.geography

forbidden_set:
  - 暖簾の店の主
  - 近所の者
  - 猫
  - 澪
  - 数字
  - 写真的な四角
  - 灯の顔            # 台帳 `灯.negatives` と同じことを、禁制集合の側でも名指す。

# ⚠️ **`attached` は宣言であって記録ではない**（`takes/` は無い）。
attached:
  - 灯.identity
  - 灯.states.支払いの前
  - 灯.negatives
  - 通り.base
  - 通り.geography

disclosure_state:
  暖簾.朱: 白
  暖簾.下のやりとり: 未
  灯.支払い: 未
  灯.渡した声: 持っている
