# 『白地図』第1章「暖簾」 / 反応 / still —— 止まる。房に触れそうになって、やめる
#
# **出典** 本文は `soul-voice-teller/examples/hakuchizu/草稿/draft_01-1_暖簾.md` の L9。
# ⚠️ **この記録は①breakdown の側であり、§1–20 を持たない。**
#
# ⚠️ **この1本の変化は「触れないこと」である。**
#    草稿 L9「灯は房に触れそうになって、**やめる。**」——
#    ⚠️ **やめることは、行為である。** 何も起きないのではない——
#    **起きかけたことが、灯の側で止められる。**
#    ゆえにこの1本は、**この話で最初に「灯が決める」1本**である。
#    （S08 の色は結果であり、S10 の支払いは決算である。**決めたのは、ここである。**）
#
# ⚠️ **`mode: still` の判断について。** スキーマは `still` を
#    「**主題が止まる**（動くのは光と粉塵だけ）」と定める。この1本は
#    **手が一度だけ動く**——ゆえに**字形の上では食い違っている。**
#    ⚠️ **これは事故ではなく判断である。** 理由——
#    ① **この1本の主題は「止まること」そのものである。** 主題は動かず、**動いたものが止まる。**
#    ② **主題は暖簾である。** 暖簾は8秒のあいだ、**風を受けても1ミリも動かない**（草稿 L9）。
#       動くのは**風と、埃と、灯の手**であり、**布はそれらのどれにも答えない。**
#    ③ ⚠️ **動きを1つに絞ったのは意図である。** 山の前の8秒で、観客に覚えてほしいのは
#       **「この布は動かない」**の一点である。**手の動きを増やせば、その一点が薄まる。**
#    ⚠️ **記録に残すのは、これが判断であるためである**（スキーマの註——
#       「種別とモードが食い違うときは、それが判断か事故かを記録に残す」）。
#
# ⚠️ **この1本の風は、S09 で戻ってくる。** 草稿 L15「布が風を受けて、**ぱさりと鳴る**。
#    白のなかにはなかった音だった」。**同じ風である**——
#    ここでは布が答えず、S09 では布が鳴る。**その差が、色の値である。**

shot: hakuchizu-ch01-seg06
spec: specs/video/hakuchizu-ch01-seg06.md
key_image: specs/image/hakuchizu-ch01-seg06.md

unit:
  before: >-
    灯は止まっている。**指先は房の手前にある**——あと少しで届く。**まだ触れていない。**
    白い房は垂れたままで、**指の近くに在ることを、布は知らない。**
  after: >-
    指は戻っている。**触れなかった。** 房は**触れられなかったことを知らない**——
    白は手も風も知らない（草稿 L9「白は風を知らない」）。
    ⚠️ **変わったのは布ではなく、灯の側である。** この1本は、布を1ミリも動かさない。

# 反応——**この一変化は、外から来たものに対する応答である。**
# ⚠️ **応答が「やめる」であることは、応答しないことではない。**
role: 反応

place: 暖簾の店の前
time: 朝
mode: still
duration: 8s

motion:
  subject: 房の手前で止まる灯の指先と、それに答えない白い房を通り過ぎる風
  quality: >-
    **風は一度、通り過ぎる。** 強くならない——**吹き抜けるのではなく、通る。**
    ⚠️ **房は動かない。** 揺れない、浮かない、鳴らない——
    草稿 L9「風が吹いても白は揺れない。**白は風を知らない。**」
    ⚠️ **指は、届く手前で止まる。** 止まりかたは**急である**——
    ゆっくり近づいて、ゆっくり引くのではない。**やめる、という速さで止まる。**
  law: >-
    `gouache-abstract` の物理。**布は白いままであり、白は紙である**——
    紙は風を知らない。⚠️ **ゆえにこの1本の風は、布の側には一度も現れない。**
    風を見せるのは**埃**だけである——埃は**紙の上を滑る**（この様式では、
    埃もまた**置かれた粒**であり、ぼかした煙ではない）。
    ⚠️ **灯の指先に影を置かない。** 白くなるのは S11 である——
    **ここでは、指先はまだ色を持っている**（`ledger.characters.灯.states.支払いの前`）。

beats:
  - range: 0-3s
    density: held
    what: >-
      白い暖簾。**房が数本、下へ垂れている。** 灯の指先が、房の手前にある。
      ⚠️ **この3秒は、動かないための3秒である。** 何も起きない——
      **起きないことが、この作品でいちばん長く保たれる。**
    # ⚠️ **`held` は「保つ」である。** この3秒に出来事を置かない。
  - range: 3-5s
    density: sparse
    what: >-
      風が来る。**埃が石畳の上を滑る。** 房は**動かない。**
      ⚠️ **風が来たことは、埃でしか判らない。** それでよい——
      **判るために置くのではなく、布が答えないことを見せるために置く。**
  - range: 5-6s
    density: held
    what: >-
      指先が、届く手前で止まる。草稿 L9「灯は房に触れそうになって、**やめる。**」
      ⚠️ **この1秒が、この1本の変化である。** 8秒のうちの1秒——
      **山の前の息を止めているのは、この1秒である。**
  - range: 6-8s
    density: sparse
    what: >-
      指が戻る。**房は、まだ白いまま垂れている。** 風はもう過ぎている。
      ⚠️ **この2秒で、観客は「布は動かない」ことを身体で覚える。**
      その記憶が、**S08 の12秒で使われる**——色が戻る1本は、
      **この布が、これまで一度も動かなかったことを前提に組まれている。**

