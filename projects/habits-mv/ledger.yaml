#       他の23本は、**何も決めない**——**同じ問いを、別の手で受けるだけである。**
disclosure:
  # ⚠️ **`s01` は、ここに無い。** ——**変化点ではないからである。**
  #    `s01` はこの作品の最初のショットであり、**観客はそこで初めて
  #    「出席簿の転出欄に、一行が残っている」ことを知る。**
  #    ⚠️ **しかしそれは遷移ではない。** `L9` が明示している——
  #    「**初出は遷移ではない。最初に現れた値は『出発点』であって、
