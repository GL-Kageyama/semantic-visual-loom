  さくら:
    # メイン 4/4。第四巻『書いていない名』の語り手。**返却する者＝さくら、される者＝誰もいない。**
    # 登場するショット: `s18`。**ただし、彼女は画面に居ない。**
    # ⚠️ **これは省略ではない。これがこの一人の描き方である。**
    #    方針 §5a「**顔と固有の声を与えない。**」／`negatives` の一行目——
    #    「**設定画は通常、その不在を埋めるために顔を四度置く。この一枚は埋めない。**」
    #    ✅ **2026-09-28 実測——`メイン/04_さくら/` には `prompt.md` しか無く、PNG が1枚も無い。**
    #       **二十七名には在り、この一名には無い。** **不在は、実行によって保たれている。**
    # ⚠️ **ゆえに `s18` の「使われないまま、名札がある。」が、彼女の席である**——
    #    **名札は在り、それを着ける者は画面に居ない。**
    #    ⚠️ **参照集合には `さくら.negatives` だけを入れる。** `identity` は入れない
    #       ——**人物を描かないことがこの一名の identity だからである。**
    # 台帳は `soul-voice-teller/examples/habits/台帳/人物/メイン/04_さくら.md`。
    identity: >-
      character/メイン/04_さくら/prompt.md ——**画像は無い。**
      ⚠️ **この欄が指すのは「何を凍結するか」であり、この一人については
      「凍結する人物が無い」ことがその答えである。**
      ⚠️ **方針 §6-3 の問いは、消えていない**——**実体側に、その一枚が在る。**
      この作品はその問いに答えない。**答えずに、不在のまま画面へ置く。**
    states: {}
    negatives:
      # ⚠️ この一人だけ、初稿の Negative が「人物そのもの」を禁じている。
      - "no person, no figure, no character, no face, no body, no human silhouette, no portrait"
      - "no arm continuing past the wrist"
      - "no romaji in place of the Japanese name"
      - "no cherry blossom, no petals, no pink"   # 名は「さくら」だが、花ではない
      - "no identifying clothing, hairstyle, or prop"

