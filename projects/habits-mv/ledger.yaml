# ───────────────────────────────────────────────────────────── song_coverage
#
# **歌詞行 × ショットの対応。** この作品が `ledger` に足す唯一の軸である。
#
# ⚠️ **なぜ `ledger` であって `bible` ではないか**（設計 02 §2-1 の裁定）——
#    **`bible` は「何が与えられたか」。`ledger` は「何を決められたか」。**
#    曲（節・行・時刻）は Suno が与えた。**ゆえに `bible` に在る。**
#    **どの行をどのショットで受けるかは、この作品が決めた。** ゆえにここに在る。
#    ⚠️ **与えられたものを決められたものと混ぜれば、曲を引き直したときに
#       「決めた」の側まで作り直すことになる。**
#
# ⚠️ **なぜ `disclosure` の隣か**——**歌は、歌われている間ずっと観客へ何かを渡している。**
#    「まだ、呼ばれていない。」と歌いながら顔を置けば、**その一秒は開示である。**
#    **対応を決めることは、開示を決めることの一部である。** ゆえに同じファイルの隣に置く。
#
# ⚠️ **`L36` がこの欄を読む。** 二箇条——
#    ① **すべての行が、その行を名指す対応をちょうど1つ持つ。**
#       ⚠️ **`∨` を使わない。** 1行に二つ以上の行を書かない（`l09` と `l10` を1本の
#       対応にまとめるのは可——**行は1つであり、ショットが2つである**）。
#    ② **節ごとに、その節の行が全部覆われている ∨ その節を名指す対応が在る。**
#
# ⚠️ **27本のショットは、この表から生まれた。**（逆ではない——**曲が先である。**）
#    切れ目は**曲の内側の境界だけ**から採った——**節の頭・行の頭・行の終わり。**
#    ⚠️ **外から区切りを持ち込めば、それは容器である**（設計 01 §1.1）。
#    ⚠️ **当初の計画に在った「28本」は、容器から出た数である。** 曲から出した数は27本であり、
#       28本は「どこかを1つ割れば届く」数であった——**届かせない。**
#
# ⚠️ **1行＝1ショットとは限らない。**（設計 02 §2-2 が明示的に許す）
#    この作品では3つの形が在る——**1行→1本（24本）／複数行→1本（5本）／1行→2本（1行）。**
#    ⚠️ **「複数行→1本」は、行が細かすぎる場所で使う。** 2.473秒の行に2本を配れば、
#       **1本が1.2秒になる。** ショットは単位であり、**1.2秒は単位にならない。**
#    ⚠️ **「1行→2本」は `l31` だけである**——**行が9.506秒を1人で持ち、その後14.309秒の
#       後奏が続く。** 後奏に歌は無いが、**節に節の対応を付けると `L36` ①が空になる**
#       （`l31` の対応が1つでなくなる）。**ゆえに後奏は `l31` の2本目の側に置く。**
#
# ⚠️ **`note` は誰も読まない。**（`L36` は `note` を読みもせず、註にもしない）
#    ゆえにここに書いたことは**検査の根拠にならない**——**設計の記録である。**
#    ⚠️ **「検査が緑だから正しい」と読まないために、この一行を書く。**
song_coverage:
  # ── intro 0.000–8.059（8.059秒・**行が無い**）
  # ⚠️ **この節だけが、節ごとに受ける。** 8.059秒に歌詞が1行も無い——
  #    **節の対応が無ければ、この8秒はどの行にも属さず、`L36` の②が空になる。**
  #    ⚠️ **このショットは曲の頭を1人で持つ。** 画面が全部を負う8秒である。
  - section: intro
    shots: [habits-mv-s01]
    note: >-
      歌を持たない。**机の上の出席簿が、閉じた状態から開かれるまで。**
      8.059秒の長さは、この曲の中位である——**厳密に長い1本が10本ある**
      （`s18` 14.840／`s27` 14.309／`s17` 13.963／`s03` 10.000／`s10` 9.814／`s26` 9.506／
      `s09` 9.495／`s02` 9.015／`s16` 8.457／`s08` 8.218）。⚠️ **この数を数え直した**——
      初め「最も長い1本の一つである（…に次ぐ）」と書いていたが、**挙げていたのは3本だけで、
      実際には10本が長い。** **「〜に次ぐ」は、次ぐ先を全部挙げていなければ実測にならない。**
      ⚠️ **長回しである**（`regime: long-take`）。**明かす節である。**

  # ── pre-chorus-1 8.059–34.229（26.170秒・3行）／**1行→1本**
  # ⚠️ **この節は、行の尺が揃っていない**——9.015 / 10.000 / 7.155。
  #    ゆえに**切れ目は行の頭だけである****（行の中では切らない）。
  - line: l01
    shots: [habits-mv-s02]
    note: >-
      「目で、読む。」9.015秒。**碓氷千夏。手は `s01` で既に置かれている**——
      ゆえにこの1本は**目から始められる**（「手が先にあり、顔が後に来る」の2番目である）。
  - line: l02
    shots: [habits-mv-s03]
    note: >-
      「口は、動く。」10.000秒。**同じ人物の顔の、二つ目の部分。**
      ⚠️ **この行の直後に、2.527秒の歌の無い間が在る**（27.074–29.601）。
      **その間は、この1本ではなく次の1本（`s04`）が吸う**——
      **行が終わったところで、ショットも終わる。**（`bible.song.lines` の註を見る。）
  - line: l03
    shots: [habits-mv-s04]
    note: >-
      「音は、出ない。」——**行そのものは 4.628秒である**（29.601 から節末 34.229 まで）。
      ⚠️ **しかしこの1本は 27.074 から始まる**——**`l02` が終わった直後である。**
      その間の 2.527秒（27.074–29.601）に**歌詞が無い**。
      **ゆえに `s04` は 7.155秒である**——**歌の無い間を、この1本が吸っている。**
      ⚠️ **誰も吸わなければ、間は節の外へ落ちる。** **`L34` の節の合計が合わなくなる。**
      **歌の無い時間は、画面の側が持つ。**（`l23` の後の 4.840秒も同じ扱いである。）

  # ── chorus-1 34.229–49.867（15.638秒・4行）／**1行→1本**
  # ⚠️ **この節は1行2.473秒で畳みかける。** **`regime: beat`。**
  #    ⚠️ **ゆえに1行＝1本である。** ここで複数行を1本にまとめれば、
  #    **畳みかけている側を、画面がほどくことになる。**
  #    ⚠️ **`L34` の節の合計は、行の合計そのものである**——`s05`〜`s08` の合計 15.638。
  - line: l04
    shots: [habits-mv-s05]
    note: "「その字は、誰の字。」2.473秒。 **サビの問いの1本目。** 佐藤美咲。"
  - line: l05
    shots: [habits-mv-s06]
    note: "「その名は、誰の名。」2.474秒。 鈴木和彦。"
  - line: l06
    shots: [habits-mv-s07]
    note: "「読む手は、誰の手。」2.473秒。 高橋由美——**この一人の記名には名の欄が無い。**"
  - line: l07
    shots: [habits-mv-s08]
    note: >-
      「まだ、呼ばれていない。」8.218秒。**サビの4行目だけが長い**——
      ⚠️ **この1本が、この節で唯一「明かせる」長さを持つ。** しかし**明かさない**——
      **「まだ、呼ばれていない」と言いながら顔を置けば、その行が偽になる。**
      片山大翔と石川久美子。

  # ── verse-2 49.867–69.176（19.309秒・4行）／**複数行→1本**
  # ⚠️ **この節は、行が細かい。** 4行が 1.516 / 7.979 / 5.186 / 5.382 とばらつく。
  #    **ゆえに2行を1本にする**——`l08`+`l09`（9.495秒）と `l10`+`l11`（9.814秒）。
  #    ⚠️ **切れ目は `l10` の頭である。** **曲の内側の境界である。**
  - line: l08
    shots: [habits-mv-s09]
    note: >-
      「箱の側面に、四枚。」1.516秒 ＋ `l09`「剥がさないまま、重なっている。」7.979秒 = 9.495秒。
      **暮林蒼。** ⚠️ **1.516秒の行を1本で持たせない**——**それは単位にならない。**
  - line: l09
    shots: [habits-mv-s09]
    note: "`l08` と同じ1本である。**上の註を見る。**"
  - line: l10
    shots: [habits-mv-s10]
    note: >-
      「いちばん古い一枚が、いちばん下にある。」5.186秒 ＋
      `l11`「違う読みで呼ばれて、振り向く。」5.382秒 = 9.814秒。
      ⚠️ **この1本が、この作品で最初に顔を置く場所である**——**「振り向く」が、それを許す。**
  - line: l11
    shots: [habits-mv-s10]
    note: "`l10` と同じ1本である。**上の註を見る。**（`disclosure` の `habits-mv-s10` も見る。）"

  # ── pre-chorus-2 69.176–76.277（7.101秒・3行）／**複数行→1本**
  # ⚠️ **1行2.473秒が3つ。** 3本に割れば**1本2.4秒**であり、**この節は長回しである**
  #    （`regime: long-take`）——**長回しの節を2.4秒に割れば、regime が嘘になる。**
  #    **ゆえに1本である。** 7.101秒。
  - line: l12
    shots: [habits-mv-s11]
    note: "「まだ、読む。」2.473秒 ＋ `l13`「口は、動く。」＋ `l14`「音は、出ない。」= 7.101秒。 篠原麻衣。"
  - line: l13
    shots: [habits-mv-s11]
    note: "`l12` と同じ1本である。**`s02`〜`s04` の3行が、ここで3秒に畳まれて戻る。**"
  - line: l14
    shots: [habits-mv-s11]
    note: "`l12` と同じ1本である。**この反復が、この曲の形である。**"

  # ── chorus-2 76.277–97.021（20.744秒・5行）／**1行→1本**
  - line: l15
    shots: [habits-mv-s12]
    note: "「その字は、誰の字。」2.473秒。 大森徹。"
  - line: l16
    shots: [habits-mv-s13]
    note: "「その名は、誰の名。」2.473秒。 川上桜。"
  - line: l17
    shots: [habits-mv-s14]
    note: "「読む手は、誰の手。」2.474秒。 関翔太。"
  - line: l18
    shots: [habits-mv-s15]
    note: >-
      「まだ、呼ばれていない。」4.867秒。 長田美穂と斎藤悦子。
      ⚠️ **`l19` と同じ語である。行は別である**（`bible.song.lines` の註を見る）——
      **ゆえに註にならない。** 4.867秒と 8.457秒——**同じ語が、同じ長さで2度は来ない。**
  - line: l19
    shots: [habits-mv-s16]
    note: >-
      「まだ、呼ばれていない。」8.457秒。 根本湊と関口浩一。
      ⚠️ **この節で最も長い1本である。** **`l18` の 4.867秒と合わせて 13.324秒**——
      サビの中に、**長回しの節にしか無いはずの長さが2本在る。**
      **ゆえに `s15`・`s16` は、サビでありながら「明かせる」1本である。**
      ⚠️ **それでも明かさない。** **この2本が持つ行は「まだ、呼ばれていない。」である。**

  # ── bridge 97.021–125.824（28.803秒・4行）／**複数行→1本**
  # ⚠️ **この節は、行が 4.069 / 4.947 / 4.947 / 10.000 と長い。**
  #    **ゆえに1本にまとめる必然は無い**——しかし**2本にするのが正しい**（下の註）。
  - line: l20
    shots: [habits-mv-s17]
    note: >-
      「宛先の無い札が、一枚。」4.069秒 ＋ `l21`「鍵は、五年前から、ある。」4.947秒
      ＋ **`l22` の歌われる区間 4.947秒** = 13.963秒。
      **侘田すみれ。** ⚠️ **`l20` と `l21` は同じ物を指している**（札と、その札が付いた鍵）——
      **別のショットに割れば、物が2つになる。** **1本である。**
      ⛔ **この和は、2026-09-28 に直した。** 前の版は `l22` を数えずに
      **「4.069 ＋ 4.947 = 13.963」**と書いていた——**4.069 ＋ 4.947 = 9.016 であり、合計が合っていなかった。**
      ⚠️ **実測**: `l22` は **106.037秒**に歌われ、**それは `s17`（97.021–110.984）の内側である。**
      `song_coverage` は `l22` を `s18` に割り当てている（下の註）——**それは絵の側の判断であって、
      歌の位置ではない。** ⛔ **ゆえに `s17` の末尾 4.963秒（9.0–13.963、`held`）は、
      `l22` が歌われているあいだ、止まっている。** **運動の層を作り直す対象である**（`shots/` の頭の註）。
  - line: l21
    shots: [habits-mv-s17]
    note: "`l20` と同じ1本である。**`disclosure` の `habits-mv-s17` を見る。**"
  - line: l22
    shots: [habits-mv-s18]
    note: >-
      「束から、一枚が、切り離される。」——⚠️ **この行は 106.037秒に歌われる**（上の `l20` の註）。
      **この1本の側の和は、次のとおりである**: `l23`「使われないまま、名札がある。」10.000秒
      ＋ **その後 120.984–125.824 の 4.840秒（歌が無い）** = 14.840秒。
      ⛔ **この和も、2026-09-28 に直した。** 前の版は `l22` の 4.947秒を足して
      **「= 14.840秒」**と書いていた——**4.947 ＋ 10.000 ＋ 4.840 = 19.787 であり、合計が合っていなかった。**
      ⚠️ **`l22` は `s18` の時間の中に無い。** **この1本は、その行を 4.947秒おくれて絵にする**——
      **`before`/`after` と `motion.subject` が、その行そのものである**（`shots/habits-mv-s18.yaml`）。
      ⚠️ **この曲で最も長い1本である。** 侘田すみれ、そして**画面に居ない者**。
      ⚠️ **初め「2番目に長い1本である」と書いていた**——**`duration` の欄から数え直して誤りと分かった。**
      **27本で長い順に `s18` 14.840／`s27` 14.309／`s17` 13.963。** **この1本が1番目である。**
  - line: l23
    shots: [habits-mv-s18]
    note: >-
      `l22` と同じ1本である。 ⚠️ **この行が10.000秒を1人で持つ。**
      **そのあとの 4.840秒に歌は無い**——**`l03` の前の 2.527秒と同じ扱いである**
      （**歌の無い時間は、画面の側が持つ**）。**ゆえに `s18` が 14.840秒である。**
      **`disclosure` の `habits-mv-s18` を見る。**

  # ── final-chorus 125.824–155.505（29.681秒・7行）／**1行→1本**
  # ⚠️ **この節は、前半がビートであり、後半が長い。**（`bible.song.sections` の註を見る）
  #    **節としては `beat` を採った**——ゆえに**切れ目はすべて行の頭である。**
  #    ⚠️ **行の頭で切れば、2.4秒の1本と 6.7秒の1本が同じ節に並ぶ。**
  #    **それがこの節の実測である。**
  - line: l24
    shots: [habits-mv-s19]
    note: "「その字は、誰の字。」2.474秒。 木村智美。"
  - line: l25
    shots: [habits-mv-s20]
    note: "「その名は、誰の名。」2.393秒。 ⚠️ **この曲で最も短い1本である。** 山田健太。"
  - line: l26
    shots: [habits-mv-s21]
    note: "「読む手は、誰の手。」2.554秒。 田村彩。"
  - line: l27
    shots: [habits-mv-s22]
    note: "「まだ、呼ばれていない。」5.345秒。 三宅隆と池田絵里。"
  - line: l28
    shots: [habits-mv-s23]
    note: >-
      「まだ、呼ばれていない。」6.703秒。 宮下遥と橋本悠斗。
      ⚠️ **橋本悠斗の床は1行厚い**（`characters` の註を見る）——**読める字を置かない。**
      ゆえにこの1本は、**この曲で唯一「字を持ちながら読めない」ことを二重に負う。**
  - line: l29
    shots: [habits-mv-s24]
    note: >-
      「誰の名。」5.026秒。 秋山誠と前田亮太。
      ⚠️ **ここで初めて、サビの一行が落ちる**——「その字は」「その名は」「読む手は」が消え、
      **「誰の名。」だけが2度残る。** ⚠️ **ゆえに `s24` と `s25` は、問いが半分になった2本である。**
      **前田亮太は、この曲で2度目を持たない一人である**——**この作品でも、彼に2本目は無い。**
  - line: l30
    shots: [habits-mv-s25]
    note: "「誰の名。」5.186秒。 清水拓也と林沙織。 **この曲で最後に歌われるサビの一行である。**"

  # ── outro 155.505–179.320（23.815秒・1行）／**1行→2本**
  # ⚠️ **この1行だけが、2本を持つ。**（この欄の頭の註を見る）
  #    **9.506秒 ＋ 14.309秒 = 23.815秒。** **`L36` ①は「対応が1つ」を数えるので、
  #    `l31` の対応はこの1つである**——**ショットが2つ在ることは、対応が2つあることではない。**
  - line: l31
    shots: [habits-mv-s26, habits-mv-s27]
    note: >-
      「光が、紙の上に落ちている。」9.506秒、**そしてその後 14.309秒の後奏。**
      ⚠️ **後奏に歌は無い。** 節に節の対応を付ければ `l31` の対応が2つになる——
      **ゆえに後奏は、この1本の側に置く。**
      ⚠️ **`s27` は、この曲で2番目に長い1本である（14.309秒）**——**最も長いのは
      `s18` の14.840秒である。** **歌が終わったあとの14秒。**
      **この作品の最後の画面は、これである。**
      ⚠️ **`L36` の註——「曲の時間の外に在るショット」にならないのは、この2本が
      ここで名指されているからである。** **名指されていないショットは、註になる。**

# ─────────────────────────────────────────────────────────────── at
#
# ⚠️ **この作品に `at` は要らない。** 本編の `at` は §16 の見出しのレンジ名を運ぶ——
#    **主題歌MVに §16 のレンジは無い**（六十三話を章で切っていない）。
#    **無いものを、空の入れ物で置かない。**
