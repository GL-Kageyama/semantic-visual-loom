# 制作台帳 — 『ハビッツ！！！』主題歌MV『誰の名』（habits-mv）
#
# **連続性（世界の状態）と開示（観客の知識の状態）を同じファイルに持つ。**
# ⚠️ **二つに割ってはならない**——参照集合も禁制集合も、この一点から導かれる（`CLAUDE.md`）。
#
# ⚠️ **この作品には、もう一つの軸がある**——**歌詞行 × ショットの対応**（`song_coverage`）。
#    それは設計 02 §2-1 の裁定により、**このファイルに置かれる**——
#    **`bible` は「何が与えられたか」（曲）。`ledger` は「何を決められたか」（対応）。**
#    そして**この欄は `disclosure` の隣に在るのが正しい**——**歌は、歌われている間ずっと
#    観客へ何かを渡している。** ゆえに**対応を決めることは、開示を決めることの一部である。**
#
# ⚠️ **これは設計であって、生成の記録ではない。** 記録は `takes/` に在る。
#
# ⚠️ **出典が三つある。** すべて `projects/habits/` の側に在る——
#    run-09＝**正**（呼ばれ方の履歴・癖・配属）／run-10＝**層**（動きの署名）／
#    台帳 `series-bible.md`（巻・話・字数・伏線）。
#    ⚠️ **この作品は、そのどれも複製しない。** 主題歌MVは六十三話の要約ではない——
#    **曲が1本あり、その時間に画面を配る。** 人物の事実は本編の台帳に在り、ここは**指す。**

characters:
  # ⚠️ **二十八名すべてを置く。**（著者の指示「キャラは要所要所で出す——自然に多くの人数を出す」）
  #
  #    ⚠️ **ただし、この作品で「出す」の意味は、本編と違う。**
  #    主題歌MVは179.320秒しかない。**二十八人を等しく並べれば、それは図鑑である**
  #    ——run-10【動きが入ると壊れるもの】の「**一個ずつは動き、並べれば図鑑**」が、
  #    ここでは**時間の側から**同じことを言う。
  #    ゆえにこの作品は**手で人を出す**——**「読む手は、誰の手。」に、二十八の手を配る。**
  #
  #    ⚠️ **identity は、人のかたちの一枚を指す。**（本編と同じ——決定 2026-09-16）
  #    指し先は `distill-essence-engine/examples/habits/character/`。
  #    ✅ **2026-09-28 実測——二十八名のうち二十七名に PNG が在る。**
  #       ⚠️ **在らないのは `メイン/04_さくら` だけである**——**それがこの一枚の内容である。**
  #       （`さくら.negatives` の註を見る。）
  #
  #    ⚠️ **外見の記述は、出典に一行も無い。**（方針 §5a）
  #    ゆえに `states:` は全員 `{}` である——**衣装の記述が、出典にも初稿にも無い。**
  #    **凍結した一枚が、外見である。**
  #
  #    ⚠️ **`negatives` の二行は、二十八名に共通である**——読み手が一人の欄だけを読んでも
  #    その人物の床が分かるように、意図的に繰り返している。**層の床であり、個人の禁制ではない。**
  #      - `no face before the name is called`   …… run-10【ルックとカメラ】
  #      - `no identifying clothing, hairstyle, or prop` …… 方針 §5a（衣装・髪型で識別しない）
  #    ⚠️ **床を厚くするのは `bible.yaml` の `negative_base` である。** ここは重複ではない。

  # ─────────────────────────────────────────────────────── 中核の四人
  碓氷千夏:
    # メイン 1/4。第一巻『残った名』の語り手。**この MV の最初の手であり、最初の顔である。**
    # 登場するショット: `s01`（手）・`s02`（目）・`s03`（口）・`s04`（音が出ない）・`s26`・`s27`。
    # ⚠️ **彼女が4本を持つのは、この作品が彼女から始まるからである**——
    #    **手が先にあり、顔が後に来る。順序は入れ替えない**（run-10【ルックとカメラ】）。
    #    プレサビの3行（目・口・音）は、**その順序がそのまま歌詞になっている場所**である。
    # 台帳は `soul-voice-teller/examples/habits/台帳/人物/メイン/01_碓氷千夏.md`。
    identity: >-
      character/メイン/01_碓氷千夏/ChatGPT Image 2026年9月18日 20_29_36.png（キャラクター設定画）
      ＋ character/メイン/01_碓氷千夏/ChatGPT Image 2026年9月17日 21_56_32.png（表情シート）。
      **二枚を一組で凍結する。** `character-sheet × luminous-anime`。
      ⚠️ **この作品では、この一組が「顔を置く」ことの唯一の許可である**——
      本編の規則「**顔は、呼ばれた後にだけ置かれる**」を、彼女は**手のショットの後に置かれる**ことで満たす。
      ⚠️ カードの中身は `distill-essence-engine` に在る。**この欄は名前と指し先だけを持つ。**
      ⚠️ 外見の記述は出典に一行も無い（方針 §5a）。**凍結した二枚が外見である。**
    states: {}
    negatives:
      - "no face before the name is called"
      - "no identifying clothing, hairstyle, or prop"
      - "no romaji in place of the Japanese name"
      - "no handwriting by the subject"
      - "no signature"

