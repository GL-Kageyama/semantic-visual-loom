# verse-2 / long-take / motion —— 違う読みで呼ばれて、振り向く。
#
# **「いちばん古い一枚が、いちばん下にある。」**（`l10`·59.362秒）＋
# **「違う読みで呼ばれて、振り向く。」**（`l11`·64.548秒）。**2行を1本で受ける。**
#
# ✅ **この1本が、この作品で最初に顔を置く場所である。**（`s02`〜`s04` は顔の**部分**である。
#    **部分ではなく、顔が起きるのは、ここが最初である。**）
#
# ⚠️ **なぜここで顔を置けるか。** 世界の規則は
#    「**顔は、呼ばれた後にだけ置かれる。**」——
#    **この1行が、その「呼ばれる」を歌の中に持っている。**
#    ⚠️ **他のどの行も、それを持っていない。** サビは「まだ、呼ばれていない。」と言い、
#    問いは「誰の名。」と問うだけである。**この行だけが、呼びを内容とする。**
#    **ゆえにこの作品の顔の順序は、ここから始まる。**
#
# ⚠️ **「違う読み」である。** ——**正しい読みで呼ばれていない。**
#    それでも振り向く。**この作品の主題が、この一語に畳まれている。**
#    ⚠️ **画面は、その読みを字で見せない**（`props.宛名票.negative`）。
#    **読めないことは、この作品では欠落ではなく、主題の側である。**
#
# ⚠️ **`侘田すみれ.negatives` を参照集合に入れる**——彼女はこの1本に**名前だけ**で立つ。
#    台帳の註「`s10`（振り向く相手として名前だけ）」がそれである。**画面には居ない。**
#
# ⚠️ **`disclosure`: 宛名票の一行.いちばん古い一枚 が `present` になる変化点である。**
#    台帳の `disclosure` の3点のうちの1つ。`negative: covered`——
#    **§18 は変わらない。** この作品の §18 は27本すべてで同一である。
shot: habits-mv-s10

unit:
  before: "いちばん古い一枚が、**いちばん下にある。**手は、まだ其処に無い。"
  after: "**手が止まり、顔が起きる。**——この作品で、最初に置かれる顔である。"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
role: "開示"

# ⚠️ **この作品の `place` は「話の記名の現場」ではない。**（`ledger.yaml` の `locations` の註）
#    **曲の1行が立つ現場である。** 六つしかない——**27本が6つを巡る。**
place: "宛名票の一行"

# ⚠️ **一時刻である。** この作品は**日付を固定しない**——`bible.world.era` は
#    「2026, Japan. The setting does not move across all four volumes.」であり、
#    **一日の内のどの時刻かだけが要る。** 二つの値しか使わない。
time: "勤務日の日中"

mode: "motion"

# ⚠️ **従属変数である。** この作品では**さらに曲に従属する**——
#    出所は `bible.song.lines[].at` の差であり、**この作品が決めた数ではない。**
#    ⚠️ **「4秒より短いから伸ばす」をしない**（`docs/seedance-route.md` の明示の規則）。
duration: "9.814s"

# 動画の仕様（§1–20）。
spec: specs/video/seedance-2.5/habits-mv-s10.md

key_image: specs/image/habits-mv-s10.md

# **狙い。** このショットが何を試すのか。
# ⚠️ **この欄を読む検査は、まだ1つも無い**（`shot-record.schema.json` の `aim`）。
aim: >-
  **この作品で最初の「顔」を置けるか。** 世界の規則が許す唯一の入口——**呼ばれて、振り向く**——を、この1行が持っている。

motion:
  subject: "暮林蒼の右手と、その顔。**そして、名前だけが呼ばれる相手。**"
  quality: "ゆっくり。**手が、いちばん下の一枚を押さえる。**そのあとで、**顔が上がる。**——**順序を入れ替えない。**"
  law: >-
    `luminous-anime` の運動である。**振り向きは、髪と首で起きる**——様式は動きを大きく描けるが、**この作品では、動きの量が小さい。****呼ばれた本人の側にだけ、呼び声が聞こえる**（`bible.constants.音`）。

# **ビート。不均等に配分する。**（`shot-record.schema.json` の `beats`）
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
beats:
  - range: "0-2.0s"
    density: held
    what: "四枚の端と、いちばん下の一枚。**まだ触られていない。**"
  - range: "2.0-4.6s"
    density: sparse
    what: "手が下へ降り、**いちばん古い一枚に触れる。**"
  - range: "4.6-6.3s"
    density: transition
    what: "**呼ばれる。**——音は、この人物の側にだけ在る。"
  - range: "6.3-9.814s"
    density: held
    what: "**振り向く。**顔が起き、止まる。"

reference_set:
  - "暮林蒼.identity"
  - "暮林蒼.negatives"
  - "宛名票の一行"
  - "宛名票"
  - "侘田すみれ.negatives"

# ⚠️ **27本すべてで同一である。** 出所は三つ——
#    `bible.negative_base` の5行／`ledger.yaml` の `characters.*.negatives` の共通の床
#    （`no identifying clothing, hairstyle, or prop`）／`props.*.negative` の2行。
#    ⚠️ **`no face before the name is called` は、顔を置くショットにも掛かる。**
#    **この作品の顔は、すべて手の後に来る**——ゆえにこの一行は、
#    **どのショットの内容とも衝突しない。**
forbidden_set:
  - "no calling voice as a sound effect"
  - "no face before the name is called"
  - "no watermark"
  - "no on-screen subtitles"
  - "no background music"
  - "no identifying clothing, hairstyle, or prop"
  - "no legible name text"
  - "no legible text on any surface"

# ⚠️ **`attached` を書かない。** この作品は**まだ1本も生成していない**——
#    書けば「意図にあるのに添付が無い」と27本ぶん鳴る（`L6` の註）。
#    **書かなければ「記録が無い」と言う**——**それが今の事実である。**
#    ✅ **生成したら、この欄を足す。**

# **このショットが実際に持つ開示状態。**（台帳の `disclosure` は「意図」、こちらが「実際」）
# ⚠️ **27本すべてが4つの属性を持つ。** 持たないショットは開示の検査を受けない（`L7` の `bare`）。
# ⚠️ **`unknown` は「観客がまだ知らない」である。** 台帳の3つの変化点（`s10`・`s17`・`s18`）で
#    値が動く。**`出席簿の転出欄.一行` は動かない**——`s01` が**出発点**だからである（`L9` の註）。
disclosure_state:
  出席簿の転出欄.一行: present
  宛名票の一行.いちばん古い一枚: present
  鍵に付いた預かり札.宛先: unknown
  名札の予備.着けられた: unknown
