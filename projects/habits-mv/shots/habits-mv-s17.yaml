# bridge / long-take / motion —— 宛先の無い札が、一枚。
#
# **「宛先の無い札が、一枚。」**（`l20`·97.021秒）＋**「鍵は、五年前から、ある。」**
# （`l21`·101.090秒）。**2行を1本で受ける。**
#
# ⚠️ **なぜ2行を1本にするか。** `l20` と `l21` は**同じ物を指している**——
#    札と、その札が付いた鍵である。**別のショットに割れば、物が2つになる。**
#    ⚠️ **曲は一つの物を二つの行で言っている。画面も一つの物を一つのショットで持つ。**
#
# ⚠️ **この1本は、この作品で2番目に長い。**——13.963秒。
#    Bridge は曲で最も長い節（28.803秒）であり、**この節は長回しである。**
#
# ⚠️ **開示の出所が、台帳ではなく曲である。** ——これは `ledger.yaml` の設計の核である——
#    「**`bible` は何が与えられたか。`ledger` は何を決められたか。**
#    **そしてこの欄は `disclosure` の隣に在るのが正しい**——**歌は、歌われている間ずっと
#    観客へ何かを渡している。**」
#    ⚠️ **この1本が、その一行の具体である。**
#
# ⚠️ **`disclosure`: 鍵に付いた預かり札.宛先 が `absent` になる変化点である。**
#    ⚠️ **世界の状態は変わっていない**——**札には、初めから宛先が無い。**
#    **変わったのは観客の知識である。** ゆえに `disclosure_state` は
#    `unknown` → `absent` と動く。
shot: habits-mv-s17

unit:
  before: "鍵が、**机の上に置かれている。**札は、まだ見えない。"
  after: "手が鍵を起こし、**札の面が光の中に出る。宛先は、無い。**"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
role: "開示"

# ⚠️ **この作品の `place` は「話の記名の現場」ではない。**（`ledger.yaml` の `locations` の註）
#    **曲の1行が立つ現場である。** 六つしかない——**27本が6つを巡る。**
place: "鍵に付いた預かり札"

# ⚠️ **一時刻である。** この作品は**日付を固定しない**——`bible.world.era` は
#    「2026, Japan. The setting does not move across all four volumes.」であり、
#    **一日の内のどの時刻かだけが要る。** 二つの値しか使わない。
time: "勤務日の夕方"

mode: "motion"

# ⚠️ **従属変数である。** この作品では**さらに曲に従属する**——
#    出所は `bible.song.lines[].at` の差であり、**この作品が決めた数ではない。**
#    ⚠️ **「4秒より短いから伸ばす」をしない**（`docs/seedance-route.md` の明示の規則）。
duration: "13.963s"

# 動画の仕様（§1–20）。
spec: specs/video/habits-mv-s17.md

# **狙い。** このショットが何を試すのか。
# ⚠️ **この欄を読む検査は、まだ1つも無い**（`shot-record.schema.json` の `aim`）。
aim: >-
  **曲そのものが開示を持ち込む唯一の場所である。** 「宛先の無い札」——**画面が明かすのではなく、歌が明かす。**

motion:
  subject: "侘田すみれの右手、鍵、そして札。"
  quality: "ゆっくり。**鍵が起きる。**札が揺れ、止まる。**宛先の欄を、指でなぞらない。**——**無いことを、確かめない。**"
  law: >-
    `luminous-anime` の運動である。**鍵は重い。**この作品で唯一、**紙でない物が動く**——ゆえに動きが遅い。

# **ビート。不均等に配分する。**（`shot-record.schema.json` の `beats`）
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
beats:
  - range: "0-4.069s"
    density: held
    what: "机の上の鍵。**札は、机に伏せられている。**"
  - range: "4.069-6.5s"
    density: transition
    what: "手が入り、**鍵を持つ。**"
  - range: "6.5-9.0s"
    density: sparse
    what: "札が起き、**揺れて止まる。**"
  - range: "9.0-13.963s"
    density: held
    what: "**宛先が無い。**そのまま、動かない。"

reference_set:
  - "侘田すみれ.identity"
  - "侘田すみれ.negatives"
  - "預かり札"
  - "預かり札.negative"
  - "鍵に付いた預かり札"

# ⚠️ **27本すべてで同一である。** 出所は三つ——
#    `bible.negative_base` の5行／`ledger.yaml` の `characters.*.negatives` の共通の床
#    （`no identifying clothing, hairstyle, or prop`）／`props.*.negative` の2行。
#    ⚠️ **`no face before the name is called` は、顔を置くショットにも掛かる。**
#    **この作品の顔は、すべて手の後に来る**——ゆえにこの一行は、
#    **どのショットの内容とも衝突しない。**
forbidden_set:
  - "no calling voice as a sound effect"
  - "no face before the name is called"
  - "no watermark"
  - "no on-screen subtitles"
  - "no background music"
  - "no identifying clothing, hairstyle, or prop"
  - "no legible name text"
  - "no legible text on any surface"

# ⚠️ **`attached` を書かない。** この作品は**まだ1本も生成していない**——
#    書けば「意図にあるのに添付が無い」と27本ぶん鳴る（`L6` の註）。
#    **書かなければ「記録が無い」と言う**——**それが今の事実である。**
#    ✅ **生成したら、この欄を足す。**

# **このショットが実際に持つ開示状態。**（台帳の `disclosure` は「意図」、こちらが「実際」）
# ⚠️ **27本すべてが4つの属性を持つ。** 持たないショットは開示の検査を受けない（`L7` の `bare`）。
# ⚠️ **`unknown` は「観客がまだ知らない」である。** 台帳の3つの変化点（`s10`・`s17`・`s18`）で
#    値が動く。**`出席簿の転出欄.一行` は動かない**——`s01` が**出発点**だからである（`L9` の註）。
disclosure_state:
  出席簿の転出欄.一行: present
  宛名票の一行.いちばん古い一枚: present
  鍵に付いた預かり札.宛先: absent
  名札の予備.着けられた: unknown
