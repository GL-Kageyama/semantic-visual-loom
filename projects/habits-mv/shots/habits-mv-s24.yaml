# final-chorus / beat / motion —— 誰の名。
#
# **「誰の名。」**（`l29`·145.293秒）——`bible.song.lines` l29。
#
# ⚠️ **ここで初めて、サビの一行が落ちる**（`bible.song.lines` の註）——
#    「その字は」「その名は」「読む手は」が消え、**「誰の名。」だけが2度残る。**
#    ⚠️ **問いが半分になった。** **ゆえに画面も半分になる**——
#    **字を探す手ではなく、名を持つ顔である。**
#
# ✅ **この1本と `s25` が、この作品で最後に顔を置く場所である。**
#    手が先にあり（`s01`）、顔が後に来る（ここ）——**作品全体が、この順序である。**
#    ⚠️ **1本の中で順序を組む必要は無い。** 世界の規則は**作品の順序**である——
#    `s01` が手を置いたとき、**この作品の手は、既に置かれている。**
#    **ゆえにサビの長い1本でも顔を置ける**——ただし**「呼ばれていない」と言う行では置かない。**
#    ⚠️ **この1本でも、手が先に在り、顔が後に起きる。** **世界の規則は破っていない。**
#
# ⚠️ **前田亮太は、二度目を持たない一人である**（サブ 24/24・第二巻第6話・主役回。
#    run-09 が彼に与える話はこの一話だけ）。**この作品でも、彼に2本目は無い。**
#    ⚠️ **彼の癖を、暮林蒼が持っている**（`ledger.yaml` の註）——
#    **移った癖を持つ者が、移した相手を名指す。**
#    ⚠️ **この作品は、その二人を隣り合わせない**——`s10`（蒼）と `s24`（前田）。
#    **14本離れている。**
#
# ⚠️ **秋山誠の記名は、提出物の名簿／名簿の転出欄である**（第一巻第11話・主役回／run-09）。
#    ——**`s01` の出席簿の転出欄と、同じ語である。** **この作品は、それを言わない。**
shot: habits-mv-s24

unit:
  before: "二つの手が、**それぞれ別の紙を押さえている。**"
  after: "**二つの顔が、起きている。**——この作品で、顔が最後に置かれる場所である。"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
role: "開示"

# ⚠️ **この作品の `place` は「話の記名の現場」ではない。**（`ledger.yaml` の `locations` の註）
#    **曲の1行が立つ現場である。** 六つしかない——**27本が6つを巡る。**
place: "束"

# ⚠️ **一時刻である。** この作品は**日付を固定しない**——`bible.world.era` は
#    「2026, Japan. The setting does not move across all four volumes.」であり、
#    **一日の内のどの時刻かだけが要る。** 二つの値しか使わない。
time: "勤務日の日中"

mode: "motion"

# ⚠️ **従属変数である。** この作品では**さらに曲に従属する**——
#    出所は `bible.song.lines[].at` の差であり、**この作品が決めた数ではない。**
#    ⚠️ **「4秒より短いから伸ばす」をしない**（`docs/seedance-route.md` の明示の規則）。
duration: "5.026s"

# 動画の仕様（§1–20）。
spec: specs/video/seedance-2.5/habits-mv-s24.md

key_image: specs/image/habits-mv-s24.md

# **狙い。** このショットが何を試すのか。
# ⚠️ **この欄を読む検査は、まだ1つも無い**（`shot-record.schema.json` の `aim`）。
aim: >-
  **「誰の名。」——問いが半分になった最初の1本。** ここで**顔を置く**。手が先にあり、顔が後に来る。

motion:
  subject: "秋山誠の手と顔、前田亮太の手と顔。"
  quality: "速い所作のあと、**二つの顔が順に起きる。****同時ではない**——一人ずつである。"
  law: >-
    `luminous-anime` の運動である。**顔が起きる動きは小さい**——**この作品で、動きの量が最も少ない顔である。**

# **ビート。不均等に配分する。**（`shot-record.schema.json` の `beats`）
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
beats:
  - range: "0-1.2s"
    density: dense
    what: "秋山誠の手。**紙を押さえる。**"
  - range: "1.2-2.9s"
    density: held
    what: "**顔が起きる。**"
  - range: "2.9-3.6s"
    density: transition
    what: "前田亮太の手。**同じ押さえ方。**"
  - range: "3.6-5.026s"
    density: held
    what: "**顔が起きる。**止まる。"

reference_set:
  - "秋山誠.identity"
  - "秋山誠.negatives"
  - "前田亮太.identity"
  - "前田亮太.negatives"
  - "束"
  - "束.appearance"

# ⚠️ **27本すべてで同一である。** 出所は三つ——
#    `bible.negative_base` の5行／`ledger.yaml` の `characters.*.negatives` の共通の床
#    （`no identifying clothing, hairstyle, or prop`）／`props.*.negative` の2行。
#    ⚠️ **`no face before the name is called` は、顔を置くショットにも掛かる。**
#    **この作品の顔は、すべて手の後に来る**——ゆえにこの一行は、
#    **どのショットの内容とも衝突しない。**
forbidden_set:
  - "no calling voice as a sound effect"
  - "no face before the name is called"
  - "no watermark"
  - "no on-screen subtitles"
  - "no background music"
  - "no identifying clothing, hairstyle, or prop"
  - "no legible name text"
  - "no legible text on any surface"

# ⚠️ **`attached` を書かない。** この作品は**まだ1本も生成していない**——
#    書けば「意図にあるのに添付が無い」と27本ぶん鳴る（`L6` の註）。
#    **書かなければ「記録が無い」と言う**——**それが今の事実である。**
#    ✅ **生成したら、この欄を足す。**

# **このショットが実際に持つ開示状態。**（台帳の `disclosure` は「意図」、こちらが「実際」）
# ⚠️ **27本すべてが4つの属性を持つ。** 持たないショットは開示の検査を受けない（`L7` の `bare`）。
# ⚠️ **`unknown` は「観客がまだ知らない」である。** 台帳の3つの変化点（`s10`・`s17`・`s18`）で
#    値が動く。**`出席簿の転出欄.一行` は動かない**——`s01` が**出発点**だからである（`L9` の註）。
disclosure_state:
  出席簿の転出欄.一行: present
  宛名票の一行.いちばん古い一枚: present
  鍵に付いた預かり札.宛先: absent
  名札の予備.着けられた: absent
