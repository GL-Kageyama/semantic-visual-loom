# pre-chorus-1 / long-take / motion —— 目で、読む。
#
# **「目で、読む。」**（`l01`·8.059秒）——`bible.song.lines` l01。
#
# ⚠️ **この作品で、顔が部分ごとに置かれ始める最初の1本である。**
#    `s01` が手を置き、`s02` が目を置き、`s03` が口を置き、`s04` が音の不在を置く。
#    ⚠️ **これは演出ではなく、歌詞の形である**——プレサビの3行が
#    「目で、読む。」「口は、動く。」「音は、出ない。」と、**すでに部分に分かれている。**
#    **曲が先に分けているものを、画面が分け直さない。**
#
# ⚠️ **参照集合に `碓氷千夏.identity` を入れる。** ここは**目の側**であり、
#    人のかたちの一枚が要る。
#
# ⚠️ **行の尺が 9.015秒である。** 出所は `l01` の `at`（8.059）と `l02` の `at`（17.074）の差
#    ——**この作品が決めた数ではない**（`bible.song.lines` の註）。
#
# ============================================================================
# ⛔ **この1本は、2026-09-28 に運動の層を作り直した。** 規則は `s01` の頭に在る
#    ——**「変化は、切れ目で終わる。」** ここには、この1本に固有のことを書く。
#
# ⛔ **直す前のこの1本は、いちばん酷かった。**
#    `held` 3.0秒 → `dense` 3.2秒 → `held` 2.815秒。
#    **目の横断は 14.259秒に終わり、切れ目は 17.074秒である**——
#    **2.815秒のあいだ、画面は止まったまま、歌が「口は、動く。」と言う。**
#    ⚠️ **「行末で止まる」というこの1本の変化は、正しい。**
#      **間違っていたのは、止まる場所である**——**止まるのが行末なら、
#      その止まりが切れ目と同時でなければならない。**
#
# **この1本に効いた操作**:
#   1. **横断を、切れ目のコマで終わらせた。** 目は 2.2秒に入り、
#      **9.015秒に、行の最後の字の上で止まる**——**止まることと切れることが同時である。**
#      ⚠️ **ゆえにこの1本から、まばたきを外した。** まばたきは「止まったあとに来るもの」であり、
#      **止まったあとが無くなった**——**切れ目が、その位置を占める。**
#   2. **`held` を消した。** 頁は前の1本からまだ沈んでおり、埃は渡り、光の縁は滑り、
#      **カメラは `s01` で始めた降下を続けている。**
#   3. **「動くのは目だけ」を捨てた。** ⛔ **前の版 §16 はそう書いていた。**
#      だが `shot-record.schema.json` の `motion` の註は
#      **「止まるのは主題であって、画面ではない。光と粉塵は動く。」**と言う。
#      **変化は1つである。動きは1つではない。**
# ============================================================================
shot: habits-mv-s02

unit:
  before: "頁の上の字を、**まだ誰も読んでいない。**"
  after: "目が一行の上を左から右へ渡り、**行の終わりで止まる。**"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
role: "反応"

# ⚠️ **この作品の `place` は「話の記名の現場」ではない。**（`ledger.yaml` の `locations` の註）
#    **曲の1行が立つ現場である。** 六つしかない——**27本が6つを巡る。**
place: "出席簿の転出欄"

# ⚠️ **一時刻である。** この作品は**日付を固定しない**——`bible.world.era` は
#    「2026, Japan. The setting does not move across all four volumes.」であり、
#    **一日の内のどの時刻かだけが要る。** 二つの値しか使わない。
time: "勤務日の夕方"

mode: "motion"

# ⚠️ **従属変数である。** この作品では**さらに曲に従属する**——
#    出所は `bible.song.lines[].at` の差であり、**この作品が決めた数ではない。**
#    ⚠️ **「4秒より短いから伸ばす」をしない**（`docs/seedance-route.md` の明示の規則）。
duration: "9.015s"

# 動画の仕様（§1–20）。
spec: specs/video/habits-mv-s02.md

# 画像の仕様（**§1–20 を持たない**。§18 も `Negative Prompt` も `Style Motion` も無い）。
# ⚠️ **この欄は、この稿で足した**（実測 2026-09-28）。⚠️ **この1本は `identity` を添付する側である**
#    ——**画像の側の `content` も、凍結した二枚を渡す。** 記録側の `reference_set` と同じ側に立つ。
#    **送った日に `attached` を書く。**
key_image: specs/image/habits-mv-s02.md

# **狙い。** このショットが何を試すのか。
# ⚠️ **この欄を読む検査は、まだ1つも無い**（`shot-record.schema.json` の `aim`）。
aim: >-
  この作品で**最初に顔の一部を置けるか**——`s01` が手を先に置いたので、ここは順序の2番目である。**顔ではなく、目の側から。**

motion:
  subject: "碓氷千夏の目と、その下の一行。**そして、頁の上を渡りつづける埃と、罫線の上を滑る光の縁。**"
  quality: "ゆっくり。**しかし一度も止まらない。**目が入り、字を追い、**行末に着くのが切れ目のコマである。**眉も口も動かさない——**主題は目のままである。**"
  law: >-
    `luminous-anime` の運動である。**目の動きは誇張しない**——様式は感情を目で語るが、**この作品では目は字を追うだけである。**⚠️ **誇張しないことと、止まることは、別である。**目の下では頁がまだ沈み、埃は逆の方へ流れ、光の縁は右へ滑っている——**この1本の運動は、目ひとつではなかった。**

# **ビート。不均等に配分する。**（`shot-record.schema.json` の `beats`）
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
# ⛔ **末尾のビートは `dense` である。** 作り直す前は `held` で、**2.815秒ぶん、切れ目の手前が止まっていた。**
# ⚠️ **`held` のビートを持たない。** 止まるのは主題であって、画面ではない。
beats:
  - range: "0-2.2s"
    density: sparse
    what: "前の1本から続く頁が、まだ沈んでいる。**埃が渡り、罫線の上の光の縁が右へ滑る。**カメラは降下をつづけている。**目は、まだ画面に入っていない。**"
  - range: "2.2-9.015s"
    density: dense
    what: "**目が入り、一行を左から右へ渡る。**——**最後の字に着くのが、切れ目のコマである。**渡っているあいだ、頁は沈みつづけ、埃は逆の方へ流れ、光の縁は右へ滑り、**カメラはまだ降りている。**"

reference_set:
  - "碓氷千夏.identity"
  - "碓氷千夏.negatives"
  - "出席簿"
  - "出席簿の転出欄"

# ⚠️ **27本すべてで同一である。** 出所は三つ——
#    `bible.negative_base` の5行／`ledger.yaml` の `characters.*.negatives` の共通の床
#    （`no identifying clothing, hairstyle, or prop`）／`props.*.negative` の2行。
#    ⚠️ **`no face before the name is called` は、顔を置くショットにも掛かる。**
#    **この作品の顔は、すべて手の後に来る**——ゆえにこの一行は、
#    **どのショットの内容とも衝突しない。**
forbidden_set:
  - "no calling voice as a sound effect"
  - "no face before the name is called"
  - "no watermark"
  - "no on-screen subtitles"
  - "no background music"
  - "no identifying clothing, hairstyle, or prop"
  - "no legible name text"
  - "no legible text on any surface"

# ⚠️ **`attached` を書かない。** 書けば「意図にあるのに添付が無い」と鳴る（`L6` の註）。
#    **書かなければ「記録が無い」と言う**——**`L6` は27本で鳴りつづける。**
#    ⛔ **この稿で、この1本の動画のテイクが付いた**（`takes/habits-mv-s02-video-1.yaml`、実測 2026-09-28）。
#    **ゆえに「この作品はまだ1本も生成していない」は、もう真ではない**——**その一行を、ここで消した。**
#    ⛔ **それでも `attached` は書かない。** `attached` は「**実際に何が付いたか**」の欄である
#    （`semantic.py` の `check_attached`——**意図は `reference_set`、実際は `attached`**）。
#    **この1本は `identity` を添付する側である**——**その一枚が実際に渡ったかを、私は見ていない。**
#    ⚠️ **画像の側は、まだ0枚である**（`media/` に在るのは動画3本だけ）。

# **このショットが実際に持つ開示状態。**（台帳の `disclosure` は「意図」、こちらが「実際」）
# ⚠️ **27本すべてが4つの属性を持つ。** 持たないショットは開示の検査を受けない（`L7` の `bare`）。
# ⚠️ **`unknown` は「観客がまだ知らない」である。** 台帳の3つの変化点（`s10`・`s17`・`s18`）で
#    値が動く。**`出席簿の転出欄.一行` は動かない**——`s01` が**出発点**だからである（`L9` の註）。
disclosure_state:
  出席簿の転出欄.一行: present
  宛名票の一行.いちばん古い一枚: unknown
  鍵に付いた預かり札.宛先: unknown
  名札の予備.着けられた: unknown
