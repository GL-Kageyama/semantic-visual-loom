# final-chorus / beat / motion —— 読む手は、誰の手。
#
# **「読む手は、誰の手。」**（`l26`·130.691秒）——`bible.song.lines` l26。
#
# ⚠️ **この1本で、サビの問いの反復が終わる。** 3度目である
#    （`s07`·39.176／`s14`·81.223／ここ 130.691）。
#    ⚠️ **4度目は無い。** ——次の `l27`「まだ、呼ばれていない。」を挟んで、
#    **`l29`・`l30` で一行が落ちる**（`bible.song.lines` の註）。
#
# ⚠️ **田村彩（第三巻第5話・主役回。記名＝お薬手帳の氏名欄／run-09）。**
#
# ⚠️ **`place: 名札` でありながら、束が画面に在る。** ——
#    **現場は名札であり、物は束である。** `place` は**場所**であって、物ではない。
#    ⚠️ **`束` は `reference_set` に入れない**——**入れると、束がこの作品の主題になる。**
#    **主題は、名である。**
shot: habits-mv-s21

unit:
  before: "手が、**紙の束の上にある。**"
  after: "手が束を押さえ、**指の間から紙が一枚出ている。**"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
role: "所作"

# ⚠️ **この作品の `place` は「話の記名の現場」ではない。**（`ledger.yaml` の `locations` の註）
#    **曲の1行が立つ現場である。** 六つしかない——**27本が6つを巡る。**
place: "名札"

# ⚠️ **一時刻である。** この作品は**日付を固定しない**——`bible.world.era` は
#    「2026, Japan. The setting does not move across all four volumes.」であり、
#    **一日の内のどの時刻かだけが要る。** 二つの値しか使わない。
time: "勤務日の日中"

mode: "motion"

# ⚠️ **従属変数である。** この作品では**さらに曲に従属する**——
#    出所は `bible.song.lines[].at` の差であり、**この作品が決めた数ではない。**
#    ⚠️ **「4秒より短いから伸ばす」をしない**（`docs/seedance-route.md` の明示の規則）。
duration: "2.554s"

# 動画の仕様（§1–20）。
spec: specs/video/habits-mv-s21.md

# 画像の仕様（**§1–20 を持たない**。§18 も `Negative Prompt` も `Style Motion` も無い）。
# ⚠️ **この欄は、この稿で足した**（実測 2026-09-28——27本のどれも持っていなかった）。
#    ⚠️ **この1本の束は、`ledger.locations.束` ではない**——**動画の仕様 §4 が明示している。**
#    ⚠️ **この1枚が写すのは、押さえられた束と、指の間から出た一枚である。**
#    **送った日に `attached` を書く。**
key_image: specs/image/habits-mv-s21.md

# **狙い。** このショットが何を試すのか。
# ⚠️ **この欄を読む検査は、まだ1つも無い**（`shot-record.schema.json` の `aim`）。
aim: >-
  **「読む手は、誰の手。」の3度目。** 問いの最後の反復である。

motion:
  subject: "田村彩の右手と、束の端。"
  quality: "速い。**押さえる動きが一つ。**紙が一枚、指の間で出る。"
  law: >-
    `luminous-anime` の運動である。**束は動かない**——動くのは、**束から出る一枚だけである。**

# **ビート。不均等に配分する。**（`shot-record.schema.json` の `beats`）
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
beats:
  - range: "0-1.2s"
    density: dense
    what: "手が束を押さえる。"
  - range: "1.2-2.554s"
    density: held
    what: "**一枚が出て、止まる。**"

reference_set:
  - "田村彩.identity"
  - "田村彩.negatives"
  - "名札"
  - "名札.appearance"

# ⚠️ **27本すべてで同一である。** 出所は三つ——
#    `bible.negative_base` の5行／`ledger.yaml` の `characters.*.negatives` の共通の床
#    （`no identifying clothing, hairstyle, or prop`）／`props.*.negative` の2行。
#    ⚠️ **`no face before the name is called` は、顔を置くショットにも掛かる。**
#    **この作品の顔は、すべて手の後に来る**——ゆえにこの一行は、
#    **どのショットの内容とも衝突しない。**
forbidden_set:
  - "no calling voice as a sound effect"
  - "no face before the name is called"
  - "no watermark"
  - "no on-screen subtitles"
  - "no background music"
  - "no identifying clothing, hairstyle, or prop"
  - "no legible name text"
  - "no legible text on any surface"

# ⚠️ **`attached` を書かない。** この作品は**まだ1本も生成していない**——
#    書けば「意図にあるのに添付が無い」と27本ぶん鳴る（`L6` の註）。
#    **書かなければ「記録が無い」と言う**——**それが今の事実である。**
#    ✅ **生成したら、この欄を足す。**

# **このショットが実際に持つ開示状態。**（台帳の `disclosure` は「意図」、こちらが「実際」）
# ⚠️ **27本すべてが4つの属性を持つ。** 持たないショットは開示の検査を受けない（`L7` の `bare`）。
# ⚠️ **`unknown` は「観客がまだ知らない」である。** 台帳の3つの変化点（`s10`・`s17`・`s18`）で
#    値が動く。**`出席簿の転出欄.一行` は動かない**——`s01` が**出発点**だからである（`L9` の註）。
disclosure_state:
  出席簿の転出欄.一行: present
  宛名票の一行.いちばん古い一枚: present
  鍵に付いた預かり札.宛先: absent
  名札の予備.着けられた: absent
