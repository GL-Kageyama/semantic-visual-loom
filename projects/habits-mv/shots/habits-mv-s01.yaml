# intro / long-take / motion —— 閉じた出席簿が、開かれる
#
# ⚠️ **この8.059秒は、この作品で11番目に長い1本である**——**厳密に長い1本が10本ある**
#    （`s18` 14.840／`s27` 14.309／`s17` 13.963／`s03` 10.000／`s10` 9.814／`s26` 9.506／
#    `s09` 9.495／`s02` 9.015／`s16` 8.457／`s08` 8.218）。⚠️ **この数は `duration` の欄から
#    数え直したものである**——**初め「4番目」と書いていたが、どの切り方でも4にはならない。**
#    出所: `bible.song.sections` の `intro`——**実測から書き足した唯一の節である**
#    （実測30 §2-1）。⚠️ **歌が1行も無い。** ゆえに `ledger.song_coverage` は
#    **この節だけを節ごとに受ける**——`{"section": "intro", "shots": ["habits-mv-s01"]}`。
#    `L36` がそれを読む。
#
# ⚠️ **なぜ「手」から始めるか。** `bible.world.rules` の六番——
#    「**手が先にあり、顔が後に来る。順序は入れ替えない。顔は、呼ばれた後にだけ置かれる。**」
#    **この規則は、1本のショットの中の規則であると同時に、作品全体の規則でもある。**
#    ゆえにこの作品の最初のショットは、**顔を持てない。**
#
# ⚠️ **参照集合に `碓氷千夏.identity` を入れない。** ——**この1本は手しか写さない。**
#    人のかたちの一枚を渡せば、生成器は顔を置く。**ゆえに渡すのは禁制の側だけである。**
#
# ⚠️ **世界の規則は「運搬は一度も完了しない」である**（`bible.world.rules` の四番）。
#    **この1本の変化は「開く」であって「読む」ではない。** *転出欄は開かれるが、
#    まだ誰も読んでいない*——**運搬の最初の一歩が、ここで止まる。**
#    出所: run-09 第一巻第1話「前年度の出席簿を綴じる。転出欄に、
#    誰も消さなかった一行が残っている。」
shot: habits-mv-s01

unit:
  before: "前年度の出席簿が、机の上に閉じている。**手は、まだ其処に無い。**"
  after: "手が出席簿を開き、**転出欄の頁が起きている。**"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
role: "所作"

# ⚠️ **この作品の `place` は「話の記名の現場」ではない。**（`ledger.yaml` の `locations` の註）
#    **曲の1行が立つ現場である。** 六つしかない——**27本が6つを巡る。**
place: "出席簿の転出欄"

# ⚠️ **一時刻である。** この作品は**日付を固定しない**——`bible.world.era` は
#    「2026, Japan. The setting does not move across all four volumes.」であり、
#    **一日の内のどの時刻かだけが要る。** 二つの値しか使わない。
time: "勤務日の夕方"

mode: "motion"

# ⚠️ **従属変数である。** この作品では**さらに曲に従属する**——
#    出所は `bible.song.lines[].at` の差であり、**この作品が決めた数ではない。**
#    ⚠️ **「4秒より短いから伸ばす」をしない**（`docs/seedance-route.md` の明示の規則）。
duration: "8.059s"

# 動画の仕様（§1–20）。
spec: specs/video/habits-mv-s01.md

# **狙い。** このショットが何を試すのか。
# ⚠️ **この欄を読む検査は、まだ1つも無い**（`shot-record.schema.json` の `aim`）。
aim: >-
  曲の頭8.059秒——**歌が1行も無い区間**を、画面が全部負えるか。そして**この作品の最初の一変化が「手」である**ことを立てられるか。

motion:
  subject: "碓氷千夏の右手と、出席簿の頁。"
  quality: "ゆっくり。頁は一度だけ起きる。**急がない。**指の腹で押さえられ、角が少し浮く。"
  law: >-
    `luminous-anime` の運動である。**紙は薄く、重さを持たない**——めくりは空気を切らず、音を立てない。この作品の物理は、**物が軽いこと**と、**光が蛍光灯であること**の二つでできている。

# **ビート。不均等に配分する。**（`shot-record.schema.json` の `beats`）
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
beats:
  - range: "0-2.5s"
    density: held
    what: "閉じた出席簿と、机の上の光。**何も動かない。**"
  - range: "2.5-5.0s"
    density: transition
    what: "手が画面の下から入り、表紙に触れる。"
  - range: "5.0-8.059s"
    density: sparse
    what: "頁が起き、**転出欄が現れる。**"

reference_set:
  - "碓氷千夏.negatives"
  - "出席簿"
  - "出席簿.negative"
  - "出席簿の転出欄"
  - "出席簿の転出欄.geography"

# ⚠️ **27本すべてで同一である。** 出所は三つ——
#    `bible.negative_base` の5行／`ledger.yaml` の `characters.*.negatives` の共通の床
#    （`no identifying clothing, hairstyle, or prop`）／`props.*.negative` の2行。
#    ⚠️ **`no face before the name is called` は、顔を置くショットにも掛かる。**
#    **この作品の顔は、すべて手の後に来る**——ゆえにこの一行は、
#    **どのショットの内容とも衝突しない。**
forbidden_set:
  - "no calling voice as a sound effect"
  - "no face before the name is called"
  - "no watermark"
  - "no on-screen subtitles"
  - "no background music"
  - "no identifying clothing, hairstyle, or prop"
  - "no legible name text"
  - "no legible text on any surface"

