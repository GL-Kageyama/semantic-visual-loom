# intro / long-take / motion —— 閉じた出席簿が、開かれる
#
# ⚠️ **この8.059秒は、この作品で11番目に長い1本である**——**厳密に長い1本が10本ある**
#    （`s18` 14.840／`s27` 14.309／`s17` 13.963／`s03` 10.000／`s10` 9.814／`s26` 9.506／
#    `s09` 9.495／`s02` 9.015／`s16` 8.457／`s08` 8.218）。⚠️ **この数は `duration` の欄から
#    数え直したものである**——**初め「4番目」と書いていたが、どの切り方でも4にはならない。**
#    出所: `bible.song.sections` の `intro`——**実測から書き足した唯一の節である**
#    （実測30 §2-1）。⚠️ **歌が1行も無い。** ゆえに `ledger.song_coverage` は
#    **この節だけを節ごとに受ける**——`{"section": "intro", "shots": ["habits-mv-s01"]}`。
#    `L36` がそれを読む。
#
# ⚠️ **なぜ「手」から始めるか。** `bible.world.rules` の六番——
#    「**手が先にあり、顔が後に来る。順序は入れ替えない。顔は、呼ばれた後にだけ置かれる。**」
#    **この規則は、1本のショットの中の規則であると同時に、作品全体の規則でもある。**
#    ゆえにこの作品の最初のショットは、**顔を持てない。**
#
# ⚠️ **参照集合に `碓氷千夏.identity` を入れない。** ——**この1本は手しか写さない。**
#    人のかたちの一枚を渡せば、生成器は顔を置く。**ゆえに渡すのは禁制の側だけである。**
#
# ⚠️ **世界の規則は「運搬は一度も完了しない」である**（`bible.world.rules` の四番）。
#    **この1本の変化は「開く」であって「読む」ではない。** *転出欄は開かれるが、
#    まだ誰も読んでいない*——**運搬の最初の一歩が、ここで止まる。**
#    出所: run-09 第一巻第1話「前年度の出席簿を綴じる。転出欄に、
#    誰も消さなかった一行が残っている。」
#
# ============================================================================
# ⛔ **この1本は、2026-09-28 に運動の層を作り直した。**
#
# **規則——「変化は、切れ目で終わる。」**
#   この作品の切れ目は、曲が置いたものである。実測（2026-09-28）——
#   **26の切れ目のうち24が、歌詞の行の頭と 20ms 以内で一致する。**
#   残る2つ（`s04` の 27.074／`s27` の 165.011）は、**行が終わって歌が消える点**である。
#   ⚠️ **ゆえに切れ目は、すべて曲の事象である。** **切れ目はアクセントである。**
#
# ⛔ **直す前のこの作品は、そのアクセントに静止で入っていた。**
#   実測——**27本のうち26本が `held` のビートで終わっている。**
#   末尾の `held` の合計は **71.231秒／179.320秒（39.7%）**、中央値 **2.155秒**、最長 **7.309秒**（`s27`）。
#   **この1本では、変化が切れ目の 1.5秒前に終わっていた**——
#   3本のテイクを 0.25秒窓で測ると、`s01` は 6.00秒で山を打ち、
#   **切れ目の前 1.5秒を、山の 1.3〜4.0% で過ごしている。**
#   ⚠️ **あの1.5秒が、著者の言う「動きが欲しい」の実体である。**
#
# ⚠️ **土台は、くつがえっていない。** 変えたのは実装であって、方針ではない——
#   `shot-record.schema.json` の `motion` の註が、既にこう言っている:
#   **「止まるのは主題であって、画面ではない。光と粉塵は動く。」**
#   **「映像では運動が地であって、静止が特殊ケースである。」**
#   ⛔ **作り直す前の27本は、これを「主題が止まるなら画面も止まる」と読んでいた。**
#   様式カードの `Motion character` は `Full animation, not limited` であり、
#   **この27本は、その運動を一度も使っていなかった。**
#
# **この1本に効いた三つの操作**（27本に共通である）:
#   1. **末尾の `held` を消した。** 変化は切れ目のコマで終わる。**切れ目の前で終わらせない。**
#      ゆえに最後のビートは `dense` である。**頁は、切れ目のコマでまだ沈んでいる。**
#   2. **`held` の意味を戻した。** `held` は「画面が止まる」ではない。
#      止まるのは主題であり、光と埃とカメラは動く。**ゆえにこの1本は `held` を1つも持たない。**
#   3. **カメラを解放した。** 前の版の §10 は「数センチの、重い沈み」であり、
#      **「何も明かさず、手を追わない」**と言っていた。いまは違う——
#      **カメラはこの1本で降下を始め、以後の1本でも止まらない。**
# ⚠️ **`mode` も `role` も `duration` も動かしていない。**
#   **動かしたのは、運動の配分だけである。**
# ============================================================================
shot: habits-mv-s01

unit:
  before: "前年度の出席簿が、机の上に閉じている。**手は、まだ其処に無い。**"
  after: "手が出席簿を開き、**転出欄の頁が起きている。**"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
role: "所作"

# ⚠️ **この作品の `place` は「話の記名の現場」ではない。**（`ledger.yaml` の `locations` の註）
#    **曲の1行が立つ現場である。** 六つしかない——**27本が6つを巡る。**
place: "出席簿の転出欄"

# ⚠️ **一時刻である。** この作品は**日付を固定しない**——`bible.world.era` は
#    「2026, Japan. The setting does not move across all four volumes.」であり、
#    **一日の内のどの時刻かだけが要る。** 二つの値しか使わない。
time: "勤務日の夕方"

mode: "motion"

# ⚠️ **従属変数である。** この作品では**さらに曲に従属する**——
#    出所は `bible.song.lines[].at` の差であり、**この作品が決めた数ではない。**
#    ⚠️ **「4秒より短いから伸ばす」をしない**（`docs/seedance-route.md` の明示の規則）。
duration: "8.059s"

# 動画の仕様（§1–20）。
spec: specs/video/habits-mv-s01.md

# 画像の仕様（**§1–20 を持たない**。§18 も `Negative Prompt` も `Style Motion` も無い）。
# ⚠️ **この欄は、この稿で足した**（実測 2026-09-28——27本のどれも持っていなかった）。
#    ⚠️ **画像の経路は、この作品で一度も検査されていない**——`L21` が画像の `Negative` を
#    読む相手は、この欄が在って初めて生まれる。**足しただけでは足りない**——
#    **生成物は `media/` へ置かれ、送った日に `attached` が書かれる。**
key_image: specs/image/habits-mv-s01.md

# **狙い。** このショットが何を試すのか。
# ⚠️ **この欄を読む検査は、まだ1つも無い**（`shot-record.schema.json` の `aim`）。
aim: >-
  曲の頭8.059秒——**歌が1行も無い区間**を、画面が全部負えるか。そして**この作品の最初の一変化が「手」である**ことを立てられるか。

motion:
  subject: "碓氷千夏の右手と、出席簿の頁。**そして、頁を通って動きつづける光と埃。**"
  quality: "ゆっくりだが、**止まらない。**表紙が起き、紙が扇になって次々に落ち、小口が揺れる。**頁は押さえられ、沈み、沈みきらないうちに切れ目が来る。**"
  law: >-
    `luminous-anime` の運動である。**紙は薄く、重さを持たない**——めくりは空気を切らず、音を立てない。⚠️ **しかし軽いことは、止まることではない。**この作品の物理は、**物が軽いこと**と、**光が蛍光灯であること**の二つでできている——**ゆえに物が動けば、光も埃もそれに遅れて動く。**これは付随ではなく、この作品の運動の本体である。

# **ビート。不均等に配分する。**（`shot-record.schema.json` の `beats`）
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
# ⛔ **末尾のビートは `dense` である。** 作り直す前は `sparse` で、その前は `held` だった——
#    **変化が切れ目の前に終わっていた。** いまは、頁が沈みきる瞬間に切れ目が来る。
# ⚠️ **`held` のビートを持たない。** 止まるのは主題であって、画面ではない。
beats:
  - range: "0-1.6s"
    density: transition
    what: "閉じた出席簿と、机の上の光。**管の光が一度ゆらぐ。**埃が机の上を渡っている。**カメラは既に動いている**——ゆっくり降下しながら、右へ。"
  - range: "1.6-3.8s"
    density: sparse
    what: "手が画面の下から入り、表紙の縁を探る。**まだ開かない。**手の後ろで埃が巻き上がる。"
  - range: "3.8-8.059s"
    density: dense
    what: "**開く。**表紙が起き、紙が扇になって次々に落ち、小口が揺れる。**転出欄の頁が持ち上がり、指に押さえられて沈む——沈みきるのが、切れ目のコマである。**"

reference_set:
  - "碓氷千夏.negatives"
  - "出席簿"
  - "出席簿.negative"
  - "出席簿の転出欄"
  - "出席簿の転出欄.geography"

# ⚠️ **27本すべてで同一である。** 出所は三つ——
#    `bible.negative_base` の5行／`ledger.yaml` の `characters.*.negatives` の共通の床
#    （`no identifying clothing, hairstyle, or prop`）／`props.*.negative` の2行。
#    ⚠️ **`no face before the name is called` は、顔を置くショットにも掛かる。**
#    **この作品の顔は、すべて手の後に来る**——ゆえにこの一行は、
#    **どのショットの内容とも衝突しない。**
forbidden_set:
  - "no calling voice as a sound effect"
  - "no face before the name is called"
  - "no watermark"
  - "no on-screen subtitles"
  - "no background music"
  - "no identifying clothing, hairstyle, or prop"
  - "no legible name text"
  - "no legible text on any surface"

# ⚠️ **`attached` を書かない。** 書けば「意図にあるのに添付が無い」と鳴る（`L6` の註）。
#    **書かなければ「記録が無い」と言う**——**`L6` は27本で鳴りつづける。**
#    ⛔ **この稿で、この1本の動画のテイクが付いた**（`takes/habits-mv-s01-video-1.yaml`、実測 2026-09-28）。
#    **ゆえに「この作品はまだ1本も生成していない」は、もう真ではない**——**その一行を、ここで消した。**
#    ⛔ **それでも `attached` は書かない。** `attached` は「**実際に何が付いたか**」の欄である
#    （`semantic.py` の `check_attached`——**意図は `reference_set`、実際は `attached`**）。
#    **著者が何を添付したかを、私は見ていない**——**推測で書けば、記録が測定になる。**
#    ⚠️ **画像の側は、まだ0枚である**（`media/` に在るのは動画3本だけ）。

# **このショットが実際に持つ開示状態。**（台帳の `disclosure` は「意図」、こちらが「実際」）
# ⚠️ **27本すべてが4つの属性を持つ。** 持たないショットは開示の検査を受けない（`L7` の `bare`）。
# ⚠️ **`unknown` は「観客がまだ知らない」である。** 台帳の3つの変化点（`s10`・`s17`・`s18`）で
#    値が動く。**`出席簿の転出欄.一行` は動かない**——`s01` が**出発点**だからである（`L9` の註）。
disclosure_state:
  出席簿の転出欄.一行: present
  宛名票の一行.いちばん古い一枚: unknown
  鍵に付いた預かり札.宛先: unknown
  名札の予備.着けられた: unknown
