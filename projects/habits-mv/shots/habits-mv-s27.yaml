# outro / long-take / still —— 後奏 —— 手が、退く。
#
# **後奏である。歌は、もう無い。**（`l31` の2本目／`bible.song.sections` の `outro`）
#
# ⚠️ **この14.309秒は、この作品で2番目に長い1本である**——**最も長いのは `s18` の
#    14.840秒である。**（初め「最も長い」と書いていたが、`duration` の欄から数え直して誤りと分かった。）
#    ⚠️ **数え直した結果である**: 27本のうち `s18` だけがこの1本より長い。
#    そして**この作品の最後の画面である。**
#
# ⚠️ **この1本の変化は「退く」である。** ——**`s26` が止めた手が、ここで画面を出る。**
#    出所は `bible.song.lines` l31 の直後——**歌が終わったあとの14秒である。**
#    ⚠️ **`s18` の `さくら` とは別である。**
#    `s18` は**不在が内容である**（名札は在り、着ける者が居ない）。
#    この1本は**退場である**（手が在り、退いていく）。
#    ⚠️ **似て見えるが、`role` が違う**——`s18` は `開示`、ここは `余白`。
#    **不在と余白は、別の種別である**（`rolemap.ROLES`）。
#
# ⚠️ **この作品は最後に、`s01` の頁を開いたまま置く。**
#    `bible.world.rules` の四番「**運搬は一度も完了しない。**」
#    ——**手が退いても、頁は閉じない。**
#
# ⚠️ **曲を切らない。**（設計 04 §2-3）
#    「**曲を切らない。fade out もかけない。曲の尺が作品の尺である。**」
#    ——**この14.309秒は、間奏でも余りでもない。** 曲の一部である。
#    **ゆえに画面も、ここで終わらない**——**曲が終わるところで終わる。**
shot: habits-mv-s27

unit:
  before: "手が、まだ頁の上にある。**動いていない。**"
  after: "**手が退き、紙と光だけが残っている。**"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
role: "余白"

# ⚠️ **この作品の `place` は「話の記名の現場」ではない。**（`ledger.yaml` の `locations` の註）
#    **曲の1行が立つ現場である。** 六つしかない——**27本が6つを巡る。**
place: "出席簿の転出欄"

# ⚠️ **一時刻である。** この作品は**日付を固定しない**——`bible.world.era` は
#    「2026, Japan. The setting does not move across all four volumes.」であり、
#    **一日の内のどの時刻かだけが要る。** 二つの値しか使わない。
time: "勤務日の夕方"

mode: "still"

# ⚠️ **従属変数である。** この作品では**さらに曲に従属する**——
#    出所は `bible.song.lines[].at` の差であり、**この作品が決めた数ではない。**
#    ⚠️ **「4秒より短いから伸ばす」をしない**（`docs/seedance-route.md` の明示の規則）。
duration: "14.309s"

# 動画の仕様（§1–20）。
spec: specs/video/seedance-2.5/habits-mv-s27.md

key_image: specs/image/habits-mv-s27.md

# **狙い。** このショットが何を試すのか。
# ⚠️ **この欄を読む検査は、まだ1つも無い**（`shot-record.schema.json` の `aim`）。
aim: >-
  **この作品で2番目に長い1本（14.309秒。最も長いのは `s18` の14.840秒である）。** 歌が終わったあとの14秒に、**退くこと一つだけ**を置く——**それを一変化として立てられるか。**

motion:
  subject: "退いていく手と、頁の上を渡る光。**主題は、もう動かない。**"
  quality: "止まっている。**手が一度だけ退く。**そのあと、**残りの11秒は、光だけが動く。**"
  law: >-
    `luminous-anime` の運動である。**残るのは、蛍光灯と、紙と、埃である**——`bible.world.visual_language.art_direction` の「Fluorescent light.」が、この1本では**画面の全部である。**

# **ビート。不均等に配分する。**（`shot-record.schema.json` の `beats`）
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
beats:
  - range: "0-3.5s"
    density: held
    what: "頁の上の手。**動かない。**"
  - range: "3.5-7.0s"
    density: sparse
    what: "**手が退く。**"
  - range: "7.0-14.309s"
    density: held
    what: "紙と光だけ。**何も起こらない。**"

reference_set:
  - "碓氷千夏.negatives"
  - "出席簿"
  - "出席簿.negative"
  - "出席簿の転出欄"
  - "出席簿の転出欄.geography"

# ⚠️ **27本すべてで同一である。** 出所は三つ——
#    `bible.negative_base` の5行／`ledger.yaml` の `characters.*.negatives` の共通の床
#    （`no identifying clothing, hairstyle, or prop`）／`props.*.negative` の2行。
#    ⚠️ **`no face before the name is called` は、顔を置くショットにも掛かる。**
#    **この作品の顔は、すべて手の後に来る**——ゆえにこの一行は、
#    **どのショットの内容とも衝突しない。**
forbidden_set:
  - "no calling voice as a sound effect"
  - "no face before the name is called"
  - "no watermark"
  - "no on-screen subtitles"
  - "no background music"
  - "no identifying clothing, hairstyle, or prop"
  - "no legible name text"
  - "no legible text on any surface"

# ⚠️ **`attached` を書かない。** この作品は**まだ1本も生成していない**——
#    書けば「意図にあるのに添付が無い」と27本ぶん鳴る（`L6` の註）。
#    **書かなければ「記録が無い」と言う**——**それが今の事実である。**
#    ✅ **生成したら、この欄を足す。**

# **このショットが実際に持つ開示状態。**（台帳の `disclosure` は「意図」、こちらが「実際」）
# ⚠️ **27本すべてが4つの属性を持つ。** 持たないショットは開示の検査を受けない（`L7` の `bare`）。
# ⚠️ **`unknown` は「観客がまだ知らない」である。** 台帳の3つの変化点（`s10`・`s17`・`s18`）で
#    値が動く。**`出席簿の転出欄.一行` は動かない**——`s01` が**出発点**だからである（`L9` の註）。
disclosure_state:
  出席簿の転出欄.一行: present
  宛名票の一行.いちばん古い一枚: present
  鍵に付いた預かり札.宛先: absent
  名札の予備.着けられた: absent
