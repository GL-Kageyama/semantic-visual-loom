# verse-2 / long-take / motion —— 箱の側面に、四枚。
#
# **「箱の側面に、四枚。」**（`l08`·49.867秒）＋**「剥がさないまま、重なっている。」**
# （`l09`·51.383秒）。`bible.song.lines` l08・l09。**2行を1本で受ける。**
#
# ⚠️ **なぜ2行を1本にするか。** `l08` は **1.516秒** しかない——
#    **1.516秒は単位にならない。**（固定方針「The shot is the unit.」
#    **一つのショットは、一つの変化のためにある。それ以上を負わせない。**）
#    ⚠️ **行の頭で切れば、1.516秒のショットができる。** **切らない。**
#    **2行で 9.495秒である**——**これは長回しの節にふさわしい。**
#
# ⚠️ **本編では「四枚」は欄である**（宛名票の欄が四つ）。
#    **この曲の「四枚」は枚である。** ——**同じ数が、別のものを数えている。**
#    ⚠️ **どちらも出典に在る。** この作品は**四枚の札を置く**——
#    **本編の四つの欄を、ここで数え直さない。**
#    （台帳 第二巻第1話「八十軒目」4,200字／`ledger.yaml` の `宛名票の一行` の註。）
#
# ⚠️ **剥がさない。** 世界の規則「**運搬は一度も完了しない**」——
#    **四枚が剥がれれば、運搬が一歩進む。** **この作品では、それは起きない。**
shot: habits-mv-s09

unit:
  before: "箱の側面に、**四枚が重なっていて、まだ誰も数えていない。**"
  after: "四枚の端が、**指の下で一度ずれる。**"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
role: "所作"

# ⚠️ **この作品の `place` は「話の記名の現場」ではない。**（`ledger.yaml` の `locations` の註）
#    **曲の1行が立つ現場である。** 六つしかない——**27本が6つを巡る。**
place: "宛名票の一行"

# ⚠️ **一時刻である。** この作品は**日付を固定しない**——`bible.world.era` は
#    「2026, Japan. The setting does not move across all four volumes.」であり、
#    **一日の内のどの時刻かだけが要る。** 二つの値しか使わない。
time: "勤務日の日中"

mode: "motion"

# ⚠️ **従属変数である。** この作品では**さらに曲に従属する**——
#    出所は `bible.song.lines[].at` の差であり、**この作品が決めた数ではない。**
#    ⚠️ **「4秒より短いから伸ばす」をしない**（`docs/seedance-route.md` の明示の規則）。
duration: "9.495s"

# 動画の仕様（§1–20）。
spec: specs/video/seedance-2.5/habits-mv-s09.md

key_image: specs/image/habits-mv-s09.md

# **狙い。** このショットが何を試すのか。
# ⚠️ **この欄を読む検査は、まだ1つも無い**（`shot-record.schema.json` の `aim`）。
aim: >-
  **物を数えさせる1本。** 「四枚」を、画面の中で**数えられる形**にできるか。

motion:
  subject: "暮林蒼の右手と、箱の側面の四枚。"
  quality: "ゆっくり。**四枚を、下から順に一度ずつ押さえる。**剥がさない。**押さえるだけである。**"
  law: >-
    `luminous-anime` の運動である。**四枚は、貼られてから時間が経っている**——端が浮き、浮いたところに埃が入る。**押さえると、埃の線が動く。**

# **ビート。不均等に配分する。**（`shot-record.schema.json` の `beats`）
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
beats:
  - range: "0-1.6s"
    density: dense
    what: "箱が置かれる。**四枚が、初めて見える。**"
  - range: "1.6-4.0s"
    density: held
    what: "手が入り、**いちばん上の一枚に触れる。**"
  - range: "4.0-6.6s"
    density: sparse
    what: "下へ順に、**四枚を押さえる。**"
  - range: "6.6-9.495s"
    density: held
    what: "手が止まる。**四枚は、剥がされていない。**"

reference_set:
  - "暮林蒼.identity"
  - "暮林蒼.negatives"
  - "宛名票"
  - "宛名票.negative"
  - "宛名票の一行"
  - "宛名票の一行.geography"

# ⚠️ **27本すべてで同一である。** 出所は三つ——
#    `bible.negative_base` の5行／`ledger.yaml` の `characters.*.negatives` の共通の床
#    （`no identifying clothing, hairstyle, or prop`）／`props.*.negative` の2行。
#    ⚠️ **`no face before the name is called` は、顔を置くショットにも掛かる。**
#    **この作品の顔は、すべて手の後に来る**——ゆえにこの一行は、
#    **どのショットの内容とも衝突しない。**
forbidden_set:
  - "no calling voice as a sound effect"
  - "no face before the name is called"
  - "no watermark"
  - "no on-screen subtitles"
  - "no background music"
  - "no identifying clothing, hairstyle, or prop"
  - "no legible name text"
  - "no legible text on any surface"

# ⚠️ **`attached` を書かない。** この作品は**まだ1本も生成していない**——
#    書けば「意図にあるのに添付が無い」と27本ぶん鳴る（`L6` の註）。
#    **書かなければ「記録が無い」と言う**——**それが今の事実である。**
#    ✅ **生成したら、この欄を足す。**

# **このショットが実際に持つ開示状態。**（台帳の `disclosure` は「意図」、こちらが「実際」）
# ⚠️ **27本すべてが4つの属性を持つ。** 持たないショットは開示の検査を受けない（`L7` の `bare`）。
# ⚠️ **`unknown` は「観客がまだ知らない」である。** 台帳の3つの変化点（`s10`・`s17`・`s18`）で
#    値が動く。**`出席簿の転出欄.一行` は動かない**——`s01` が**出発点**だからである（`L9` の註）。
disclosure_state:
  出席簿の転出欄.一行: present
  宛名票の一行.いちばん古い一枚: unknown
  鍵に付いた預かり札.宛先: unknown
  名札の予備.着けられた: unknown
