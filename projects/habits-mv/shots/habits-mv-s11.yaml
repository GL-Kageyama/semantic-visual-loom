# pre-chorus-2 / long-take / motion —— まだ、読む。口は、動く。音は、出ない。
#
# **「まだ、読む。」**（`l12`·69.176秒）＋**「口は、動く。」**（`l13`）＋
# **「音は、出ない。」**（`l14`·74.122秒）。**3行を1本で受ける。**
#
# ⚠️ **なぜ3行を1本にするか。** 1行 2.473秒が三つである——
#    **3本に割れば、1本2.4秒になる。**
#    ⚠️ **しかしこの節は `long-take` である**（`bible.song.sections` の `pre-chorus-2`）。
#    **長回しの節を2.4秒に割れば、`regime` が嘘になる。**
#    **ゆえに1本である。** 7.101秒。
#
# ⚠️ **この節は、本編の `pre-chorus-1` の短い反復である**（`bible.song.sections` の註）。
#    **画面もまた、反復である。** `s02`〜`s04` と同じ三つの変化が、
#    **7.101秒に畳まれて戻る。**
#    ⚠️ **同じ変化を三つ置くことは、`s02`〜`s04` の複製ではない**——
#    **曲が、そう置いている。** 画面は曲の形に従う。
#
# ⚠️ **`place: 束`。** 曲は「**束から、一枚が、切り離される。**」と言う（`l22`）——
#    **この現場は、後の `s18` で本番を迎える。** ここは**その手前である。**
#    ⚠️ **本編の `伝票の束` とは別の鍵である**（`ledger.yaml` の `束` の註）——
#    **曲は「何の束か」を言わない。言っていないものを、画面が決めない。**
shot: habits-mv-s11

unit:
  before: "束が、机の上で揃っていない。**手は、まだ其処に無い。**"
  after: "手が止まり、**口が閉じている。音は、出ていない。**"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
role: "所作"

# ⚠️ **この作品の `place` は「話の記名の現場」ではない。**（`ledger.yaml` の `locations` の註）
#    **曲の1行が立つ現場である。** 六つしかない——**27本が6つを巡る。**
place: "束"

# ⚠️ **一時刻である。** この作品は**日付を固定しない**——`bible.world.era` は
#    「2026, Japan. The setting does not move across all four volumes.」であり、
#    **一日の内のどの時刻かだけが要る。** 二つの値しか使わない。
time: "勤務日の日中"

mode: "motion"

# ⚠️ **従属変数である。** この作品では**さらに曲に従属する**——
#    出所は `bible.song.lines[].at` の差であり、**この作品が決めた数ではない。**
#    ⚠️ **「4秒より短いから伸ばす」をしない**（`docs/seedance-route.md` の明示の規則）。
duration: "7.101s"

# 動画の仕様（§1–20）。
spec: specs/video/habits-mv-s11.md

# 画像の仕様（**§1–20 を持たない**。§18 も `Negative Prompt` も `Style Motion` も無い）。
# ⚠️ **この欄は、この稿で足した**（実測 2026-09-28——この稿を書くために開いた時点で、
#    `s11`〜`s15` のどれも持っていなかった）。`L18` がこの欄を読み、
#    **指す先が開けるか**、**画像の仕様が §1–20 を持っていないか**を確かめる。
key_image: specs/image/habits-mv-s11.md

# **狙い。** このショットが何を試すのか。
# ⚠️ **この欄を読む検査は、まだ1つも無い**（`shot-record.schema.json` の `aim`）。
aim: >-
  **3行を7.101秒で受ける。** プレサビの反復を、**畳んで戻す**——`s02`〜`s04` が26.170秒だったものを、7.101秒で言い直せるか。

motion:
  subject: "篠原麻衣の手、目、口。"
  quality: "速い。**三つが続けて起きる**——手が一枚を取り、目が其処へ落ち、口が動く。**一つずつは短い。** 間を置かない。"
  law: >-
    `luminous-anime` の運動である。**畳まれた反復は、同じ運動を短く行う**——運動の質は `s02`〜`s04` と同じで、**量だけが少ない。**

# **ビート。不均等に配分する。**（`shot-record.schema.json` の `beats`）
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
beats:
  - range: "0-2.473s"
    density: dense
    what: "手が一枚を取り、**目が其処へ落ちる。**"
  - range: "2.473-4.946s"
    density: dense
    what: "**口が動く。**字の形が、一度だけ。"
  - range: "4.946-7.101s"
    density: held
    what: "口が閉じる。**音は、出ない。**"

reference_set:
  - "篠原麻衣.identity"
  - "篠原麻衣.negatives"
  - "束"
  - "束.appearance"

# ⚠️ **27本すべてで同一である。** 出所は三つ——
#    `bible.negative_base` の5行／`ledger.yaml` の `characters.*.negatives` の共通の床
#    （`no identifying clothing, hairstyle, or prop`）／`props.*.negative` の2行。
#    ⚠️ **`no face before the name is called` は、顔を置くショットにも掛かる。**
#    **この作品の顔は、すべて手の後に来る**——ゆえにこの一行は、
#    **どのショットの内容とも衝突しない。**
forbidden_set:
  - "no calling voice as a sound effect"
  - "no face before the name is called"
  - "no watermark"
  - "no on-screen subtitles"
  - "no background music"
  - "no identifying clothing, hairstyle, or prop"
  - "no legible name text"
  - "no legible text on any surface"

# ⚠️ **`attached` を書かない。** この作品は**まだ1本も生成していない**——
#    書けば「意図にあるのに添付が無い」と27本ぶん鳴る（`L6` の註）。
#    **書かなければ「記録が無い」と言う**——**それが今の事実である。**
#    ✅ **生成したら、この欄を足す。**

# **このショットが実際に持つ開示状態。**（台帳の `disclosure` は「意図」、こちらが「実際」）
# ⚠️ **27本すべてが4つの属性を持つ。** 持たないショットは開示の検査を受けない（`L7` の `bare`）。
# ⚠️ **`unknown` は「観客がまだ知らない」である。** 台帳の3つの変化点（`s10`・`s17`・`s18`）で
#    値が動く。**`出席簿の転出欄.一行` は動かない**——`s01` が**出発点**だからである（`L9` の註）。
disclosure_state:
  出席簿の転出欄.一行: present
  宛名票の一行.いちばん古い一枚: present
  鍵に付いた預かり札.宛先: unknown
  名札の予備.着けられた: unknown
