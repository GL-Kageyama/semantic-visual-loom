# 作品台帳 — 『ハビッツ！！！』主題歌MV『誰の名』（habits-mv）
#
# ⚠️ **これは本編でも宣伝でもない。主題歌MVである。**
#    **時間の主が曲である**（`bible.time_source: song`）——この一行が、この作品を
#    リポジトリで唯一の種類の作品にしている。`L34`（尺）と `L36`（歌詞の覆い）が、
#    **この作品でだけ鳴る。**
#
# ⚠️ **置き場。** `projects/habits-mv/` である——**`projects/` の直下。**
#    すべての作品は、自分のディレクトリに自分の `bible.yaml` と `ledger.yaml` を持つ
#    （`docs/usage.md`「What a project is」）。**親の台帳は読まない。写さない。**
#    三つは同居するが、**同じ台帳を共有しない**——
#      ① `projects/habits/`          本編・六十三話
#      ② `projects/habits-promo-chinatsu/` 宣伝・二十八秒
#      ③ `projects/habits-mv/`       **この作品**・主題歌MV・179.320秒
#    **⚠️ 作品は作品を抱えない**（`CLAUDE.md`「A work does not hold a work」）。
#    `check.py` は再帰しないので、抱えれば**親を走らせても読まれない。**
#
# ─────────────────────────────────────────────────────────── 曲は、与えられた事実である
#
# **`bible` は「何が与えられたか」。`ledger` は「何を決められたか」。**
# **曲は与えられ、対応は決められる。**（設計 01 §2.3）
#
# 出所: `soul-voice-teller/examples/habits/届ける/theme-song.md`（主題歌『誰の名』）
#       および Suno の出力4本（実測 2026-09-28、実測30）。
#       ⚠️ **どちらも配布物であり、このリポジトリの外にある。**
#
# ⚠️ **曲は、このリポジトリに入れない。** 著作権と利用条件の記録は作品側に置く
#    （設計 04 §5 Q-6e）。**要る3点**——① 商用利用には Suno が用意した経路での
#    ダウンロードが要る ② `Remix` は商用利用できない ③ **指紋・透かし・メタデータを
#    除去・改変・隠蔽してはならない。** ⚠️ **これは 2026-09-28 時点の記述である。**
#    **配布の前に、その時点の規約を読み直す。**
#
# ─────────────────────────────────────────────────────────── 届いた曲について（実測）
#
# ⚠️ **届いた曲は、`theme-song.md` が求めた形と、二点ずれている。**
#    **これはこの作品の欠陥ではない。与えられた事実である。**
#
#    ① **`[Verse 1]` が無い。** 台本は33行を渡したが、返ってきたのは31行である
#       （実測30 §4-1——落ちた5キューは `[Intro]`・`[Verse 1]`・その3行、足された1キュー）。
#       **ゆえにこの作品は、`[Verse 1]` を1行も持たない。**
#       ⚠️ **私の記録した推奨は「引き直し」である**（実測30 §9-4）。
#       **裁定はまだである。** 差し戻しが決まれば、下の `sections` と `lines` を
#       差し替えるだけでよい——**ショットの刻みは、歌の側から引き直せる。**
#
#    ② **`bpm` と `meter` が、どのファイルにも無い**（Suno は BPM もキーも書かない。
#       実測30 §1-1）。**ビート検出器もこの環境に無い**（同 §3-2）。
#       ゆえに**この作品は、`bpm` と `meter` を1つも書かない**——
#       **`L35` が予約のままであり、埋められない欄を埋めた顔にしないためである。**
#       ⚠️ **`theme-song.md` は「96 bpm・4/4」と指定している。それは指定であって、
#          届いた音の実測ではない。** **指定を実測として書かない。**
#
# ─────────────────────────────────────────────────────────── 尺は、どのファイルから採るか
#
# **`duration: 179.320` は `.wav` と `.m4a` の実測である。**
# ⚠️ **Suno の4つの出力は尺が違う**（実測30 §1-1）——`wav` 179.320／`m4a` 179.320／
#    `mp3` 179.352／`mp4` 179.200。**この作品は `wav` と `m4a` を採る。**
#    ⚠️ **`mp4` は素材にできない**——Suno の `mp4` は**ジャケット画＋歌詞の焼き込み＋
#    `MADE WITH SUNO` の透かし**であり、**規約の③に触れ、`L21` の床にも触れる**
#    （設計 04 §7-1）。**MV は `wav` か `m4a` から作る。**
#    ⚠️ **どのファイルから採るかは未裁定である**（設計 01 §5 Q-7）。**ここでは2つが
#       一致しているので、裁定は尺を動かさない。**
#
# ⚠️ **この欄を読む層は無い。** `L34` は `duration` を読み、**実物を開かない**——
#    ゆえに **`duration` が本当にそのファイルの尺であるかは、誰も確かめない**（穴である）。

project: habits-mv

bible:
  # 作品の様式。**様式カードの名前である。**
  # 出所: `projects/habits/bible.yaml` の同じ欄（本編が採った様式）。
  #       ⚠️ **この作品は本編と同じ様式で描かれる。** 主題歌MVは本編の一部である。
  #       ⚠️ この欄が §18 の7つ目のスロット `Style Motion` の出所である（`specmap.PROMPT_SLOTS`）。
  style: luminous-anime

  # 作品が話す言語。**値は英語で書く**（生成に渡る文字列は英語である——訳してはならない）。
  # 出所: `projects/habits/bible.yaml` の同じ欄。**この作品は日本語を話す。**
  #       ⚠️ **空欄は中立ではない。** 実測: 発話を検出した動画に**中国語の字幕が焼かれた**。
  #          だから**症状を禁じるのではなく、言語を名指す**（`L27`）。
  #       ⚠️ **この作品は、歌以外に何も喋らない。** それでも名指す——
  #          **歌は日本語であり、この作品の言語は日本語である。**
  language: Japanese

  # ─────────────────────────────────────────────────── 時間の主は、曲である
  #
  # ⚠️ **この一行が門である。** これを書かない限り、`bible.song` は註のために在るだけになる
  #    （`L34` がそのことを註で言う）。**`song` と書いた瞬間から、曲が作品の尺である。**
  # 出所: 設計 01 §2.1。
  time_source: song

  song:
    # 採用された1本。
    # ⚠️ **実体は、このリポジトリに無い。** 曲は入れない（上の「曲は、与えられた事実である」）。
    #    置き場は、この作品の `media/` である——**そこが「標本の置き場」だからである**
    #    （`renders/` は作品、`media/` は標本。`docs/usage.md`）。
    # ⚠️ **この欄を読む層は無い。** 書くのは、人が後から辿れるようにするためである。
    master: media/まだ.wav

    # ⚠️ **実測値である。頼んだ尺ではない**——Suno には尺を指定する公式の欄が無い。
    duration: 179.320

    # ─────────────────────────────────────────────── 曲の区切り（9節）
    #
    # ⚠️ **曲の中に既に在る区切りは材料である。**（設計 01 §1.1）
    #    下の8節は、**Suno が返した節マーカーをそのまま採った**ものである
    #    （実測30 §2-1。マーカーは8つ——`[Pre-Chorus]` `[Chorus]` `[Verse 2]`
    #    `[Pre-Chorus]` `[Chorus]` `[Bridge]` `[Final Chorus]` `[Outro]`）。
    # ⚠️ **`intro` だけは、マーカーが無いので書き足した。** 実測:
    #    **Suno の最初のマーカーは 8.059 秒の `[Pre-Chorus]` であり、頭 8.059 秒に
    #    マーカーが無い**（`[Intro]` は台本に在ったが、返ってきた39キューに無い）。
    #    ⚠️ **足さなければ `Σ` は `duration` に届かない**（`L34` がそれを鳴らす）。
    #    ⚠️ **これは容器ではない**——**曲の先頭 0.000 秒は、曲の内側の境界である。**
    #       外から持ち込んだ区切り（「8小節＝32秒」）とは、出どころが違う。
    #
    # ⚠️ **節の名は、曲の語である**（`chorus-1` のように）。**作品の語に訳さない**——
    #    訳せば、書き手が毎回それを曲の区切りへ翻訳することになる（`song.sections.id` の註）。
    #    ⚠️ **同名の節が2つ以上あるので、番号を振る**（`chorus-1` / `chorus-2`）。
    #       **これは名の重複を避けるためであって、順番の主張ではない。**
    #
    # ⚠️ **`regime` は、この作品が決めたことである。**（ゆえに `ledger` に在ってもよいが、
    #    節の欄である以上ここに置く——`song.sections[].regime` がその席である。）
    #    決め方は設計 01 §1.3 と §2.2——
    #      **長回し＝明かす／ビート＝響かせる。**
    #      **歌詞の1行が2.4〜2.5秒で畳みかけてくる節は `beat`。**
    #      **1行が息を長く持つ節は `long-take`。**
    #    ⚠️ **この割り当ては、私の判断であり、著者の裁定を受けていない。**
    #       （委任の下で決め、記録に残す。**覆すなら `regime` の字を1つずつ直すだけである。**）
    #
    # ⚠️ **`bpm` と `meter` は、この作品のどこにも無い。** 埋められないからである（上の実測）。
    sections:
      # 0.000–8.059。**曲が既に始まっている8秒間**（マーカーが無いので書き足した）。
      # 1行も歌われない。**ここは `L36` の「歌を持たない区間」であり、画面が全部を負う**
      # ——ゆえに `ledger.song_coverage` は、この節だけを**節ごとに**受ける。
      - { id: intro, at: 0.000, until: 8.059, regime: long-take }
      # 8.059–34.229（26.170秒・3行）。1行が9〜10秒を息で持つ。**長回しである。**
      - { id: pre-chorus-1, at: 8.059, until: 34.229, regime: long-take }
      # 34.229–49.867（15.638秒・4行）。1行2.473秒。**畳みかける。ビートである。**
      - { id: chorus-1, at: 34.229, until: 49.867, regime: beat }
      # 49.867–69.176（19.309秒・4行）。箱の側面の四枚。**長回しである。**
      - { id: verse-2, at: 49.867, until: 69.176, regime: long-take }
      # 69.176–76.277（7.101秒・3行）。**本編の `pre-chorus-1` の短い反復である。**
      - { id: pre-chorus-2, at: 69.176, until: 76.277, regime: long-take }
      # 76.277–97.021（20.744秒・5行）。**サビの反復。ビートである。**
      - { id: chorus-2, at: 76.277, until: 97.021, regime: beat }
      # 97.021–125.824（28.803秒・4行）。**曲で最も長い節である。**
      # 最後の1行が10.000秒を1人で持ち、そのあと 4.840秒の間奏が続く。**長回しである。**
      - { id: bridge, at: 97.021, until: 125.824, regime: long-take }
      # 125.824–155.505（29.681秒・7行）。**行数が最も多い。** 前半は1行2.4秒で畳みかけ、
      # 後半は1行5〜7秒で伸びる。**前半がビートであり、節としては `beat` を採る。**
      # ⚠️ **1つの節の中に両方の刻みが在る。** 設計 01 §2.2 は「3値目を今は作らない」と
      #    書いている——**ゆえに混在は、ここでは `beat` の側に寄せた。**
      #    ⚠️ **これは最初の実測例である。** 混在が足りないと分かれば、3値目が要る。
      - { id: final-chorus, at: 125.824, until: 155.505, regime: beat }
      # 155.505–179.320（23.815秒・1行）。**最後の1行が9.506秒を1人で持ち、
      # そのあと 14.309秒の後奏が続く。長回しである。**
      - { id: outro, at: 155.505, until: 179.320, regime: long-take }

    # ─────────────────────────────────────────────── 歌詞行（31行）
    #
    # ⚠️ **`id` は、この基盤の側で振った。** Suno の字幕から引けるのは `at` と `text` と
    #    （節の中にしか無いなら）`section` までであり、**行の ID は引けない**（実測30 §2-1）。
    #    ゆえに `l01`〜`l31` は**この一枚が与える名である**——`ledger.song_coverage` が引く。
    # ⚠️ **`at` は Suno の字幕の時刻である。** 実測30 §2-1 の39キューから、
    #    マーカー8本を落とし、**歌詞の31行を抜いた。**（`[Verse 1]` の3行は、そもそも
    #    返ってきていない——上の「届いた曲について」。）
    # ⚠️ **それが「歌われた時刻」である保証は無い**——**実測では決着しなかった**
    #    （行の尺が `2.473/2.473/2.474` と反復する一方、同じ節の中で `9.015/10.000/4.628`
    #    とも動く。実測30 §2-4）。**この一点は、`L34` と `L36` の前提ではない**
    #    ——両層が読むのは「対応が在るか」と「合計が合うか」だけである。
    # ⚠️ **空の行を作らない。** 歌を持たない区間は、**節で受ける**（`intro` がそれである）。
    #    空の行は、覆われた行に見える（`L36` は「∃ 対応」を数えるので、中身の無い行にも
    #    対応が付き、緑になる）。`song.lines[].id` の註を見る。
    lines:
      # [Pre-Chorus] 8.059–34.229
      - { id: l01, at: 8.059, section: pre-chorus-1, text: "目で、読む。" }
      - { id: l02, at: 17.074, section: pre-chorus-1, text: "口は、動く。" }
      # ⚠️ この行の前の 27.074–29.601（2.527秒）に歌詞が無い。**行は行の時刻から始まる。**
      - { id: l03, at: 29.601, section: pre-chorus-1, text: "音は、出ない。" }
      # [Chorus] 34.229–49.867
      - { id: l04, at: 34.229, section: chorus-1, text: "その字は、誰の字。" }
      - { id: l05, at: 36.702, section: chorus-1, text: "その名は、誰の名。" }
      - { id: l06, at: 39.176, section: chorus-1, text: "読む手は、誰の手。" }
      - { id: l07, at: 41.649, section: chorus-1, text: "まだ、呼ばれていない。" }
      # [Verse 2] 49.867–69.176
      - { id: l08, at: 49.867, section: verse-2, text: "箱の側面に、四枚。" }
      - { id: l09, at: 51.383, section: verse-2, text: "剥がさないまま、重なっている。" }
      - { id: l10, at: 59.362, section: verse-2, text: "いちばん古い一枚が、いちばん下にある。" }
      - { id: l11, at: 64.548, section: verse-2, text: "違う読みで呼ばれて、振り向く。" }
      # [Pre-Chorus] 69.176–76.277
      - { id: l12, at: 69.176, section: pre-chorus-2, text: "まだ、読む。" }
      - { id: l13, at: 71.649, section: pre-chorus-2, text: "口は、動く。" }
      - { id: l14, at: 74.122, section: pre-chorus-2, text: "音は、出ない。" }
      # [Chorus] 76.277–97.021
      - { id: l15, at: 76.277, section: chorus-2, text: "その字は、誰の字。" }
      - { id: l16, at: 78.750, section: chorus-2, text: "その名は、誰の名。" }
      - { id: l17, at: 81.223, section: chorus-2, text: "読む手は、誰の手。" }
      - { id: l18, at: 83.697, section: chorus-2, text: "まだ、呼ばれていない。" }
      # ⚠️ **同じ語が2度続く。** 1度目は 4.867秒、2度目は 8.457秒——**同じ行ではない。**
      #    ゆえに2行として置く（`L36` は「同じ行を2回覆う」ことを註にするが、
      #    ここは別の行なので、そもそも註にならない）。
      - { id: l19, at: 88.564, section: chorus-2, text: "まだ、呼ばれていない。" }
      # [Bridge] 97.021–125.824
      - { id: l20, at: 97.021, section: bridge, text: "宛先の無い札が、一枚。" }
      - { id: l21, at: 101.090, section: bridge, text: "鍵は、五年前から、ある。" }
      - { id: l22, at: 106.037, section: bridge, text: "束から、一枚が、切り離される。" }
      # ⚠️ この行は 10.000秒を1人で持つ。**その後 120.984–125.824（4.840秒）に歌詞が無い。**
      - { id: l23, at: 110.984, section: bridge, text: "使われないまま、名札がある。" }
      # [Final Chorus] 125.824–155.505
      - { id: l24, at: 125.824, section: final-chorus, text: "その字は、誰の字。" }
      - { id: l25, at: 128.298, section: final-chorus, text: "その名は、誰の名。" }
      - { id: l26, at: 130.691, section: final-chorus, text: "読む手は、誰の手。" }
      - { id: l27, at: 133.245, section: final-chorus, text: "まだ、呼ばれていない。" }
      - { id: l28, at: 138.590, section: final-chorus, text: "まだ、呼ばれていない。" }
      # ⚠️ **ここで初めて、サビの一行が落ちる。** 「その字は」「その名は」「読む手は」が
      #    消え、**「誰の名。」だけが2度残る。** 台本（`theme-song.md`）の形である。
      - { id: l29, at: 145.293, section: final-chorus, text: "誰の名。" }
      - { id: l30, at: 150.319, section: final-chorus, text: "誰の名。" }
      # [Outro] 155.505–179.320
      - { id: l31, at: 155.505, section: outro, text: "光が、紙の上に落ちている。" }

  world:
    # 出所: `projects/habits/bible.yaml` の同じ欄（run-10【世界観】——一字も変えない）。
    concept: >-
      2026年、日本。埼玉県川口市、東京都足立区、神奈川県横浜市戸塚区。
      **魔法も、制度も、秘密の組織もない。あるのは、記名の作法が行き届いた日常だけである。**

    # 出所: `projects/habits/bible.yaml` の同じ欄。**八つとも一字も変えない。**
    #       ⚠️ **本編の規則は、この作品にもそのまま掛かる。** 主題歌MVは本編の一部である。
    rules:
      - "ひとつ、名は呼ばれた回数でできている。**名の本体は、書かれた側ではなく呼ばれた側にある。**"
      - "ふたつ、同時に立てる席は限られている。"
      - "みっつ、禁則の語群がある。"
      - "**この作品の運搬は一度も完了しない。** 受け取られないか、受け取ったことにされないか、受け取った先で読まれない。**完了しないことが、動きを事件にしない唯一の方法である。事件とは、運搬が完了することである。**"
      - "**各話に一行を置く——「何を、どこから、どこへ、誰の手で運ぶか。そしてどこで止まるか」。この一行が書けない話は、動きのない話であり、書き直す。この一行は、アニメなら一カットで描ける動作でなければならない。**"
      - "**手が先にあり、顔が後に来る。順序は入れ替えない。顔は、呼ばれた後にだけ置かれる。**"
      - "**地の文に書かれた内面は、すべて、動きか台詞に置き換え可能でなければならない。置き換えられない内面は、内面ではなく説明である。** これは追加の規則ではなく、**削除の規則**である。"
      - "**作中の人物は、自分が映像の中にいることを知らない。**"

    # ⚠️ **この欄だけ英語である。** 生成に渡す文字列は英語であり、訳してはならない。
    #    出所は日本語である——ゆえにこの欄は「写し」ではなく「移し替え」である。
    # 出所: `projects/habits/bible.yaml` の同じ欄（run-10【ルックとカメラ】）。
    visual_language:
      art_direction: >-
        A Japanese record-keeping site, 2026. Three resolutions of the written name —
        print, ballpoint pen, pencil. Nameplate plastic, the thickness of a register's
        left sleeve, glue traces on an address slip, layered pencil on a claim tag.
        Fluorescent light. One close shot of a hand per episode.
