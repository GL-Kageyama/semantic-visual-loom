# 制作台帳 — 声の試聴（explainer-voice-samples）
#
# ⚠️ **人物は二人だが、4本は別人である。** ミライの2本は同じ人物の年齢違いではなく、
#    **別々の声の候補**である（22歳の声・27歳の声）。ミラボの2本も同じ機体の
#    声違いである。**台帳の人物は「誰が喋るか」ではなく「どんな声か」を分けるために在る。**
#
# ⚠️ **`identity` は「未作成」である。** この試聴は `key_image` を添えない——
#    **外見を決めるのが目的ではない**からである。§3 の文が外見を固定する。
#    **「無い」と書くことは、書き忘れではない。**

characters:
  ミライ:
    identity: >-
      **未作成（この試聴は外見を目的にしない）。** 20代の女性。
      枠の前で一度だけ台詞を読む。§3 の文が外見を固定する。
    negatives:
      - no child
      - no exaggerated cuteness
      - no wink
      - no blown kiss
  ミラボ:
    identity: >-
      **未作成。** 小さな AI パートナー。浮いた機体で、顔は暗いガラスの画面、
      口は画面に描かれた一本の線である。**人間ではない。**
    negatives:
      - no human face
      - no mascot costume
      - no child body

locations:
  試聴室:
    base: >-
      **未作成。** 窓の無い、静かな部屋。壁は暖かい灰色で、家具も道具も無い。
      ⚠️ **この1枚は動画へ渡すためではない**（`reference_set` は空である）。
      **部屋の見た目は §4 の文が固定する。**
    geography: >-
      話者は枠の中央に立ち、壁はその背後に平らに広がる。
      **部屋の外は無い**——カメラは話者の正面から動かない。
    states: {}

# ⚠️ **開示の変化点は4つである。** どの本も「声が聴こえる」ことがこの試聴の出来事である。
#    ⚠️ 4本は同じ台詞を喋るが、**声が違う**——ゆえに別々の変化点として並ぶ。
#
# ⚠️ **`negative:` は §18 `Negative Prompt` の節の集合が動いたかを名乗る**
#    （`L10` が両方向に検算する）。**声の違いは `Master Prompt` と `Audio Prompt` に在り、
#    `Negative` には在らない**——だからここは「声が変わった」ではなく
#    「禁制の集合が動いた」を書く欄である。
#    · vs-02 `changed` …… ミライB は「胸声へ落ちない」を禁じた（`no chest voice` ほか）
#    · vs-03 `changed` …… 機体の1本になったので、人の像に関わる禁制を足した
#    · vs-04 `covered` …… ミラボB は **vs-03 と禁制の集合が同一**。声だけが動いた
disclosure:
  - shot: vs-01
    声.候補: ミライA
    negative: covered
  - shot: vs-02
    声.候補: ミライB
    negative: changed
  - shot: vs-03
    声.候補: ミラボA
    negative: changed
  - shot: vs-04
    声.候補: ミラボB
    negative: covered
