# 第一候補 / 対話 / motion —— ミライA（22歳・明るく軽い）
#
# ⚠️ **この4本は、声以外を揃えてある。** 台詞・尺・ビート・構図・光・カメラが同じで、
#    人物と声だけが違う。**違う条件で録った声は、比較にならない。**
#
# ⚠️ **この1本の変化は1つだけである。**「静けさが、一度の台詞になり、静けさに戻る。」
#    それ以外のことは何も起こらない——立ち上がらない、歩かない、近づかない。

shot: vs-01
spec: specs/video/vs-01-mirai-light.md

# ⚠️ **`key_image` を置かない。** この試聴に画像の経路は無い。
#    **書かないことは、無いことである**（空の `key_image:` を書けば「在って空」になる）。

aim: >-
  **ミライの参照音声の候補を、WAN 3.0 で1本作る。** 声だけを取り出して
  `references/` へ置き、`semantic-audio-loom` の経路Aへ渡す。
  ⚠️ **この試聴が裁くのは声だけである。** 顔も、絵も、作品としての出来も裁かない。

unit:
  before: "**試聴室は静かである。** 話者は口を閉じ、枠の中央に立っている。"
  after: "**台詞が一度読み終えられ、部屋が静かに戻っている。** 話者は同じ場所に立っている。"

role: 対話
effect: 声
place: 試聴室
time: 時刻を持たない
mode: motion
duration: 10s

# ⚠️ **人数は身体を数える。** 枠に映るのは話者一人である。
population: 1

motion:
  subject: ミライ
  quality: >-
    喋るために口が開き、顎が小さく動き、息が入る。**立ち位置は変えない。**
    肩と胸は呼吸のぶんだけ動き、髪は遅れてついてくる。
  law: >-
    luminous-anime の物理。**空気が主役である**——話者が止まっても、
    光の中の塵と、髪の遅れと、呼吸は動き続ける。

beats:
  - range: 0-1s
    density: sparse
    what: "**口を閉じている。** 一度、息を吸う。まだ言葉は無い。"
  - range: 1-5.6s
    density: dense
    what: "**最初の文を喋る。** 口と顎が動き、視線はカメラへ。"
  - range: 5.6-6.4s
    density: held
    what: "**息継ぎ。** 口が閉じ、目だけが少し動く。**言葉は無い。**"
  - range: 6.4-9.4s
    density: dense
    what: "**二つ目の文を喋る。** 語尾で一度、息が抜ける。"
  - range: 9.4-10s
    density: sparse
    what: "**口が閉じ、静けさに戻る。** 何も足さない。"

# ⚠️ **参照画像は1枚も無い。** `attached` を書く——欄そのものが無いと
#    `L6` は「記録が無い」と註で言う。**この作品は記録できる：渡していない。**
reference_set: []
attached: []

forbidden_set:
  - 二つ目の人影
  - 聞き手
  - 読み取れる文字
  - 字幕
  - 音楽
  - カメラの移動
  - 立ち上がる・歩く
  - 手を振る
  - ウインク
  - 投げキス

disclosure_state:
  声.候補: ミライA

sound:
  scene_ref: explainer-voice-samples-vs-01
