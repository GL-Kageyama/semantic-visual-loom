  what: 「問い」 「あなたは、誰に送られるの」 — the fire's voice returns, laying a question on his palm. He does not answer;
    he has never been asked.
- range: 0:20-0:30
  density: held
  what: 「空の手」 — CORE, longest share The open palm, empty, the question laid on it. Hold. Cut.
