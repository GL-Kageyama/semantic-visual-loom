# 制作台帳 — 受け火 V3（ukebi-v3）
#
# 連続性（世界の状態）と開示（観客の知識の状態）を同じファイルに持つ。
# ⚠️ 二つに割ってはならない——参照集合も禁制集合も、この一点から導かれる。
#
# 正はこのリポジトリの外に在る（`soul-voice-teller/.../ukebi-anime/台帳/`）。
# ここは写しである。写しの段で落ちる値は、著者が入れるまで設計側にしかない（PLAN 0-j 末）。
#
# 識別子 `identity` は採用済みの設定画を名指す（`distill-essence-engine/.../ukebi-anime/`）。

characters:
  送り火:
    identity: >-
      ukebi-anime-character-sheet-送り火（`紺色コートのキャラクター設定画.png`）。
      中背、肩は普通、手だけが体に対して大きい。藍の短い髪、耳を出す、前髪は眉の上。
      膝丈の藍のコート、襟は立てない、内側は濃い灰色、ボタンは無地。
      細い目、薄い眉、閉じた口。表情を作らない。
    states: {}
    negatives:
      - "no smile"
      - "no tears"
      - "no anger"
      - "no readable text"
      - "no second person"
  花:
    identity: ukebi-anime-character-sheet-花（設定画 版4）
    states: {}
    negatives:
      - "no readable text"
  サチ:
    identity: >-
      ukebi-anime-character-sheet-サチ（設定画 版2）。痩せた女。布の履き物
      ——設定画は草履形。再焼きまで、プロンプトで布と指定する。窄口の壺を片手に。
    states: {}
    negatives:
      - "no readable text"
      - "no sandals"
      - "no straw sandals"
  フミ:
    identity: >-
      ukebi-anime-character-sheet-フミ（`疲れた青年のキャラクター設定画.png`）。
      痩せて背が丸い。黒い短い髪、寝癖が残る。灰と焦げ茶の上着、襟は開き、袖口は擦り切れる。
      指先と爪の縁にインク。目が窪み、眼鏡は無い。視線は紙の上で止まる。
      ペンを置いた後も指がペンの形を保つ。
    states: {}
    negatives:
      - "no readable text"
      - "no glasses"
      - "no second person"
  名なしの子:
    identity: ukebi-anime-character-sheet-名なしの子（設定画）
    states: {}
    negatives:
      - "no readable text"
  コダマ:
    identity: ukebi-anime-character-sheet-コダマ（設定画 版2）
    states: {}
    negatives:
      - "no readable text"
  トワ:
    identity: ukebi-anime-character-sheet-トワ（設定画）
    states:
      火:
        note: 細い火。縦に伸びる。火の底に伏せた目。自ら光るが、場を照らさない。
    negatives:
      - "no readable text"
  ナギ:
    identity: ukebi-anime-character-sheet-ナギ（設定画）
    states:
      火:
        note: >-
          軍の外套の形の火。徽章なし・旗なし・帽子・若い。色は魂火と同じ青白・縁だけ赤。
          外套の形は輪郭だけで、体ではない。
    negatives:
      - "no readable text"
  あなた:
    # POV only. 参照画像なし。足だけ。全身も顔も手も出さない（ep01 s02/s19）。
    identity: >-
      the viewer — POV only. No reference image. Only the two feet appear,
      looking down. Never a full body, never a face, never the hands.
    states: {}
    negatives:
      - "no full body"
      - "no face"
      - "no hands"
      - "no second person"

locations:
  踏切:
    # 補正版の板（2026-11-17）。砂利と土・白黒の腕木・灯なし。
    # ⚠️ 舊い板（distill の `ukebi-anime-art-board-crossing`）は三箇所食い違うので使わない。
    base: reference/踏切/青い鬼火の無人踏切.png（補正版。砂利と土・白黒の腕木・灯なし）
    geography: >-
      線路・遮断機・踏切板の位置関係。カメラは踏切を出ない。
      遮断機は上がったまま。誰も渡らない。
    states: {}

props:
  台帳:
    appearance: >-
      彼が腕に抱える台帳。初頁は白く、頁の内側に折れ目が一本。
      頁にはペン先の形の焦げ跡が在る（第3話の印は2）。
    negative:
      - "readable text"
      - "printed title on the cover"
  秤:
    appearance: 彼女を測ろうとする秤。目盛りは読めない。
    negative: ["readable numerals", "a digital display"]
  判:
    appearance: 判。押すと印が残る。印は片側だけ薄い。
    negative: ["readable text on the seal", "an ink pad with a label"]
  記憶:
    appearance: >-
      火の中の記憶。机・窓・頁・伏せた顔。場所ではなく、火の内側の像。
      画面の縁に踏切の板か水たまりを残す。
    negative: ["a second room outside the fire", "a readable page"]
  魂火:
    appearance: >-
      掌の上の魂火。唯一の光源。浮かない。第3話は梅の大きさ。
      青白い芯と、暖かい縁。場を照らす。
    negative: ["a floating fire", "a second flame", "a lantern"]
  手紙:
    appearance: 手紙。宛名は読めない。
    negative: ["readable address", "a printed stamp with text"]
  客の火:
    appearance: >-
      ゲストの火。送られる側の魂。踏切では小さい。色は魂ごとに違う——
      第1話は青白い芯・温かい中間・暗い底。第2話は土の色で、青白い火ではない。
    negative:
      - "a face in the flame"
      - "a memory inside the flame"
      - "a second flame"
      - "smoke"
      - "sparks"
  壺:
    appearance: >-
      窄口・無地・空の壺。土色の素焼き、片手に収まる、手首に紐。水は一滴も無い。
    negative:
      - "water"
      - "a drop"
      - "a pattern on the pot"
      - "a handle"
      - "a lid"
  腰掛け:
    appearance: >-
      低い木の腰掛け。灰褐色、膝の高さ。台帳の脇。
      s09/s10a は空、s10b で花が座る。
    negative:
      - "a back"
      - "an armrest"
      - "a cushion"
      - "a table"
      - "a chair with a back"

# 変化点だけを持つ。全ショットは並べない。変化点の間は直前の状態が続く。
# 第3話の二点は開示ではなく伏線（form-only）。意味（半身）は第9話まで言わない。
disclosure:
  - shot: ukebi-v3-ep01-15-s13
    喉.留まり: present
    negative: covered
  - shot: ukebi-v3-ep02-32-s16
    印.片方薄い: present
    negative: covered
    # form_only: true —— 開示ではなく伏線。意味（半身）は第9話まで言わない。
  - shot: ukebi-v3-ep04-14-s10b
    花.席: present
    negative: covered
  - shot: ukebi-v3-ep06-09-s07
    花.測れない: present
    negative: covered
  - shot: ukebi-v3-ep06-14-s12
    花.該当なし: present
    negative: covered
  - shot: ukebi-v3-ep06-22-s19b
    花.印なし: present
    negative: covered
  - shot: ukebi-v3-ep07-22-s14c
    判.押される: present
    negative: covered
  - shot: ukebi-v3-ep07-23-s15a
    印.片側が薄い: present
    negative: covered
    # form_only: true —— 開示ではなく伏線。意味（半身）は第9話まで言わない。
  - shot: ukebi-v3-ep08-23-s14
    印.裂けた縁: present
    negative: covered
    # form_only: true —— 第9話「半身」の伏線。
  - shot: ukebi-v3-ep09-17-s10
    花.半身: present
    negative: covered
  - shot: ukebi-v3-ep09-20-s13
    折れ目.一致: present
    negative: covered
    # form_only: true —— 初頁の折れ目と花が同じ画面（形の一致）。
  - shot: ukebi-v3-ep10-24-s22
    花.名: present
    negative: covered
  - shot: ukebi-v3-ep10-31-s29
