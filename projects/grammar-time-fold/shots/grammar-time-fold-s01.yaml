# 第一ショット / 情景 / motion —— 100年が、1つの枠を通り抜ける
#
# ⚠️ **この作品には、この1本しか無い。**
#    前のショットも次のショットも無い——**ゆえに `L10` は註で
#    「先行する §18 を持つショットが無い」と言う。****違反ではない。**
#
# ⚠️ **このショットの出典は、形式カード `time-fold` の4つの欄である。**
#      `PLACE`   ＝動かない場所——海に突き出た一枚岩
#      `PASSES`  ＝時がそれにすること——100年分の波が、前を通り過ぎる
#      `SURVIVOR`＝**岩そのもの。** 周りのすべてが変わるあいだ、これだけが変わらない
#      `RANGE`   ＝**100年**
#    **⚠️ カメラは錨である。** 場所は保たれる——**離れて戻ることは、2つ目のショットである。**
#
# ⚠️ **このショットの折り目は1つである。**「100年が、1つの枠を通り抜ける。」
#    **それ以外のことは何も起こらない**——人物も、場所の移動も、光の切り替えも無い。

shot: grammar-time-fold-s01
spec: specs/video/shot-01-rock.md

# ⚠️ **`key_image` を置かない。** この作品の画像の経路はまだ1度も走っていない
#    （`ledger.yaml` の `一枚岩.base` は「未作成」である）。
#    ⚠️ **空の `key_image:` を書けば「画像の仕様が在って空」になる。**
#       **書かないことは、無いことである。**
#    ⚠️ **`L18` はこの不在を1件の註に畳んで報告する**——
#       「記録が無いのであって、食い違っているのではない」。

aim: >-
  **形式カード `time-fold` を1度だけ実際に使う。** 100年が、切られずに1つの枠を通り抜ける——
  **カメラは動かず、岩だけが変わらない。**
  ⚠️ この試しが成り立たなければ、**7枚の文法のうちの1つが、この基盤では立てない**ことになる。
  ⚠️ **確かめているのは文法が効いたかどうかではない。** 文法を仕様に落とせたかどうかである。

unit:
  before: "**海に突き出た一枚岩がある。** 波がその下にあり、水平線が上三分の一にある。**まだ何も起きていない。**"
  after: "**同じ岩が、同じ場所に立っている。** 周りの海と陸は削られ、その上に鳥が一羽降りている。"

# ⚠️ **種別は `情景` である。** 固有基準は「その場所が、その時刻に、そこに在ること」——
#    **この1本が裁かれるのは、それである。****人物は裁かれない**（居ない）。
role: 情景

place: 一枚岩

# ⚠️ **時刻ではなく、幅を持っている。** 空欄ではない——**このショットが跨ぐのは100年である**
#    という宣言である（`bible.yaml`「時代が無い」が、これを年代に固定しない）。
#    ⚠️ **100年は時刻語ではない**——`L3` の8族のどれでもない。
time: 100年

# ⚠️ **`motion` である**——`mode` の意味は「**主題が動くか**」である。
#    主題は岩であり、**岩は動かない。** しかしこのショットの運動は主題の外に在る——
#    **波が動き、光が動き、100年がこの枠を通り抜ける。**
#    ⚠️ **ゆえに `still` ではない。** `still` は「主題が停まる」ではなく
#       **「画面が凍る」**——このショットは1秒も凍らない。
mode: motion

duration: 10s

# ⚠️ **運動の層は、この作品の折り目そのものである。**
motion:
  subject: 海に突き出た一枚岩
  quality: >-
    **岩は動かない。** 動くのは、岩を囲むすべてである——波、光、海面、遠くの陸。
    **100年が、この枠を左から右へ通り過ぎていく。** 岩はその間じゅう同じ場所に立ち、
    **削られない**——周りが全部削られるのに、これだけが削られない。
    最後の1秒、**鳥が一羽降りる。**
  law: >-
    landscape-photo の物理。**f/64 の深い焦点**——手前の岩も、遠くの水平線も、等しく鋭い。
    **ゆえに、どこで起きた動きも、同じ大きさで見える**——遠くの陸が削られることも、
    足元の波が返ることも、この枠では同じ強さを持つ。**カメラは据えられ、追われない。**
    ⚠️ **様式カードは `SVL_STYLES_DIR=references/styles` を張らねば読まれない。**

beats:
  - range: 0-3s
    density: sparse
    what: >-
      **岩がある。海がある。空がある。** 波が岩の下で返している。
      **まだ何も起きていない**——この3秒は、経過が始まる前の枠である。
  - range: 3-7s
    density: held
    what: >-
      **時が、この枠を通り抜ける。** 波が幾度も岩に当たり、そのたびに海の色が変わる。
      光が動き、雲が入れ替わる。**留まるのは岩だけである。**
      **この4秒が、このショットの主題である。**
  - range: 7-9s
    density: dense
    what: >-
      **周りが削られていく。** 海が痩せ、遠くの陸が低くなり、波の当たり方が変わる。
      **岩の面だけは、削られない**——100年が、ここだけを触らずに通り過ぎていく。
  - range: 9-10s
    density: held
    what: >-
      **鳥が一羽、降りる。** 岩の上に止まり、動かない。
      **100年という幅が、この1羽によって、事後に届く。**

# ⚠️ **参照画像は1枚も無い。** ゆえに集合は空である——
#    **空を書くことは、書き忘れではない。**（`ledger.yaml` の `一枚岩.base` を見よ）
#    ⚠️ **`attached` を書く。** 欄そのものが無いと `L6` は
#       「記録が無い」と註で言う——**この作品は記録できる：渡していない。**
reference_set: []
attached: []

forbidden_set:
  - カメラの移動
  - ズーム
  - 日付
  - 字幕
  - 人物
  - 船
  - 建物
  - 2羽目の鳥
  - 嵐
  - 読み取れる文字

# ⚠️ **開示の変化点は、この1本である。** 台帳の `disclosure` が
#    「**岩の前を、100年が通り過ぎた**」をこのショットに置いている——
#    **この作品で観客が知る唯一のことは、経過そのものである。**
#    ⚠️ **台帳と一致していなければならない**（`L7a` = 早すぎる開示／`L7b` = 台帳が予測していない）。
disclosure_state:
  一枚岩.歳月: 100年
