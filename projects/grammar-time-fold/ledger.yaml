# 制作台帳 — 一枚岩（grammar-time-fold）
#
# ⚠️ **人物は居ない。** この作品の登場物は岩と海と空と鳥1羽であり、
#    どれも人物ではない——**ゆえに `characters: {}` である。**
#    ⚠️ **この空は空欄ではなく作品の内容である。**
#       §2 の規則「**この作品に、人物は居ない。**」が、台帳の側で同じことを言っている。
#
# ⚠️ **開示の変化点は1つ在る。** この作品で観客が知るのは、
#    **岩の前を100年が通り過ぎたということ**である。
#    それは最後の1秒、鳥が降りた瞬間に、事後として届く——
#    **100年という幅は、過ぎてみるまで見えない。**

# ⚠️ **人物は居ない。** 生成へ渡る参照のうち、人物に由来するものは1つも無い。
characters: {}

locations:
  一枚岩:
    # ⚠️ **この作品の唯一の場所である。** 海に突き出た岩——
    #    カメラはここから動かず、**ゆえにこの場所は離れられない。**
    #    `base` は基準画像を指す。
    #    ⚠️ **まだ作られていない。** **「無い」と書くことは、書き忘れではない。**
    base: >-
      **未作成。** この作品は**生成の前に書かれた**——`media/` は空である。
      最初の1枚は、著者が画像の経路を1度走らせたときにここへ入る。
      ⚠️ **この1枚は、動画へ渡すためではない**（`reference_set` を見よ）。
      **岩と海と空の見た目は、§3 と §4 の文が固定する。**

    # ⚠️ **`geography` は「位置関係を示すボード」。**
    #    この作品の位置関係は1つだけである——**岩が手前に在り、海がその周りに、
    #    空が上にある。****この関係は100年のあいだ動かない。**
    geography: >-
      **岩は枠の下三分の一に立ち、水平線は上三分の一にある。**
      岩の周りは海であり、**海の向こうには何も無い。**
      ⚠️ **この構図は100年のあいだ保たれる**——**変わってもよいのは、
      岩を囲むもののほうであって、岩の位置ではない。**

    states: {}

# ⚠️ **開示の変化点は1つである。**
#    「**岩の前を、100年が通り過ぎた**」——**この作品で観客が知る唯一のことは、
#    経過そのものである。**
#    ⚠️ **`negative: changed` は「この変化点で §18 の Negative が動いた」の意味である。**
#       この作品には先行するショットが無いので、`L10` は**註**で
#       「先行する §18 を持つショットが無い」と言う——**違反ではない。**
#       **「変わった」を言える相手が、まだ居ないのである。**
disclosure:
  - shot: grammar-time-fold-s01
    一枚岩.歳月: 100年
    negative: changed
