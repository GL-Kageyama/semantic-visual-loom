# プロモーション 第二ショット / 所作 / motion —— 布の上で、指が止まる
#
# **出典**
#   拍は **`expression.md` の第二の拍**である。「**②指が布の上で止まる。**」
#
#   出所: run-10 層——`名札を留める前に、布の上から姓の三文字を指でなぞる`（**著者決定により採用**）／
#         run-10 第一巻 第3話「三文字をなぞる」——`名札は胸の左に着ける。`／
#         run-09 第3話の癖——`自分の名札を、毎朝一度読み返す。`
#         run-10 の註——「**動きの本体は手である。動かない場所で、手だけが動く。**」
#
# ⚠️ **これが、この作品の中心である。**（決定 2026-09-18 の四つとは別に、この一段が選んだ）
#    親の `bible.yaml` は「**手が先にあり、顔が後に来る。順序は入れ替えない**」と書く。
#    **この二十八秒の中で、手だけが主題を持つショットは、ここである。**
#    ゆえにこのショットは、五つの中で最も長い——**七秒。保持は、長さでできている。**
#
# ⚠️ **完了しない。**（run-10【動きの単位】——「この作品の運搬は一度も完了しない」）
#    留め具は、**まだ閉じない。** 閉じれば、名札は留まり、名は彼女のものになる——
#    **この作品が二十八秒かけて言わないことは、それである。**

shot: habits-promo-chinatsu-s02
spec: specs/video/shot-02-cloth.md
# ⚠️ **この1枚は、このショットの動画へ添付（参照画像）として渡る**——最初のコマではない。
#    ⚠️ **写すのは `after` の側である**——**指が止まったところ**であって、なぞっている最中ではない。
#       `§7` の Peak はなぞる最中だが、**§17 第一位が「The stop is the content」と書く。**
key_image: specs/image/shot-02-cloth.md

unit:
  before: 名札が、胸の左にある。**手は、まだ上がっていない。**
  after: "**布の上で、指が止まっている。** 三文字が、布の下にある。**留め具は、まだ閉じない。**"

# 所作——**この一変化は、手が運び、止まることである。**
# 固有基準は「所作の明瞭さ・変化の一点性・引きの強さ」。**変化は一点である——指が止まる、その一点。**
role: 所作

place: 名札

time: 2026年の勤務日の日中

mode: motion

duration: 7s

motion:
  subject: 碓氷千夏の右手
  quality: >-
    手が上がり、**布の上から姓の三文字をなぞり、止まる。**
    ⚠️ **なぞるのは、布の上である**——指と字のあいだに布がある。**字は見えない。**
    ⚠️ **完了しない**——留め具はまだ閉じない。止まるのは**指**であって、動作ではない。
  law: >-
    luminous-anime の物理。**止まるのは主題であって、画面ではない**——蛍光灯の下で、
    埃と光は動き続ける。⚠️ 様式カードの中身は `distill-essence-engine` に在る。

beats:
  - range: 0-4s
    density: sparse
    what: >-
      胸の左。**手が入り、上がる。** 名札の上に、指が置かれる。
      ⚠️ **顔は下を向いている。** 第一ショットで既に呼ばれているので、顔は置いてよい——
      ただし**このショットの主題は手である。顔は主題を持たない。**
  - range: 4-7s
    density: held
    what: >-
      **三文字をなぞる。そして、止まる。** 布の下の字は、一度も見えない。
      **留め具は、まだ閉じない。** 紙と手の音だけが在る。

reference_set:
  - 碓氷千夏.identity
  - 碓氷千夏.negatives
  - 名札.base
  - 名札.geography

