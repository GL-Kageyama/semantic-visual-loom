  - 碓氷千夏.negatives
  - 名札.base
  - 名札.geography

# ⚠️ **このショットに変化点は無い**（台帳の `disclosure` は第一・第四ショットだけを挙げる）。
#    だが `disclosure_state` は「**このショットが実際に持つ状態**」である——
#    **変化点ではないことは、状態を持たないことではない。**
#    ⚠️ **`{}` と書けば、「このショットは開示の状態を一つも持たない」という別の主張になる。**
disclosure_state:
  名札.姓: present
