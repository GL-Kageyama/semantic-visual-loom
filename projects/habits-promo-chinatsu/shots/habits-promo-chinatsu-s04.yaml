# プロモーション 第四ショット / 所作 / motion —— 名の書かれた位置から、半歩下がる
#
# **出典**
#   拍は **`expression.md` の第四の拍**である。「**④名の書かれた位置に、半歩下がって立つ。**」
#
#   出所: 台帳 `人物/メイン/01_碓氷千夏.md` 変化弧——「碓氷千夏が訊く。訊いた後、
#         **名の書かれた位置から半歩下がる。**「私」は残る。」／
#         run-05 姿勢——`立つとき常に半歩下がるので、写真ではいつも他人の肩の後ろから顔だけが出る。`／
#         run-09 第14話「空いたまま」の癖——`名の書かれた位置に、もう一度立つ。`
#
# ⚠️ **このショットで、作品は紙へ移る。** 第一から第三は、**彼女が身につけている名**の現場だった。
#    ここは、**紙に書かれた名**の現場である。**この移動が、この作品の唯一の場所の変化である**
#    （`ledger.yaml` の場所の註）。
#
# ⚠️ **半歩は、下がりきらない。**
#    `expression.md` の「③翻訳」——「**四番目の半歩は、まだ下がりきらない。**」
#    ゆえに `unit.after` は「半歩下がって立っている」ではなく、**「まだ下がりきっていない」である。**
#    ⚠️ **下がりきれば、この作品は終わってしまう**——**この作品の終わりは、第五ショットである。**
#
# ⚠️ **紙は映るが、読めない。**（`no legible name text`——この作品で承認された）
#    **見せないのではない。見せて、読めないのである。** それが第五ショットへの橋になる。

shot: habits-promo-chinatsu-s04
spec: specs/video/shot-04-half-step.md
# ⚠️ **この1枚は、このショットの動画へ添付（参照画像）として渡る**——最初のコマではない。
#    ⚠️ **五枚のうち、全身を写す唯一の一枚である。** ✅ **下半身はスカートである**
#       （決定 2026-09-18、著者。経緯は画像仕様のヘッダ）——**ゆえにこの一枚にだけ、
#       スカートが肯定形で書かれている。他の四枚は枠に入らないので、書かない。**
key_image: specs/image/shot-04-half-step.md

unit:
  before: 名の書かれた紙の前に、**まっすぐ立っている。**
  after: "**半歩下がり、まだ下がりきっていない。重心は、後ろ足に移っている。**"

role: 所作

# 第四・第五ショットの記名の現場。**紙に書かれた名**（`ledger.yaml`）。
place: 出席簿の転出欄

time: 2026年の勤務日の日中

mode: motion

duration: 7s

motion:
  subject: 碓氷千夏の全身と、後ろ足
  quality: >-
    **一歩ではなく、半歩である。** 出典は`半歩`とだけ書く——**その距離は決まっていない。**
    ⚠️ **完了しない。** 下がりきる前で止まる。**重心の移動だけが、残る。**
  law: >-
    luminous-anime の物理。**止まるのは主題であって、画面ではない**——蛍光灯の下で、
    埃と光は動き続ける。⚠️ 様式カードの中身は `distill-essence-engine` に在る。

beats:
  - range: 0-4s
    density: sparse
    what: >-
      机の上の出席簿。**開かれた頁。転出欄。** 彼女が、その前に立っている。
      ⚠️ **欄は記入済みだが、判読できない**——紙の上に在るのは**名の印であって、名ではない。**
  - range: 4-7s
    density: held
    what: >-
      **半歩、下がる。そして、まだ下がりきらない。** 後ろ足に荷重が移る。
      紙と手の音だけが在る。

