# プロモーション 第五ショット / 反応 / still —— 彼女は、こちらを見る
#
# ✅ **このショットが、この作品の唯一の免除である。**（決定 2026-09-18、著者）
#
#    **彼女は、こちらを見る。**
#
#    ⚠️ **本編の規則はこう書く**——「**作中の人物は、自分が映像の中にいることを知らない**」
#       （run-10【アニメ化を前提とする、その意味】）。
#       **この一変化だけが、その規則を免れる。**
#
#    ⚠️ **免除が一箇所であることは、記録の側で保たれている。**
#       この語は、この作品の**どこにも現れない**——他の四つのショットにも、
#       `bible.yaml` の `negative_base` にも、`ledger.yaml` にも無い。
#       **ここにしか無い。** **それは、この一段が保つ約束である。**
#
#    ⚠️ **このショットは、著者の指定（四ショット）からはみ出した一枚である**（`bible.yaml`「尺」）。
#       理由は固定方針「**The shot is the unit. One shot exists for one change**」——
#       **免除は、四つの拍のどれでもない五つ目の変化である。**
#       **四つ目に足せば、免除はショットの中に埋もれ、数えられなくなる。**
#       ⚠️ **著者の指定に戻すことは可能である**——そのとき免除は、第四ショットの末尾へ移る。
#
# ⚠️ **これは規則の破れではなく、規則が置いた席である。**
#    run-10:71——「**作品の外に、はじめて掛け声をかける者が現れる。ただし、作中では最後まで
#    発音されない。外で発音されることは、内で発音されないことを打ち消さない。
#    代償は消さずに持つ。**」
#    **この作品は、その「外」である。** ゆえにこの視線は、作品の外からの掛け声への、唯一の返事である。
#    ⚠️ **まだ、名は発音されていない。** この視線は、名を呼ばずに返している。

shot: habits-promo-chinatsu-s05
spec: specs/video/shot-05-gaze.md
# ⚠️ **この1枚は、このショットの動画へ添付（参照画像）として渡る**——**最初のコマではない。**
#    ⚠️ **最初のコマにすれば、彼女は最初からこちらを見ている**——**三秒の待ちが消える。**
#    ✅ **この1枚が、この作品の唯一の免除を写す。** 五枚のうち、レンズを見るのはこれだけである
#       ——**画像の経路が戻ったことは、免除を増やしていない。**
key_image: specs/image/shot-05-gaze.md

unit:
  before: 半歩下がった位置で、**視線は名の書かれた紙にある。**
  after: "**彼女が、こちらを見ている。**"

# 反応——**この一変化は、視線が上がるその一点である。**
# 固有基準は「抑制・微細な身体・表情の段階」。**このショットは、抑制だけでできている。**
role: 反応

place: 出席簿の転出欄

time: 2026年の勤務日の日中

# ⚠️ **`still` である。**意味は「**主題が止まる**」——動くのは光と埃だけ、ではない。
#    **このショットで動くのは、視線である。** 主題（彼女）は止まったまま、視線だけが上がる。
#    ⚠️ **種別の既定は `still` であり（`rolemap` の `反応`）、ここでは既定に従っている。**
#       食い違いではない。**判断である。**
#    ⚠️ **`still` の生命線は微細運動である**（`rolemap.MOTION_PATTERNS` の `微細運動`——
#       「事象なき存在感・繊細さ」）。**この二十八秒の最後の一変化が、まさにそれである。**
mode: still

duration: 5s

motion:
  subject: 碓氷千夏の視線
  quality: >-
    紙から、**レンズへ。** 速くない。**止まる時間のほうが長い。**
    ⚠️ **顔は、呼ばれた後にだけ置かれる**——彼女は第一ショットで呼ばれている。**順序は守られている。**
  law: >-
    luminous-anime の物理。**止まるのは主題であって、画面ではない**——蛍光灯の下で、
    埃と光は動き続ける。⚠️ 様式カードの中身は `distill-essence-engine` に在る。

beats:
  - range: 0-3s
    density: held
    what: >-
      **動かない。** 半歩下がった位置。**紙を見ている。** この三秒は、**ためである。**
  - range: 3-5s
    density: held
    what: >-
      **視線が上がり、レンズに止まる。** 表情は変えない——
      **笑わない。怖がらない。問わない。**（`prompt.md`⑨——「恐怖もかわいいも出さない」）
      **見るだけである。**

