# 制作台帳 — 学習机（grammar-coexisting-realities）
#
# ⚠️ **⚠️ 人物は1人である。** 枠の中には**二人**座っているが、
#    台帳に立つのは**1人**である——**同一の人物が二つの実在に立っている**からである。
#    **これはこの作品の要である。** カードは言う——「**二つ以上の実在に立つ担い手を名指せ。
#    ゆえに共存は主張ではなく、見える。**」
#    ⚠️ **人物を2人立てたら、この作品は「似た二人」の話になる。** それは別の文法である。
#
# ⚠️ **⚠️ 外見は肯定形で書く**（`docs/h3-route.md` の制約8）。
#    「書かなければ空白のまま残る」のではない——**空白は埋められる。
#    既定は中立ではない。****名前を書かないことは決定である。
#    外見を書かないことは決定ではない。**
#    ゆえに下の `identity` は、**二つの齢の姿を、同じ人物として具体的に書く。**
#    ⚠️ **これは経路の制約であると同時に、この作品の文法そのものでもある**——
#       **同一性は、顔から読めなければならない。**
#
# ⚠️ **開示の変化点は1つ在る。** この作品で観客が知るのは、
#    **枠の中の二人が同一の人物である**ということである。
#    それは**眉の上のほくろと、机の上の消しゴム**によって届く——
#    **消しゴムは二度描かれない。****ほかのすべては二度ある。**

characters:
  自分:
    # ⚠️ **この人物は1人である。****二つの齢に分かれて立っているだけである。**
    #    ⚠️ **両方に同じ特徴が要る。** 分け目、眉の形、左の眉の上の小さなほくろ、
    #       そして**右手**——**この4つが、二人を一人に畳む。**
    identity: >-
      **同一の人物の、二つの齢。**
      **〔小学1年〕** 短く切った髪を真ん中で分けている。白い半袖のシャツ、
      半ズボン、裸足。**椅子の上で両膝を立てて座り**、右手に鉛筆を持っている。
      **〔40歳〕** 同じ分け目の髪を、両側だけ短くしている。紺の作業シャツの袖を
      一度折り返し、**椅子に直角に座り**、両足を床につけている。
      同じ手を、机の上に平らに置いている。
      ⚠️ **二人に共通するもの**——**同じ分け目、同じ眉の形、
      左の眉の上の同じ小さなほくろ、そして同じ右手。**
      ⚠️ **この4つは、どちらの齢でも同じ位置にある。** 片方だけに書いてはならない。
      ⚠️ **二人は互いを見ない。** 気づかないのでも、避けるのでもない——
      **それぞれが自分の机の上を見ている。**

locations:
  学習机:
    # ⚠️ **この作品の唯一の場所である。** 同じ机が、枠の中に二度立っている。
    #    カメラはここを出ない——**しかも動かない。**
    #    `base` は基準画像を指す。
    #    ⚠️ **まだ作られていない。** **「無い」と書くことは、書き忘れではない。**
    base: >-
      **未作成。** この作品は**生成の前に書かれた**——`media/` は空である。
      最初の1枚は、著者が画像の経路を1度走らせたときにここへ入る。
      ⚠️ **この1枚は、動画へ渡すためではない**（`reference_set` を見よ）。
      **机と二つの部屋の見た目は、§2 と §4 の文が固定する。**

    # ⚠️ **`geography` は「位置関係を示すボード」。**
    #    この作品の位置関係は1つだけである——**机が二度、重なって並び、
    #    その重なりの上に消しゴムが1つ在る。**
    #    ⚠️ **⚠️ 分ける線は無い。** カードの `avoid` が
    #       「分割画面と、それを分ける線」を禁じている——
    #       **二つの机は、線で分けられずに重ねられる。**
    geography: >-
      **左の机が少し奥に、右の机が少し手前に、重なって置かれている。**
      二人はそれぞれ自分の机の前に座り、**互いに背を向けてはいない**——
      **同じ側を向いて、同じ机の面を見ている。**
      ⚠️ **二つの机のあいだに線は引かれない。** 机の天板は連続して見え、
      **重なりの上に、消しゴムが1つだけ在る。**
      ⚠️ **この消しゴムは二度描かれない。** **ほかのすべての物は二度ある。**

    states: {}

# ⚠️ **開示の変化点は1つである。**
#    「**枠の中の二人は、同一の人物である**」——**この作品で観客が知る唯一のことは、
#    その1点である。**
#    ⚠️ **`negative: changed` は「この変化点で §18 の Negative が動いた」の意味である。**
#       この作品には先行するショットが無いので、`L10` は**註**で
#       「先行する §18 を持つショットが無い」と言う——**違反ではない。**
disclosure:
  - shot: grammar-coexisting-realities-s01
    自分.同一性: 両方に立つ
    negative: changed
