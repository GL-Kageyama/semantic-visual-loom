# 第一ショット / 総覧 / motion —— 同じ机が、二度、同時に立つ
#
# ⚠️ **この作品には、この1本しか無い。**
#    前のショットも次のショットも無い——**ゆえに `L10` は註で
#    「先行する §18 を持つショットが無い」と言う。****違反ではない。**
#
# ⚠️ **⚠️ このショットは `MINIMAX H3` の経路で書かれている。**
#    形式カード `coexisting-realities` は**経路によって到達可能性が変わる唯一のカード**である——
#    **`WAN 3.0` では正面衝突**（連続テイク1本は二つの場所を持てない）。
#    **`H3` では衝突ではない**（各コマがそれ自体で1つのシーンであり、
#    **1つのショットが複数の場所を正当に持つ**）。
#    ⚠️ **§18 の見出しが `MINIMAX H3` を名乗ることで、経路が決まる。**
#
# ⚠️ **⚠️ `L2` はこの経路では鳴らない。****それは通ったのではない。**
#    この層は台帳の `place` 1つを読み、§10 も §18 も開かない——
#    **見るものが無い。****何も見なかった層は、通った層とまったく同じに見える。**
#    **荷は仕様が負う。**
#
# ⚠️ **このショットの出典は、形式カード `coexisting-realities` の4つの欄である。**
#      `REALITIES` ＝**小学1年の自分の机と、40歳の自分の机。**どちらも、いまである
#      `BEARER`   ＝**自分。**同一の人物が、両方に座っている
#      `SHARED`   ＝**消しゴム1つ。**ほかのすべては二度ある
#      `ORDER`    ＝**重ねて並べる。****分ける線は引かない**
#
# ⚠️ **⚠️ §15 が免除を許されるのは、枠自身の場所と時刻だけである。**
#    同一性・描画の法・光の法・音は、**この1本のあいだ保たれる。**

shot: grammar-coexisting-realities-s01
spec: specs/video/shot-01-desk.md

# ⚠️ **`key_image` を置かない。** この作品の画像の経路はまだ1度も走っていない。
#    ⚠️ **空の `key_image:` を書けば「画像の仕様が在って空」になる。**
#       **書かないことは、無いことである。**
#    ⚠️ **`L18` はこの不在を1件の註に畳んで報告する**——
#       「記録が無いのであって、食い違っているのではない」。
#    ⚠️ **この経路は絵コンテを渡す経路である**（`docs/h3-route.md`）。
#       しかし**板はまだ1枚も描かれていない**——**`specs/board/` も作らない。**

aim: >-
  **形式カード `coexisting-realities` を1度だけ実際に使う。** 同じ学習机に、
  **小学1年の自分と40歳の自分が、同時に座っている。**
  **どちらも、いまである**——**古いほうが先ではない。**
  **机の上で、消しゴムだけが1つしかない。**
  ⚠️ この試しが成り立たなければ、**7枚の文法のうちの1つが、この基盤では立てない**ことになる。
  ⚠️ **確かめているのは文法が効いたかどうかではない。** 文法を仕様に落とせたかどうかである。

unit:
  before: "**学習机がある。** 誰も座っておらず、**机の上には何も無い。**"
  after: "**同じ机の前に、小学1年の自分と40歳の自分が、同時に座っている。** 机の上には、**消しゴムが1つだけ在る。**"

# ⚠️ **種別は `総覧` である。** 固有基準は「**順序の明瞭さ・全体が一つの動きとして読めるか**」——
#    **この1本が裁かれるのは、まさにそれである。****二つの実在の順序が明瞭であり、
#    枠の全体が1つの動きとして読めるか。**
role: 総覧

place: 学習机

# ⚠️ **「昭和といま」である。****これは時刻語ではない**——ゆえに `L3` の族を増やさない。
#    ⚠️ **それでもこの欄が要るのは、このショットが二つの時刻を同時に持つからである。**
#       **単数に見えるが、内容は「どちらも、いま」である。**
#    ⚠️ **§15 が免除するのは、まさにこの1点である。**
time: 昭和といま

# ⚠️ **`motion` である。** 様式カード `impossible-medium` が言う——
#    「**静止は手に入らない。** 一致しない二つの法に支配された枠は、休めない。
#    **少なくとも1つの属性が、他方の媒体が持たない法の下で、常に動いている。**」
#    動くのは**写真の光**であり、**描かれた輪郭は止まっている。**
mode: motion

duration: 10s

# ⚠️ **運動の層が、この枠の法そのものである。****動きは対象ごとではなく、属性ごとに決まる。**
motion:
  subject: 学習机の上を進む、写真の光
  quality: >-
    **二つの実在が並んで立ち、どちらも先ではない。****同じ机が二度ある。**
    **消しゴムだけが、一度しか描かれない。**
    **描かれた輪郭は止まり、写真の光だけが動き続ける**——
    **同じ対象が、二つの時計を同時に持っている。****どちらも、間違っていない。**
  law: >-
    impossible-medium の物理。**一つの枠を二つの法則が分け合い、両者は一致しない。**
    **輪郭は描画の法で止まり、光は写真の法で進む**——机の艶の反射が滑り、
    影の縁がわずかに伸び、**窓の映りが消しゴムを横切る。**
    ⚠️ **継ぎ目は主題である。** 影の縁ごとに法が変わる——**そこが、この枠の出来事である。**
    ⚠️ **様式カードは `SVL_STYLES_DIR=references/styles` を張らねば読まれない。**

beats:
  - range: 0-3s
    density: sparse
    what: >-
      **同じ机の天板が、枠の中に二度ある。** 左に、小学1年の自分の机。
      右に、40歳の自分の机。**二人が、それぞれの前に座っている。**
      ⚠️ **どちらも、いまである**——**古いほうが先ではない。**
  - range: 3-6s
    density: dense
    what: >-
      **二人が、同じ分け目の髪をしている。** 同じ眉の形、左の眉の上に同じ小さなほくろ、
      **そして同じ右手。****この4つが、二人を一人に畳む。**
      ⚠️ **二人は互いを見ない。** それぞれが、自分の机の面を見ている。
  - range: 6-9s
    density: dense
    what: >-
      **机の上に、消しゴムが1つだけ在る。****それは二度描かれない**——
      **二つの机が重なる場所に、一度だけ置かれている。**
      ⚠️ **ほかのすべては二度ある。****鉛筆も、ノートも、机の傷も、二度ある。**
  - range: 9-10s
    density: held
    what: >-
      **描かれた輪郭は止まったまま、写真の光だけが進み続ける。**
      机の艶の反射が、**ゆっくりと消しゴムを横切って、そこを離れる。**
      ⚠️ **どちらの実在も、終わらない。****どちらも、先ではない。**

# ⚠️ **参照画像は1枚も無い。** ゆえに集合は空である——
#    **空を書くことは、書き忘れではない。**（`ledger.yaml` の `学習机.base` を見よ）
reference_set: []
attached: []

# ⚠️ **無条件の `no cut` を書かない**（`docs/h3-route.md` の制約3）。
#    **コマが場所を変える唯一の合法的な道を、無条件の禁止は閉じてしまう。**
#    このショットでは**どのコマも場所を変えない**——ゆえに切る必要が無い。
forbidden_set:
  - 実在のあいだのカット
  - 実在のあいだのディゾルブ
  - 分割画面と、それを分ける線
  - 古いほうを過去にする色調
  - 年代を名乗る文字
  - 年齢メイク
  - どちらかの人物の透け
  - 二人のあいだの気づき
  - 一方から他方への変形
  - カメラの移動
  - 読み取れる文字

# ⚠️ **開示の変化点は、この1本である。** 台帳の `disclosure` が
#    「**枠の中の二人は、同一の人物である**」をこのショットに置いている——
#    **ほくろと、消しゴムが、それを届ける。**
#    ⚠️ **台帳と一致していなければならない**（`L7a` / `L7b`）。
disclosure_state:
  自分.同一性: 両方に立つ
