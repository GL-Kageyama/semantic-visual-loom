# 『未現像』第8章「対峙」 / 対話 / still —— 背で受けて、息をひとつ、置く
#
# **出典**
#   本文は `soul-voice-teller/examples/migenzo/草稿/draft_08-3_娘さえ.md`——
#   「その者は言う。あなたは娘を、二十年、暗室の引き出しのなかに置いてきた。……
#   **その者の言いかたは、ゆっくりだった。ゆっくり、ひとつひとつことばを置くように、言っていた。
#   置かれたことばが、絹の二十年の暗室の床に、ひとつずつ落ちて、並んでいた。**」／
#   `draft_08-1_対峙.md`「**絹はその沈黙のなかに立つ。**……沈黙というものが、四人のからだのあいだの
#   空気をすこし重くしていて、その重さのなかに、絹は立っていた」／
#   `draft_08-4_決意.md`「**絹はその者を振り返らない。**……**うしろの四人の視線を、
#   絹は背で受けている。**……**四人は動かない。動かないまま、絹の背を見送っている。**」
#   ⚠️ **この1本が見せる「二十年」は `draft_01-1_白い紙.md` が置いた**——
#   「**絹は息を浅くしている。**……**肩が、わずかに、上がったままになる。**
#   頭のなかで、数を数えている。いち、に、さん。**その数えかたが、二十年、変わらない。**」
#
# ⛔ **この記録は ② design のものである**（`PLAN.md` §3 手順1・2、2026-09-23 著者裁定）。
# ⚠️ **この記録は §1–20 を持たない。** 仕様は `spec:` の先である。
#
# ⛔ **この1本の変化は `絹.決意 → 定まった` である**（`PLAN.md` §2）。
#   ⚠️ **値は `定まった`**——`ledger.disclosure` の註——「**決めた**」ではない。
#   **決めるのは絹であり、この1本が置くのは、向かう先が定まったことである。**
#   ⛔ **ゆえに、この1本に「選ぶ」動作を置かない。** **選ぶのは次である**（`draft_08-4`
#   「沈めるという選択が、いま絹のなかで、**ゆっくりかたちをとる**」）。
#
# ⛔ **この1本は `still` である**（`PLAN.md` §1）。⚠️ **そして、それは偶然ではない**——
#   **決意が定まることは、行為ではない。** ⚠️ **この摘要版は、ここで溜めに入る**——
#   `PLAN.md` §1「山の作り方」の第2段——「**09・10（8s＋10s）** — **言葉と、宙づり。**」
#   ⛔ **ゆえに、この1本では、絹は何もしない。**
#   ⚠️ **そして、この1本の変化は、観客の側にも在る**——`PLAN.md` §2
#   「**最後の暗室へ向かう**」。⛔ **この摘要版では、その部屋は、いま立っている部屋である**（§0-e）——
#   **ゆえに「向かう」は、この1本では方向として現れる。**
#
# ⚠️ **この1本の可視の担い手は、息である——これは ② の延伸であり、申告する。**
#   ⚠️ **`draft_01-1` は「肩が、わずかに、上がったままになる」を、現像のあいだの癖として置いた**
#   （「その数えかたが、二十年、変わらない」）。⛔ **原文は、この癖を第8章に置いていない。**
#   ⛔ **だが、`still` の1本は、可視の担い手を必要とする**——
#   基盤の註「**止まるのは主題であって、光と粉塵と液は動く**」。
#   ⚠️ **そして、原文の第8章の行為は「歩き出す」である**（`draft_08-4`）——
#   ⛔ **`still` はそれを撮れない。** ⚠️ **ゆえに ② は、原文が第1章に置いた癖を、
#   この1本の担い手として借りる。** ⛔ **借りたこと、ここに書く。**
#   ⚠️ **読みかたを固定しておく**——**下がるのは、二十年、浅く保たれてきた息であって、
#   背ではない。** ⛔ **背が曲がれば、それは諦めである。** **この1本は、諦めを撮らない。**
#
# ⛔ **この1本の台詞は、置かれない**（`PLAN.md` §0-f）——
#   「**第8章の一行（「あなたの見ないことは、誰かを崩壊させてきた」／「あなた自身の娘さえ」）は、
#   置かない。**」⚠️ **音声は全て捨てられるからである。**
#   ⚠️ **ゆえに、この1本は「語られている」ことを別のもので示す**——
#   `draft_08-3`「**ことばが、……ひとつずつ落ちて、並んでいた**」。
#   ⛔ **字幕を出さない**（`bible.negative_base`——`no on-screen subtitles`）。
#   **語りは、暗さと、動かないことと、時間で示される。**
#
# ⛔ **この1本の戸口に立つ者は、ひとりである——これは圧縮であり、申告する。**
#   ⚠️ **原文は四人である**（`draft_08-1`「三人がうしろに立っている」＋最初の一人）。
#   ⛔ **この摘要版は、二人目・三人目の鍵を作らない**（`PLAN.md` §0-g）——
#   **鍵の無い者を画面に立てれば、生成器は毎回ちがう顔を作る。**
#   ⚠️ **そして、顔の描かれない者が四人並べば、その危険は四倍になる。**
#   ⚠️ **ゆえに、この1本の戸口には、05 で眼だけが錨になった者ひとりが立つ。**
#
# ⛔ **`draft_08-1` のポケットの手は、置かない——これも判断である。**
#   ⚠️ **原文は強い**——「その者の右手が、ポケットのなかに入っている。……
#   **握っている手のかたちが、ポケットの布のうえに、すこし浮き上がっている。**……
#   **指の節が、四つ、浮いている。**」
#   ⛔ **だが、ポケットの手を見せるには、その者の体を照らす必要がある。**
#   ⚠️ **そして、体を照らせば、顔が描かれる**——**05 が、まさにそれを避けた**
#   （`PLAN.md` §0-g——源が与えるのは眼だけであり、残りは「未指定」である）。
#   ⚠️ **ゆえに、この1本の画面で、その者の体は暗さのままである。**
#   ⛔ **それは損失である**（二十年、折り畳んだ像を握ってきた手が、画面に無い）。
#   **`PLAN.md` §1「この摘要版が落としたもの」に追記した。**

shot: migenzo-ch08-seg01

spec: specs/video/migenzo-ch08-seg01.md
key_image: specs/image/migenzo-ch08-seg01.md

unit:
  before: >-
    暗室の戸口。**手前いっぱいに、絹の背がある**——赤い安全光が、その背の右の縁を照らしている。
    ⚠️ **背は、まっすぐである。** **肩が、わずかに、上がったままになっている**——
    `draft_01-1`「肩が、わずかに、上がったままになる。……**その数えかたが、二十年、変わらない**」。
    向こうの戸口に、暗さがある。**その暗さのなかに、赤い光を返す二点がある**（05 の者である）。
  after: >-
    **同じ枠。同じ背。** ⚠️ **変わったのは、肩である**——
    **二十年、浅く保たれてきた息が、ひとつ、置かれる。** 肩が、わずかに下がる。
    ⛔ **背は、曲がらない。** ⚠️ **そして、そのまま止まる。**
    向こうの二点は、まだ、こちらを見ている。**だれも、動いていない。**
    ⚠️ **ゆえに観客は、この1本の終わりで、向かう先が定まったことを、動きではなく姿勢で読む。**

# 対話——**この1本の仕事は、語られていることに、時間を与えることである。**
# ⚠️ **台詞は無い**（§0-f）。⛔ **ゆえに、この1本の「対話」は、沈黙の形をしている**——
#   `draft_08-1`「絹はその沈黙のなかに立つ。二十年、絹は沈黙のなかに生きてきた。……
#   **けれど、この沈黙は絹の沈黙ではなかった。……絹に向けられた沈黙だった。**」
#   ⛔ **この1本に、うなずきも、まばたきの演技も置かない。**
role: 対話

place: 暗室

time: 時刻を持たない（no time of day——この部屋の状態は光そのものである）

mode: still

duration: 8s

motion:
  subject: >-
    ⚠️ **主題は止まっている。** 動くのは**赤い安全光のゆらぎ**と、
    **暗さのなかの二点が返す光の、わずかな移ろい**だけである
    （基盤の註——「**止まるのは主題であって、光と粉塵と液は動く**」）。
    ⚠️ **そして、この1本の最後に、絹の肩がひとつ下がる**——それだけである。
  quality: >-
    わずか。遅い。**8秒で、動きはひとつも無い。**
    ⚠️ **`draft_08-3`「その者の言いかたは、ゆっくりだった。ゆっくり、ひとつひとつことばを置くように、
    言っていた」**——**その「ゆっくり」が、この8秒の長さである。**
    ⛔ **ただし、語っている者を演じさせない。**
    **顔が無いので、口は動かない。** ⚠️ **ゆえに、言葉の速度は、時間そのものでしか示せない。**
  law: >-
    `documentary-photo` の物理——**静止が地である。**
    ⚠️ カードの一行——「**Stillness is fully available … it is the form's native state.**」
    ⛔ **カメラは動かない。寄らない。** ⚠️ **寄れば、それは「決意を捉える」画になる**——
    **この1本は、捉えない。置くだけである。**
    ⚠️ **そして、この部屋の地理の法**（`ledger.暗室.geography`）——**外は、この画の外に無い。**
    **戸口の向こうは、暗さであって、外ではない。**

beats:
  - range: 0-3s
    density: held
    what: >-
      手前いっぱいの背。**赤い光の縁。** 向こうの暗さと、二点。
      ⚠️ **この3秒は、言葉が既に始まっている時間である**——
      ⛔ **だから、ここで何も始めない。** **観客は、途中から立ち会う。**
  - range: 3-6s
    density: transition
    what: >-
      **動かない。** ⚠️ **この3秒が、この1本の本体である**——
      `draft_08-3`「**置かれたことばが、絹の二十年の暗室の床に、ひとつずつ落ちて、並んでいた**」。
      ⛔ **ことばを画面に置けない**（字幕は禁制、音は捨てる）。
      ⚠️ **ゆえに置けるのは、時間だけである。** **この3秒は、長い。長いまま置く。**
  - range: 6-8s
    density: held
    what: >-
      **絹の肩が、ひとつ、下がる。** ⚠️ **`draft_01-1` の「二十年、変わらない」数えかたが、
      ここで一度だけ、緩む。** ⛔ **背は曲がらない。** **手は動かない**——
      **指を止める動作は 08 のものである**（`PLAN.md` §1 の追記——**8-3 の変種は 08 と同族**）。
      ⚠️ **そして、そのまま終わる。**
      ⛔ **ここで絹を歩かせない。** ⚠️ **歩き出せば、これは `still` でなくなる**——
      **そして、この摘要版で「向かう」は、次からの3本が担う。**

# ⛔ **`reference_set` / `forbidden_set` / `attached` / `disclosure_state` は ③ が埋める。**
#    ⚠️ **この1本が ③ で引くことになる鍵の見込み**（**② の側の申し送り**）:
#    `暗室.base` / `暗室.geography` / **`絹.identity`** / **`盗人.identity`**。
#    ⛔ **05 と同じ申し送りを、③ はもう一度負う**——
#    **`盗人.identity` を引くなら、「眼だけが錨である」ことを③が負う**
#    （`bible.negative_base` の核2節は**娘の顔**を禁じているだけであり、**この者を禁じていない**）。
#    ⚠️ **そして、この1本は絹の背を撮る。** ⛔ **設定画は顔を持つ**——
#    **背中だけを引く経路は、この基盤には無い**（**07・08 と同じ申し送り**）。
