# 『未現像』第2章「見ないことの記録者」 / モンタージュ / motion —— 二十年が、この部屋を通り過ぎる
#
# **出典**
#   本文は `soul-voice-teller/examples/migenzo/草稿/draft_02-1_見ない者.md`（記録者の日常）と
#   `draft_02-4_影.md`（「失くしたものは、消えたのではなく、ここに影の色になって積もっていた。
#   **二十年、積もって、いま、絹の影のほうが、絹よりもすこし重い**」）。
#   文法は `semantic-visual-loom/references/formats/time-fold.md`（第2章だけが `video-spec` 以外を名乗る）。
#
# ⛔ **この記録は ② design のものである**（`PLAN.md` §3 手順1・2、2026-09-23 著者裁定）。
# ⚠️ **この記録は §1–20 を持たない。** 仕様は `spec:` の先である。
#
# ⛔ **この1本の形式変数は `time-fold` の文法が決める**——`PLACE`＝暗室／`PASSES`＝二十年／
#   `SURVIVOR`＝現像トレイと赤い安全光／`RANGE`＝二十年。**§6 `REFERENCES` に `REF_FORMAT:` を書く。**
#   ⚠️ **値そのものは §1–20 の側にある。** ここに書くのは**どの文法で撮るか**だけである。
#
# ⛔ **絹の体は、この1本の画面に入らない——これは判断である。**
#   ⚠️ **`time-fold` は「One survivor」を要求する**（カード）——
#   「**Something in the frame does not change across the whole span** — that is what makes
#   the passage legible as time. Name it.」
#   ⛔ **老けない人の体を画面に置けば、それは2人目の survivor になる。**
#   ⚠️ **そして、それ以上に悪いことが起きる**——20年を畳んだ画のなかに**一度も老けない女**が立つ。
#   カードが `avoid` で禁じているのは**加齢の手段（メイク・プロテーゼ）**であり、
#   **加齢そのものを描かないことは禁じていない。** だが**描かないことが「変わらない人」に見える**なら、
#   その画は**間違って見える**。⚠️ **依頼の「誤解させない」に、これが最も反する。**
#   ⚠️ **ゆえに、この1本の時間は「影」が運ぶ**——そして**それは源がそう書いている**：
#   `draft_02-4`「影は、**絹が失くしてきたものの重なり**だった」。**影が育つ、とはそういうことである。**
#   ⚠️ **`PLAN.md` §1 の一行も、主語が影である**——「見ないことの記録者でありつづけ、**その裏に影が育つ**」。
#   ⛔ **この判断は `PLAN.md` §4-c 問い9 の裁定（02 は絹を老けさせない）と対である。**
#   **あちらは「老けさせない」を決め、こちらは「ならば誰が時間を運ぶか」を決めている。**
#
# ⚠️ **この1本に変化点は無い**（`ledger.disclosure`）——**二十年は状態の継続である。**
#   ⚠️ **ゆえにこの1本が観客に渡すのは「何かが変わった」ではなく「変わらないまま過ぎた」である。**
#   **変化点の無いショットが1本あることは、抜けではなく設計である**（`PLAN.md` §2）。

shot: migenzo-ch02-seg01

spec: specs/video/migenzo-ch02-seg01.md
key_image: specs/image/migenzo-ch02-seg01.md

unit:
  before: >-
    暗室の壁に、**絹の影がひとつ、薄く**映っている。影は彼女の輪郭をなぞっていて、
    それ以上のものではない。現像トレイの琥珀の液面と、その上の赤い安全光が、静かにある。
  after: >-
    **影だけが濃くなっている。** それはもう輪郭をなぞる影ではなく、
    **彼女の体より少し重いもの**である——`draft_02-4`
    「失くしたものは、消えたのではなく、**ここに影の色になって積もっていた**」。
    ⚠️ **トレイと安全光は、9秒のあいだ1フレームも変わらない。**
    ⛔ **変わるものが2つ在ってはならない**（カードの `avoid`「Every element changing at once」）。

# モンタージュ——**この1本の仕事は、切らずに時間を通すことである。**
# ⚠️ **カットを1つも置かない。** `time-fold` の `Negative` が
#   `no cut, no time-skip, no cross-dissolve` を要求する。
role: モンタージュ

place: 暗室

# ⚠️ 時刻を持たない。**この1本では、それがとくに効く**——
#   **時計を持たない部屋で二十年を畳む**ことが、この文法の内容である。
time: 時刻を持たない（no time of day——この部屋の状態は光そのものである）

mode: motion

duration: 9s

motion:
  subject: >-
    **壁の影**。⚠️ **絹の体は画面に入らない**——入るのは、安全光が壁に落とす彼女の影だけである。
  quality: >-
    **濃さを増す。連続で。速くならない。** ⚠️ **形は変わらない**——影は絹のままである。
    変わるのは**重さだけ**である。`draft_02-4`「影の指先が、絹の指先より、すこし、重い」。
    ⛔ **動きとして見せない。** この9秒に**出来事は1つも無い**——
    **あるのは、積もることが続いていることだけである。**
  law: >-
    `documentary-photo` の物理——**静止が地である。** ⚠️ **そして `time-fold` の文法**——
    「**The camera is the anchor**……**A fixed frame is the native case**」。
    ⛔ **カメラは1ミリも動かない。** 動けば、畳んだ時間が「移動」になる。
    ⚠️ **survivor は現像トレイと赤い安全光である**（`PLAN.md` §0-b）——
    **この2つが変わらないから、影の濃さが「経過」として読める。**

beats:
  - range: 0-3s
    density: held
    what: >-
      暗室。上に赤い安全光、下に現像トレイの琥珀の液面、**壁に薄い影**。
      ⚠️ **この3秒は「いま」である**——影は絹の輪郭をなぞっているだけである。
      ⛔ **ここで何も予告しない。** `draft_02-1`「二十年、おなじ高さに、おなじ向きで吊るしてきた」——
      **同じであることが、この前半の内容である。**
  - range: 3-6s
    density: transition
    what: >-
      **影が濃さを増していく。** ⚠️ **カットしない。** 濃さは連続である——
      途中に段を置かない（段を置けば、それは「何かが起きた」になる）。
      `draft_02-4`「何度も何度も、像の上に脂を置いてきた。**そのぶんだけ影が濃くなっていく**」。
  - range: 6-9s
    density: held
    what: >-
      **影は、絹の体より重い。** それだけが二十年である。
      ⚠️ **トレイも安全光も、9秒前と1フレームも変わっていない。**
      ⛔ **ここで影を動かさない。** `draft_02-4` は影の指が独りでに動くと書くが、
      **それは第2章の後半（2-4）の出来事であり、この1本の変化ではない**——
      **動かせば「異常が起きた」1本になり、この1本は「何も起きなかった」1本でなくなる。**

# ⛔ **`reference_set` / `forbidden_set` / `attached` / `disclosure_state` は ③ が埋める。**
#    ⚠️ **この1本が ③ で引くことになる鍵の見込み**（**② の側の申し送り**）:
#    `暗室.base` / `暗室.geography`。
#    ⛔ **人物の鍵を、ここに置かない。** **絹の体は画面に入らない**——
#    ⚠️ **入るのは影だけであり、影は `絹.identity` では固定できない**（設定画ではない）。
#    ⛔ **それでも、絹が画面に居ないことは「絹が要らない」ではない**——
#    **影は絹の影であり、彼女の体の形をしている。** ② は §10 でそこを決める。
