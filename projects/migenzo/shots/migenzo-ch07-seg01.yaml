# 『未現像』第7章「留置」 / 所作 / motion —— 動けるのに、動かない
#
# **出典**
#   本文は `soul-voice-teller/examples/migenzo/草稿/draft_07-2_留置.md`——
#   「絹は筒に手を伸ばす。**指が筒に触れる一歩手前で、とまる。** 触れれば、絹はそれを手に取る。
#   手に取れば、次は開けることになる。**絹は指をひっこめる。**……」／
#   「**絹には、筒を取る、ということが、できる。できるのに、取らない。**
#   取らない、ということを、二十年、この手でしてきた。取れる、ということが、手のなかで、
#   すこし重い。取らない、ということが、もっと重い。……**手のひらを、そっと開いて、
#   すこし持ち上げて、重さを量る。量った手の指先が、すこし震えて、とまる。**」／
#   「**絹の伸ばした指の先に、筒の冷たさが、触れるか触れないかの距離でとまっている。
#   その距離のまま、絹は二十年、筒を置いてきた。**」
#   変化は `draft_07-4_亀裂.md`——「二十年の信念に、いま、一本の線が入る。**音もなく入る。**」
#
# ⛔ **この記録は ② design のものである**（`PLAN.md` §3 手順1・2、2026-09-23 著者裁定）。
# ⚠️ **この記録は §1–20 を持たない。** 仕様は `spec:` の先である。
#
# ⛔ **この1本の変化は `絹.信念 → 亀裂` である**（`PLAN.md` §2）。
#   ⚠️ **値は `亀裂`**——「崩れた」ではない。**崩れるのは2本あと（S11）である**（`ledger.disclosure`）。
#   ⛔ **そして、この変化は画面に現れない**——`draft_07-4`「**音もなく入る。**」
#   ⚠️ **ゆえに、この1本は「考え」を撮らない。** **撮るのは、手である。**
#   **観客が読むのは、亀裂そのものではなく、亀裂を可能にする行為である。**
#
# ⛔ **この1本の変化は、`PLAN.md` §1「山の作り方」の第1段である。**
#   ⚠️ そこに書かれた一行が、この1本の設計そのものである——
#   「**08（9s・motion）** — **指が止まる。** **絹は動ける。触れれば開けてしまう。**
#   ⚠️ **ここで観客は「この人は、動かないことを選べる人だ」と身体で覚える。**」
#   ⛔ **ゆえに、この1本に必要なのは「筒が在ること」である。**
#   **在って、届いて、それでも取らない**——**取れなければ、選択ではない。**
#
# ⚠️ **この1本の主題は、距離である。** `draft_07-2`——
#   「**その距離のまま、絹は二十年、筒を置いてきた。**」
#   ⛔ **ゆえに、この1本に「触れる」を置かない。** **触れれば、距離が消える。**
#   ⚠️ **そして、この1本に「引き出しを閉める」も置かない**——
#   `PLAN.md` §1 の一行は**「止まり、引っ込む」**までしか書いていない。
#   ⛔ **原文には閉める動作がある**（`draft_07-2`「絹は指をひっこめる。**引き出しを閉める。**」）。
#   ⚠️ **入れれば、この1本は2つの出来事を持つ**——**止まることと、閉めること。**
#   そして**最後の画が、筒でなく、引き出しの前板になる**——
#   ⛔ **この1本の主題（距離）が、最後の1秒で消える。**
#   ⚠️ **ゆえに、この1本は引き出しの開いたままで終わる。** **これは §1 の一行に従った結果である。**
#
# ⛔ **`props.脂痕` を、この1本に置かない——これは判断である。**
#   ⚠️ **原文には在る**——`draft_07-4`「**閉めた引き出しの取っ手に、絹の指の脂が、うすく残っている。**
#   ……取っ手の上の脂の痕が、暗室のすこしの光のなかで、**うすく光っている**」。
#   ⛔ **だが、`ledger.props.脂痕` の分布は S01・S04・S07 の三度である**
#   （`構想/foreshadowing.md`「**脂痕は三度戻る**」）。
#   ⚠️ **四度目を置けば、この物は事象でなく模様になる。**
#   そして ⛔ **04 の力は「その痕が、絹のものでない」ことである**——
#   **自分の痕を続けて置けば、他人の痕が読めなくなる。**
#   ⚠️ **ゆえに、この1本の脂痕は撮らない**（**② が見て、外した、という記録である**）。

shot: migenzo-ch07-seg01

spec: specs/video/migenzo-ch07-seg01.md
key_image: specs/image/migenzo-ch07-seg01.md

unit:
  before: >-
    引き出しが開いている。**暗い木のなかに、フィルムの筒が横たわっている**——
    二十年、そこに在るものである。⚠️ **筒の上に、まだ、手は無い。**
    ⚠️ **この1本が始まる前、この空間は、二十年、だれの指も入らなかった空間である。**
    赤い安全光は、引き出しの内側までは届かない——**縁だけを照らしている。**
  after: >-
    **同じ枠。手は、もう、無い。** ⚠️ **筒は、1ミリも動いていない**——
    `draft_07-2`「一度転がって、あとは二十年、動かない」。
    ⛔ **変わったのは画面ではない。** **指の先に残った距離が、同じ距離だった、ということである**——
    「**その距離のまま、絹は二十年、筒を置いてきた。**」
    ⚠️ **ゆえに観客は、この1本の終わりで、初めて「この人は、取れたのだ」と知る。**

# 所作——**`PLAN.md` §1 の註——07 と 08 は同じ役であり、それは意図である**——
#   **「手が動く1本と、手が止まる1本」。** ⚠️ **07 が動くほう、この1本が止まるほうである。**
role: 所作

place: 暗室

time: 時刻を持たない（no time of day——この部屋の状態は光そのものである）

mode: motion

duration: 9s

motion:
  subject: >-
    **絹の手**——**入ってくること、伸びること、止まること、ひっこむこと**。
    ⛔ **筒は動かない。** ⚠️ **絹の体も、顔も、この枠に入らない**——
    **この1本の画面は、引き出しの内側と、そこへ入ってくる手だけである。**
  quality: >-
    遅い。小さい。**ひとつの弧である**——`documentary-photo`
    「**What moves is ordinary and small — a hand**」。
    ⚠️ **止まることは、この1本でいちばん大きい出来事であり、なお、動きではない。**
    ⛔ **`draft_07-2`「量った手の指先が、すこし震えて、とまる」**——
    **震えは1度だけである。** ⚠️ **繰り返せば、それは演技になる。**
  law: >-
    `documentary-photo` の物理——**カメラは眼の高さで立ち、見る。持つ。**
    ⛔ **動かない。寄らない。** ⚠️ **寄れば「止まった指」を強調する画になる**——
    **それは「never to make a point」に反する。**
    ⚠️ **この1本の意味は、指が止まったことではなく、止まった距離が二十年と同じだったことである。**
    ⛔ **ゆえに、カメラは、その距離を、他の距離と同格に置く。**

beats:
  - range: 0-3s
    density: held
    what: >-
      開いた引き出しの内側。**木の底と、そのうえの筒。** 赤い光は縁までしか届かない。
      ⚠️ **この3秒、画面は動かない。** ⛔ **ここで筒を見せつけない**——
      **この物は、この作品で二度目に現れるだけの物である**（S04 で失われている）。
  - range: 3-6s
    density: dense
    what: >-
      **手が、枠の外から入ってくる。** 伸びる。**筒に触れる一歩手前で、とまる。**
      ⚠️ **そして、掌がすこし開き、持ち上がる**——`draft_07-2`「重さを量る」。
      ⛔ **指は閉じない。** **筒をつまめば、この1本は「取る」1本になる。**
      ⚠️ **震えは、この3秒の最後に一度だけ置く。**
  - range: 6-9s
    density: held
    what: >-
      **手が、ひっこむ。** ⚠️ **動作は、入ってきたときと同じ速さである**——
      **速く引けば、それは「拒んだ」になる。これは拒否ではない。**
      ⛔ **`draft_07-2`「指をひっこめたその手が、すこし冷たくなっている」**——
      **温度は画面に無い。** ⚠️ **残るのは、同じ位置に在る筒と、同じ距離だけである。**
      ⛔ **この最後の3秒で、何も起こさない。**
      ⚠️ **変化は観客の側に起きる**——**「触れれば、開けてしまう」と、観客が知る。**

# ⛔ **`reference_set` / `forbidden_set` / `attached` / `disclosure_state` は ③ が埋める。**
#    ⚠️ **この1本が ③ で引くことになる鍵の見込み**（**② の側の申し送り**）:
#    `暗室.base` / `暗室.geography` / **`引き出し`** / **`未露光のフィルム`**。
#    ⛔ **人物の鍵を、ここに置かない。** **絹の手は、この1本の画面に在るが、
#    設定画は顔を持つ**——⚠️ **「手だけ」を引く経路は、この基盤に無い**（**07 と同じ申し送り**）。
#    ⚠️ **`未露光のフィルム` の否定集合が、この1本では特に効く**——
#    `no image on the unexposed film` / `no developed image`。
#    ⛔ **筒を開けてはならない**（`構想/world.md`「**一度も重ね合わせでなかったものは、現像できない**」）。
#    ⚠️ **そして ③ への申し送りが1つある**——**この物は S04 で失われている。**
#    **S04 と この1本のあいだに、返却の画は無い**（`ledger.props.未露光のフィルム` の註）。
#    ⛔ **③ は、それを矛盾として扱わない**——**台帳が状態を持ち、画面が持たないだけである。**
