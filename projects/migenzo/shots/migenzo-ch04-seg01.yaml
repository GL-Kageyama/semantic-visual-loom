#    `暗室.base` / `暗室.geography` / `引き出し` / `脂痕`。
#    ⛔ **人物の鍵を、ここに置かない。** **この1本に人物は入らない。**
#    ⚠️ **`脂痕` は S01 と同じ物である**——**① の `props` が「同じ物が別の場所に現れる」と書く**なら、
#    **この1本がその2度目である**（`③` が判定する）。
