# 『未現像』第4章「内側から」 / 開示 / still —— 一枚が消え、だれかの渦だけが残る
#
# **出典**
#   本文は `soul-voice-teller/examples/migenzo/草稿/draft_04-1_消えた一枚.md`（空の引き出しと、
#   木の底の**筒のかたちのへこみ**）、`draft_04-3_残された指.md`（内側の板の**親指の渦**——
#   「絹の脂痕とおなじように、銀の粒になって光っている」）。
#
# ⛔ **この記録は ② design のものである**（`PLAN.md` §3 手順1・2、2026-09-23 著者裁定）。
# ⚠️ **この記録は §1–20 を持たない。** 仕様は `spec:` の先である。
#
# ⛔ **申し送り（1）——この1本の枠は「引き出し」であって「戸口」ではない。**
#   ⚠️ **`PLAN.md` §1 の一行は「一枚が消え、*戸口に*脂痕だけが残る（内側から開けられた）」と書く。**
#   ⛔ **原文の脂痕は、戸口に無い。** 3箇所を突き合わせた結果である——
#     ・`draft_04-3`「**引き出しの内側にひとつ残っている。取っ手のすぐ下の内側の板に。**
#        ……親指の腹の渦の形がかすかに光っている。……**銀の粒になって光っている**」← **これが脂痕である。**
#     ・`draft_04-2`「すべりの内側のほうに、**指を引いたような、かすかな跡**が残っている。……
#        白い跡を指でなぞると、**すこしへこんでいる**」← **これは「へこみ」であって、脂痕ではない。**
#     ・`draft_04-1`「戸の取っ手の下のところがすこし光っている」← **指のかたちの艶であり、脂痕と呼ばれていない。**
#   ⚠️ **ゆえに「戸口に脂痕」は、計画表の圧縮である。** ⛔ **圧縮は決定文書に残してよいが、
#   ショット記録は原文に従う**——**記録は生成器へ渡る文字列の親である。**
#   ⚠️ **そして、選んだのは物理でもある**——**この1本の変化は「一枚が消えた」である。**
#   **戸口を撮れば、消えたことが画面に無い**（`PLAN.md` 固定方針「1ショット1変化」）。
#   ⛔ **両方を1つの枠に入れない**——**広い画に主題が2つ在ることは、依頼の「誤解させない」に反する。
#   そして渦は小さい。** 広い画では、この1本でいちばん重要なものが読めなくなる。
#   ⚠️ **これが意味する損失は「内側から開けられた」が画面に無いことである**——
#   `PLAN.md` §1「この摘要版が落としたもの」に追記した。
#
# ⛔ **申し送り（2）——この1本に「指が止まる」動作は入らない。**
#   ⚠️ `draft_04-3`「絹はその脂痕に触れない。**指をのばしかけて、とめる。**」
#   ⛔ **この動作は 08 が持つ**（`PLAN.md` §1「指がフィルム筒の手前で止まり、引っ込む」）。
#   ⚠️ **原作は「指が止まる」を3箇所（3-2・4-3・7-2）に置いている。摘要版はそれを1度だけ撮る。**
#   ⛔ **ゆえに、この1本に絹は入らない。**
#
# ⛔ **申し送り（3）——この1本に人物は入らない。**
#   ⚠️ **そして、それは `PLAN.md` の一行と一致する**——§1 の一行は
#   「一枚が消え、**脂痕だけが残る**」と、**残された物を主語にしている。**
#   ⚠️ **`draft_04-4` で絹は既に外へ出て歩き出している**——**この1本の時刻に、彼女はこの部屋に居ない。**
#
# ⚠️ **この1本の変化は、開示の側にある**（`PLAN.md` §2）——
#   「`娘.一枚` → `失われた`」／観客が知ること「それは、**外から**破られた」。
#   ⛔ **物理的な出来事は、この1本が始まる前に終わっている。**
#   ⚠️ **この1本がするのは、**`draft_04-3` の最後の一行**——
#   「**残されたのは、指の脂痕ひとつだけ。**」を、7秒かけて画面に置くことである。
#   ⚠️ **ゆえに `still` である**（`PLAN.md` §1）。**主題は止まっている。**
#   ⚠️ **そして、それでよい**——`documentary-photo` が言う——
#   「**Stillness is fully available … it is the form's native state.**」

shot: migenzo-ch04-seg01

spec: specs/video/migenzo-ch04-seg01.md
key_image: specs/image/migenzo-ch04-seg01.md

unit:
  before: >-
    暗室の奥の引き出しが、**半分ほど開いている**。二十年、開かなかった木は湿気を吸ってふくらみ、
    開いたあとの乾いた音が、もう消えている。**なかは、空である。**
    ⚠️ **だが、この1本が始まる前、空であることは、まだ何も意味していない**——
    木の底が、ただ暗い。⚠️ **空洞は、空洞としてしか見えていない。**
  after: >-
    赤い光の縁が、引き出しの底を、わずかに動いて渡る。**木の底に、
    フィルムの筒のかたちをしたへこみがある**——`draft_04-1`「二十年、その重さを受けていた場所が、
    いま、指をすべらせる。**なにも返してこない。**」。
    そして取っ手のすぐ下の内側の板に——**だれかの親指の渦が、銀の粒になって光っている。**
    ⚠️ **絹が二十年、像のうえに残してきた脂痕と、おなじ光りかたである**（`draft_04-3`）——
    **ゆえに観客は、これを代償の跡ではなく、盗まれた跡として読む。**
    ⛔ **絹は、ここで触れない。** 彼女はこの1本に居ない。

# 開示——**この1本の仕事は、空の底に残された光を、観客に見せることである。**
# ⚠️ **この1本は、説明を一つも持たない。** あるのは**へこみ**と**渦**だけである——
# そして、**そのどちらも、この作品の語彙である**（へこみ＝二十年の重さ、渦＝代償の光）。
# ⛔ **ゆえに、この2つが同じ枠に在ることは、情報の重複ではなく対である。**
role: 開示

place: 暗室

time: 時刻を持たない（no time of day——この部屋の状態は光そのものである）

mode: still

duration: 7s

motion:
  subject: >-
    **赤い安全光のゆらぎ**と、**その縁が引き出しの底を渡っていくこと**。
    ⚠️ **主題（引き出し）は止まっている。**
  quality: >-
    わずか。遅い。⚠️ **`draft_04-1` の「かた、と、乾いた音」は、もう鳴り終わっている**——
    **この1本は、音のあとである。** ⛔ **ここで引き出しを動かさない。**
  law: >-
    `documentary-photo` の物理——**静止が地である。**
    ⚠️ **この1本が `still` である理由は、変化が既に終わっていることである**——
    **7秒かけても、この部屋では何も起きない。** **起きたことは、もう起きてしまっている。**
    ⛔ **カメラは動かない。寄らない。** ⚠️ **寄れば「見つける」という演劇になる**——
    **この1本の仕事は、見つけることではなく、置くことである。**

beats:
  - range: 0-2s
    density: held
    what: >-
      半分開いた引き出し。**暗い空洞。** ⚠️ **まだ何も光っていない。**
      ⛔ **ここで観客に何も教えない。** `draft_04-1`「空、ではなく」——
      **最初に見えるのは「空」だけである。**
  - range: 2-4s
    density: transition
    what: >-
      赤い光の縁が底に入り、**筒のかたちのへこみが浮かぶ。**
      ⚠️ **へこみだけである。** `draft_04-1`「そのへこみだけが、そこになにかがあったことを覚えている」——
      **「なにかがあった」までで、まだ「何が」ではない。**
  - range: 4-5s
    density: sparse
    what: >-
      光が内側の板へ上がる。**親指の渦が、銀の粒になって浮かぶ。**
      `draft_04-3`「渦のまわりの線が一本ずつ見える。渦のいちばん細いところが光っている」。
      ⚠️ **この1秒が、この1本の芯である**——**観客はここで、
      「これは絹のものではない」と知る。**
  - range: 5-7s
    density: held
    what: >-
      **光が少しずれ、渦が消え、また浮かぶ。** ⚠️ **そのまま終わる。**
      ⛔ **引き出しを閉めない。** ⚠️ **閉めるのは絹である**——**彼女は既に外に居る。**
      ⚠️ **この1本の最後に残るのは、「残されたのは、指の脂痕ひとつだけ」である**（`draft_04-3`）。
      ⛔ **ここで 05 を予告しない。** ⚠️ **追跡は次の1本である。**

