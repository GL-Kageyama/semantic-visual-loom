#    **`最後の暗室.base`** / **`最後の暗室.geography`** / **`印画紙`**。
#    ⛔ **申し送りが3つある。**
#    **（1）この1本は、人物の鍵をひとつも引かない。**
#    ⚠️ **絹は11本に居たが、この1本には居ない**（上の註）。**娘の手も、もう無い**——
#    **消えたからである。**
#    ⛔ **13本のうち12本に人物が居る作品の、最後の1本が、無人である。**
#      ⚠️ **訂正（2026-09-23、② の通し読み）。この行は初稿で「15本のうち12本」と書いていた。**
#      ⛔ **この摘要版は13本である**（`PLAN.md` §1 の表、`shots/*.yaml` の実数、
#      `ledger.locations.最後の暗室` の註「13本すべての `place` がこの字になる」）——
#      **15は、裁定の途中にあった古い本数である。**
#      ⚠️ **12のほうは正しい**（**人物が居ないのは、この最後の1本だけである**、`ledger.characters.絹`——
#      **「13本のうち11本に居る」＋この1本に手を持つ娘 → 12**）。
#      ⛔ **数を書いた行は、数えた時点の綴りである。写すときは、数え直す。**
#    **③ は、これを欠落として扱わない**——**この無人さが、この1本の内容である。**
#    **（2）`印画紙` の否定集合が、この1本では最も強く効く。**
#    ⚠️ **`no image on the unexposed film` は、この1本では「像が無いこと」そのものである。**
#    ⛔ **だが `negative` は名詞を消せない**（hakuchizu の実測）——
#    **ゆえに §18 の肯定文の側が「白」「銀塩の白」「なにも浮かんでいない」を名指す。**
#    ⚠️ **`ledger.props.印画紙` の註——「何も浮かばない白も、この物の姿である（S13）。
