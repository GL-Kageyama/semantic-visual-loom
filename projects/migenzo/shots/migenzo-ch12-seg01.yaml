# 『未現像』第12章「白」 / 離脱 / still —— なにも浮かばない印画紙
#
# **出典**
#   本文は `soul-voice-teller/examples/migenzo/草稿/draft_12-1_何も浮かばない.md`——
#   「絹は印画紙を見る。**なにも浮かばない。白いままだった。**娘の手の小さな像も、
#   絹の背中も、輪郭の端から滲んで消えていった。いま、印画紙にはなにも浮かばない。」／
#   「消えかたは、ゆっくりだった。輪郭の端が、まず、うすくなって、それから、なかのかたちが
#   白に戻っていった。……**最後に小さな手がうすくなって、消えていった。**」／
#   「**絹はその白を液から引き上げる。紙の角をトングでつまんで、トレイの上で、すこし、とめて、
#   水を切る。切れた水が液面へ落ちて、小さな音を立てる。ぽた、ぽた、と二度、音がして、
#   それきり、暗室は、また、静かになる。**」／
#   「紙はまだすこし湿っていて、冷たかった。**なにも浮かばない、という白。**
#   二十年のあいだ、絹がこわがってきた白。その白が、いま絹の手のなかにある。……
#   **写ったどの顔よりも、なにも写らないこの白のほうが、重い。**」／
#   「**白は絹を映さない。なにも映さない。それでも白は重い。白のうえを、赤い光がすこし流れている。**
#   ……赤い光が白のうえを流れていって、**白はその光をすこし吸って、それでも白いまま、ある。**」
#   白の三義は `草稿/draft_12-2_三義.md`——「**白のなかに、現像されなかった娘の顔の場所がある。
#   白のなかに、二十年の問いを決めないまま残す場所がある。そして、白のなかに、
#   まだだれの顔も浮かんでいない場所がある。三つの場所が、ひとつの白のなかにある。**……
#   **境目のない白が、いま、絹の手のなかにある。**」
#
# ⛔ **この記録は ② design のものである**（`PLAN.md` §3 手順1・2、2026-09-23 著者裁定）。
# ⚠️ **この記録は §1–20 を持たない。** 仕様は `spec:` の先である。
#
# ⛔ **この1本の変化は `白 → 決まらない` である**（`PLAN.md` §2、`ledger.disclosure`）。
#   ⚠️ **値は `決まらない`**——⛔ **「未定」でも「曖昧」でもない。**
#   **この2語は「決めるべきことが残っている」という読みを生む。**
#   **決まらないことは、この作品の最終状態である。**
#   ⚠️ **ゆえに、この1本は「これから決まる」画を撮らない。**
#   **撮るのは、決まらないまま、乾いていく白である。**
#
# ⛔ **この1本の変化は、白の側の、最後の1つである——そして、それは可逆でない。**
#   ⚠️ **源が、この1本に置いているのは「引き上げ」と「水切り」である**（`draft_12-1`）。
#   ⚠️ **写真の物理では、これは決定的な境目である**——
#   **液のなかにあるかぎり、白はまだ動きうる。液から出て乾けば、白はもう変わらない。**
#   ⛔ **ゆえに、この1本の変化は「白が、決まらないまま、決まった」ことである。**
#   ⚠️ **決まるのは、答えではなく、白そのものである。**
#   **そこが、この1本の全部である。**
#
# ⛔ **この1本の主題は、紙である。そして、紙は動かない。**
#   ⚠️ **動くのは3つ**——**（1）紙から落ちる水**（`draft_12-1`「切れた水が液面へ落ちて、
#   小さな音を立てる」）、**（2）紙のうえを流れる赤い光**（「白のうえを、赤い光がすこし
#   流れている」）、**（3）像の最後の輪郭が、白に戻っていくこと**——
#   ⛔ **これは「紙が動く」のではない。** **紙に含まれた液が、乾いていくことである**
#   （基盤の註——「**止まるのは主題であって、光と粉塵と液は動く**」）。
#   ⚠️ **ゆえに、この1本は `still` である。**
#
# ⛔ **この1本が、この摘要版でいちばん大きな妥協を負う**（`PLAN.md` §0-h）。
#   ⚠️ **白の三義（読者の顔／娘の無限／判決の不在）が「一つの枠に並ぶ」ことは、
#   WAN 3.0 では撮れない**——`coexisting-realities` は §18 に `MINIMAX H3` を名乗ることを
#   要求し、**その名が経路を選ぶ**。
#   ⚠️ **そして、この1本は、その三義のうち1つを、そもそも撮れない**——
#   `draft_12-3_あなた.md`「**あなたはその白に指を触れる。……そして、あなたの顔が白のなかに浮かぶ。
#   ……現像の順番で、あなたの顔が白のなかから浮かんでくる。**」
#   ⛔ **これは二人称の頁である。** **この摘要版は、読者を画面に持てない**——
#   **その顔を生成すれば、それは「だれか」の顔であり、読者ではない。**
#   ⚠️ **ゆえに、この1本は白を「一度に一つの読み」として撮る**——
#   **決めないことを、決めずに撮る。**
#   ⛔ **そして、三義が重ならないという損失は、この1本に落ちる。**
#
# ⛔ **この1本の画面に、絹の顔も、絹の手も、置かない——これは判断である。申告する。**
#   ⚠️ **原文では、この白は「絹の手のなか」にある**（`draft_12-1`「その白が、
#   いま絹の手のなかにある」）。⛔ **だが、この1本は手を入れない。**
#   **（1）この1本の役は `離脱` である。** ⚠️ **`rolemap.ROLES` の `離脱` の固有基準は
#   「境界の可視化・出た先の示唆」である**——**作品が、彼女の手から出ていく1本である。**
#   **（2）`PLAN.md` §1 の一行は「**見る側が、現像される側へ立たされる**」である**——
#   ⛔ **最後の枠に人物が居れば、観客はその人物の位置に立つ。**
#   **この摘要版が観客に渡せる位置は、人物のいない、白の正面である。**
#   ⚠️ **ゆえに、この1本にトングだけが入る**——**手ではない道具である。**
#   ⛔ **トングは台帳に鍵を作らない。** **鍵は、ショットの `reference_set` が引くものだけである**
#   （`ledger.props` の註）。**そして、この道具は状態を持たない**——
#   **引き出しに鍵があるのは、それが「空／在る」という状態を持つからである**（S04 と S08）。
#   **この道具に、状態は無い。**
#
# ⛔ **`draft_12-2` の指を、この1本に置かない——これも判断である。**
#   ⚠️ **原文は良い**——「**絹は白に指を置く。指の腹を白のうえに置いて、ゆっくり、右へ動かす。……
#   娘の顔の場所を通っても、問いの場所を通っても、だれも浮かんでいない場所を通っても、
#   紙はおなじようにざらつく。境目は、どこにもない。**」
#   ⛔ **だが、指が白を横切ることは、運動である**——**そして、この1本の変化は、
#   白が乾くことである**（上の註）。**2つ目の出来事を置けば、この1本は2つの変化を持つ。**
#   ⚠️ **そして、この指は「触れる」——08 の族ではない**（`PLAN.md` §1 の追記は
#   「手が伸びて、対象に届かずに戻る/止まる」形だけを数えている）。
#   ⛔ **ゆえに、この1本は指を外す。** **12 が外したのと同じ理由である。**

shot: migenzo-ch12-seg01

spec: specs/video/migenzo-ch12-seg01.md
key_image: specs/image/migenzo-ch12-seg01.md

unit:
  before: >-
    **光の島。** トレイと、その琥珀の液面。⚠️ **液面は、もう、動いていない。**
    **その上に、印画紙が1枚、宙にある**——紙の角を、**トングがつまんでいる**
    （**トングは画面の外から入っている。人は、この枠に居ない**）。
    ⚠️ **紙は、まだ、濡れている。** **像は、消えかけている**——
    `draft_12-1`「**最後に小さな手がうすくなって、消えていった。**」
    ⚠️ **その小さな手が、まだ、いちばんうすく残っている。**
    **水が、紙の下の角へ集まって、ひとつ、落ちる。**
  after: >-
    **同じ枠。紙は、同じ場所に、同じ角度で、宙にある。**
    ⚠️ **変わったのは2つである**——**像が、完全に白へ戻った。**
    `draft_12-1`「**なにも浮かばない。白いままだった。**」
    **そして、水が、もう、落ちていない。** ⚠️ **紙は、まだ、湿っている。**
    ⛔ **赤い光が、白のうえを流れている。** **白は、その光をすこし吸って、それでも白いまま、
    そこにある**（`draft_12-1`）。
    ⚠️ **ゆえに観客は、この1本の終わりで、この白がもう変わらないことを知る**——
    **決まらないまま、決まった。**

# 離脱——**この1本の仕事は、作品が液から出ることである。**
#   ⚠️ **`rolemap.ROLES` の `離脱` の固有基準は「境界の可視化・出た先の示唆」である。**
#   ⚠️ **この1本の境界は、光の島の縁である**——`draft_09-1`「**赤い光の届く範囲は、せまかった。
#   光の届かない壁ぎわでは、二十年の闇が、まだ、そこに沈んでいた。**」
#   ⛔ **ゆえに、この1本の縁は、壁ではなく、赤から闇への変わり目である。**
#   ⚠️ **「出た先」は、この摘要版では撮らない**（`PLAN.md` §0-e——**外は、この画の外に無い**）。
#   ⛔ **代わりに在るのは、紙が、もう液のなかに無い、ということである。**
role: 離脱

place: 最後の暗室

time: 時刻を持たない（no time of day——この部屋の状態は光そのものである）

mode: still

duration: 9s

motion:
  subject: >-
    ⚠️ **主題は止まっている**——**トングに挟まれた紙は、9秒のあいだ、1ミリも動かない。**
    動くのは3つである。**（1）紙の下の角に集まり、落ちる水**（`draft_12-1`「ぽた、ぽた、と二度」）。
    **（2）紙のうえを流れる赤い光。** **（3）像の最後の輪郭が、白へ戻っていくこと**——
    ⚠️ **これは液の乾きである**（上の註）。
  quality: >-
    遅い。**9秒で、彼女の動きはひとつも無い**——**そもそも、この枠に人物が居ない。**
    ⚠️ **水滴は二度である**（`draft_12-1`「**ぽた、ぽた、と二度、音がして、それきり**」）。
    ⛔ **3度目を置かない。** **それきり、という語が、この1本の終わりである。**
  law: >-
    `documentary-photo` の物理——**静止が地である。**
    ⚠️ **そして、この1本は、この作品で最も静止に近い**——
    **前の12本が何かを動かしてきたのに対し、この1本は、動くものが尽きたあとを撮る。**
    ⛔ **カメラは動かない。寄らない。** ⚠️ **白に寄れば、それは「白を読む」画になる**——
    **この白には、読むべきものが無い。**
    ⚠️ **そして、この部屋の地理の法**（`ledger.locations.最後の暗室.geography`）——
    **光の届かない面は、沈んだまま暗い。**
    **この1本の最後の画は、闇のなかの、小さな赤い島と、そのなかの、白い1枚である。**

beats:
  - range: 0-3s
    density: held
    what: >-
      **宙にある、濡れた1枚。** ⚠️ **像の最後——小さな手の輪郭が、いちばんうすく残っている。**
      **水が、下の角へ集まる。**
      ⛔ **この3秒で、何も始めない。** **観客は、消えかけた手を見る。**
  - range: 3-6s
    density: transition
    what: >-
      **像が、白へ戻りきる。** ⚠️ **そして、水が、ひとつ、落ちる。**
      **二度目も、落ちる。** ⛔ **それきりである。**
      ⚠️ **この3秒で、この作品の像が、全部、消える**——
      **`draft_12-1`「輪郭の端が、まず、うすくなって、それから、なかのかたちが白に戻っていった。」**
      ⛔ **ここで音を置かない**（`PLAN.md` §0-f）。**落ちる水は、画であって、音ではない。**
  - range: 6-9s
    density: held
    what: >-
      **白。** ⚠️ **赤い光が、そのうえを流れていく。** **白は、白いままである。**
      ⛔ **ここで何も起こさない。** **紙は、宙にある。** **水は、もう、落ちない。**
      ⚠️ **この3秒が、この摘要版の最後の3秒である**——
      **`ledger.disclosure`「**決まらないことは、この作品の最終状態である。**」**
      ⛔ **ゆえに、ここで「決まった」顔を撮らない。** **撮れるのは、白だけである。**

