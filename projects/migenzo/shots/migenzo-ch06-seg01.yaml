# 『未現像』第6章「二人目・三人目」 / 総覧 / motion —— 吊り線のうえで、一枚ではなくなる
#
# **出典**
#   本文は `soul-voice-teller/examples/migenzo/草稿/draft_06-3_暴力.md`——
#   「絹は現像して、像を吊るした。吊るして、見なかった。……**乾いた像の端を、洗濯ばさみで挟んで、
#   紐に吊るした。吊るした像が揺れて壁に影を落としていた。**」／
#   `draft_06-1_二人目.md`「あと、何人いるのか。**数えることを絹はやめた。**」／
#   `draft_02-1_見ない者.md`「二十年、**おなじ高さに、おなじ向きで**吊るしてきた」。
#
# ⛔ **この記録は ② design のものである**（`PLAN.md` §3 手順1・2、2026-09-23 著者裁定）。
# ⚠️ **この記録は §1–20 を持たない。** 仕様は `spec:` の先である。
#
# ⛔ **この1本には、人の顔が入らない——これは判断であり、2つの理由を持つ。**
#   ① **`PLAN.md` §0-e**——「壊された者たちの顔は、暗室へ来ない。
#      **来るのは、絹が現像した印画紙のほうである**」。**§1 の06 が、その印画紙である。**
#      ⚠️ **ゆえに、この1本には三人が立たない**——**立つのは、吊られた紙である。**
#   ② **`PLAN.md` §0-g**——「⚠️ **二人目・三人目の子供の鍵は作らない。**……
#      **群像は顔でなく、絹が現像した印画紙で立てる。**」
#      ⛔ **印画紙に顔が写っていれば、この1本は「鍵の無い顔」を何枚も要求することになる**——
#      **生成器は毎回ちがう顔を作る。** ⚠️ **それは依頼の「誤解させない」に最も反する。**
#   ⚠️ **ゆえに、カメラは吊り線の裏側に立つ。** この1本が見るのは、**紙の裏である。**
#   ⛔ **そして、それは損失ではない**——**この作品の中心の行為が「見ないこと」である。**
#   `draft_06-3`「絹は、その影も、そのしたたりも、**見なかった**」。
#   **裏側から撮ることは、この作品の主題を、カメラの位置で言い直している。**
#
# ⚠️ **この1本の変化は `絹.加害 → 全容` である**（`PLAN.md` §2）。
#   ⚠️ **値は「全容」**——「自覚」でも「理解」でもない。**絹の中身でなく、事実の量である**（`ledger` の註）。
#   ⛔ **ゆえに、この1本が動かすのは絹ではなく、画面に在る紙の量である。**
#   ⚠️ **`PLAN.md` §2 の「観客が知ること」は「壊された者は、一人ではない」**——
#   **この1本の変化は、開示の側に在る**（03・04 と同じ形）。
#
# ⛔ **モードは `motion` である**（`PLAN.md` §1）。⚠️ **この1本で動くのは紙そのものである**——
#   **濡れた紙は乾き、乾くあいだに、赤い光の通りかたが変わる。**
#   ⚠️ **この運動は、`documentary-photo` の法の内側にある**——
#   「**What moves is ordinary and small**」。**乾くことは、この部屋でいちばん平凡な運動である。**

shot: migenzo-ch06-seg01

spec: specs/video/migenzo-ch06-seg01.md
key_image: specs/image/migenzo-ch06-seg01.md

unit:
  before: >-
    吊り線に、**まだ濡れている印画紙**が並んでいる。⚠️ **濡れているあいだ、紙は光を通す**——
    赤い安全光が紙の裏を抜けて、白が内側からうっすらと光っている。
    ⚠️ **この1本が始まる前、観客が数えられるのは、手前の数枚だけである。**
  after: >-
    **乾いた。** 光はもう通らない。**白い紙が、何枚も、互いのうしろに並んでいる。**
    ⚠️ **数えられない**——`draft_06-1`「あと、何人いるのか。**数えることを絹はやめた。**」
    ⛔ **変わったのは紙の数ではない。** 同じ紙である——
    変わったのは、**乾いたことで、うしろの紙が隠れなくなったことである。**
    ⚠️ **ゆえに観客は、この1本の終わりで、初めて「一人ではない」と知る。**

# 総覧——**この1本の仕事は、量を一度に見せることである。**
# ⚠️ **`PLAN.md` §1 の註——「この作品で唯一 `総覧` の役を持つ1本である」。**
# ⛔ **ゆえに、この1本に出来事を置かない。** **量そのものが出来事である。**
role: 総覧

place: 暗室

time: 時刻を持たない（no time of day——この部屋の状態は光そのものである）

mode: motion

duration: 8s

motion:
  subject: >-
    **吊られた印画紙そのもの**——**乾いていくこと**。⚠️ そして、乾くにつれて変わる、
    赤い光の通りかた。⚠️ **絹は画面に入らない。**
  quality: >-
    遅い。小さい。**乾きは、急がない。** ⚠️ **紙は揺れる**——`draft_06-3`
    「吊るした像が**揺れて**壁に影を落としていた」。**揺れと乾きが、この8秒の全部である。**
    ⛔ **ここに手を入れない。** **吊るす行為は、この1本の前に終わっている**——
    ⚠️ **入れれば、この1本は「所作」になる**（**07 と 08 がその役である**）。
  law: >-
    `documentary-photo` の物理——「**The camera stands and watches, at eye level. It holds;
    if it moves at all it moves to keep the subject in frame, never to make a point.**」
    ⛔ **ゆえに、この1本はパンしない。** ⚠️ **線の端まで振れば、「量」を見せるための運動になる**——
    **それは「never to make a point」に反する。**
    ⚠️ **枠は固定である。** **量は、枠の外へはみ出したまま置かれる**——
    **はみ出していることが、量である。**

beats:
  - range: 0-3s
    density: held
    what: >-
      暗室の吊り線。**濡れた紙が並んでいる。** 赤い光が紙を抜けて、白が内側から光っている。
      ⚠️ **`draft_06-3`「乾いた像の端を、洗濯ばさみで挟んで、紐に吊るした」**——
      **留めているものが見える。** ⛔ **この3秒では、量を数えさせない。**
  - range: 3-5s
    density: transition
    what: >-
      **紙が乾いていく。** 光の抜けかたが、白の内側から、表面へ移る。
      ⚠️ **白が、紙の白になる**（`ledger.印画紙`——「白は銀塩の白であって、
      紙の白でも、まして発光でもない」）。⛔ **発光させない。** **乾きであって、光ではない。**
  - range: 5-8s
    density: held
    what: >-
      **乾いた紙が、重なりながら並んでいる。** 揺れは、乾くにつれて小さくなっている。
      ⚠️ **最初の3秒で手前の数枚だったものが、いま、数えられない。**
      ⛔ **ここでカメラを引かない。** ⚠️ **引けば「見せにいく」ことになる。**
      ⚠️ **この1本の最後に残るのは、量だけである**——`draft_06-3`
      「けれど、いま三人の顔が、絹の前に立っている」——
      **その「三人」が、この摘要版では、この枚数である。**

# ⛔ **`reference_set` / `forbidden_set` / `attached` / `disclosure_state` は ③ が埋める。**
#    ⚠️ **この1本が ③ で引くことになる鍵の見込み**（**② の側の申し送り**）:
#    `暗室.base` / `暗室.geography` / **`印画紙`**。
#    ⛔ **人物の鍵を、ここに置かない。** **この1本に人物は入らない。**
#    ⚠️ **そして ③ への申し送りが1つある**——**`印画紙.negative` の
#    `no digital image on the paper` / `no glossy photo paper` は、
#    「紙の裏側を撮る」というこの1本の設計と両立する。**
#    ⛔ **だが、`未露光のフィルム.negative` の `no developed image` を
#    この1本へ引いてはならない**——**この1本の紙は、現像された紙である。**
#    ⚠️ **② はどちらの鍵が正しいかを決めない。② が書いたのは「この1本は現像済みの紙を撮る」ということである。**
