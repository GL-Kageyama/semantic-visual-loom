# 『未現像』第5章「追う者」 / 反応 / motion —— 見られる側に立つ
#
# **出典**
#   本文は `soul-voice-teller/examples/migenzo/草稿/draft_05-2_子供.md`——
#   「その者は絹の前で立ち止まる。立ち止まって、絹を見ている。**絹を見ている、ということが、
#   二十年ぶりに絹へ向けられた視線だった。**……まっすぐな視線の先が、絹の顔のまんなかにあたっている」／
#   「絹はその者の顔を見ない。**見ない、ということが、もう通じない。**……目をそらした、その先で、
#   石の塀がすこし白く光っている。**そらす場所が、もう、ない。**」／「絹はその視線を受け止める。」
#
# ⛔ **この記録は ② design のものである**（`PLAN.md` §3 手順1・2、2026-09-23 著者裁定）。
# ⚠️ **この記録は §1–20 を持たない。** 仕様は `spec:` の先である。
#
# ⛔ **この1本は戸口で起きる**（`PLAN.md` §0-e）——**町へは行かない。**
#   ⚠️ **そして、来る者は閾を越えない。** 同じ §0-e——
#   「**壊された者たちの顔は、暗室へ来ない。** 来るのは**絹が現像した印画紙のほうである**」。
#   ⛔ **ゆえに、この1本の立位置は2つで、そのあいだが戸口である**——
#   **絹は内側、来る者は外側、ふたりは閾で止まる。**
#   ⚠️ **この止まりかたは、この作品の地理そのものである**——`world.md`
#   「**暗室: 内と外を区別していない場所**」。**外は、この画の外に無い**（`ledger.暗室.geography`）。
#
# ⛔ **この1本の顔は、描かれない——これは判断である。**
#   ⚠️ `PLAN.md` §0-g: 盗人の源が与えるのは**眼だけ**である——
#   「**大人の体に、二十年前の子供の眼**。⚠️ 残りは設定画が『未指定』と註記している」。
#   ⛔ **未指定の顔を描かせれば、生成器は毎回ちがう顔を作る**——
#   **それは「誤解させない」に最も反する。**
#   ⚠️ **ゆえに、この1本の体は暗さに属し、赤い光を返すのは眼だけである。**
#   ⛔ **そして、それは損失ではない**——`draft_05-2` がこの者の眼について言うのは、
#   「けれど、**眼だけが、二十年前の子供の眼をそのまま持っている**」である。
#   **この1本は、その一行を、そのまま撮る。**
#
# ⚠️ **この1本の変化は `絹.位置 → 反転した` である**（`PLAN.md` §2）。
#   ⚠️ **値は「反転した」であって「逆転した」ではない**（`ledger.disclosure` の註）——
#   **勝ち負けではなく、立ち位置の交換である。**
#   ⛔ **そして、この1本に台詞は無い。** `PLAN.md` §0-f——**音声は全て捨てる。**
#   ⚠️ **ゆえに観客が読むのは、言葉でなく眼である。**
#   **二十年、絹は像を見て、人を見なかった。この1本で、はじめて彼女が見られる。**

shot: migenzo-ch05-seg01

spec: specs/video/migenzo-ch05-seg01.md
key_image: specs/image/migenzo-ch05-seg01.md

unit:
  before: >-
    暗室の戸口。戸は開いている。**外は、赤い光の届かない暗さである**——
    この部屋の光は内側にしか無い。⚠️ **閾のところに、まだ、だれも居ない。**
    絹は内側に立っている。**彼女の眼は、横へ逸れている**——
    `draft_05-2`「二十年、通じてきた、見ない、ということが」——
    ⚠️ **そらす場所は、まだ、ある**（壁、トレイ、吊り線）。
  after: >-
    暗さのなかに**ひとつの体**が立ち、**閾で止まっている。**
    ⛔ **顔は描かれない。赤い光を返しているのは、眼の二点だけである**（`draft_05-2`
    「**眼だけが、二十年前の子供の眼をそのまま持っている**」）。
    **そして絹の眼が、戻っている。** 逸れずに、その二点のほうを向いている。
    ⚠️ **`draft_05-2`「そらす場所が、もう、ない」**——**彼女は受け止めている。**

# 反応——**この1本の主題は絹の反応であって、来る者ではない。**
# ⚠️ **ゆえに、動くのは主に絹である。** 来る者は**歩いて、止まる**だけである。
# ⛔ **この1本に演劇を置かない**——`PLAN.md` の依頼——**「単純な演出」。**
role: 反応

place: 暗室

time: 時刻を持たない（no time of day——この部屋の状態は光そのものである）

mode: motion

duration: 9s

motion:
  subject: >-
    **絹の眼**。そして、**彼女がからだをそのほうへ向けること**。
    ⚠️ **来る者は、暗さのなかから歩いてきて、閾で止まる**——それだけである。
  quality: >-
    遅い。小さい。⛔ **急がない。** 様式の法——
    「**What moves is ordinary and small** — a hand, a turn of the head. **The frame does not
    arrange itself around the movement.**」
    ⚠️ **この1本で起きることは、首が回ることと、眼が止まることだけである。**
    ⛔ **「受け止める」を、大きな動作にしない。** 大きければ、それは決意の演技になる——
    **決意は 09 である。この1本が置くのは、位置の交換だけである。**
  law: >-
    `documentary-photo` の物理——**カメラは眼の高さで立ち、見る。**
    ⛔ **動かない。寄らない。** ⚠️ **寄れば、この1本は「見つめる1本」になる**——
    **そうではなく、この1本は「見られる1本」である。**
    ⚠️ **そして、この部屋の地理の法**——**外は入らない。** 来る者は閾を越えない。

beats:
  - range: 0-3s
    density: held
    what: >-
      開いた戸口。**暗さ。** 赤い安全光は内側だけを照らしている。
      絹の横顔が手前にあり、**その眼は横へ逸れている。**
      ⚠️ **この3秒は、二十年そのものである**——`draft_05-2`
      「二十年、だれも、絹を、まっすぐには見なかった」。
      ⛔ **ここで戸口に何かを置かない。** **まだ、何も来ていない。**
  - range: 3-6s
    density: transition
    what: >-
      **暗さのなかに、体の輪郭が立つ。** 歩いてきて、**閾のところで止まる。**
      ⚠️ **止まる位置が、この1本でいちばん重要である**——**越えない。**
      顔は読めない。**赤い光を返す二点だけが、こちらを向いている。**
  - range: 6-9s
    density: held
    what: >-
      **絹の眼が、戻る。** 逸れるのをやめる。⚠️ **そして、そのまま止まる。**
      `draft_05-2`「まっすぐな視線の先が、絹の顔のまんなかにあたっている。**そのあたりがすこしあつい**」。
      ⛔ **この最後の3秒で、絹は何もしない**——**動かないことが、この1本の到達である。**
      ⚠️ **そして観客は、ここで初めて、この作品の向きが変わったことを読む**——
      **`PLAN.md` §2「絹が壊してきた人生が、絹のほうへ歩いてくる」。**
      ⛔ **言葉で説明しない。** 台詞は無い（§0-f）。

# ⛔ **`reference_set` / `forbidden_set` / `attached` / `disclosure_state` は ③ が埋める。**
#    ⚠️ **この1本が ③ で引くことになる鍵の見込み**（**② の側の申し送り**）:
#    `暗室.base` / `暗室.geography` / **`盗人.identity`**。
#    ⛔ **`盗人.identity` を引くなら、③ は「眼だけが錨である」ことを負う**——
#    **この作品の否定集合に「顔を描くな」が要る**（`bible.negative_base` の核2節は
#    **娘の顔**を禁じているだけであり、**この者を禁じていない**）。
#    ⚠️ **② はここに判断を書かない。** **② が申し送るのは、
#    「この1本の顔は描かれない、という設計で書いた」ということだけである。**
#
# ════════════════════════════════════════════════════════════════════════
# ③ 台帳（2026-09-24）—— **この4欄は、台帳の一点から導出された。**
#
# ⚠️ **規則**——`reference_set` は「この枠が固定するもの」。`forbidden_set` は
#   「この枠に現れてはならないもの」。⛔ **`attached` は宣言であって記録ではない**
#   （`skills/ledger/SKILL.md` 手順8）——**実際に何が付いたかはテイクの側に在り、いまは空である。**
#   ⚠️ **ゆえに `attached` は `reference_set` と同じものを並べる。** 食い違えば `L6` が鳴る。
#
# ⚠️ **`forbidden_set` は届く**（§16 → §18 `Negative Prompt`、`engine/ledger/specmap.py`）。
#   ⛔ **ゆえに ③ は発明しない**——ここに書いたものは、**この1本の §18 が既に禁じているか、
#   台帳がまだ明かしていないか、作品が使い切ったもの**だけである。
#   ⚠️ **`forbidden_set` は「丸ごと」しか書けない**——部分を禁じる欄はこの基盤に無い
#   （`skills/ledger/SKILL.md`「Fields and rules that nobody reads」が名指す穴）。**穴は穴として記録する。**
#
# ⚠️ **`disclosure_state` は「その1本の時点で、観客が持っている状態の全部」である**
#   （`projects/hitosara/` の先例——**変化点の間は、直前の状態が続く**）。
#   ⛔ **台帳が宣言する値は「〜になった」の形である**——ゆえに**変化点より前の値は、
#   その否定の形で書く**（`明かされていない` / `反転していない` …）。
#   ⚠️ **初出は遷移ではない**（`L9`）——`世界.法` は S01 が初出であり、台帳の変化点は
#   **「遷移」ではなく「出発点」である。ゆえに `L9` は註で鳴る**——これは**期待どおり**である
#   （`skills/ledger/SKILL.md` 手順10）。
#
# ⚠️ **② の見込みに、③ が1つ足す**——**`絹.identity` を引く。**
#   ⛔ **理由——この1本の絹は、初めて顔が読める1本である**（§18「a calm sunken-eyed face…
#   her eyes are on the two points of light beyond it, open and readable」）。
#   ⚠️ **画像仕様も、この1本に絹の設定画を置いている**（`specs/image/migenzo-ch05-seg01.md`）。
#   ⛔ **② の見込みが挙げたのは盗人だけである。** ③ は**枠の内容を根拠に足す**——
#   **顔が読める1本に設定画を置かないのは、記録の側の穴である。**
# ⛔ **`盗人.identity` を引く以上、③ は「眼だけが錨である」ことを負う**（② の申し送り）。
#   ⚠️ **§18 が既に支払っている**——「no facial features on the figure at the threshold」
#   「no child in frame」「no child's body」。**肯定形の側も、眼以外を書かない。**
# ⛔ **`forbidden_set` が空である。** ⚠️ **これは「禁制が無い」ではない**——
#   **この1本では、禁じたいものが「部分」であり、この欄は「丸ごと」しか書けない**のである
#   （`skills/ledger/SKILL.md`「Fields and rules that nobody reads」が名指す穴）。
#   ⚠️ **娘の手と胴は禁制である**（§18「no small hand pressing the lens」「no child's body」）——
#   ⛔ **だが `娘` と書けば、この1本が枠に持っている「娘の眼」まで禁じることになる。**
#   **ゆえに、この1本の禁制は §18 の側だけが持つ。穴を記録し、欄を発明しない。**
# ⚠️ **申し送り（著者へ）**——**この1本には娘の眼が在る**（§18「they are a child's eyes」）。
#   ⛔ **台帳はこれを開示点に持たない**（`娘.手` は S11、`娘.一枚` は S03・S04）——
#   **眼は「手」ではないからである。** ⚠️ **台帳を直すのは ② でも ③ でもない。**

reference_set:
  - 暗室.base
  - 暗室.geography
  - 絹.identity
  - 盗人.identity
forbidden_set: []

attached:
  - 暗室.base
  - 暗室.geography
  - 絹.identity
  - 盗人.identity

disclosure_state:
  世界.法: 実演された
  娘.一枚: 失われた
  絹.位置: 反転した
  絹.加害: 知られていない
  絹.能動: 本人起点でない
  絹.信念: 揺らいでいない
  絹.決意: 定まっていない
  娘.手: 開示されていない
  絹.変化弧: 完結していない
  白: 像になる
