#    **赤い光が届くのは、トレイと引き出しと、そのまわりだけである**（`draft_09-1`）。
#    **③ は、`base` に「同じアートボード」を引き、そのうえで「光の島の外は闇」を否定形でなく
#    肯定形の側で持つ必要がある。** ⛔ **否定形は空欄になり、生成器が壁で埋める。**
