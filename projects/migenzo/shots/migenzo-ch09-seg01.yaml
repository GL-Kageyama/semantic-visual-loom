# 『未現像』第9章「最後の暗室」 / 余白 / still —— 宙づり。触れない
#
# **出典**
#   場所と光は `soul-voice-teller/examples/migenzo/草稿/draft_09-1_暗室.md`——
#   「赤い光が、**トレイをひとつ**照らす。**引き出しをひとつ**照らす。**そのほかは、なにも見えない。**」／
#   「**赤い光の届く範囲は、せまかった。光の届かない壁ぎわでは、二十年の闇が、
#   まだ、そこに沈んでいた。トレイと引き出しと、そのまわりだけが、赤く、浮かび上がって、
#   あとは、闇のなかに沈んだままだった。**」／
#   「赤い光のなかで、**ほこりがすこし浮いていて**、そのほこりも、二十年、動いていなかった空気のなかに、
#   **いま、ようやくすこし動きはじめていた**」。
#   液面と、この1本の内容は `草稿/draft_09-3_液面.md`——
#   「絹はフィルムを液面の上にかざす。**かざして、とどめる。沈めない。**
#   **沈めるという選択が、まだ絹の手のなかにある。**」／
#   「液面の表面に、**ごくうすい膜が張っていて**、その膜が、赤い光のなかで、すこし、きらめく。
#   二十年、動かなかった液の表面に、今夜、絹が戸を開けたときに動いた空気が、いま、すこし、
#   その膜のうえに、**波を作っている。波は、糸のように細く、トレイのふちからふちへ、
#   すこし走って、消える。**」／
#   「**液面が、絹の沈めるという手を待っている。**二十年の静けさは、絹を待っていなかった。
#   **今夜の液面は、絹の手を待っている。**」／
#   「絹の指は、もう、液面のすぐ上にあった。**あと、すこし。**
#   指を下ろせば、フィルムの端が、液に、触れる。」
#
# ⛔ **この記録は ② design のものである**（`PLAN.md` §3 手順1・2、2026-09-23 著者裁定）。
# ⚠️ **この記録は §1–20 を持たない。** 仕様は `spec:` の先である。
#
# ⛔ **この1本は変化点を持たない——これは空欄ではなく、決定である**（`PLAN.md` §2）。
#   ⚠️ **`ledger.disclosure` に `migenzo-ch09-seg01` の項が無いのは、書き落としではない。**
#   **10 は溜めである**——`PLAN.md` §1「山の作り方」の第2段——
#   「**09・10（8s＋10s）** — **言葉と、宙づり。**」⚠️ そして
#   「**11の `TRIGGER`（沈めること）が、この溜めで画面に置かれる。**」
#   ⛔ **ゆえに、この1本の仕事は「何も決めないこと」である。**
#   **開示の表に空欄を置くことが、この1本の記録である**（`ledger.disclosure` の註）。
#
# ⛔ **この1本の変化は、画面の側にだけ在る——そして、それは彼女の変化ではない。**
#   ⚠️ **変わってよいのは液面である**——基盤の註
#   「**止まるのは主題であって、光と粉塵と液は動く**」。
#   ⚠️ **この1本の主題は止まっている**（＝`still`）。**手も、フィルムも、動かない。**
#   ⛔ **そして、この1本の終わりに、選択は、まだ、なされていない。**
#   **宙づりのまま終わることが、この1本の内容である。**
#
# ⛔ **この1本の画面に、扉は入らない——そして、それは損失である。申告する。**
#   ⚠️ **第9章の冒頭は、この摘要版で2室に分けた理由そのものである**（`PLAN.md` §0-e）——
#   `draft_09-1`「絹は暗室の前に立つ。**最後の暗室。**二十年、開けなかった暗室。……
#   **戸の取っ手のうえに、ほこりがうすく積もっている。**」「**二十年分の闇が、
#   戸の向こうに待っていた。**」
#   ⛔ **だが `still` は、戸を開ける行為を撮れない。** ⚠️ **開くことは主題の運動である。**
#   ⚠️ **そして、この摘要版は1ショット1変化である**——
#   **戸を開ける画と、宙づりの画は、2つの変化である。**
#   ⛔ **ゆえに、この1本は「開いたあと」から始まる。**
#   ⚠️ **残るのは、戸が開いたことの痕跡としての、ほこりである**——
#   `draft_09-1`「二十年、動かなかったものが、いま、絹が戸を開けたことだけで、すこし、動きはじめた。
#   **絹の手の届くこの赤い光のなかだけ、二十年ぶりに、ものが、動きはじめた。**」
#   ⛔ **戸そのものは、この摘要版のどこにも無い。** **`PLAN.md` §1「落としたもの」に追記3として書く。**
#
# ⛔ **この1本の机のうえに、選択肢の残骸は、置かない——これも判断である。申告する。**
#   ⚠️ **`章立て.md` 第9章は、これを明示して要求している**——
#   「可能だった別の選択（**現像しないまま残す／焼く／誰かに託す**）の残骸を、暗室に並置する。
#   **葛藤を宣言でなく遂行（選択肢の残骸）として見せる**」。
#   ⚠️ **原文にはそれが在る**——`draft_09-2_選択.md`「絹は暗室のなかに、選べたはずのものを、ならべる。
#   **フィルムを戻す場所だった引き出し。火をつけて、灰にするためのマッチ。だれかに託すための封筒。**
#   ……**三つならべて、絹はその三つのあいだにフィルムを置いてみる**」
#   （マッチを一本手に取り、軸を親指で押し、机に戻す動作まである）。
#   ⛔ **だが、この1本は置かない。理由は3つ。**
#   **（1）この1本の画面は、トレイと、宙づりのフィルムと、液面である。**
#   **机のうえの三つを入れれば、この1本は2つの主題を持つ**（1ショット1変化）。
#   **（2）そして、それは②の発明になる**——⚠️ **この部屋の光は、源が次のように定めている**——
#   `draft_09-1`「**赤い光が、トレイをひとつ照らす。引き出しをひとつ照らす。
#   そのほかは、なにも見えない。**」⛔ **机を照らせば、私は源が照らしていないものを照らすことになる。**
#   **（3）そして、三つのうちのひとつは、既に画面に在る**——
#   ⚠️ **空の引き出しである。** `draft_09-2`「二十年、絹は引き出しを選んできた。
#   **その引き出しは、いま、空だ。**」⚠️ **引き出しは、源が照らす2つのうちの1つである。**
#   ⛔ **ゆえに、この1本は、残骸のうち「戻す場所」だけを、光の島の内側に置く**——
#   **空のまま。** ⚠️ **マッチと封筒は、暗さのなかにある**（**見えない、ではなく、撮らない**）。
#
# ⚠️ **この1本のフィルムは、筒から出ている——これは延伸であり、申告する。**
#   ⚠️ **原文の第9章は、フィルムの姿を「かざす」としか書かない**（`draft_09-3`）。
#   ⛔ **そして `ledger.props.未露光のフィルム` の外見は、この摘要版で唯一測られる寸法を持つ**
#   （S11 の `transformation` の `KEEP`＝「**フィルムの幅**」）。
#   ⚠️ **ゆえに ② は、この1本でフィルムを「幅の見える平らな一枚」として置く**——
#   **`draft_09-3`「フィルムの端が、絹の指の腹に、すこし、食い込んでいる」**が、
#   **端を持つということは、面が画面に在るということである。**
#   ⛔ **筒は、この枠に入らない。**（**入れば、この1本は「筒から出す」画になる。**）
#
# ⛔ **娘の手は、この1本でも禁制である**（`PLAN.md` §2——`no small hand pressing the lens` は
#   **01〜10 の10本が負う**。**落ちるのは 11 である**）。
#   ⚠️ **この1本は、像をまだ持たない**——**浮かぶのは次である。**

shot: migenzo-ch09-seg01

spec: specs/video/migenzo-ch09-seg01.md
key_image: specs/image/migenzo-ch09-seg01.md

unit:
  before: >-
    **闇のなかの、小さな赤い島である。** 島のなかにあるのは3つだけ——
    **現像トレイと、その琥珀の液面と、隣の壁の引き出し**（`draft_09-1`）。
    ⚠️ **引き出しは、開いたまま、空である**（`draft_09-2`）。
    液面は**一枚の皮のように張っていて**（`draft_09-3`）、そのうえに**ごくうすい膜**があり、
    **糸のように細い波が、ふちからふちへ走っては消えている**——
    二十年動かなかった液が、**今夜、戸が開いたことで、まだ、動いている**。
    **赤い光のなかに、ほこりが浮いていて、ゆっくり落ちていく。**
    ⚠️ **そして、液面のすぐ上に、絹の手がある。** 手は**未露光のフィルムを、幅の見える一枚として**
    つまみ、**かざしている**。⛔ **触れていない。** 液面は光を吸うので、
    **フィルムの影は、液面に落ちない**（`draft_09-3`）。
  after: >-
    **同じ枠。手は、同じ高さにある。** ⛔ **1センチも下がっていない。**
    ⚠️ **変わったのは、液面である**——**糸のような波が、もう一度、ふちからふちへ走り、
    そして、消える。** 消えたあと、**液面は、止まる**。
    ⚠️ **膜は、まだ張っている。** **ほこりは、まだ落ちている。**
    ⛔ **フィルムの端は、まだ、液に触れていない。**
    ⚠️ **ゆえに観客は、この1本の終わりで、何も知らされないまま、10秒を過ごしたことになる**——
    **その10秒が、この1本の仕事である。**

# 余白——**この1本の仕事は、耐えることである。**
#   ⚠️ **`rolemap.ROLES` の `余白` の固有基準は「耐えるか・張力の保持」である。**
#   ⛔ **ゆえに、この1本に出来事を置かない。** **何も起こらないことが、起こることである。**
#   ⚠️ **`PLAN.md` §1「山の作り方」の第2段**——「**09・10（8s＋10s）** — **言葉と、宙づり。**」
#   ⛔ **09 が言葉の側であり、この1本が宙づりの側である。**
role: 余白

place: 最後の暗室

time: 時刻を持たない（no time of day——この部屋の状態は光そのものである）

mode: still

duration: 10s

motion:
  subject: >-
    ⚠️ **主題は止まっている**——**絹の手と、つままれたフィルムは、動かない。**
    動くのは4つである。**（1）液面の膜のうえを走る、糸のように細い波**（`draft_09-3`）。
    **（2）赤い安全光のゆらぎ。** **（3）赤い光のなかを落ちていくほこり**——
    これは**二十年動かなかった空気の、はじめての運動である**（`draft_09-1`）。
    **（4）液面そのものの光りかた**——`draft_09-3`「液面は光を吸って、それでも、すこし光って見える」。
    ⛔ **この4つ以外に、動くものを置かない。**
  quality: >-
    遅い。小さい。**10秒で、出来事はゼロである。**
    ⚠️ **波は、`draft_09-3` の一行のままである**——「**糸のように細く、トレイのふちからふちへ、
    すこし走って、消える**」。⛔ **2度走らせる。3度は走らせない**——
    **3度目は、もはや波でなく、周期である。**
    ⚠️ **ほこりの落下は、`documentary-photo` の物理そのものである**——
    「**What moves is ordinary and small**」。
  law: >-
    `documentary-photo` の物理——**静止が地である。**
    ⚠️ カードの一行——「**Stillness is fully available … it is the form's native state.**」
    ⛔ **カメラは動かない。寄らない。** ⚠️ **寄れば、それは「宙づりの手」を強調する画になる**——
    **この1本の意味は、手が宙にあることではなく、液面が手を待っていることである**
    （`draft_09-3`「**今夜の液面は、絹の手を待っている**」）。
    ⛔ **ゆえに、カメラは、手と液面を、同格に置く。**
    ⚠️ **そして、この部屋の地理の法**（`ledger.locations.最後の暗室.geography`）——
    **光の届かない面は、沈んだまま暗い。**
    **この枠の外縁は、闇であって、壁ではない。**

beats:
  - range: 0-4s
    density: held
    what: >-
      **光の島。** トレイと、琥珀の液面と、空の引き出し。
      ⚠️ **そして、液面のすぐ上に、止まっている手と、つままれたフィルムの一枚。**
      ⛔ **この4秒で、何も始めない。** **波が、一度走って、消える。**
      ⚠️ **観客は、この4秒で「まだ沈んでいない」ことを知る。**
  - range: 4-7s
    density: transition
    what: >-
      **波が、もう一度、走る。** ⚠️ **それだけである。**
      **ほこりが、ひとつ、赤い光のなかを落ちていく。**
      ⛔ **ここで手を下げない。** **下げれば、この1本は 11 になる**——
      **11 はこの摘要版でいちばん長い1本であり、この1本の7秒目に始まってはならない。**
      ⚠️ **`draft_09-3`「**あと、すこし。**指を下ろせば、フィルムの端が、液に、触れる」**——
      **その「あと、すこし」を、この3秒が保つ。**
  - range: 7-10s
    density: held
    what: >-
      **液面が、止まる。** ⚠️ **膜が、まだ張っている。** **ほこりが、まだ落ちている。**
      ⛔ **そして、フィルムは、まだ、触れていない。**
      ⚠️ **この3秒が、`余白` の固有基準（「耐えるか・張力の保持」）の判定そのものである**——
      **耐えられるかどうかは、この3秒で観客が息を止めるかで決まる。**
      ⛔ **ここで、絹の顔を出さない。** **出せば、この1本は「迷っている顔」の画になる**——
      **`反応` は 12 の役である。**

