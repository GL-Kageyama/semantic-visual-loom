# 『未現像』第10章「現像」 / 運動（作画） / motion —— 沈める。そして、小さな手が浮かぶ
#
# **出典**
#   沈めることは `soul-voice-teller/examples/migenzo/草稿/draft_10-1_沈める.md`——
#   「絹はフィルムを液面に沈める。**二十年、沈めなかった。沈めないということが絹の二十年だった。
#   その二十年が、いま、沈めるという行為に変わる。**」／
#   「フィルムは冷たかった。……**琥珀の液が、フィルムの端からゆっくりとそれを飲んでいく。**
#   まず、端が液に触れる。**触れた瞬間、フィルムは液面に浮く。浮いて、とどまる。**
#   **液の膜が、二十年、沈められなかった一枚を、まだ、うえにとどめている。**
#   それから、液が端からフィルムにのぼっていく。**のぼる速さは、とても遅い。
#   液がフィルムの乳剤をひたしていく速さは、二十年を逆にたどっていく速さと同じくらい遅かった。**」／
#   「絹は液面を見る。液面のなかで、**白が身じろぎをする。**……**二十年、動かなかった白が、
#   いま、すこし動いた。** 白のなかのいちばん奥のところで、**うすい影が、すこし濃くなっている。**
#   影は、まだ、なにのかたちでもない。液のなかを、のぼってくる。**のぼってくるにつれて、
#   影の輪郭が、すこしずつ、ととのっていく。**」
#   浮かぶものは `草稿/draft_10-2_浮かぶ像.md`——
#   「顔の輪郭ではない。**背中だった。逃げる、背中。絹の背中だった。**……
#   **眼が浮かぶ。像のなかに、眼はない。娘の顔は、どこにも浮かばない。娘は映っていない。
#   顔があるはずの場所が、白い。その白のなかに、眼も、鼻も、口も、浮かばない。**
#   映っているのは、**逃げる絹と、レンズを内側から押さえる小さな手**だった。……
#   絹の背中のこちらがわにレンズがあって、**レンズのうえに小さな手がかぶさっている。
#   レンズの丸い黒いくちが、手のひらの下にすこし見えていて、その黒いくちを、手が、ふさいでいる。**」／
#   「**指のあいだから、赤い光がすこし漏れて、像のなかに線になって残っている。**
#   指のあいだの五つのすきまのうち、いちばん広いすきまから、赤い光がひとすじ漏れていて、
#   **そのひとすじが像のなかのいちばん明るい線になっている。**」
#   手の中身は `草稿/draft_10-3_小さな手.md`——
#   「その手は、レンズを押さえるまでに、**いちど迷っている。指がレンズの直前で止まっている。**
#   押すか、押さないか。**死の瞬間に、娘は迷った。その迷いが、像のなかに残っている。**
#   レンズと指とのあいだに、**ひとさしゆびぶんのすきまがある。**……
#   **そのすきまが、娘の迷いだった。**」／「押さえたあと、その手は、**離そうとした。**……
#   **押すというかたちと、離すというかたちの、ちょうどあいだで、指がとまっている。**」
#   そして、沈めたあとの状態は `草稿/draft_10-4_崩壊.md`——
#   「**像はまだ、濡れていた。**……**紙の角から、現像液が、ひとつ、したたって、トレイに落ちる。**」
#
# ⛔ **この記録は ② design のものである**（`PLAN.md` §3 手順1・2、2026-09-23 著者裁定）。
# ⚠️ **この記録は §1–20 を持たない。** 仕様は `spec:` の先である。
#
# ⛔ **この1本は `transformation` を名乗る**（`PLAN.md` §0-b）——
#   ⚠️ **理由は「沈めることが、その文法そのものである」からである**——
#   カード「**One thing becomes another without a cut and without a stated process —
#   the change is the shot**」。⚠️ **沈めるとは、まさに切らずに変わることである。**
#   ⛔ **ゆえに、この1本に切れ目を置かない。過程の段を置かない。主体を2つにしない。**
#   ⚠️ **文法の席は §9 ACTION と §11 MOTION である**（カードの `Sources`）——
#   **§6 に `REF_FORMAT` として名乗るのは ② の次の段である。**
#
# ⛔ **この1本は、この摘要版の山である**（`PLAN.md` §1「山の作り方」の第3段）。
#   ⚠️ **山を作っているのは、この1本の長さではない。手前の3段である**——
#   **08（指が止まる）／09（言葉・沈黙）／この1本の手前の3秒（宙づり）。**
#   ⛔ **ゆえに、この1本の14秒は、作った盛り上がりを受け止める側である。**
#   ⚠️ **`CORE` ビートが尺の30%を超える**——下の `beats` では **5-12s（7秒・50%）**である。
#
# ⛔ **この1本の変化は `娘.手 → 開示された` である**（`PLAN.md` §2、`ledger.disclosure`）。
#   ⚠️ **値は `開示された`**——**「明かされた」ではない。**
#   **明かす者が居るのではなく、沈めた結果として浮かぶのである。**
#   **この1本に行為者は1つだけ**（`TRIGGER`＝沈めること）。
#   ⛔ **そして、この1本は `negative: changed` を伴う。**
#   ⚠️ **10本が負ってきた `no small hand pressing the lens` が、この1本で落ちる。**
#   **動きかたは「削除」である**（hakuchizu の S08 は「入れ替え」だった——**同じ `changed` でも
#   中身が違う。写さない**）。
#   ⛔ **危険は減らない。** **手が主題になれば、こんどは手が描かれすぎる危険が立つ**——
#   **② が §16 と §18 に置くのは、その逆側の禁制である**（下の申し送り）。
#
# ⚠️ **この1本の主体が何であるかを、② は明記する——これは読みであり、申告する。**
#   ⛔ **源は、沈めるものを `フィルム` と書き**（`draft_10-1`）、
#   **浮かんだものを `紙` と書く**（`draft_10-4`「濡れた**紙**のうえで」「**紙**の角から、
#   現像液が、ひとつ、したたって」）。⚠️ **② は、この2つの呼び名のあいだの機構を発明しない。**
#   ⚠️ **そして、発明する必要も無い**——カードの一行が、この1本の読みそのものである——
#   「**the viewer watches two states be the same subject at different moments**」。
#   ⛔ **その「同じ」を作るのが `KEEP` である**（`PLAN.md` §0-b）——
#   **`KEEP`＝フィルムの幅と、手の大きさ。**
#   ⚠️ **ゆえに ② は、液面の上にかざされたフィルムの幅を、そのまま、浮かんでくる像の幅にする**
#   （**`ledger.props.未露光のフィルム` の註——「この物の幅は、この摘要版で唯一測られる寸法である」**）。
#   **幅が保たれれば、観客は「1つのものが続いている」と読む。**
#   ⛔ **そして、この1本は、担体の材質を主題にしない。** **主題は、幅と、手の大きさである。**
#
# ⛔ **泡を、この1本に置かない——これは判断である。申告する。**
#   ⚠️ **原文は泡を強く書いている**——`draft_10-1`「沈むたびに、液のなかで、二十年前の空気が
#   ひとつずつ浮いて弾ける。……**泡の数が二十をこえている。絹には、その泡のひとつひとつが、
#   二十年のどこかの時間に見える。**」「泡の、いちばん大きいのが、液面にのぼってきて、
#   そこで、すこしゆれて、弾ける。**弾ける瞬間、液面に、うすいしわが広がって、
#   トレイのふちにあたって、消える。**」
#   ⛔ **だが、この1本は泡を数えない。理由は3つ。**
#   **（1）カードが禁じている**——`avoid`「**A second subject changing at the same time**」。
#   **泡の列は、像とは別の、2つ目の変わるものである。**
#   **（2）「二十年」の意味は、既に 02 が持っている**——`PLAN.md` §1——
#   「**「二十年」が画面に要るのは、この1本（02）だけである**」。
#   ⚠️ **もう一度数えれば、この1本は 02 の反復を持つ1本になる。**
#   **（3）山は、ひとつでなければならない。** ⛔ **この1本の画面に在ってよいものは、
#   液面と、沈むものと、浮かぶものである。**
#   ⚠️ **そして、沈むときに液面が割れることは残す**（下の `beats`）——
#   **その1つだけが `TRIGGER` の署名である。**
#
# ⛔ **この1本の画面に、絹の顔は要らない——これも判断である。**
#   ⚠️ **原文の第10章は、彼女を像の前に立たせる**——`draft_10-4`「絹はその像の前に立っている。
#   立ったまま、動かない。……手はうごかない。絹も、うごかない。**ふたつ、うごかないものが、
#   赤い光のなかに向き合っている。**」
#   ⛔ **だが、それは 12 の画である**——**12 の役は `反応` であり、**
#   **`反応` の固有基準は「抑制・微細な身体・表情の段階」である。**
#   ⚠️ **この1本に顔を入れた瞬間、山の頂点が「彼女の表情」になる**——
#   **この摘要版の山は、彼女の中ではなく、液面の上にある。**
#   ⚠️ **この1本に居るのは、手だけである**（`FROM` でフィルムを沈める手）。
#   **手は `TRIGGER` を持つ者として居り、主題ではない。**

shot: migenzo-ch10-seg01

spec: specs/video/migenzo-ch10-seg01.md
key_image: specs/image/migenzo-ch10-seg01.md

# ⚠️ **`transformation` の4語を、ここに置く**（`PLAN.md` §0-b の表の写し）——
#    ⛔ **これは §1–20 ではない。** **文法の4語を、記録の側に残すだけである。**
#    **§9 ACTION と §11 MOTION が、これを散文に開く。**
#    ⛔ **生きた鍵として置かない——`shot-record.schema.json` は
#    `additionalProperties: false` であり、この4語の欄を持たない**（**S1 が鳴る。実測**）。
#    ⚠️ **5つめの語 `DURATION` は、この記録では `duration: 14s` である**（スキーマの欄がある）。
#    ⛔ **この穴は、② の綴りの問題ではない**——**カードの文法が、記録の側に家を持たないことである。**
#
# FROM: **液面の上にかざされた、未露光のフィルム。** ⚠️ **まだ、なにも始まっていない。**
#    **幅の見えている、平らな一枚である。** その端を、絹の指がつまんでいる——
#    `draft_10-1`「つまんだ力が、すこし、強すぎるのが、自分でも分かる。**それでも、ゆるめない。**」
# TO: **レンズを内側から押さえる小さな手を載せた、濡れた印画紙。**
#    ⚠️ **像のなかに、娘の顔は無い。** **顔があるはずの場所が、白い**（`draft_10-2`）。
#    在るのは、**逃げる絹の背中**と、**レンズの丸いくちをふさぐ小さな手**である。
#    ⚠️ **その手の指のあいだの、いちばん広いすきまから、赤い光がひとすじ漏れている**——
#    **それが、この像のなかのいちばん明るい線である。**
# KEEP: **フィルムの幅と、手の大きさ**（`PLAN.md` §0-b）。
#    ⚠️ **幅が保たれるから、この変化は置き換えでなく継続として読まれる**（カードの `do`）。
#    ⛔ **幅が変われば、この1本は「別の物が出てきた」1本になる。**
# TRIGGER: **沈めること。** ⚠️ **それは、この1本のなかで一度だけ起きる**（下の `beats` の 3-5s）。
#    ⛔ **`draft_09-3_液面.md`「絹の指は、もう、液面のすぐ上にあった」**——**この1本は、その状態から始まる。**

unit:
  before: >-
    最後の暗室の、光の島。**琥珀の液面が、一枚の皮のように張っている**——
    `draft_09-3`「**液面の表面に、ごくうすい膜が張っていて**」。
    ⚠️ **そのすぐ上に、フィルムがかざされ、絹の指がその端をつまんでいる。**
    **手は、沈めない。** ⚠️ **`draft_09-3`「沈めるという選択が、まだ絹の手のなかにある。」**
    ⚠️ **液面は、光を吸うので、フィルムの影を落とさない**
    （`draft_09-3`「**フィルムの影が液面に落ちない**」）——
    **ゆえに、この1本の最初の画には、影が無い。**
  after: >-
    **同じトレイ。同じ液面。** ⚠️ **液のなかに、像がある**——
    **濡れた印画紙のうえに、逃げる背中と、レンズを押さえる小さな手がある。**
    **娘の顔の場所は、白い。**
    ⚠️ **そして、紙の角から、現像液が、ひとつ、したたって、トレイに落ちる**（`draft_10-4`）。
    ⛔ **落ちたあと、画面は動かない。** ⚠️ **像は、像のまま、そこにある。**
    ⚠️ **ゆえに観客は、この1本の終わりで、初めて、娘が何をしたのかを知る。**

# 運動（作画）——**この一変化は、運動であり、運動そのものが画である。**
#   ⚠️ **限定 `作画` を使う。** 目録の `運動` の行が名前を持たないので、
#   **データが先に名を書く**（`rolemap.MOTION_PATTERNS`。`L15` は限定の側も引く）。
#   ⚠️ **`作画` の固有基準は「様式の物理への忠実・溜めと解放」である**——
#   **この1本が、まさにそれである。** ⛔ **絵が描かれるという意味ではない**
#   （**この作品は `no anime` / `no cel shading` / `no 2D drawing` を13本すべてで負う**。
#   `role` は生成器へ渡る文字列ではない——`specmap.FIELD_SOURCE` が `("added", None)`）。
#   ⚠️ **溜めは手前の3秒であり、解放は 5-12s である。**
role: 運動（作画）

place: 最後の暗室

time: 時刻を持たない（no time of day——この部屋の状態は光そのものである）

mode: motion

duration: 14s

motion:
  subject: >-
    **液面と、そのなかのもの**——**沈み、ひたされ、像が浮かぶこと**。
    ⚠️ **液面の上に在るもの（フィルム）と、液面のなかに在るもの（像）は、
    同じ1つのものの、2つの時点である**（`to` の読み）。
    ⚠️ **手は、`TRIGGER` を持つ者としてだけ、この枠に居る**——
    **沈め終われば、手は枠から出る。** ⛔ **それ以外に、人物はこの枠に入らない。**
  quality: >-
    **遅い。** ⛔ **この1本の速さが、この1本の全部である**——
    `draft_10-1`「**のぼる速さは、とても遅い。液がフィルムの乳剤をひたしていく速さは、
    二十年を逆にたどっていく速さと同じくらい遅かった。**」
    ⚠️ **ゆえに、この1本に加速を置かない。** **14秒は、14秒の速さで進む。**
    ⛔ **急がせれば、それは「作業」になる。** **この1本は、二十年が変わる1本である。**
  law: >-
    **カードの法が、この1本の法である**——
    「**The change is the time, and it is not compressed.**……
    **the shot spends its seconds on the passage itself, not on the states at either end.**」
    ⛔ **ゆえに、この1本は両端を長く持たない**（`FROM` は3秒、最後は2秒である）。
    ⛔ **切らない。ディゾルブを置かない。中間の段を据えて説明しない**
    （カードの `avoid` の3つ）。
    ⚠️ **そして `documentary-photo` の物理**——**カメラは眼の高さで立ち、見る。持つ。**
    ⛔ **動かない。寄らない。** **この1本の変化は液面のなかで起きるのであって、
    カメラのなかで起きるのではない。**

beats:
  - range: 0-3s
    density: held
    what: >-
      **宙づり。** 液面の上に、幅の見えているフィルム。**指が、その端をつまんでいる。**
      ⚠️ **この3秒は 09 の終わりと重なる**（09 は「触れない」で終わる）——
      ⛔ **ゆえに、ここで何も始めない。** **この3秒は、溜めの受け渡しである。**
      ⚠️ **液面は光を吸い、影を落とさない。**
  - range: 3-5s
    density: dense
    what: >-
      **沈める。** ⚠️ **`TRIGGER` は、ここで一度だけ起きる。**
      **端が液に触れる。触れた瞬間、フィルムは液面に浮き、とどまる**——
      `draft_10-1`「**液の膜が、二十年、沈められなかった一枚を、まだ、うえにとどめている。**」
      **それから、液が端からのぼっていく。** ⚠️ **液面が、いちど割れて、閉じる。**
      ⛔ **泡を数えない**（上の註）。**この1つの割れが、`TRIGGER` の署名である。**
  - range: 5-12s
    density: dense
    what: >-
      ⛔ **ここが `CORE` である（7秒・14秒の50%）。**
      **白が、身じろぎをする。** ⚠️ **何も浮かんでいない白の、いちばん奥で、
      うすい影が、すこし濃くなる。**
      ⚠️ **そして、影の輪郭が、ととのっていく**——`draft_10-1`「**影は、まだ、
      なにのかたちでもない。**……のぼってくるにつれて、**影の輪郭が、すこしずつ、ととのっていく。**」
      ⛔ **`章立て.md` 第1章の順序（輪郭→眼→口元）を、この1本に使わない。**
      **この1本に眼は浮かばない**——`draft_10-2`「**眼が浮かぶ。像のなかに、眼はない。**」
      ⚠️ **浮かぶ順序は、源が書いたとおりである**——**背中（肩の線 → 腕 → 開いた手）**、
      **そして、像のはしに小さな手**。
      ⚠️ **そして、この7秒の終わりに、この1本の答えが来る**——
      **レンズの丸い黒いくちを、小さな手がふさいでいる。**
      ⛔ **そこに、迷いが1つだけ置かれている**——`draft_10-3`
      「**レンズと指とのあいだに、ひとさしゆびぶんのすきまがある。……そのすきまが、
      娘の迷いだった。**」⚠️ **`PLAN.md` §1「落としたもの」の第3項が、
      これを「14秒のうちの1つの局面」として認めている。**
      **独立したショットにはしない。**
  - range: 12-14s
    density: held
    what: >-
      **像は、まだ、濡れている。** ⚠️ **紙の角から、現像液が、ひとつ、したたって、
      トレイに落ちる**（`draft_10-4`）。
      ⛔ **それ以外に、何も動かない。** ⛔ **カメラを寄せない**——
      **寄れば、それは「見つけた」という演技になる。**
      ⚠️ **この2秒が、答えを受け取る時間である。** **観客は、ここで初めて息をする。**

# ⛔ **`reference_set` / `forbidden_set` / `attached` / `disclosure_state` は ③ が埋める。**
#    ⚠️ **この1本が ③ で引くことになる鍵の見込み**（**② の側の申し送り**）:
#    **`最後の暗室.base`** / **`最後の暗室.geography`** / **`未露光のフィルム`** / **`印画紙`** /
#    **`絹.identity`**（**手だけである**）/ **`娘.identity`**（**この1本で初めて立つ**）。
#    ⛔ **申し送りが4つある。**
#    **（1）`no small hand pressing the lens` が、この1本で落ちる**
#    （`ledger.disclosure` の `migenzo-ch10-seg01`、`negative: changed`）。
#    ⛔ **削除であって、入れ替えではない。** ⚠️ **そして、落としたぶんの危険は、
#    逆側に立つ**——**手が主題になれば、像のなかの手が描かれすぎる。**
