# 『未現像』第11章「受け取る」 / 反応 / still —— 白は、判決を下さない
#
# **出典**
#   本文は `soul-voice-teller/examples/migenzo/草稿/draft_11-3_娘の顔.md`——
#   「絹は像を見る。像のなかに、娘の顔はない。手はある。レンズを押さえる小さな手。逃げる背中はある。
#   絹の背中。けれど、娘の顔はない。……**その場所だけが、白い。白い場所の輪郭は、ない。
#   どこまでが白で、どこからが像か、その境目が、液のなかで、とけている。**」／
#   「**とけた境目のあたりで、白が、すこしゆれている。ゆれる白のなかを、赤い光が、すこし流れて、
#   とまる。流れた光のあとが、白のなかに、すこしのこって、消える。消えるまでのあいだ、
#   白のなかに、顔のかたちがあるように見えて、やはり、ない。**
#   **見える、と、ない、のあいだを、光が、すこしゆれながら、通りすぎていく。**」
#   受ける手は `草稿/draft_11-1_二重の真実.md`——
#   「**絹の手が、像の四隅をおさえている。**四隅の紙が、液で、すこしそっている。
#   そのそりを、指でおさえている。……**四本の指の、いちばん外の小指が、紙の角の、すこしうえで、
#   浮いている。浮いた小指の下を、赤い光が、すこし、通りぬけている。**」／
#   「**動かない、ということが、像の答えであるように、絹には、思える。けれど、動かないということは、
#   答えではない。ただ、二十年、そうだったという、ことだけだった。**」
#   そして、この章に残るものは `草稿/draft_11-2_白.md`——
#   「**白は判決を下さない。愛だ、とも、留置だ、とも、白は言わない。**……
#   返さない、ということが、白の返しだった。」
#
# ⛔ **この記録は ② design のものである**（`PLAN.md` §3 手順1・2、2026-09-23 著者裁定）。
# ⚠️ **この記録は §1–20 を持たない。** 仕様は `spec:` の先である。
#
# ⛔ **この1本の変化は `絹.変化弧 → 完結` である**（`PLAN.md` §2、`ledger.disclosure`）。
#   ⚠️ **値は `完結`**——`章立て.md` の一行の写しである
#   （「絹の変化弧が完結（**現像＝加算の誤解 → 現像＝崩壊 → 崩壊の受容**）」）。
#   ⛔ **3つの語を、この記録に並べない**（`ledger.disclosure` の註——**属性の値は状態であって、
#   経過ではない。経過は §7 と §15 が持つ**）。
#   ⚠️ **ゆえに、この1本が撮るのは「受容」という状態である。**
#
# ⛔ **この1本の変化は、彼女のなかで起きる——そして、それは画面の外である。**
#   ⚠️ **源が書く受容は、冷たさである**——`draft_11-4`「**冷たい。**二十年、冷えていた、
#   その冷たさを、絹は掌で受け取る。冷たさが、絹の掌から、手首へ、腕へ、すこし、のぼっていって、
#   二十年、動かなかった、絹のからだのなかのどこかに、すこし、入っていく。」
#   ⛔ **温度は画面に無い。** ⚠️ **ゆえに、この1本の可視の変化は、彼女でなく白の側に置かれる**——
#   **下の一行である。**
#
# ⛔ **この1本の可視の変化は、白を横切る光である。**
#   ⚠️ **そして、それは源が書いたことそのものである**——`draft_11-3`——
#   「**消えるまでのあいだ、白のなかに、顔のかたちがあるように見えて、やはり、ない。**」
#   ⛔ **この1本に顔は出ない。** **出るのは「出かけて、出ない」という1つの出来事である。**
#   ⚠️ **そして、その出来事が、`PLAN.md` §1 の一行そのものである**——
#   「**崩壊を受け取る。愛か暴力かは、決まらない。**」
#   ⛔ **決まらないことは、撮れる。** **決まらないことを「決まった」と撮るのが誤りである。**
#
# ⚠️ **この1本の反応は「動かないこと」である——これは読みであり、申告する。**
#   ⚠️ **`rolemap.ROLES` の `反応` の固有基準は「抑制・微細な身体・表情の段階」である。**
#   ⛔ **この1本に、表情を置かない。** **置けば、受容が「彼女の表情」になる。**
#   ⚠️ **`draft_11-1`「動かない、ということが、像の答えであるように、絹には、思える」**——
#   **この1本は、その一行を、彼女の側で実演する。**
#   **指は、最後まで、同じ場所にある。**
#
# ⛔ **この1本の画面に、絹の顔をも、もう一方の手をも、置かない——これは判断である。**
#   （1）**顔**——⚠️ **源の第11章は、彼女に手と冷たさを与え、顔を与えていない**
#   （`draft_11-4` は掌・手首・腕までしか書かない）。**表情の段階は、この1本の担い手ではない。**
#   （2）**手を重ねる動作**——⚠️ **`draft_11-4` は「像の小さな手の上に、自分の手を重ねる」と書く。
#   ⛔ だが、この1本は `still` であり、重ねることは運動である**——
#   **そして、それを撮れば、この1本の変化が「彼女が触れた」になり、`所作` の1本になる。**
#   ⛔ **さらに悪いことに、像の小さな手と絹の手が同じ枠で重なれば、
#   生成器は2つの手を1つに溶かしうる**（**依頼の法「誤解させない」に最も反する形である**）。
#   ⚠️ **ゆえに、この1本に在る手は、紙の角をおさえる4本の指だけである。**
#   ⛔ **重ねる画は、この摘要版に無い。** **損失として、§1「落としたもの」に追記3で書く。**
#
# ⚠️ **`draft_11-3` にも、手が伸びて止まる動作がある——② は、これを外す。**
#   ⚠️ **原文**——「絹はその白に手を伸ばす。**触れない。触れる一歩手前で、とどまる。**……
#   指のさきの、現像液の、ひとしずくが、白のうえで、ゆれている。**ゆれて、落ちそうで、落ちない。**」
#   ⛔ **これは 08 と同族である。** ⚠️ **そして `PLAN.md` §1 の追記は、この族を
#   「4箇所＋変種1」と数えている**（`draft_03-2`・`draft_04-3`・`draft_06-3`・`draft_07-2`、
#   および `draft_08-3` の変種）。**この記録が、その数を1つ増やす**——
#   ⛔ **数を書いた以上、数え直しが要る。** **`PLAN.md` §1 の追記に、この1件を追記する。**
#   ⚠️ **ゆえに、この1本の4本の指は、伸びない。** **すでに、そこに在る。**

shot: migenzo-ch11-seg01

spec: specs/video/migenzo-ch11-seg01.md
key_image: specs/image/migenzo-ch11-seg01.md

unit:
  before: >-
    最後の暗室の、光の島。**トレイの液のなかに、まだ濡れている印画紙がある**——
    **像のなかに、逃げる絹の背中と、レンズを押さえる小さな手がある。**
    ⚠️ **そして、顔があるはずの場所がある。** **その場所だけが、白い。**
    ⚠️ **境目が、とけている**——`draft_11-3`「**どこまでが白で、どこからが像か、
    その境目が、液のなかで、とけている。**」⛔ **ゆえに、この1本の最初の画では、
    白と像のあいだに、線が1本も無い。**
    ⚠️ **紙の手前の角に、絹の4本の指がある。** **いちばん外の小指が、紙の角の、すこしうえで、
    浮いている。** ⚠️ **その小指の下を、赤い光が通っている。**
  after: >-
    **同じ枠。指は、1本も動いていない。**
    ⚠️ **変わったのは、白である**——**赤い光が、白のなかを横切って、行ってしまった。**
    ⛔ **そして、光のあとに、何も残っていない。**
    ⚠️ **白のなかに、顔のかたちは、無い。** **見えかけて、無かった。**
    ⚠️ **境目も、無いままである。** **白は、ひとつの白である。**
    ⛔ **ゆえに観客は、この1本の終わりで、何も決まらないことを知る**——
    **`draft_11-2`「白は判決を下さない。愛だ、とも、留置だ、とも、白は言わない。」**

# 反応——**この1本の仕事は、抑制である。**
#   ⚠️ **`rolemap.ROLES` の `反応` の固有基準は「抑制・微細な身体・表情の段階」である。**
#   ⛔ **この1本に、表情を置かない**（上の註）。
#   ⚠️ **抑制の担い手は、動かない4本の指である。**
#   **そして、この1本の変化は、彼女ではなく、白のほうで起きる。**
role: 反応

place: 最後の暗室

time: 時刻を持たない（no time of day——この部屋の状態は光そのものである）

mode: still

duration: 8s

motion:
  subject: >-
    ⚠️ **主題は止まっている**——**4本の指は、1本も動かない。像も、動かない。**
    動くのは3つである。**（1）白を横切っていく赤い光**——**これが、この1本の変化である。**
    **（2）白の、とけた境目のゆれ**（`draft_11-3`「とけた境目のあたりで、白が、すこしゆれている」）。
    **（3）液面の、ごくうすい動き。**
    ⚠️ **浮いた小指の下を、赤い光が通りぬける**（`draft_11-1`）——
    **これも光の運動であって、彼女の運動ではない。**
  quality: >-
    わずか。遅い。**8秒で、彼女の動きはひとつも無い。**
    ⚠️ **光の横断は、この8秒のうち4秒かける**（下の `beats` の 3-7s）——
    **速く通せば、それは「ちらつき」であり、`draft_11-3` の「見える、と、ない、のあいだ」が消える。**
    ⛔ **「見えかけて、無い」が読めるためには、光が遅くなければならない。**
  law: >-
    `documentary-photo` の物理——**静止が地である。**
    ⚠️ カードの一行——「**Stillness is fully available … it is the form's native state.**」
    ⛔ **カメラは動かない。寄らない。** ⚠️ **寄れば、それは「白を確かめる」画になる**——
    **この1本は、確かめない。**
    ⚠️ **そして、この部屋の地理の法**（`ledger.locations.最後の暗室.geography`）——
    **光の届かない面は、沈んだまま暗い。**
    ⛔ **ゆえに、白は、闇のなかの光の島の、いちばん明るいところにある**——
    **この1本の明るさは、白そのものではなく、白が在る場所である。**

beats:
  - range: 0-3s
    density: held
    what: >-
      **濡れた印画紙。** 背中。**レンズを押さえる小さな手。**
      ⚠️ **そして、顔があるはずの場所の、境目のない白。**
      **手前の角に、4本の指。** ⚠️ **小指が、浮いている。**
      ⛔ **この3秒で、何も始めない。** **観客は、像を読む時間を持つ。**
  - range: 3-7s
    density: transition
    what: >-
      **赤い光が、白のなかへ入っていく。** ⚠️ **そして、横切る。**
      `draft_11-3`「**消えるまでのあいだ、白のなかに、顔のかたちがあるように見えて、
      やはり、ない。**」
      ⛔ **ここに顔を描かせない。** ⚠️ **これは `bible.negative_base` の核の実演である**——
      **見えかけて、無いことこそが、この1本の内容である。**
      ⚠️ **光は、この4秒の終わりに、白の外へ出て、とまる。**
  - range: 7-8s
    density: held
    what: >-
      **光のあとに、何も残っていない。** ⚠️ **境目も、無い。**
      **指は、まだ、同じ場所にある。**
      ⛔ **ここで彼女を動かさない。** **息ひとつ、置かない**——
      **息を置けば、それは `所作` になる**（**08 の役である**）。
      ⚠️ **この1秒が、`draft_11-1` の一行の実演である**——
      「**動かない、ということが、像の答えであるように、絹には、思える。
      けれど、動かないということは、答えではない。**」

# ⛔ **`reference_set` / `forbidden_set` / `attached` / `disclosure_state` は ③ が埋める。**
#    ⚠️ **この1本が ③ で引くことになる鍵の見込み**（**② の側の申し送り**）:
#    **`最後の暗室.base`** / **`最後の暗室.geography`** / **`印画紙`** / **`絹.identity`**（**指だけである**）。
#    ⛔ **申し送りが3つある。**
#    **（1）`娘.identity` を、この1本でも引くかどうかは ③ が決める。**
#    ⚠️ **引く理由**——**像のなかの小さな手が、この1本にも在る**（11 で浮かんだものは消えていない。
#    消えるのは 13 である）。
#    ⛔ **引かない理由**——**この1本の主題は、白であって、手ではない。**
#    ⚠️ **どちらでも成立する。② は決めない**（**`reference_set` は ③ のものである**）。
#    ✅ **③ の裁定（2026-09-24）——引かない**（理由3つは `specs/video/migenzo-ch11-seg01.md` §19）。
#    **（2）`no small hand pressing the lens` は、この1本には掛からない**——
#    ⚠️ **11 で落ちた**（`negative: changed`）。**ゆえに像のなかの手は、禁制の外にある。**
#    ⛔ **だが、危険は逆側にある**（11 の申し送り(1)と同文）——
#    **手が描かれすぎる。** ⚠️ **この1本では、さらに、紙の角の4本の指と像のなかの小さな手が
#    同じ枠に同居する**——⛔ **③ と §18 は、この2つを別々のものとして書く必要がある。**
#    **（3）娘の顔は、この1本でも出ない。**
#    ⚠️ **そして、ここでは「出ない」ことが主題である**——**光が横切って、何も残さない。**
#    ⛔ **`no fully rendered face of the daughter` を、この1本の禁制集合から外さない。**
#
# ════════════════════════════════════════════════════════════════════════
# ③ 台帳（2026-09-24）—— **この4欄は、台帳の一点から導出された。**
#
# ⚠️ **規則**——`reference_set` は「この枠が固定するもの」。`forbidden_set` は
#   「この枠に現れてはならないもの」。⛔ **`attached` は宣言であって記録ではない**
#   （`skills/ledger/SKILL.md` 手順8）——**実際に何が付いたかはテイクの側に在り、いまは空である。**
#   ⚠️ **ゆえに `attached` は `reference_set` と同じものを並べる。** 食い違えば `L6` が鳴る。
#
# ⚠️ **`forbidden_set` は届く**（§16 → §18 `Negative Prompt`、`engine/ledger/specmap.py`）。
#   ⛔ **ゆえに ③ は発明しない**——ここに書いたものは、**この1本の §18 が既に禁じているか、
#   台帳がまだ明かしていないか、作品が使い切ったもの**だけである。
#   ⚠️ **`forbidden_set` は「丸ごと」しか書けない**——部分を禁じる欄はこの基盤に無い
#   （`skills/ledger/SKILL.md`「Fields and rules that nobody reads」が名指す穴）。**穴は穴として記録する。**
#
# ⚠️ **`disclosure_state` は「その1本の時点で、観客が持っている状態の全部」である**
#   （`projects/hitosara/` の先例——**変化点の間は、直前の状態が続く**）。
#   ⛔ **台帳が宣言する値は「〜になった」の形である**——ゆえに**変化点より前の値は、
#   その否定の形で書く**（`明かされていない` / `反転していない` …）。
#   ⚠️ **初出は遷移ではない**（`L9`）——`世界.法` は S01 が初出であり、台帳の変化点は
#   **「遷移」ではなく「出発点」である。ゆえに `L9` は註で鳴る**——これは**期待どおり**である
#   （`skills/ledger/SKILL.md` 手順10）。
#
# ⛔ **② の申し送り(1)への ③ の答え——`娘.identity` を引かない。**
#   ⚠️ **理由3つ。** ① **この1本の主題は白であって、手ではない**（② の申し送り自身が
