# 『未現像』第3章「未露光」 / 開示 / still —— 引き出しのなかの一枚が、二十年ひらかれないまま在る
#
# **出典**
#   本文は `soul-voice-teller/examples/migenzo/草稿/draft_03-2_未露光.md`——
#   「暗室の奥に引き出しがある。絹は現像を終えるたび、その引き出しを開けない。開けないまま、二十年になる。
#   ……二十年、だれも開けていないから、**木は乾いて、すこし白くなっている。木の肌が、ささくれている**」。
#   ⚠️ 章の最後の一行：`draft_03-2`「フィルムはなにも写っていない。
#   けれど、**なにも写っていないその白さが、二十年、絹のなかでいちばん重い**」。
#
# ⛔ **この記録は ② design のものである**（`PLAN.md` §3 手順1・2、2026-09-23 著者裁定）。
# ⚠️ **この記録は §1–20 を持たない。** 仕様は `spec:` の先である。
#
# ⛔ **この1本に「指」は入らない——これは判断であり、申し送りを伴う。**
#   ⚠️ **原作は「指が止まる」動作を3箇所に置いている。**
#     ・`draft_03-2`「絹は引き出しの前で立ち止まる。**手を伸ばす。伸ばして、戻す。**
#        ……指が、**取っ手のひとつ手前の乾いた木のところでとまる**」
#     ・`draft_04-3`「絹はその脂痕に触れない。**指をのばしかけて、とめる。**」
#     ・`draft_07-2`「絹は筒に手を伸ばす。**指が筒に触れる一歩手前で、とまる。**」
#   ⛔ **そして `PLAN.md` §1 は、これを 08 の1本に定めている**——
#   「**指がフィルム筒の手前で止まり、引っ込む**（動けるのに、動かない）」。
#   ⚠️ **`PLAN.md` §1「山の作り方」の第1段が、まさにその1本である**——
#   「**08（9s・motion）— 指が止まる。** 絹は動ける。触れれば開けてしまう。
#    ⚠️ **ここで観客は『この人は、動かないことを選べる人だ』と身体で覚える。**」
#   ⛔ **3箇所すべてを撮れば、08 は山の第1段でなくなる**——**同じ動作の3度目になる。**
#   ⚠️ **ゆえに、この1本は指を出さない。** 伸ばす動作は 08 が持つ。
#   ⚠️ **これは損失である。** `PLAN.md` §1「この摘要版が落としたもの」に追記した。
#
# ⛔ **この1本に人物は入らない——同じ判断の続きである。**
#   ⚠️ `draft_03-2` は「絹は引き出しの**前で立ち止まる**」と書き、`draft_03-4` は
#   「暗いまま、**引き出しの前に立つ**」と書く。**絹はこの章に立っている。**
#   ⛔ **それでも、この1本の主題は物である**——`PLAN.md` §1 の一行が
#   「**引き出しのなかの一枚が、二十年ひらかれないまま在る**」と、**物を主語にしている。**
#   ⚠️ **そして、絹を立てれば、この1本は「絹が開けない1本」になる**——
#   **それは 08 である**（絹が筒の手前で指を止める1本）。**同じ部屋で、同じ引き出しで、
#   同じ「開けない」を2度やることになる。**
#   ⚠️ **ゆえに、この1本は引き出しだけを撮る。** 誰も居ない部屋に、
#   **二十年、だれの手も触れていない木がひとつある**——**それが開示である。**
#
# ⚠️ **この1本の変化は、開示の側にある。** `PLAN.md` §2——
#   「`娘.一枚` → `在ることが明かされた`」／観客が知ること「**絹には、二十年ひらかない一枚がある**」。
#   ⛔ **物理的な出来事は1つも起きない。** `unit` に書くのは**「何が変わったか」ではなく
#   「何が見えるようになったか」である**——⚠️ **`PLAN.md` §2 が「観客が知ること」の列を持っている以上、
#   開示のショットの変化はそこに在る。** ⚠️ **02 が変化点を持たないのと対である**（`PLAN.md` §2）。
#
# ⚠️ **モードは `still` である**（`PLAN.md` §1）。**主題が止まる**——
#   そして**この1本では、ほとんど何も動かない**。`draft_03-2`
#   「二十年、この空気は、動かなかった。絹が手をのばして、戻すたびに、空気が、すこしだけ、動いて、また、とまる」。
#   ⛔ **絹が居ないので、空気を動かす者も居ない。** **この1本の空気は、8秒間とまっている。**

shot: migenzo-ch03-seg01

spec: specs/video/migenzo-ch03-seg01.md
key_image: specs/image/migenzo-ch03-seg01.md

unit:
  before: >-
    暗室の奥。**乾いて白くなった木の引き出し**が、閉じている。
    木はこの部屋のほかのどの木よりも白い——二十年、湿気を知らない木である。
    ⚠️ **だが、まだそれは、ただの奥行きである**——暗い奥に、木の箱がひとつあるだけである。
  after: >-
    **同じ引き出しが、この部屋でいちばん乾いたものとして、画面にある。**
    白いささくれの一本一本まで赤い光を受けて立っている。
    ⚠️ **変わったのは引き出しではない。変わったのは、それが何であるかである**——
    **この部屋で唯一、絹の手が触れない木**が、8秒のあいだそこに置かれる。
    ⛔ **木は1ミリも動かない。** なかに在る一枚も、この1本では姿を見せない。

# 開示——**この1本の仕事は、一枚の在ることを、物の乾きで示すことである。**
# ⚠️ **説明しない。** `world.md`「説明しない。三則は各章の『現像の行為』そのもので示す。」
# ⚠️ **この1本には、その代わりに「乾き」がある**——**二十年、開かなかったことが、
# 木の表面に残っている。** それだけが、この1本の語りである。
role: 開示

place: 暗室

time: 時刻を持たない（no time of day——この部屋の状態は光そのものである）

# ⚠️ `PLAN.md` §1 の表は motion 7本・still 6本である。**これがその still の1本目である。**
mode: still

duration: 8s

motion:
  subject: >-
    **赤い安全光のゆらぎ**、それだけである。⚠️ **主題（引き出し）は止まっている。**
    ⛔ **埃を足さない**——この部屋は `no window` であり、埃の源が無い。
    ⛔ **空気も、この8秒では動かない**（`draft_03-2`「二十年、この空気は、動かなかった」）。
    ⚠️ **絹が居ないからである**——**空気を動かす者を、この1本は画面に置いていない。**
  quality: >-
    わずか。速くならない。⚠️ **「止まっている絵」に見せない**——
    光が息をしている程度の、いちばん小さい運動を残す。
    ⛔ **`still` は「動きが無い」ではない。** 基盤の註がそう言う——
    「**止まるのは主題であって、光と粉塵と液は動く**」。
  law: >-
    `documentary-photo` の物理——「**Stillness is fully available … it is the form's native state.**」
    ⚠️ **この1本は、その様式のいちばん得意な場所に立っている。**
    ⛔ **カメラは動かない。** ⚠️ **寄りもしない**——寄れば「何かが起きる」と予告することになる。

beats:
  - range: 0-3s
    density: held
    what: >-
      暗い奥。**引き出しの輪郭だけが見えている。** 取っ手の形が、赤い光のなかで、
      ほかの何よりも乾いて見える。⚠️ **この3秒は、まだ何も言わない**——
      `draft_03-2`「待っている、というのが、正確ではない。**ものは、待たない。置かれている、だけだ。**」
  - range: 3-6s
    density: sparse
    what: >-
      赤い光がわずかに揺れ、**木の肌のささくれが浮かぶ。** 白いとげのように、一本ずつ。
      `draft_03-2`「ささくれに、赤い光がすこしかかって、**白いとげのように、浮かんでいる**」。
      ⚠️ **この1本の主題は、この3秒で立つ**——**二十年、開いていない木の肌**である。
  - range: 6-8s
    density: held
    what: >-
      **動かない。** 光だけが少しずれる。⚠️ **そのまま終わる。**
      ⛔ **ここで引き出しを開けない。** **開くのは 04 である。**
      ⚠️ **そして、この1本の最後に残るのは、木の白さだけである**——`draft_03-2`
      「なにも写っていないその白さが、**二十年、絹のなかでいちばん重い**」。
      ⚠️ **その白さは、この1本では木の側に置かれている**（なかの一枚は、まだ出てこない）。
      ⛔ **出せば、幹の答えに触れる。** `PLAN.md` §2「幹の答えを第9章以前に出さない」。

# ⛔ **`reference_set` / `forbidden_set` / `attached` / `disclosure_state` は ③ が埋める。**
#    ⚠️ **この1本が ③ で引くことになる鍵の見込み**（**② の側の申し送り**）:
#    `暗室.base` / `暗室.geography` / `引き出し`。
#    ⛔ **人物の鍵を、ここに置かない。** **この1本に人物は入らない。**
#    ⚠️ **そして `引き出し` という鍵が台帳に在るかどうかは、② は知らない**——
#    **② が申し送れるのは「この1本はこの物を主題にした」ということだけである。**
