# 『未現像』第6章「二人目・三人目」 / 所作 / motion —— 差し出す。そして、代償だけが像に残る
#
# **出典**
#   本文は `soul-voice-teller/examples/migenzo/草稿/draft_06-4_差し出す.md`——
#   「**トレイに液を注ぐ。**……**フィルムを沈める。沈めたフィルムの上を、液の表面が、
#   すこし、ゆれて、とまる。**」／「**現像するたび、記憶をひとつ失う。**二十年、絹は現像で
#   記憶を失い続けてきた。**いま、絹は、自分の意志で、記憶をひとつ差し出す。**」／
#   「抜けていく音を、絹は、追わない。今日、絹は、それを置いていく。**抜けていく音は、
#   娘の声の、いちばん高い一音だった。**」／「**置いた音のぶん、トレイの液が、すこし冷たくなる。**」
#   ⚠️ **代償の形は `草稿/draft_01-3_脂痕.md` と `構想/foreshadowing.md` が定める**——
#   「**脂痕は三度戻る**（場面1→4→5）」。**この1本がその三度目である**（`ledger.props.脂痕`）。
#   ⚠️ **文法は `semantic-visual-loom/references/formats/meaning-responsive.md`**——
#   `BEARER`＝絹の手／`ANSWER`＝像の縁に滲む脂痕／`DELAY`＝遅れ／`LIMIT`＝絹の顔には届かない。
#
# ⛔ **この記録は ② design のものである**（`PLAN.md` §3 手順1・2、2026-09-23 著者裁定）。
# ⚠️ **この記録は §1–20 を持たない。** 仕様は `spec:` の先である。
#
# ⛔ **この1本の変化は「絹が、自分から差し出す」である**（`PLAN.md` §2、
#   `絹.能動 → 本人起点になった`）。⚠️ **値は「能動的になった」ではない**——
#   「本人起点になった」である。**ゆえに、この1本が撮るのは能力ではなく起点である。**
#   ⛔ **そして `PLAN.md` §2 の註——「幹には触れない」。**
#   この1本は**絹が動く1本**であって、**娘の一枚は、まだ何も明かさない。**
#
# ⛔ **この1本の核心は、失われるものが画面に無いことである。**
#   ⚠️ **絹が失うのは音である**——`draft_06-4`「娘の声の、いちばん高い一音」。
#   ⛔ **そして `PLAN.md` §0-f が、この摘要版の音を全部捨てている。**
#   ⚠️ **ゆえに、この1本は「失われた」と言えない**——**言えるのは世界のほうだけである。**
#   ⚠️ **それが `meaning-responsive` の文法である**——
#   「**The picture changes because of what it means, not because of what happened**」。
#   **意味は絹の手に在り、答えは像に在る。⛔ そして、その間の因果が、画面から抜かれている。**
#
# ⛔ **画中の何も、この答えを起こさない——これは文法の要求である**（カード）——
#   「**nothing in the frame causes the answer.** No object moves into the frame,
#   no light source changes, **no one acts**.」
#   ⚠️ **手は意味を持つ。⛔ だが、手は答えを作らない。**
#   **脂痕は、絹が指で置くものではない**（`draft_04-3` の渦は「だれか」のものであり、
#   `draft_01-3` の脂痕は**像の縁に滲む**——**塗られるのではなく、滲む**）。
#   ⛔ **ゆえに、この1本に「指で触れる」動作を置かない。** **触れれば、因果が画面に戻る。**
#
# ⛔ **LIMIT は「絹の顔には届かない」である。⚠️ そして、それは画面で読める形を持つ**——
#   **答えは像の縁で止まる。** ⚠️ 液は変わらない。光は変わらない。**部屋は何も変わらない。**
#   ⛔ **カードの `avoid`——「Answering everywhere at once, so the answer reads as a colour grade」。**
#   **答えが広がれば、それは代償でなく色被りになる。**
#   ⚠️ **ゆえに、この1本の変化は、画面のなかの数センチに閉じている。**

shot: migenzo-ch06-seg02

spec: specs/video/migenzo-ch06-seg02.md
key_image: specs/image/migenzo-ch06-seg02.md

unit:
  before: >-
    現像トレイ。琥珀の液面。**その上に、絹の手が、小さなフィルムをかざしている。**
    ⚠️ **この1本が始まる前、彼女はまだ何も失っていない**——
    フィルムは、まだ液に触れていない。乾いている。
    ⚠️ **見えているのは、手と、フィルムと、液と、赤い安全光だけである。**
  after: >-
    **沈み終えたフィルムの上で、液面がとまっている。** ⚠️ そして、
    **像の縁に、脂痕が滲んでいる**——`ledger.props.脂痕`
    「像の縁に、滲みとして残る（S01・S07）」。
    ⚠️ **絹は、指を触れさせていない。** 置いたのは記憶である——
    そして**滲んだのは、置いた側の痕である**（`構想/world.md`
    「**代償の痕跡が、唯一の生身の証拠になる**」）。
    ⛔ **液は、変わっていない。** **光も、変わっていない。** **彼女も、画面に居ない。**

# 所作——**この1本の仕事は、手が動くことである。**
# ⚠️ **`PLAN.md` §1 の註——07 と 08 は同じ役（所作）であり、それは意図である**——
#   **「手が動く1本と、手が止まる1本」。** ⛔ **ゆえに、この1本に「止まる」を置かない。**
#   **止まるのは 08 である。** ⚠️ **ここで手が止まれば、08 の山の第1段が、この1本で消費される。**
role: 所作

place: 暗室

time: 時刻を持たない（no time of day——この部屋の状態は光そのものである）

mode: motion

duration: 10s

motion:
  subject: >-
    **絹の手**——`BEARER`。⚠️ **そして、その手がフィルムを沈めること**、
    **沈めたあと、液面がとまること**。⛔ **絹の体は、この枠に入らない。**
  quality: >-
    遅い。**ひとつの動作である**——`documentary-photo`
    「**What moves is ordinary and small — a hand**」。
    ⚠️ **沈めることは、この10秒でいちばん大きい出来事であり、なお小さい。**
    ⛔ **そのあとの6秒は、ほとんど何も動かない。** **液面がとまり、脂痕が滲むだけである。**
    ⛔ **`meaning-responsive` の `DELAY`（遅れ）が、この静止である**——
    カード「**The delay is composed.** ……**Answering at the end of the clip reads as a reveal.**」
    ⚠️ **即答は、カットに見える。**
  law: >-
    ⛔ **カメラは答えを言わない**——カード「**The camera may not tilt, push, or cut to express it**
    — a camera move is a *statement about* the meaning, and this grammar wants the world to make it.」
    ⚠️ **ゆえに、この1本はカメラを動かさず、寄らず、カットしない。**
    ⚠️ そして `documentary-photo` の物理——**眼の高さで立ち、見る。持つ。**
    ⛔ **§12 `LIGHTING` が、この1本ではじめて「出来事」を持つ**——
    カードの `Sources`「**it is the card that most needs §12's lighting events, because
    the world's answer is staged there**」。⚠️ **だが、光源は変わらない。**
    **変わるのは、光の返りかたである**——**滲んだ脂が、赤い光を返しはじめる。**

beats:
  - range: 0-2s
    density: held
    what: >-
      トレイの液面と、**その上にかざされた手と、小さなフィルム**。
      ⚠️ **この2秒は、まだ何も起きていない。** ⛔ **ここでフィルムを見せつけない**——
      **像の中身は、この1本の主題ではない**（それは三人の顔であり、§0-g が作らせない）。
  - range: 2-5s
    density: dense
    what: >-
      **沈める。** 液面がゆれ、フィルムが液の下へ入る。
      `draft_06-4`「**沈めたフィルムの上を、液の表面が、すこし、ゆれて、とまる。**」
      ⚠️ **この3秒が、この1本の唯一の動作である。**
      ⛔ **速くしない。** **急げば、それは「作業」になる**——
      **この動作は差し出しであり、作業ではない。**
  - range: 5-8s
    density: transition
    what: >-
      **液面がとまる。** ⚠️ **そして、像が浮きはじめる**——
      ⛔ **だが、この枠が持つのは像の縁である。**
      `draft_06-4`「像が浮かぶ」——**浮かぶことは見える。中身は読めない。**
      ⚠️ **この3秒のあいだに、絹から何かが抜けていく**——
      **画面には何も現れない。** ⛔ **それが、この摘要版の音の決定（§0-f）と、
      この文法の `DELAY` の交点である。**
  - range: 8-10s
    density: held
    what: >-
      **像の縁に、脂痕が滲む。** ⚠️ **遅れて。** 赤い光が、滲んだところだけを返す。
      `draft_06-4`「**置いた音のぶん、トレイの液が、すこし冷たくなる。**」——
      ⚠️ **温度は画面に無い。⛔ ゆえに、代償は脂痕だけが持つ。**
      ⛔ **ここでカメラを寄せない。** カードの `avoid`——
      「**A camera move, a cut, or a rack focus standing in for the answer**」。
      ⚠️ **寄れば、「見つけた」という演技になる。** **この1本は、置いたまま終わる。**

# ⛔ **`reference_set` / `forbidden_set` / `attached` / `disclosure_state` は ③ が埋める。**
#    ⚠️ **この1本が ③ で引くことになる鍵の見込み**（**② の側の申し送り**）:
#    `暗室.base` / `暗室.geography` / **`脂痕`** / **`絹.identity`**（**手だけである**）。
#    ⛔ **申し送りが2つある。**
#    **（1）この1本のフィルムには、像が浮く。** ⚠️ **原文のその像は、三人の「撮るな」という顔である**
#    （`draft_06-4`）。⛔ **その顔に鍵は無い**（§0-g）。⚠️ **②は、枠を像の縁に置き、
#    フィルムを小さく、液の下に置くことで、顔を読めなくしている。**
#    ⛔ **だが、`bible.negative_base` が禁じているのは娘の顔だけである**——
#    **「像の上の顔」をどう扱うかは ③ が決める**（**05 と同じ形の申し送り**）。
#    ✅ **③ の裁定（2026-09-24）——その顔に鍵を引かない**（**引く鍵が台帳に無い**）。
#    ⚠️ **ゆえに、下の `reference_set` に、この顔のための欄は無い。**
#    **（2）`絹.identity` を引くなら、③ は「この1本に顔が無い」ことを負う**——
#    ⚠️ **設定画は顔・体格・エプロンを持つ。手だけを引く経路は、この基盤には無い。**
#    ⚠️ **② はここに判断を書かない。** **② が申し送るのは、
#    「この1本の画面に在るのは手だけである、という設計で書いた」ということだけである。**
#
# ════════════════════════════════════════════════════════════════════════
# ③ 台帳（2026-09-24）—— **この4欄は、台帳の一点から導出された。**
#
# ⚠️ **規則**——`reference_set` は「この枠が固定するもの」。`forbidden_set` は
#   「この枠に現れてはならないもの」。⛔ **`attached` は宣言であって記録ではない**
#   （`skills/ledger/SKILL.md` 手順8）——**実際に何が付いたかはテイクの側に在り、いまは空である。**
#   ⚠️ **ゆえに `attached` は `reference_set` と同じものを並べる。** 食い違えば `L6` が鳴る。
#
# ⚠️ **`forbidden_set` は届く**（§16 → §18 `Negative Prompt`、`engine/ledger/specmap.py`）。
#   ⛔ **ゆえに ③ は発明しない**——ここに書いたものは、**この1本の §18 が既に禁じているか、
#   台帳がまだ明かしていないか、作品が使い切ったもの**だけである。
#   ⚠️ **`forbidden_set` は「丸ごと」しか書けない**——部分を禁じる欄はこの基盤に無い
#   （`skills/ledger/SKILL.md`「Fields and rules that nobody reads」が名指す穴）。**穴は穴として記録する。**
#
# ⚠️ **`disclosure_state` は「その1本の時点で、観客が持っている状態の全部」である**
#   （`projects/hitosara/` の先例——**変化点の間は、直前の状態が続く**）。
#   ⛔ **台帳が宣言する値は「〜になった」の形である**——ゆえに**変化点より前の値は、
#   その否定の形で書く**（`明かされていない` / `反転していない` …）。
#   ⚠️ **初出は遷移ではない**（`L9`）——`世界.法` は S01 が初出であり、台帳の変化点は
#   **「遷移」ではなく「出発点」である。ゆえに `L9` は註で鳴る**——これは**期待どおり**である
#   （`skills/ledger/SKILL.md` 手順10）。
#
# ⚠️ **② の見込みに、③ が2つ足す**——**`未露光のフィルム` と `印画紙`。**
#   ⛔ **どちらも §18 の肯定文が枠に置いている**——「holding between the fingers one small dry flat
#   strip of unexposed film」「one blank white silver-gelatin sheet」。
#   ⚠️ **フィルムの幅は、この作品で唯一測られる寸法である**——**この1本と `ch09-seg01`・
#   `ch10-seg01` の3本で、幅が読める**（09 の申し送り(2)。⚠️ 07 に在るのは缶であって、
#   幅は読めない）。**引かなければ、幅は3本でばらつく。**
#   ⚠️ **`印画紙` は「浮かばない白」の側である**——この1本では**フィルムに像が浮き、紙は白のまま**。
#   その対比が内容である以上、紙の白も固定する。
# ⛔ **`絹.identity` を引く。② の申し送りどおり、③ は「この1本に顔が無い」ことを負う。**
#   ⚠️ **§18 が既に支払っている**——「Her body and her face are not in this frame,
#   there is no second hand」。**`絹.negatives` の3節も §18 に在る。**
# ⚠️ **禁制の根拠**——娘（**§18「no child's hand of any kind」**）・盗人（§18「no figure」「no person」）。
# ⚠️ **この1本のフィルムには像が浮く。** ⛔ **その像に読める顔は無い**——
#   §18 が「seen only at the edge of the frame and stays unreadable in its middle」と定めている。

reference_set:
  - 暗室.base
  - 暗室.geography
  - 印画紙
  - 脂痕
  - 未露光のフィルム
  - 絹.identity

forbidden_set:
  - 娘
  - 盗人

attached:
  - 暗室.base
  - 暗室.geography
  - 印画紙
  - 脂痕
  - 未露光のフィルム
  - 絹.identity

disclosure_state:
  世界.法: 実演された
  娘.一枚: 失われた
  絹.位置: 反転した
  絹.加害: 全容
  絹.能動: 本人起点になった
  絹.信念: 揺らいでいない
  絹.決意: 定まっていない
  娘.手: 開示されていない
  絹.変化弧: 完結していない
