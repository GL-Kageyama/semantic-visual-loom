# 『未現像』第1章「現像」 / 質感 / motion —— 白から像が浮かび、代償が像の上に残る
#
# **出典**
#   本文は `soul-voice-teller/examples/migenzo/草稿/draft_01-1_白い紙.md` の
#   「輪郭が先に浮かぶ。……最後に口元が浮かぶ」から「眼のあたりに指の脂が一つ残っている」まで。
#   世界の法は `構想/world.md`「世界の核」、絵の基準は `distill-essence-engine/examples/migenzo/`。
#
# ⛔ **この記録は ② design のものである**（`PLAN.md` §3 手順1・2、2026-09-23 著者裁定）。
#   ⚠️ **① は `bible.yaml` と `ledger.yaml` の2本で終わっている**——① は妥当なショット記録を
#   1本も書けない（必須7欄のうち ① が持つのが `shot`・`unit`・`role` の3つだけである）。
#
# ⚠️ **この記録は §1–20 を持たない。** 仕様は `spec:` の先である。
# ⚠️ **この1本は、この作品の世界法則が最初に実演される1本である。**
#   そして**その実演は、説明ではなく現像そのものである**——
#   `world.md`「説明しない。三則は各章の「現像の行為」そのもので示す。」
#
# ⛔ **この1本に「拒む手」は入らない——これは判断であり、申し送りを伴う。**
#   ⚠️ `draft_01-2_拒んだ女.md` は、画面の端から差し伸びて**レンズの直前でいちど止まる手**を
#   書いている（「その指先はレンズの直前で、いちど止まる。押すまでに、わずかな迷いがある」）。
#   ⚠️ **そして `world.md` は、この手を第10章の回収の伏線として名指している**——
#   「この等価は**第1章の「被写体が拒む手掴み」で匂わせ**、第10章の小さな手で回収する」。
#   ⛔ **それでも、この1本は手を出さない。** 理由は3つ。
#     ① **`PLAN.md` §1 の一行が、この1本の変化を「像が浮かび、代償が脂として残る」と定めている**
#        ——手を足せば**2つ目の変化**になり、1ショット1変化の固定方針を破る。
#     ② **01〜10 の禁制 `no small hand pressing the lens` が、まさにこの領域を禁じている**
#        ——「女の手」と「娘の手」を画で区別させる指定は、**生成器が最も誤解しやすい種類の指定**である
#        （依頼の「誤解させない」に反する）。
#     ③ **迷いは手でなく、顔に出せる**——`draft_01-2` は同じ迷いを
#        「眼は横へ逸れている」「口元が言いかけてやめた」とも書いている。**顔の側を採る。**
#   ⛔ **ゆえに、この摘要版は `world.md` の第1章の伏線を落とす。** ⚠️ **これは損失である**——
#   `PLAN.md` §1「この摘要版が落としたもの」に追記した。
#
# ⚠️ **像は「撮ることを拒んだ女」である。娘ではない**（`話割り.md` 1-2）。
#   ⚠️ **ゆえに、この1本は `bible.negative_base` の核2節と衝突しない**——
#   `no fully rendered face of the daughter` は**娘の顔**を禁じており、
#   **この1本に浮かぶのは別人の顔である。**

shot: migenzo-ch01-seg01

# 動画の仕様（§1–20 を持つ）。**§18 の見出しがモデルを名乗る**（`L18` が読む）。
spec: specs/video/migenzo-ch01-seg01.md

# 画像の仕様（§1–20 を持たない・7欄と `Negative` を持つ）。
# ⚠️ **動画の最初のコマではない**——このショットの**見せ場の1枚**であり、**添付として**動画へ渡る。
key_image: specs/image/migenzo-ch01-seg01.md

unit:
  before: >-
    現像トレイの液面に、**何も浮かんでいない白い印画紙**が沈んでいる。
    白は銀塩の白のまま、琥珀の液を通して光をうっすら返している——
    ⚠️ **まだ何も起きていない。この白は、失敗ではなく待機である**（`world.md`）。
  after: >-
    白のなかに一本の線が立ち、輪郭になり、**眼が浮かび、口元が閉じる。**
    そして像の眼のすこし下に、**絹の親指の脂痕が一つ残っている。**
    ⚠️ **像は戻らない。** そして**脂痕は、絹が一つ失ったものの在り処である**——
    `world.md`「現像の代償（消えた記憶）が、レンズの指紋・手の脂として像に残る」。

# 質感——**この1本の仕事は、物の表面が像になることである。**
# ⚠️ **人物のショットではない。** 絹の手は入るが、**絹は主題ではない**（主題は紙である）。
role: 質感

# **台帳の `locations` の鍵**（`L8` が `reference_set` をこれに突き合わせる）。
place: 暗室

# ⛔ **この作品に時刻は無い。** アートボードが「no time of day and no directional light ——
# この板が固定する「状態」は**光そのもの**である」と書いている。
# ⚠️ **ゆえに「一時刻」の代わりに、時刻を持たないという恒常を書く。**
# ⚠️ **これは空欄ではない。** 空欄にすれば、モデルは自分の既定の時刻を入れる。
time: 時刻を持たない（no time of day——この部屋の状態は光そのものである）

mode: motion

duration: 10s

motion:
  subject: >-
    現像液に沈んだ白い印画紙の上に浮かぶ像——
    **輪郭 → 眼 → 口元**（`draft_01-1` の順序）。そして引き上げられた紙の上に残る脂痕。
  quality: >-
    ⛔ **速くならない。滲みとして、順に、遅く。** 白から像が浮かぶことは、
    この1本では**出来事ではなく経過**である——10秒の大半を、**順序そのもの**に使う。
    ⚠️ **「像が現れる」を一瞬で見せない。** 見せるのは**白が段階を踏んで減ること**である。
    ⚠️ 絹の手は、**この10秒のあいだ、紙の縁をつまんだままほとんど動かない**
    （動くのは、最後に紙を引き上げるときだけである）。
  law: >-
    `documentary-photo` の物理——**静止が地であり、動くのは小さく平凡なもの（手）である。**
    ⚠️ **そして像が浮かぶことは、様式の物理ではなく、この世界の法である**——
    `bible.world.rules`「像はネガの重ね合わせとして待機し、**浮かぶ瞬間だけ正像へ反転**する」。
    ⛔ **ここを混ぜない。** 様式は**部屋と手**を縛り、世界の法は**紙**を縛る。
    ⚠️ **様式カードの中身は `distill-essence-engine` に在る。ここに置くのは名前だけである。**

# ⚠️ **不均等に配分する**（`video-spec` の核）。**前半は保ち、後半で畳む。**
beats:
  - range: 0-3s
    density: held
    what: >-
      液面の下の白い紙。**何も浮かんでいない。** 琥珀の液を通した安全光が、
      紙の上で一様に止まっている。⚠️ **この3秒は待ち時間である**——
      `draft_01-1`「絹は息を浅くしている。……いち、に、さん。その数えかたが、二十年、変わらない」。
      ⛔ **ここに何かを予告しない。** 白のままであることが、この1本の前半である。
  - range: 3-5s
    density: sparse
    what: >-
      **輪郭が先に立つ。** 顔の輪郭ではない——**一本の線**が白のなかに立ち、
      最初は細く、揺れ、それから太さを持つ。⚠️ `draft_01-1`「線は最初、ほそい。揺れている。」
  - range: 5-7s
    density: held
    what: >-
      **眼が浮かぶ。開いている。** ⚠️ **こちらを見返すのではなく、横へ逸れる**——
      `draft_01-2`「その眼はこちらを見ていない。横へ逸れている。何かから逃げるように」。
      ⚠️ **絹は、この眼を見ない**（`draft_01-1`「絹はその眼を見ない」）——
      **画面は見るが、絹は見ない。この差が、この1本の質感である。**
  - range: 7-10s
    density: dense
    what: >-
      **口元が浮かび、閉じる。** 何かを言いかけてやめた口元——
      ⚠️ `draft_01-1`「何かを言いかけてやめた口元が、線のなかに閉じる」。
      絹が紙の縁をつまんで引き上げる。琥珀の雫が紙を離れて液面へ落ち、
      **輪をひとつ広げる。** 紙の上——**眼のすこし下**に、指の脂が一つ残っている。
      ⛔ **絹はそれを拭かない。** `draft_01-1`「拭けば、像のほうが少し薄くなる。」
      ⚠️ **像はもう戻らない。** この最後の1秒で、観客は**法則を一つ、説明されずに受け取る。**

# ⛔ **`reference_set` / `forbidden_set` / `attached` / `disclosure_state` は、ここに無い。**
#    ⚠️ **これは書き落としではない——所有が違う。** `skills/breakdown/SKILL.md` の表が
#    「① は `reference_set` / `forbidden_set` / `attached` / `disclosure_state` を持たない
#    （それは ③ `ledger` である）」と定め、`PLAN.md` §3 の手順4 が同じことを言う。
#    ⛔ **② も同じ4欄を持たない**——**② が持つのは `place` / `time` / `mode` / `motion` /
#    `beats` / `duration` である。** ③ が台帳の一点から導出して、この4欄を埋める。
#    ⚠️ **ゆえに 01〜10 の `no small hand pressing the lens` も、いまはまだ無い。**
#
# ⚠️ **この1本が ③ で引くことになる鍵の見込み**（**宣言ではなく、② の側の申し送り**）:
#    `暗室.base` / `暗室.geography` / `印画紙` / `脂痕`。
#    ⛔ **`絹` を入れない。** この1本に絹の手は入るが、**主題は紙である**——
#    ⚠️ **人は画面に居るが、この1本は人物のショットではない。**
#    ⚠️ **判断は ③ が行う。** ここに書いたのは**② が何を見ていたか**の記録である。
