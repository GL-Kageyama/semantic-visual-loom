    #    ⛔ **危険は減らない。** 手が主題になれば、**こんどは手が描かれすぎる危険が立つ**——
    #    ② が §16 と §18 に置くのは、その逆側の禁制である。
    #    ⚠️ **`L14` は、この宣言を読んで初めて黙る**（`PLAN.md` §4-a）。
    娘.手: 開示された
    negative: changed

