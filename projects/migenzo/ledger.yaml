# 制作台帳 — 『未現像』（migenzo）／摘要版・全13ショット
#
# **連続性（世界の状態）と開示（観客の知識の状態）を同じファイルに持つ。**
# ⚠️ **二つに割ってはならない**——参照集合も禁制集合も、この一点から導かれる（`CLAUDE.md`）。
#
# ⚠️ ここにあるのは**設計**である。**生成の記録ではない**——記録は `takes/` に在る。
#
# ⚠️ **人物の事実は、ここに複製しない。** 語り・生活・関係は
#    `soul-voice-teller/examples/migenzo/構想/characters.md` と `world.md` に在る。
#    このファイルが持つのは**カメラが要る語彙だけ**である——キーと、identity の意図と、禁制。
#
# ⚠️ **この作品は摘要版である。** 台帳は**その13本に要る語彙だけ**を持つ。
#    撮らない場所も、撮らない人物も、ここには無い——
#    **無いことは「まだ書いていない」であると同時に「この摘要版に出さない」である**（下の `disclosure`）。
#
# ⚠️ **`place` は `locations` の鍵である。** この作品は**一室しか撮らない**（`PLAN.md` §0-e）——
#    ゆえに `locations` の鍵は1つであり、13本すべての `place` は同じ字になる。
#    **それは退屈ではなく、この摘要版の法である。**
#
# ⛔ **この台帳は、まだ誰も機械で読んでいない。** `known_keys()` は
#    「参照集合が引けるキー」を**ここから導出する**——ゆえにここに無い鍵は、
#    **どのショットの `reference_set` にも書けない**（`L8` が鳴る）。
#    ⚠️ **`disclosure` の属性名だけは、この導出の外に在る**（`L8` は `reference_set` と `attached` しか見ない。
#    2026-09-23 実測）。**ゆえに下の `世界.法` と `白` は合法である**——下の註を見よ。

characters:
  絹:
    # この摘要版の中心。**13本のうち11本に居る**（01 と 13 は印画紙そのものが主題である）。
    # 出所: `構想/characters.md`「絹」——欲求／動機／傷／信念／声／変化弧／表と内のずれ／ロール。
    #       ⚠️ **動機の一行**——「現像しない＝愛」。**この摘要版が13本かけて崩す一行である**（`disclosure` 12）。
    identity: >-
      絹。五十代後半・痩身。`migenzo-kinu-character-sheet`
      （`distill-essence-engine/examples/migenzo/`）がこの作品の人物基準である。
      ⚠️ **絹の顔は出す。** `migenzo-scene-board/prompt.md` が既に
      「her face visible — the calm, sunken-eyed face, the short dark hair faintly streaked
      with grey gathered loosely at the back … her black apron over a black blouse,
      her hands faintly stained from chemicals」と定めている。
      ⚠️ **これは娘の扱いと正反対である**——娘は顔を持たず、絹は顔を持つ。
      **その差が、この作品の非対称そのものである**（下の `娘` と `bible.negative_base` の核を見よ）。
      ⚠️ **画像は既存の出力を使う**（依頼）。**新しい設定画を起こさない。**
      ⛔ **`states` を書いていない——これは判断であり、書き落としではない。下の註を見よ。**
    # ⛔ **`states` が空である理由（2026-09-23、著者裁定 = `PLAN.md` §4-c 問い9）。**
    #    ⚠️ **決定は「02 は絹を老けさせない」である。ゆえにこの欄は空のままでよく、台帳は完成している。**
    #    ⛔ **争点は `states` ではなく、02 を `time-fold` と呼ぶこと自体だった。**
    #    ⚠️ **測った事実**:
    #      ・`references/formats/time-fold.md` の `avoid` が「Aging makeup, prosthetics, or a
    #        stated "years later"」を持ち、`Negative` も `no aging makeup, no prosthetic` を要求する
    #        ——**この文法は、加齢を演出する手段そのものを禁じている。**
    #      ・`構想/characters.md:9`「**二十年前**、娘の死の瞬間、カメラを落として…」
    #        ——**二十年は、物語の現在より前に既に経過している**（backstory）。
    #      ・`話割り.md` 第2章 = 2-1 見ない者／2-2 壊した男／2-3 距離／2-4 影
    #        ——**現在の日常**であり、二十年を渡る章ではない。
    #      ・`states` の値は**静止画の基準画像を選ぶ**。**加齢は動きである**——
    #        動きを静止層に置くのは層の誤りである。
    #    ⚠️ **採った読みは「二十年の反復そのものを畳む」である**——ゆえに加齢は主題になりえず、
    #       `states` は要らない。`PLAN.md` §1 の一行は「その裏に**影**が育つ」——**主語が影である。**
    #    ⚠️ **`migenzo-kinu-character-sheet` は50代後半の1枚だけである。**
    #       書けば**私が老けかたを発明することになる**（**無い基準画像を指す鍵は、記録ではなく空欄である**）。
    #    ⛔ **そして `no date stamp` / `no caption` / `no title card carrying elapsed time` も禁じる**
    #       ——**「二十年」は数字として画面に出せない。出せないまま畳むのが、この文法である。**
    negatives:
      # 出所: `migenzo-kinu-character-sheet` の Negative、および `bible.negative_base`。
      - "no youthful face for 絹"
      - "no clean unstained hands"
      - "no smiling expression"

  娘:
    # ⛔ **この作品の核である。** 出所: `構想/characters.md`——
    #    「娘——一度も「重ね合わせ」を崩壊させられたことがないため、**現像不能の白**として残る。
    #      **顔も名も、決して現れない。**」
    #    ⚠️ **彼女が画面に持つ実体は、ただ一つ——小さな手である**（下の註）。
    # ⛔ **裁定（2026-09-23、著者）——この欄は設定画を名指す。ただし錨は「手」だけである。**
    #    ⚠️ **初稿は「identity lock に使う参照画像は、存在しない」と書いた。** 覆した。
    #    ⛔ **理由1: この摘要版で、基準が要る体の部位は手だけである**——そしてそれは**山**である。
    #       ⚠️ **設定画の唯一の実体が、まさにそれである**（`Merged` の写し）——
    #       「**a small child's hand pressed flat against the inside of a camera lens**,
    #       the palm and fingers spread to block the shutter,
    #       **the one real, living thing in the sheet**」。
    #    ⚠️ **理由2: 顔は既に二重に守られている**——`bible.negative_base` の核2節が
    #       **13本すべてに掛かり**、そのうえで**設定画自身が頭部を空白の白のまま置いている**。
    #    ⛔ **理由3: hakuchizu の `暖簾の店の主` と同じ形は、ここでは使えない**——
    #       あの店主は**一度も画面に立たない**が、**娘の手は S11 に立つ。**
    #       **錨を渡さない選択は「顔を作らない」ではなく「手を毎回作り直す」になる。**
    #    ⚠️ **`check.py` の `known_keys()` は `C.sheet` を「＝identity」と定義する**——
    #       ゆえに**この2つは1つの枠であり、片方に「画像は無い」と書きながら他方を使うことはできない。**
    #    ⛔ **代償（申告する）**: あの設定画は**日本語の注記を3つ**持ち（「顔は現像されない」
    #       「表情なし」「小さな手——レンズを内側から押さえる」）、**添付すれば画に流入しうる**
    #       （hakuchizu の実測——**Negative は名詞を消せない**）。ゆえに **② は S11 の §18 の
    #       肯定文の側で手を明示して制御し、`no readable text` に頼らない。**
    #       ⚠️ **そして、あの設定画は `no heavy film grain` / `no shallow depth of field` /
    #       `no yellow cast` を宣言する——暗室の逆である。動画側の指定が勝つと ② が明記する。**
    #    ⛔ **穴は残る**: `required: ["identity"]` は「顔を持たない人物」を表現できない。
    #       **私はスキーマを書き換えない**（`schemas/` は基盤のものである）。申し送りは `PLAN.md` §0-g。
    identity: >-
      娘。`migenzo-musume-character-sheet`（`distill-essence-engine/examples/migenzo/`）が
      **この人物の基準である。ただし、そこで錨になるのは「小さな手」だけである。**
      ⛔ **顔は、この作品で一度も現れない**——`構想/characters.md`
      「一度も「重ね合わせ」を崩壊させられたことがないため、**現像不能の白**として残る。
      **顔も名も、決して現れない。**」
      ⚠️ **ゆえに設定画の頭部は空白の白のまま置かれている**——
      それはあの設定画の欠落ではなく**仕様**であり、**この作品の核そのものである。**
      ⛔ **そして手は S11 まで禁制である**——それまで10本が負う
      `no small hand pressing the lens` は、**ショット記録の側が持つ**（下の註）。
      ⚠️ **「顔も名も出さない」は変化しない。** ゆえに `disclosure` の変化点にしない——
      **13本すべてが同じ禁制を負う**（`bible.negative_base` の核2節）。
    # ⛔ **`no small hand pressing the lens` を、ここに書かない。**
    #    ⚠️ **書けば、S11 で詰む。** `forbidden_set` はショットごとに台帳から導出される——
    #    **`娘.negatives` に置いた節は、13本すべての禁制集合に入る。**
    #    ⛔ **そして S11 は、まさにその手が主題になる1本である**（`PLAN.md` §2 の `negative: changed`）。
    #    ⚠️ **ゆえにこの1節は台帳でなく、§16 MUST NOT と §18 の側が持つ**——
    #    **01〜10 の10本にだけ掛かり、S11 で落ちる。**
    #    ⚠️ **台帳に置けるのは変化しない禁制だけである。変化する禁制の家は、ショット記録である。**
    negatives:
      - "no fully rendered face of the daughter"
      - "no name for the daughter"

  盗人:
    # 出所: `構想/characters.md`「盗人」——声「短く、静かに突きつける」／
    #       「**敵役は加害者の鏡**」／「**大人の体に、二十年前の子供の眼**」。
    # ⚠️ **この摘要版は彼を立てない。** `PLAN.md` §1 の「落としたもの」——
    #    出会うのは**戸口の1本（05）と対峙の1本（09）だけ**であり、**鏡の構造は撮っていない。**
    #    ⛔ **そして台詞は1行も無い**（`PLAN.md` §0-f——音声は全て捨てる）。
    #    ⚠️ **ゆえに「短く、静かに突きつける」声は、この摘要版に存在しない。**
    #    **残るのは眼だけである**——そしてそれは、源が与えた唯一の具体と一致する。
    identity: >-
      盗人。`migenzo-nusubito-character-sheet`
      （`distill-essence-engine/examples/migenzo/`）がこの作品の人物基準である。
      ⚠️ **源が与えるのは眼だけである**——「**大人の体に、二十年前の子供の眼**」。
      設定画は残りを**「未指定」と註記している**。
      ⛔ **私は「未指定」を埋めない。** 埋めれば、この人物は顔を持ち、
      **鏡の構造を持たないこの摘要版に、根拠の無い顔が1つ増える。**
      ⚠️ **画面に何が出るか（戸口の人影か、眼だけか、そもそも出るか）は ② が §10 で決める**——
      **台帳は語彙であって、演出ではない。**
    negatives:
      - "no fully rendered face for 盗人"
      - "no legible name for 盗人"
      - "no child's body"

locations:
  暗室:
    # ⚠️ **この摘要版の場所は2つである**（`PLAN.md` §0-e、2026-09-23 著者裁定）。
    #    ⛔ **01〜09 の `place` がこの字になる。**（10〜13 は `最後の暗室`。）
    #    ⛔ **訂正（2026-09-23、② が 10 の記録を書く際の原文照合）**——初稿は
    #    「**この摘要版の唯一の場所である。13本すべての `place` がこの字になる**」と書いていた。
    #    **誤りである。** `draft_09-1_暗室.md`「絹は暗室の前に立つ。**最後の暗室。**……
    #    **絹の仕事の暗室ではない。**……**これは、いちばん奥の小さな暗室だった**」＋
    #    「**二十年、だれも開けていない。**」——**1室では、この章と両立しない。**
    # ⚠️ **`place` が2つであることは、`L2` の検査対象ではない**——
    #    `L2` が鳴るのは**1つの欄に複数の場所が在るとき**である。**2室は、2つ在るから2つである。**
    # 出所: `構想/world.md`「暗室」——内と外を区別していない場所／単一光源／液面はスクリーン内スクリーン。
    base: >-
      `migenzo-art-board`（`distill-essence-engine/examples/migenzo/`）がこの作品の基準である——
      16:9・人物なし・時刻なし・方向性の光なし。3色パレット: 赤い安全光／琥珀の現像液／
      未露光の印画紙の白／まわりの部屋のほぼ黒。**中央の現像トレイに、何も浮かんでいない
      銀塩印画紙が一枚。**
      ⚠️ **この板が固定する「状態」は、光そのものである**（出典の一行の写し——
      「no time of day and no directional light — the **"state" this board fixes is the light itself**」）。
      ⚠️ **画像は既存の出力を使う**（依頼）。**新しいアートボードを起こさない。**
      ⛔ **現像トレイと液面は、ここに含まれる。** 別の `props` の鍵にしない——
      **同じ物を二箇所が持てば、写しは黙ってずれる。**
    geography: >-
      一室。**位置関係は4点だけである**——中央に現像トレイ（液面）、上に赤い安全光、
      一方の壁に引き出し、そして**戸口**。
      ⚠️ **暗室の戸は、内側から開けられた形跡を残す戸である**（`構想/章立て.md` 第4章）。
      **内と外を区別していない場所**（`world.md`）——ゆえに**外は、この画の外に無い。**
      ⚠️ **窓が無い。時計が無い。** `bible.negative_base` の世界と光がそれを禁じる——
      **禁じているのは、この地理の外にあるものを画に入れないためである。**
    # ⛔ **`states` を書いていない——これは判断であり、書き落としではない。**
    #    ⚠️ **この部屋は、二十年のあいだ一度も変わらない。**
    #    `PLAN.md` §0-b の 02 `time-fold` の `SURVIVOR` は
    #    「**現像トレイと安全光——この2つだけが変わらない**」と言う。
    #    ⛔ **ゆえに鍵を持つべき状態が、存在しない。**
    #    **状態の無い場所に `states` を書けば、私は状態を発明することになる**
    #    （⚠️ hakuchizu の `暖簾の店の前` が `states` を持つのは、**あちらにあってこちらに無い、
    #    色が戻るという変化が在るからである**——**機構を写すと質が落ちる**）。
    #    ⚠️ **そして、この不変が、02 の文法そのものである**——
    #    `time-fold` が二十年を運べるのは、**運ばれないものが1つ在るからである。**

  最後の暗室:
    # ⛔ **10〜13 の `place` がこの字になる。**（01〜09 は `暗室`。）
    #    ⚠️ **2026-09-23、著者裁定（`PLAN.md` §4-c 問い2）で増えた2つ目の部屋である。**
    # 出所: `草稿/draft_09-1_暗室.md`——「絹は暗室の前に立つ。**最後の暗室。**二十年、開けなかった暗室。
    #       **絹の仕事の暗室ではない。もっと前の暗室だった。仕事の暗室は、建物の手前のほうにあった。
    #       これは、いちばん奥の小さな暗室だった。**」／「**二十年、だれも開けていない。**」／
    #       「**戸の取っ手のうえに、ほこりがうすく積もっている。**二十年分のほこりではない。
    #       二十年、ここまでだれも来なかったから、ほこりもうすいまま、そこにあった」／
    #       「赤い光が、**トレイをひとつ**照らす。**引き出しをひとつ**照らす。**そのほかは、なにも見えない。**」
    #       ／「**赤い光の届く範囲は、せまかった。光の届かない壁ぎわでは、二十年の闇が、
    #       まだ、そこに沈んでいた。トレイと引き出しと、そのまわりだけが、赤く、浮かび上がって、
    #       あとは、闇のなかに沈んだままだった。**」
    base: >-
      ⚠️ **同じアートボードである。** `migenzo-art-board` が固定する単一の赤い安全光と
      琥珀の現像液が、この部屋でもそのまま効く——**新しい基準を起こさない。**
      ⛔ **違いはひとつ、「二十年、閉じていた」ことである。**
      ⚠️ **ゆえに `PLAN.md` §0-e の代償（基準が増える）は、実際にはほぼゼロである。**
      ⛔ **そして、この部屋の見えかたは、源が決めている**（上の一節）——
      **赤い光が届くのは、トレイと引き出しと、そのまわりだけである。**
      **残りは、二十年ぶんの闇である。** ゆえに**この部屋の画は、闇のなかの小さな赤い島**になる。
    geography: >-
      **建物のいちばん奥の、小さな一室**（`draft_09-1`）。⚠️ **仕事の暗室は建物の手前である**——
      **ゆえにふたつの部屋の関係は「手前／奥」であって、隣でも上下でもない。**
      ⛔ **この1行が、2室を矛盾なく並べる唯一の記述である**（源がそう書いている）。
      **位置関係は4点だけである**——中央に現像トレイ（液面）、上に赤い安全光、
      一方の壁に引き出し、そして**戸**。⚠️ **戸は、二十年、閉じていた戸である。**
      ⚠️ **窓が無い。時計が無い。** そして⛔ **光の届かない面は、沈んだまま暗い**——
      **`暗室` が「一室を見せる」のに対し、この部屋は「光の届く範囲だけを見せる」。**
    # ⛔ **`states` を書いていない——これは判断であり、書き落としではない。**
    #    ⚠️ **`暗室` とは理由が違う。混同しない。**
    #    ⛔ **この部屋は、一度だけ変わる**——**二十年の闇に、赤い光が点く**（`draft_09-1`
    #    「絹はなかに入る。入って、絹は赤い光をつける。……**二十年ぶりの赤い光だった**」）。
    #    ⚠️ **だが、その変化は、どのショットの枠にも入らない**——
    #    **10 の枠が始まる時点で、灯りは既に点いている。**
    #    ⛔ **撮らない状態に基準画像を割り当てれば、私は撮らないものを作ることになる。**
    #    ⚠️ **ゆえに `states` は空である。** **この部屋は、10〜13 のあいだ、変わらない。**

props:
  # ⛔ **鍵を作るのは、ショットの `reference_set` が引くものだけである。**
  #    台帳は辞書であって、名詞の一覧ではない。
  印画紙:
    # **この作品の中心の物。** S01・S06・S07・S11・S13 が使う。
    # 出所: `migenzo-art-board/prompt.md`（未露光の銀塩印画紙）／
    #       `構想/world.md`（白から像が滲む・現像＝崩壊）／`構想/章立て.md` 第1章（輪郭→眼→口元）。
    appearance: >-
      銀塩印画紙。**白は銀塩の白であって、紙の白でも、まして発光でもない**——
      `migenzo-art-board` の `Merged` が「blown highlights on the white paper」と書き、
      ⑧ガードが「赤・琥珀に寄せすぎない——**銀塩の白・黒を残す**」と定める。
