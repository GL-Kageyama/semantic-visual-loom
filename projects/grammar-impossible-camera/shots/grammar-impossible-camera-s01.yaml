# 第一ショット / 運動（カメラのみ） / motion —— 瞳の中へ入り、3歳の夏に着く
#
# ⚠️ **この作品には、この1本しか無い。**
#    前のショットも次のショットも無い——**ゆえに `L10` は註で
#    「先行する §18 を持つショットが無い」と言う。****違反ではない。**
#
# ⚠️ **このショットの出典は、形式カード `impossible-camera` の4つの欄である。**
#      `EYE`     ＝**在りえない視点。** 洗いの前端が、その位置である
#      `ENTRY`   ＝**瞳。** どうやって中へ入ったかを、この1本が自分で言う
#      `PATH`    ＝**視神経。** さかのぼる——尺度も物理も、その世界のものである
#      `ARRIVAL` ＝**3歳の夏の光。** 視点はそこで終わる
#    **⚠️ これはカメラの移動ではない。**「カメラがどこかに在る」という前提が捨てられている。
#
# ⚠️ **⚠️ 進むのは視点であって、画ではない。**
#    `watercolor` は「カメラは窓ではなく紙である」と言い、**動くのは水であって筆ではない**と言う。
#    **ゆえにこの1本では、洗いの前端が視点の位置である**——
#    **白は、まだ入っていない場所である。**

shot: grammar-impossible-camera-s01
spec: specs/video/shot-01-nerve.md

# ⚠️ **`key_image` を置かない。** この作品の画像の経路はまだ1度も走っていない。
#    ⚠️ **空の `key_image:` を書けば「画像の仕様が在って空」になる。**
#       **書かないことは、無いことである。**
#    ⚠️ **`L18` はこの不在を1件の註に畳んで報告する**——
#       「記録が無いのであって、食い違っているのではない」。

aim: >-
  **形式カード `impossible-camera` を1度だけ実際に使う。** 瞳の中へ入り、視神経をさかのぼり、
  **3歳の夏の光に着く。**
  ⚠️ この試しが成り立たなければ、**7枚の文法のうちの1つが、この基盤では立てない**ことになる。
  ⚠️ **確かめているのは文法が効いたかどうかではない。** 文法を仕様に落とせたかどうかである。

unit:
  before: "**白い紙がある。** その手前に、瞳の丸い色の縁が1つ。**入り口は、まだ開いていない。**"
  after: "**白は尽き、画面は光で満ちている。** 視点は3歳の夏に着き、**そこで終わる。**"

# ⚠️ **種別は `運動（カメラのみ）` である。** 固有基準は「見え方そのものが動くこと」——
#    **主題は動かない。動くのは、見え方のほうである。**
#    ⚠️ **限定つきの綴りを使えるのは `運動` だけである**（`rolemap.QUALIFIABLE`）。
#       `カメラのみ` は運動の層の登録名であり、**引けている。**
#       `L15` は綴りを違反にせず、**註**で報告する。
role: 運動（カメラのみ）

# ⚠️ **1つの文字列である。** ⚠️ **経路はここに書かない。**
#    `L2` は `place` を `→` `／` `、` で割る——**割れた場所は違反になる。**
#    **しかもこのカードの意味からして、経路を `place` に漏らせば
#    「1視点が経路を進む」という文法そのものが壊れる。****経路は §10 が持つ。**
place: 瞳の内側

# ⚠️ **到着点が、この1本の時刻である。** 空欄ではない——
#    **この視点は、いま現在から3歳の夏へ向かっている**という宣言である。
#    ⚠️ **「夏」は `L3` の8族のどれでもない**——時刻語ではない。
time: 3歳の夏

# ⚠️ **`motion` である**——`mode` の意味は「**主題が動くか**」である。
#    この作品の主題は**見え方そのもの**であり、**それは進む。** ゆえに `still` ではない。
mode: motion

duration: 12s

# ⚠️ **運動の層が、この作品の旅程そのものである。**
motion:
  subject: 視神経をさかのぼる視点
  quality: >-
    **洗いが進む。****その前端が、視点の位置である。** 白は、まだ入っていない場所である——
    ゆえに**この1本では、白が尽きることが到着である。**
    経路は途中で法を変えない。**尺度はこの世界のものであり、それは最初から最後まで同じである。**
    最後に**光が満ち、そこで終わる。**
  law: >-
    watercolor の物理。**水が動く者であって、筆ではない**——輪郭は手で描き直されず、
    **滲みが外へ広がって落ち着く。****濡れた縁は止まらない**——同じシルエットが、
    少しあとには少し違う。⚠️ **画は紙であって窓ではない**——**枠は動かない。**
    **控えられた白は、この1本では経路そのものである。**
    ⚠️ **様式カードは `SVL_STYLES_DIR=references/styles` を張らねば読まれない。**

beats:
  - range: 0-3s
    density: sparse
    what: >-
      **入り口が、明示される。** 白い紙の手前に、瞳の丸い色の縁が1つ浮かぶ。
      **どうやって中へ入るのかを、この1本はここで言う**——
      ⚠️ **言わなければ、前のショットの継続の誤りとして読まれる。**
  - range: 3-7s
    density: dense
    what: >-
      **洗いが、縁を越えて進む。** 色素が外へ広がり、**前端が視点の位置になる。**
      白は、まだ入っていない場所として残る——**この4秒が、このショットの主題である。**
  - range: 7-10s
    density: transition
    what: >-
      **白が痩せていく。** 経路の法は変わらない——**尺度も、滲み方も、同じである。**
      奥から光が増えはじめ、**まだ何の光かは名乗らない。**
  - range: 10-12s
    density: held
    what: >-
      **到着する。** 画面は光で満ち、**視点はそこで終わる。**
      **この2秒で、観客は行き先を知る**——**3歳の夏である。**

# ⚠️ **参照画像は1枚も無い。** ゆえに集合は空である——
#    **空を書くことは、書き忘れではない。**（`ledger.yaml` の `瞳の内側.base` を見よ）
reference_set: []
attached: []

forbidden_set:
  - 通常のカメラ位置
  - 魚眼
  - 経路の途中で変わる物理
  - 到着の無い終わり
  - 顔
  - 2つ目の瞳
  - 血
  - 解剖図
  - 読み取れる文字

# ⚠️ **開示の変化点は、この1本である。** 台帳の `disclosure` が
#    「**この視点は、3歳の夏に着く**」をこのショットに置いている——
#    **到着の瞬間に、観客は行き先を知る。**
#    ⚠️ **台帳と一致していなければならない**（`L7a` / `L7b`）。
disclosure_state:
  視点.到達: 3歳の夏
