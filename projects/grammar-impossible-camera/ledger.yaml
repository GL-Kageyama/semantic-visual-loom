# 制作台帳 — 瞳の内側（grammar-impossible-camera）
#
# ⚠️ **人物は居ない。** この作品の登場物は視点そのものであり、
#    視点は人物ではない——**ゆえに `characters: {}` である。**
#    ⚠️ **この空は空欄ではなく作品の内容である。**
#       §2 の規則「**この作品に、顔は写らない。**」が、台帳の側で同じことを言っている。
#
# ⚠️ **開示の変化点は1つ在る。** この作品で観客が知るのは、
#    **この視点が誰の3歳の夏に着いたか**である。
#    それは到着の瞬間に届く——**それまで、この旅程は行き先を名乗らない。**

# ⚠️ **人物は居ない。** 生成へ渡る参照のうち、人物に由来するものは1つも無い。
characters: {}

locations:
  瞳の内側:
    # ⚠️ **この作品の唯一の場所である。** ⚠️ **経路はここに書かない。**
    #    「瞳→視神経→3歳の夏」は `place` ではなく **§10 が持つ**——
    #    `L2` は `place` を `→` で割り、**割れた場所は違反になる。**
    #    **しかもこのカードの意味からして、経路を `place` に漏らせば
    #    「1視点が経路を進む」という文法そのものが壊れる。**
    #    `base` は基準画像を指す。
    #    ⚠️ **まだ作られていない。** **「無い」と書くことは、書き忘れではない。**
    base: >-
      **未作成。** この作品は**生成の前に書かれた**——`media/` は空である。
      最初の1枚は、著者が画像の経路を1度走らせたときにここへ入る。
      ⚠️ **この1枚は、動画へ渡すためではない**（`reference_set` を見よ）。
      **在りえない視点の中の見た目は、§2 と §11 の文が固定する。**

    # ⚠️ **`geography` は「位置関係を示すボード」。**
    #    この作品の位置関係は1つだけである——**手前が白く、奥が光である。**
    #    ⚠️ **この関係は、旅程のあいだ向きを変えない**——
    #       **変わるのは、白と光の割合だけである。**
    geography: >-
      **手前に控えられた白、奥に光がある。** 視点は白の側から光の側へ進む——
      ⚠️ **ただし画そのものは動かない。** 進むのは**洗いの前端**であり、
      **白は、まだ入っていない場所として残る。**

    states: {}

# ⚠️ **開示の変化点は1つである。**
#    「**この視点は、3歳の夏に着く**」——**到着の瞬間に、観客は行き先を知る。**
#    ⚠️ **`negative: changed` は「この変化点で §18 の Negative が動いた」の意味である。**
#       この作品には先行するショットが無いので、`L10` は**註**で
#       「先行する §18 を持つショットが無い」と言う——**違反ではない。**
disclosure:
  - shot: grammar-impossible-camera-s01
    視点.到達: 3歳の夏
    negative: changed
