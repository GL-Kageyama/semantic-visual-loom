# 第一ショット / 情景 / motion —— 踏む前に、雪が応える
#
# ⚠️ **この作品には、この1本しか無い。**
#    前のショットも次のショットも無い——**ゆえに `L10` は註で
#    「先行する §18 を持つショットが無い」と言う。****違反ではない。**
#
# ⚠️ **このショットの出典は、形式カード `recognizing-world` の5つの欄である。**
#      `FIGURE`  ＝**そこに居ない誰か。** この1本には、誰も写らない
#      `SIGN`    ＝**雪の側の兆し。** 踏まれる前に、踏まれた形になる
#      `DEPTH`   ＝**道が開くところまで。** 足跡の先で雪が解ける
#      `REFUSAL` ＝**灯籠だけは点かない。** ここで認知が止まる
#    **⚠️ 兆しは環境に在り、社交には無い。** 振り向く者も、迎える者も居ない。
#
# ⚠️ **⚠️ 認知は積み上がる。** 「認知していない」から「認知した」への
#    1カットは、**別の文法である**——**兆しが重なり、その重なりが時間である。**
#
# ⚠️ **⚠️ この場所には床がある。** 他のすべてが応えても、灯籠だけは応えない——
#    **床の無い場所は、効果として読まれる。**

shot: grammar-recognizing-world-s01
spec: specs/video/shot-01-shrine.md

# ⚠️ **`key_image` を置かない。** この作品の画像の経路はまだ1度も走っていない。
#    ⚠️ **空の `key_image:` を書けば「画像の仕様が在って空」になる。**
#       **書かないことは、無いことである。**
#    ⚠️ **`L18` はこの不在を1件の註に畳んで報告する**——
#       「記録が無いのであって、食い違っているのではない」。

aim: >-
  **形式カード `recognizing-world` を1度だけ実際に使う。** 真夜中の神社で、
  **踏まれる前の雪が踏まれた形になり、足跡が先にでき、その先で道が開く。**
  **灯籠だけは点かない。**
  ⚠️ この試しが成り立たなければ、**7枚の文法のうちの1つが、この基盤では立てない**ことになる。
  ⚠️ **確かめているのは文法が効いたかどうかではない。** 文法を仕様に落とせたかどうかである。

unit:
  before: "**真夜中の境内がある。** 雪はどこも踏まれておらず、**灯籠は1つも点いていない。**"
  after: "**参道の雪が、踏まれた形になっている。** 足跡の先で道が開き、**灯籠だけは、依然として点いていない。**"

# ⚠️ **種別は `情景` である。** 固有基準は「その場所が、その時刻に、そこに在ること」——
#    **この1本が裁かれるのは、まさにそれである。****場所が、場所として在る。**
role: 情景

place: 神社

# ⚠️ **真夜中である。** 空欄ではない——**この認知は、灯りの無い時刻に起きている**
#    という宣言である。**ゆえに灯籠が点かないことは、この時刻の中で意味を持つ。**
#    ⚠️ **時刻語はこれ1つだけである**——`L3` は**ビート本文**の族の数を数えるので、
#       ビートには時刻の語を増やさない。
time: 真夜中

# ⚠️ **`motion` である**——`mode` の意味は「**主題が動くか**」である。
#    主題は雪の参道であり、**雪は動く**——**踏まれぬまま、踏まれた形になる。**
#    ゆえに `still` ではない。
mode: motion

duration: 9s

# ⚠️ **運動の層が、この場所の認知そのものである。**
motion:
  subject: 真夜中の神社の、雪の積もった参道
  quality: >-
    **雪が、踏まれる前に踏まれた形になる。** 足跡は手前から奥へ向かって先にでき、
    **その先で雪が解けて道が開く。** 兆しは積み上がる——**一度に切り替わらない。**
    そして**灯籠だけは点かない。****他のすべてが応えても、ここで止まる。**
  law: >-
    mokuhanga の物理。**版が動く者であり、それは印象によって働く**——
    枠は流れず、**刷り直される。** 像が着地し、**また着地する。**
    **見当のずれが、そのまま運動である**——色の面が墨の線に対して少し滑り、
    **縁が二重になって落ち着く。****ずれは版のものであって、主題のものではない。**
    ⚠️ **様式カードは `SVL_STYLES_DIR=references/styles` を張らねば読まれない。**

beats:
  - range: 0-3s
    density: sparse
    what: >-
      **真夜中の境内である。** 雪が、誰も踏んでいない面のまま残っている。
      灯籠が並んでいる——**そのどれも、点いていない。**
      **この3秒は、まだ何も登録されていない枠である。**
  - range: 3-6s
    density: dense
    what: >-
      **踏まれていない雪が、踏まれた形になる。** 足跡が、手前から奥へ向かって
      先にできていく——**歩く者は、まだ居ない。**
      ⚠️ **これは一度の切り替えではない。****兆しが、1つずつ積み上がっている。**
  - range: 6-8s
    density: dense
    what: >-
      **足跡の先で、雪が解けはじめる。** 道が、誰も来ないうちに開いていく——
      **認知が、ここまで届いた。**
  - range: 8-9s
    density: held
    what: >-
      **灯籠だけは、点かない。** ほかのすべてが応えても、**これだけは応えない。**
      **この1秒で、観客はこの場所の床を知る**——**ここが、認知の止まる場所である。**

# ⚠️ **参照画像は1枚も無い。** ゆえに集合は空である——
#    **空を書くことは、書き忘れではない。**（`ledger.yaml` の `神社.base` を見よ）
reference_set: []
attached: []

forbidden_set:
  - 人物
  - 姿
  - 神主
  - 動物
  - 灯籠の点火
  - 風
  - 場所に代わって反応する誰か
  - 認知の前後を分けるカット
  - 雰囲気の一括した変化
  - 読み取れる文字

# ⚠️ **開示の変化点は、この1本である。** 台帳の `disclosure` が
#    「**この場所は、来る者を知っている。しかし灯籠だけは点かない**」を
#    このショットに置いている——**床が届くことが、この作品の開示である。**
#    ⚠️ **台帳と一致していなければならない**（`L7a` / `L7b`）。
disclosure_state:
  神社.応答: 灯籠だけ拒む
