# 制作台帳 — 神社（grammar-recognizing-world）
#
# ⚠️ **人物は居ない。** この作品の認知は、**そこに居ない誰かへ向けられている**——
#    足跡は、歩く者の姿なしに先にできる。ゆえに `characters: {}` である。
#    ⚠️ **この空は空欄ではなく作品の内容である。**
#       カードは「**認知は間違っていてもよい。** 場所は、そこに居ない誰かを、
#       あるいは見誤った誰かを登録しうる。**それは文法の内側であり、しばしばそのショットの眼目である。**」
#
# ⚠️ **開示の変化点は1つ在る。** この作品で観客が知るのは、
#    **この場所が見て見ぬふりを選んだ**ということである。
#    それは**灯籠が点かないこと**によって届く——
#    **他のすべてが応えたあとで、これだけが応えない。**

# ⚠️ **人物は居ない。** 生成へ渡る参照のうち、人物に由来するものは1つも無い。
characters: {}

locations:
  神社:
    # ⚠️ **この作品の唯一の場所である。** 真夜中の境内、雪の参道、並ぶ灯籠。
    #    カメラはここを出ない。
    #    `base` は基準画像を指す。
    #    ⚠️ **まだ作られていない。** **「無い」と書くことは、書き忘れではない。**
    base: >-
      **未作成。** この作品は**生成の前に書かれた**——`media/` は空である。
      最初の1枚は、著者が画像の経路を1度走らせたときにここへ入る。
      ⚠️ **この1枚は、動画へ渡すためではない**（`reference_set` を見よ）。
      **境内の見た目は、§2 と §4 の文が固定する。**

    # ⚠️ **`geography` は「位置関係を示すボード」。**
    #    この作品の位置関係は1つだけである——**参道が手前から奥へ伸び、
    #    灯籠がその両側に並んでいる。**
    #    ⚠️ **足跡は、この参道の上を手前から奥へと先にできていく。**
    geography: >-
      **参道が手前から奥へ伸び、その両側に灯籠が並んでいる。** 鳥居が奥に在る。
      ⚠️ **足跡はこの参道の上に、手前から奥へ向かって先にできる**——
      **ゆえにこの場所の奥行きが、認知の進む向きそのものである。**

    states: {}

# ⚠️ **開示の変化点は1つである。**
#    「**この場所は、来る者を知っている。しかし灯籠だけは点かない**」——
#    **他のすべての兆しが積み上がったあとで、床が届く。**
#    ⚠️ **`negative: changed` は「この変化点で §18 の Negative が動いた」の意味である。**
#       この作品には先行するショットが無いので、`L10` は**註**で
#       「先行する §18 を持つショットが無い」と言う——**違反ではない。**
disclosure:
  - shot: grammar-recognizing-world-s01
    神社.応答: 灯籠だけ拒む
    negative: changed
