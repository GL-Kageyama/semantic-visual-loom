# 制作台帳 — 『窓を拭く』（mado-fuki）
#
# **連続性（世界の状態）と開示（観客の知識の状態）を同じファイルに持つ。**
# ⚠️ **二つに割ってはならない**（`CLAUDE.md`）。

characters:
  女:
    # ⚠️ **顔は主役にならない。** 背中と手だけが要る——ゆえに顔の identity lock は持たない。
    #    ⚠️ **「要らない」は「参照が無い」ではない。** 固定したいのは**手・布・後ろ姿**である。
    identity: >-
      **未作成。** この作品は生成の前に書かれた——`media/` はまだ無い。
      要るのは顔ではなく、**手・布・後ろ姿**である
      （正面と横顔を持たないシート。仕様は `specs/image/mado-fuki-onna-character-sheet.md`）。
      ⚠️ **画像が出来るまで、この欄は「未作成」のままである**——無いファイルを指す語は嘘である。
    states: {}

locations:
  海辺の部屋:
    # ⚠️ **この作品の唯一の場所である。** 窓が一枚、床板、脚立とバケツ。
    base: >-
      **未作成。** この作品は**生成の前に書かれた**——`media/` は空である。

    geography: >-
      海に面した空き部屋。窓は壁の一面に一枚だけ。窓の外は海と、まだ低い太陽。
      **カメラは部屋の内側から出ない。**
    states: {}

# ⚠️ **開示の変化点は2つである。**
#    ① `s03` **ガラスが拭け、海が見え始める**（曇りの向こうに在ったものが、姿を現す）
#    ② `s04` **部屋が明るくなる**（窓が透いたぶん、室内の光が変わる）
#    ⚠️ **`s01`・`s02` は変化点ではない。** そこは出発点である——海はまだ見えていない。
disclosure:
  # ⚠️ **`s03` は `changed`、`s04` は `covered` である。**
  #    `s02` だけが `body_parts: {hand: 1}` を持ち、その写し `no second hand` を §18 に置く——
  #    ゆえに **Negative の集合は `s02 → s03` で1節だけ縮み、`s03 → s04` では動かない。**
  #    ⚠️ **禁止が消えることは、モデルが描いてよいものの恒久的な拡大である**——`L14` がそう言う。
  #    ここでは**枠が手1本から後ろ姿の全身へ変わる**からで、開示の都合ではない。
  - shot: mado-fuki-s03
    ガラス.透け: 海が見え始める
    negative: changed
  - shot: mado-fuki-s04
    部屋.明るさ: 朝の光で満ちる
    negative: covered

dramaturgy:
  version: 1
  premise: "海辺の空き部屋で、女が曇った窓を拭いている。"
  question: "彼女は、窓の向こうを見られるのか——見たあとで、この部屋に居られるのか。"
  argument: >-
    曇りは守りでもある。**拭くことは、見ることを選ぶことである。**
  visual_thesis: >-
    ガラスは常に手前で光を受けている。**最後の1本で初めて、光は向こう側から来る。**

  value_poles:
    - ja: 隠す
      en: hidden
    - ja: 見える
      en: seen

  acts:
    - id: act-1
      shots: [mado-fuki-s01, mado-fuki-s02, mado-fuki-s03, mado-fuki-s04]
      turn: "`s03` — 布が滑り、ガラスの向こうが初めて像を結ぶ。**隠すことが終わる。**"
      climax: mado-fuki-s03
      value_from: 隠す
      value_to: 見える
      rhythm: "質感 → 発見 → 所作 → 余白"

  motifs:
    - id: 布
      first: mado-fuki-s02
      recurrences: [mado-fuki-s03]
      payoff: mado-fuki-s04

  ending_image: >-
    拭き終えた窓の前に、女が立っている。**ガラスはもう何も隠していない。**
    海が、朝の光の中に在る。
