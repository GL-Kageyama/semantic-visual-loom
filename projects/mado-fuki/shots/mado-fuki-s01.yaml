# 第一ショット / 情景 / motion —— 曇った窓と、まだ見えない海
#
# ⚠️ **このショットの変化は「世界の肌」である。** まだ何も透かない——
#    動くのは光と、窓に垂れる結露だけである。
#
# ⚠️ **カメラの目録を引かない1本である**（`L54` の註が「当たらない」と言う）。
#    **三脚を据えて動かさない。** 引かないことも記録である。
#    ⚠️ **光の目録と構図の目録は引く**——`Dawn`・`Window light`・`Soft light`、
#       そして一点透視（`051` 一点透視構図）。

shot: mado-fuki-s01
spec: specs/video/mado-fuki-s01.md

aim: >-
  **曇ったガラスを、この作品の主語として置く。** 海はもうそこに在るが、
  観客にはまだ見えない。**見えないものが在る、という1点だけを渡す。**

unit:
  before: "部屋は空で、窓は白く曇っている。外の明るさだけが、ガラスを通り抜けている。"
  after: "同じ部屋。**ガラスに、外の形がまだ像を結ばないまま、光だけが強くなっている。**"

role: 情景
place: 海辺の部屋
time: 夜明け
mode: motion
duration: 8s
# ⚠️ **この枠に映る人数は、同時に一人までである**（`L51` が数を見る）。
population: 1

motion:
  subject: 曇った窓と、窓のそばに立つ女
  quality: >-
    **光がゆっくり上がる。** 結露の粒が一つ、ガラスを伝って落ちる。女は動かない——
    彼女より先に、部屋の明るさが変わる。
  law: >-
    Cinematic still の物理。**光源は窓の外の太陽だけ**。浅い被写界深度——
    窓枠に焦点が合い、部屋の奥は落ちる。**ガラスの曇りは、光を散らす面として在る。**

beats:
  - range: 0-3s
    density: sparse
    what: "部屋。床板、脚立、バケツ。**窓は白い。** 外の明るさだけが、曇りを透かして薄く広がる。"
    intensity: 1
    audience: "まだ朝の早い、空き部屋だ。"
  - range: 3-6s
    density: sparse
    what: >-
      ガラスに寄る。**結露の粒が一つ、ゆっくり下へ落ちる。** 曇りの向こうに、
      明るさのむらだけがある——**像は結ばない。**
    intensity: 2
    audience: "窓の向こうに、何かが在る。**まだ、何だか分からない。**"
  - range: 6-8s
    density: held
    what: >-
      窓のそばに、女が立っている。**後ろ姿。** 布を手に提げ、まだ動かない。
      朝の光が、彼女の肩の線を薄く拾う。
    intensity: 3
    audience: "この人が、この窓を拭くのだろう。"

reference_set: []
attached: []

forbidden_set:
  - 女の顔の寄り
  - もう一人の人間
  - 拭かれたガラス
  - はっきり見える海
  - 読み取れる文字
  - 人工の光源
  - カメラの移動（この1本は据えたまま）

disclosure_state:
  ガラス.透け: 曇っている
  海.見え: 見えていない

dramatic:
  function: 質感
  audience:
    feel: "静かで、少しだけ息が詰まる。**窓の向こうが白い。**"
    expect: "誰かが、この窓を拭くのだろう。"
    know: "ここは海辺の空き部屋であること。夜明けであること。"
  button: "**曇ったガラスと、その前に立つ後ろ姿**——まだ何も透かない。"
