# 第二ショット / 反応 / motion —— 布が触れ、光が散る
#
# ⚠️ **このショットはカメラの目録を引く。** `push in slowly`（`003` ドリーイン、
#    `travels: true`）——ゆえに**「カメラは動かない」とは書かない**（`L54` が見る）。
#    ⚠️ **役は `反応` で、`003` の `roles` に在る。**
# ⚠️ **構図は `070 透かして見せる`**（`view through transparency`）——ガラス越しの光。

shot: mado-fuki-s02
spec: specs/video/mado-fuki-s02.md

aim: >-
  **光を、ガラスの上で散らす。** 拭く前の一瞬、布が触れた所だけ曇りが崩れ、
  光がそこへ集まる。**まだ海は見えない——見えるのは光だけである。**

unit:
  before: "ガラスは一様に曇り、布はまだ触れていない。"
  after: "**布の通った一条だけ曇りが崩れ、そこに外の光が滲み出している。**"

role: 反応
place: 海辺の部屋
time: 夜明け
mode: motion
duration: 8s
population: 1
# ⚠️ **このショットだけが `body_parts` を持つ。** 枠に入るのは**身体の一部**である
#    （手と前腕）。人数の1は正しいが、**失敗は肢で起きる**——実測 `drama-pilot` `s04` の
#    「3本目の手」がそれである。**名指さない席は、生成器が自分の既定で埋める。**
#    ⚠️ **`s01`・`s03`・`s04` は持たない**——あの3本は後ろ姿の全身が枠に在り、
#      手を1本に限る理由が無い（**禁制は数を数える。数えるべきでない所で数えてはならない**）。
body_parts:
  hand: 1

motion:
  subject: ガラスに触れる布と、その向こうの光
  quality: >-
    **布が滑る。** 曇りが布の跡に沿って崩れ、崩れた所から光が滲む。
    手はゆっくりで、光のほうが先に動く——**滲みは布より遅れて広がる。**
  law: >-
    Cinematic still の物理。**光源は窓の外の太陽だけ。** ピントはガラス面に在り、
    布の手前と、外の海は落ちる。**光は拡散し、輪郭を持たない。**

beats:
  - range: 0-2s
    density: sparse
    what: "ガラス面。**布が画面の外から入り、ガラスに触れる。** 曇りが指の下で押される。"
    intensity: 3
    audience: "拭き始めた。"
  - range: 2-5s
    density: dense
    what: >-
      **布が滑る。** 一条の帯がガラスに残り、そこだけ曇りが無い。
      朝の光が、その帯を通って室内へ落ちる——**光の帯が、ガラスの上に描かれる。**
    intensity: 5
    audience: "**向こうが明るい。** 何かが在る。"
  - range: 5-8s
    density: held
    what: >-
      布が止まる。**帯は光を透かしているが、像は結ばない。** まだ白い。
      手が、ガラスから少し離れる。
    intensity: 4
    audience: "まだ、見えない。**でも、もう曇ってはいない。**"

reference_set: []
attached: []

forbidden_set:
  - 女の顔の寄り
  - もう一人の人間
  - はっきり見える海
  - 読み取れる文字
  - 人工の光源
  - 手の寄りすぎ（指のクローズアップ）

disclosure_state:
  ガラス.透け: 一条だけ拭かれている
  海.見え: 見えていない

dramatic:
  function: 様式美
  audience:
    feel: "**きれいだ。** 拭くという行為が、光を描いている。"
    expect: "このまま拭けば、向こうが見える。"
    know: "ガラスの向こうに光が在ること。"
  button: "**光を透かす一条の帯**——まだ像は結ばない。"
