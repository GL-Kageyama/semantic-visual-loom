# 第四ショット / 余白 / motion —— 部屋が明るくなる
#
# ⚠️ **このショットは四つの目録を一度に引く。**
#    - カメラ：`pull back slowly`（`004` ドリーアウト、`travels: true`、`roles` に `余白`）
#    - 光：`Golden hour`・`God rays`
#    - 構図：`low horizon`（`073` 低い地平線）
#    - 画風：`cinematic-still`（目録 `093`）——全編で一つ
#
# ⚠️ **引きの1本である。** 窓が透けたぶん、部屋そのものが明るくなる——
#    ここで初めて、**光が向こう側から来る。**

shot: mado-fuki-s04
spec: specs/video/mado-fuki-s04.md

aim: >-
  **部屋を、窓のほうへ引き取る。** カメラが下がり、窓が枠の中で小さくなる——
  それでも**ガラスはもう白くない。** 海と、その上の空が、部屋の中に在る。

unit:
  before: "窓は透けており、女がその端に立っている。"
  after: "**カメラが下がり、部屋の全体が枠に入る——窓は明るく、部屋はもう暗くない。**"

role: 余白
place: 海辺の部屋
time: 夜明け
mode: motion
duration: 8s
population: 1

motion:
  subject: 部屋と、窓と、窓の端に立つ女
  quality: >-
    **カメラがゆっくり下がる。** 窓が枠の中で小さくなり、部屋の床と壁が入ってくる。
    女は動かない。**下がるほど、部屋が明るくなる**——光が床に落ちている。
  law: >-
    Cinematic still の物理。**光源は窓の外の太陽だけ。** 引きは台車の重さで一定、
    加速しない。**地平線は低く、空が大きい。**

beats:
  - range: 0-3s
    density: sparse
    what: "窓。**海と、その上の空。** 太陽はまだ低く、水面に道を作っている。"
    intensity: 3
    audience: "朝だ。"
  - range: 3-6s
    density: sparse
    what: >-
      カメラが下がる。**床板、脚立、バケツ、壁が入ってくる。**
      窓から入った光が、床に長い四角を落としている。
    intensity: 2
    audience: "この部屋は、もう暗くない。"
  - range: 6-8s
    density: held
    what: >-
      **引ききった部屋。** 窓は枠の中で小さく、女は窓の端に立っている。
      彼女は動かない。**光だけが、まだ少しずつ強くなっている。**
    intensity: 2
    audience: "**彼女は、まだここに居る。**"

reference_set: []
attached: []

forbidden_set:
  - 女の顔の寄り
  - もう一人の人間
  - 読み取れる文字
  - 人工の光源
  - 窓枠の外の地形（島・船・建物）
  - カメラの上下動（この引きは水平のみ）

disclosure_state:
  ガラス.透け: 透けている
  部屋.明るさ: 朝の光で満ちる

dramatic:
  function: 余白
  audience:
    feel: "**静かだ。** 何も起きていないのに、全部が変わっている。"
    expect: "彼女は、ここを出るのだろう。"
    know: "海は最初から在ったこと。ガラスが隠していただけだということ。"
  button: "**引ききった部屋と、窓の端の後ろ姿**——光はもう、向こう側から来ている。"
