# 作品台帳 — 『ハビッツ！！！』（habits）
#
# **出典が二つある。どちらも配布物であり、このリポジトリの外にある。**
#   ① `elevate-draft-engine/examples/habits-ja/handoff/run-10/artifacts/elevated.md`
#      ——ルックとカメラ・世界観・動きの単位・アニメ化の意味（**層**＝run-10）
#   ② `soul-voice-teller/examples/habits/台帳/series-bible.md`
#      ——巻・話・字数・伏線・連載の整合（**正**＝台帳）
#   読み分けは出典自身が書いている——「**人物を書くには run-09、場面を書くには run-10**」
#   （`elevate-draft-engine/examples/habits-ja/README.md`）。**run-10 は run-09 を置き換えない。**
#   この一枚が使うのは run-10 と台帳である。**人物の事実は run-09 と `台帳/人物/` に在り、
#   ここには複製しない**（`方針 §3-1②`）。
#
# ⚠️ **値はすべて写しである。** 決定 2026-09-15（著者）——「写し、出典の行を併記する」。
#    **欄ごとに `出所:` を付ける。** ⚠️ **写しは黙ってずれる**——鳴らす者が要る。
# ⚠️ **食い違ったら、出典が勝つ。** 台帳 `人物/README.md` の〔導出〕と同じ約束である
#    ——**出典にあるものと、導いたものを混ぜない。**
# ⚠️ **出典に無い欄は、空のまま置く。** 空は空白ではない（`台帳/人物/README.md`「書かないことの決定」）。
#
# ⚠️ **`world` は、まだ誰も読んでいない。** 今日この一枚を機械で読む者は
#    `bible.constants.video` だけである（`engine/shot/print_spec.py` の §1 導出と `L26`）。
#    **家に読者がいて初めて、家は家である**——`world` の読者は、まだ居ない。
#
# ⚠️ **不変部と可変部の線引きは未決定である**（`schemas/README.md`）。
#    ここは「出典が不変部として書いているもの」だけを置いた。

project: habits

bible:
  # 作品の様式。**様式カードの名前である。**
  # 出所: `distill-essence-engine` の様式カード `luminous-anime`（2026-08-26 追加）。
  #       ⚠️ **出典は、この作品に固有の様式名を与えていない。** run-10【ルックとカメラ】は
  #          ルックを散文で書くが、カードの名前は書かない。**八点の初稿がこの名前を選んでいる**
  #          （`examples/habits/habits-concept-board-luminous-anime/`）。
  #          **ゆえにこの一行は写しではなく、初稿の選択である**——§5a の「発明（要承認）」に当たる。
  #       ⚠️ **2026-09-16——初稿の八点のうち六点は、退避された。** 五点は旧題（巻題と話名）を
  #          本文に持っていたため、**残る一点（侘田すみれの設定画）は、四枚で一組という
  #          宣言を実体側で偽にしないためである**（`examples/habits/_backup_20260916/`）。
  #          **実体側に残るのは二点**——構想盤と表紙である。
  #          **この節が引くのは、その二点のうち構想盤である。**
  #       ⚠️ カードの中身は `distill-essence-engine` に在る。ここに置くのは**名前だけ**である。
  #       ⚠️ この欄が §18 の7つ目のスロット `Style Motion` の出所である（`specmap.PROMPT_SLOTS`）。
  style: luminous-anime

  # 作品が話す言語。**値は英語で書く**（生成に渡る文字列は英語である——訳してはならない）。
  # 出所: 決定（2026-09-18、著者）「**言語指定で触っているなら、必ずその言語を話す。**」
  #       ⚠️ **空欄は中立ではない。** それまでこの欄はどこにも無く、
  #          **空欄は生成器の既定で埋まった**——実測: 発話を検出した動画に
  #          **中国語の字幕が焼かれた**。だから**症状を禁じるのではなく、言語を名指す。**
  #       ⚠️ **この作品は日本語を話す。** 発声は出典の一部である
  #          （run-10【音と声】／さくらに固有の声を与えない、もこの層の話である）。
  #       ⚠️ **この欄を読む者**: `L27`（`engine/ledger/semantic.py`）——
  #          **宣言があり、かつ §18 `Audio Prompt` へ届いていること**を見る。
  #          **生成物が実際にその言語で喋ったかは、この基盤からは見えない**（穴である）。
  language: Japanese

  world:
    # 出所: run-10【世界観】——一字も変えない。
    concept: >-
      2026年、日本。埼玉県川口市、東京都足立区、神奈川県横浜市戸塚区。
      **魔法も、制度も、秘密の組織もない。あるのは、記名の作法が行き届いた日常だけである。**

    # 出所: run-10【世界観】——この三つが「掟」として名指されている。
    # 出所: run-10【動きの単位——運搬と、一話一カット】——**この作品の運搬の規則。**
    # 出所: run-10【ルックとカメラ】・【アニメ化を前提とする、その意味】——**削除の規則。**
    rules:
      - "ひとつ、名は呼ばれた回数でできている。**名の本体は、書かれた側ではなく呼ばれた側にある。**"
      - "ふたつ、同時に立てる席は限られている。"
      - "みっつ、禁則の語群がある。"
      - "**この作品の運搬は一度も完了しない。** 受け取られないか、受け取ったことにされないか、受け取った先で読まれない。**完了しないことが、動きを事件にしない唯一の方法である。事件とは、運搬が完了することである。**"
      - "**各話に一行を置く——「何を、どこから、どこへ、誰の手で運ぶか。そしてどこで止まるか」。この一行が書けない話は、動きのない話であり、書き直す。この一行は、アニメなら一カットで描ける動作でなければならない。**"
      - "**手が先にあり、顔が後に来る。順序は入れ替えない。顔は、呼ばれた後にだけ置かれる。**"
      - "**地の文に書かれた内面は、すべて、動きか台詞に置き換え可能でなければならない。置き換えられない内面は、内面ではなく説明である。** これは追加の規則ではなく、**削除の規則**である。"
      - "**作中の人物は、自分が映像の中にいることを知らない。**"

    # ⚠️ **この欄だけ英語である。** このリポジトリの規約——**生成に渡す文字列は英語**であり、
    #    訳してはならない（`CLAUDE.md`「Things That Must Not Be Broken」）。
    #    **出典は日本語である。ゆえにこの欄は「写し」ではなく「移し替え」である。**
    #    ⚠️ **移し替えは著者の承認を得ていない。** §5a の「発明（要承認）」と同じ扱いにする——
    #       出典の日本語を、それぞれの値の直上に一字も変えずに置いた。
    #
    # ⚠️ **出典が与えていない欄は、置いていない。** 置かなかった欄——
    #    `color_language` `texture` `rendering` `visual_density` `weather` `atmosphere`
    #    （`ukebi-v2` の `bible.yaml` は八欄を持つ。**この作品に同じ八欄を写す先は無い**）。
    #    出典に在るのは、下の `art_direction` と `era` の二つ分だけである。
    #    **埋めるなら——初稿の七点が答えた分（`habits-concept-board-luminous-anime/prompt.md`
    #    の「様式（Style）」節）を、規則として採るかどうかを決める必要がある。**
    #    ⚠️ **方針 §2 がそれを禁じている**——八点は初稿であり、**規則の根拠にできない。**
    visual_language:
      # 出所: run-10【ルックとカメラ】——「2026年の日本の、記名の現場。**印刷・ボールペン・
      #       鉛筆の三つの解像度。** 名札のプラスチック、出席簿の左袖の厚み、宛名票の糊の跡、
      #       預かり札の鉛筆の重なり。蛍光灯。手の近景を毎話一つ。音は、呼び声ではなく、
      #       **紙と手の音**である。」
      art_direction: >-
        A Japanese record-keeping site, 2026. Three resolutions of the written name —
        print, ballpoint pen, pencil. Nameplate plastic, the thickness of a register's
        left sleeve, glue traces on an address slip, layered pencil on a claim tag.
        Fluorescent light. One close shot of a hand per episode.
        Sound is not a calling voice but the sound of paper and hands.
      # 出所: run-10【世界観】「2026年、日本。」／台帳 `series-bible.md` 三、年表
      #       「**舞台は 2026 年、四巻を通じて動かない。**」
      era: "2026, Japan. The setting does not move across all four volumes."

  constants:
    # 出所: run-10【世界観】・【音と声】・【ルックとカメラ】。
    # ⚠️ `ukebi-v2` の `bible.yaml` はここに「根本律」「光源」「カメラ」を置く。
    #    **この作品にその三つを写す先は無い**——出典は同じ三つを名指していない。
    #    代わりに、出典が**全巻を貫く定数として書いている**ものだけを置く。
    運搬: "**完了しない。** 事件とは、運搬が完了することである。"
    音: "**呼び声ではなく、紙と手の音。** 効果音としての呼び声は要らない。呼び声が聞こえるのは、呼ばれた本人の側だけである。"
    顔: "**呼ばれた後にだけ置かれる。** 手が先にあり、顔が後に来る。順序は入れ替えない。"
    名: "**本体は、書かれた側ではなく呼ばれた側にある。** 名は呼ばれた回数でできている。"

    # §1 の作品定数。**ショットに依らない4つである。**
    # ⚠️ **出典に、この4つは無い。** run-10 は解像度も尺も書かない。
    #    ゆえにこの4つは**初稿の側から採る**——八点の `prompt.md` が §1 相当を持つ。
    #    ⚠️ **方針 §2 により、初稿は規則の根拠にならない。** **この4行は要承認である。**
    #    ⚠️ **`duration` はここに無い。** 尺はショットごとに違う——
    #       **従属変数であり、家は `shot.duration`、読む者は `L23` である。**
    #    ⚠️ **値を変えるときは、`specs/` の §1 を全部とも直すこと。** `L26` が食い違いを鳴らす。
    video:
      aspect: "16:9"
      resolution: "1920x1080"
      frame_rate: "24fps"
      orientation: "Landscape"

  # 全ショットに必ず付く禁制。**英語不変部——訳してはならない。**
  #
  # ⚠️ **この作品は「記名」を題にしている。** 名は紙に書かれ、手で読まれる——
  #    ゆえに「読めない文字」は、この作品では自明でない。
  #    出典はこの点を決めていない（run-10【ルックとカメラ】は「カメラは、机上の手、左袖の名札、
  #    めくられる名簿の三箇所に置かれる」とだけ書く）。
  #    **初稿は答えている**——`habits-concept-board-luminous-anime/prompt.md`——
  #    「紙の欄は記入済みだが**判読できない**——名の印であって名ではない。……
  #      判読できる名を置けば、その人物の同一性が一枚に固定される。
  #      **この作品は二十四名の順番を配役表にしない**」（＝§5b① と同じ向き）。
  #    ⚠️ **方針 §2 により、これは規則ではない。**
  #
  #    ⚠️ **裁定 2026-09-21（著者）——この一行を、床から外した。**
  #       初稿だけを根拠にする一行を、**作品ぜんたいの床**に置くことはできない（`方針 §2`）。
  #       **可読度は、各話の §18 `Negative Prompt` が負う**——**そうでなければならない**:
  #       `02-07` は名を読ませず、`02-08` は「橋本」を読ませる。**同じ作品の中に、両方がある。**
  #       **一本の床では、この二つを同時に表せない。**
  #       ⚠️ **旧 `- "no legible name text"` は、ここに在った**（要承認）。経緯は `HISTORY.md` 0.32.0。
  #       ⚠️ **§18 の側は一字も変わっていない**——床から外すことは、**要求を減らすだけである**。
  #       ⚠️ **`projects/habits-promo-chinatsu` は、同じ語を 2026-09-18 に承認している。**
  #          あちらは**宣伝**であり、**名を隠すことが主題である**（同 `bible.yaml`「名は、枠の外で呼ばれる」）。
  #          **これは別の作品の、別の決定である。** ゆえに片方だけを動かしてよい。
  negative_base:
    - "no calling voice as a sound effect"   # run-10【音と声】
    - "no face before the name is called"    # run-10【ルックとカメラ】
    - "no watermark"                         # 基盤の共通禁制
    - "no on-screen subtitles"               # 基盤の共通禁制

  # ─────────────────────────────────────────────────── 経路が受け取らないスロット
  #
  # ⚠️ **裁定 2026-09-21（著者）——この作品は、`SEEDANCE 2.5` の制限を承知で使う。**
  #
  #    この経路は**否定を専用のパラメータで受け取らない。**公式に否定として扱われるのは
  #    **字幕と音声だけ**である（`"No subtitles."` / `"No BGM"` / `"No audio."`）——
  #    **残りは、ただの散文として読まれる**（`engine/ledger/specmap.py` の
  #    `MODEL_UNRECEIVED_SLOTS`。出所は BytePlus（ModelArk）の公式ドキュメント）。
  #
  #    ⚠️ **それでもこの経路を要する理由は、第二巻第七話である。**
  #       この話は**二つの字を持ち、そのどちらも読ませない**——表札の字は**彫ってあり、
  #       へこみに黒が入っている**。宛名票の字は**印刷である**。**この二つは同じ「文字」ではない。**
  #       ⚠️ **合成（`timeline`）には置けない**——合成で置けるのは**画面上で動かない文字**であり、
  #       この二つは**ショットの内側で、視差と手ぶれで動く**。
  #       **ゆえに生成器が描く。** **文字を描けないモデルでは、原理的に達成できない**
  #       ——失敗の型は《空白になる》と《偽の字になる》であり、**この作品は両方を禁じている。**
  #
  #    ⚠️ **85節を §18 に置いたまま、この経路を使う。** **それが代償である。**
  #       **ゆえに §18 `Negative Prompt` は、この経路では床ではなく記録として置かれる**——
  #       この経路が実際に読むのは、`Master Prompt` の側の散文と、末尾の
  #       `No subtitles. No BGM.` である（`specs/video/habits-ch02-seg07.md` の §18）。
  #
  #    ⚠️ **この宣言を外せば、`L30` は違反へ戻る**（`check.py` の自己検査も戻す）。
  #       **宣言しなければならないのは、承知の上で使うからである。**
  #       ⚠️ **一字一句が照合される**（完全一致。`SEEDANCE 2.5: Negative Prompt`）——
  #          綴りが違えば**効かない**。`L30` はそれを報告する。
  #
  #    ⚠️ **`no on-screen subtitles` は床のままである。** **字幕（不随意的な焼き込み）と、
  #       作中の文字は別物である**——そして**この経路には字幕を出す公式の記法が在る**（`【】`）ので、
  #       **この床は、この経路でむしろ強く効く。** **作中の文字を描かせることは、
  #       字幕を許すことではない。**
  route_limits_accepted:
    - "SEEDANCE 2.5: Negative Prompt"
