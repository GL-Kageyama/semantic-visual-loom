# プロモーション 第一ショット / 反応 / motion —— 名が呼ばれ、返事が一拍遅れる
#
# **出典**
#   拍は **`expression.md` の第一の拍**である（`distill-essence-engine/examples/habits/character/メイン/01_碓氷千夏/`）。
#   「**①名を呼ばれ、返事が一拍遅れる。**」——**これは著者が凍結した一枚に、既に描かれている。**
#   ⚠️ **このショットは、その一枚を仕様へ移したものである。** 新しい拍を立てていない。
#
#   出所: run-08:82 第9話「呼ばない名前」——`職員室で名を呼ばれ、返事が一拍遅れる。`
#         run-09——`その名の呼ばれ方＝正しく呼ばれる`／`欠けている人称＝あなた`
#         run-06——`誰かを名で呼ばずに用件から話し始める。`（第三ショットが引く）
#
# ⚠️ **このショットに、呼び声は無い。**
#    run-10【音と声】——「**呼び声が聞こえるのは、呼ばれた本人の側だけである。**」
#    ゆえに観客は、名を一度も聞かない。**聞こえるのは、返事の遅れだけである。**
#    ✅ **これは制約ではなく、この作品の主題である**（`bible.yaml`「名は、枠の外で呼ばれる」）。
#
# ✅ **二経路を切った**（②design、2026-09-18）。動画は §1–20 と §18 の七欄、画像は1段落ずつ。
#    ⚠️ **画像の経路は、一度切られて、戻った。**（決定 2026-09-18、著者）
#       **切ったのはこの一段である**——理由と、それがなぜ誤りだったかは `bible.yaml`「画像の経路」に
#       **反転として残してある。消していない。**
#    ⚠️ **この1枚は、このショットの動画へ添付（参照画像）として渡る**——**最初のコマではない。**
#       最初のコマにすれば、**このショットの変化が画面上で起きなくなる**。
#    ⚠️ **`specs/video/` の §18 `Negative Prompt` は、五ショットで同一である**——
#       **画像の `Negative` も、それと同一である。** 理由は第一ショットの二つの仕様のヘッダを読む。

shot: habits-promo-chinatsu-s01
spec: specs/video/shot-01-called.md
key_image: specs/image/shot-01-called.md

unit:
  before: 職員室。**名が呼ばれ、彼女の頭がまだ動き出していない。**
  after: "**振り向ききって、口がまだ開かない。返事が一拍、遅れている。**"

# 反応——**この一変化は、遅れそのものである。**
# 固有基準は「抑制・微細な身体・表情の段階」（`engine/ledger/rolemap.py`）。**三つとも、この一拍の作り方である。**
role: 反応

# 第一から第三ショットの記名の現場。**彼女が身につけている名**（`ledger.yaml`）。
place: 名札

# ⚠️ **この作品は、四つの拍が同じ日であるかを決めない**（`bible.yaml` の規則）。
#    決めれば、それは一話になる。**この二十八秒は、一話ではない。**
time: 2026年の勤務日の日中

mode: motion

# ⚠️ **尺は、この作品で著者が決めた数である**（`bible.yaml`「尺」）。
#    親の `8s` は「発明（要承認）」だった。**この作品の五つの尺は、著者の指定の内側にある**
#    ——「4ショット×4〜8秒＝20〜30秒」。**五つで二十八秒である。**
duration: 5s

motion:
  subject: 碓氷千夏の首と頭
  quality: >-
    **呼ばれた側だけが聞いた声に、一拍遅れて頭が動く。** 動きは小さく、速くない——
    run-10 第一巻「十」——「**速度は遅い**」。⚠️ **完了しない。**
    振り向ききったところで止まるが、**返事は、まだ出ていない。**
  law: >-
    luminous-anime の物理。**止まるのは主題であって、画面ではない**——蛍光灯の下で、
    埃と光は動き続ける。⚠️ 様式カードの中身は `distill-essence-engine` に在る。ここに置くのは**名前だけ**である。

beats:
  - range: 0-3s
    density: sparse
    what: >-
      職員室。**背中と、横顔の半分。** 名が呼ばれる——**声は聞こえない。**
      頭が動き出す。⚠️ **顔は置かれない**——「手が先にあり、顔が後に来る」の順序の中で、
      **ここは「呼ばれた後」の側である。** ゆえに顔は、このショットで既に許されている。
  - range: 3-5s
    density: held
    what: >-
      **振り向ききる。口は開かない。** 一拍。**この一拍が、このショットの主題である。**
      紙と手の音だけが在る。呼び声は無い。

# ⚠️ **`reference_set` の鍵は、すべて `ledger.yaml` に在る。**（`L8`）
reference_set:
  - 碓氷千夏.identity      # 凍結した二枚一組——⚠️ **設定画の側は未追跡である**
  - 碓氷千夏.negatives
  - 名札.base
  - 名札.geography

# ⚠️ **この作品に居ない者を、名で禁じる。** 省略すれば、モデルは「他の誰か」を描く。
#    ⚠️ **この一覧は手で書いた**——親の台帳の二十八名から、碓氷千夏を引いた二十七名である。
#       **台帳から機械で導いたものではない。ずれる。**
#    ⚠️ **この作品では、禁制が親より強い。** 親は「この一話に居ない者」を禁じた。
#       **この作品は、二十七名すべてを禁じる**——`bible.yaml` の規則
#       「**この作品は、彼女以外の誰も画面に置かない**」が、その理由である。
forbidden_set:
  - 暮林蒼
  - 侘田すみれ
  - さくら
  - 佐藤美咲
  - 鈴木和彦
  - 高橋由美
  - 片山大翔
  - 篠原麻衣
  - 大森徹
  - 川上桜
  - 関翔太
  - 長田美穂
  - 根本湊
  - 木村智美
  - 山田健太
  - 田村彩
  - 三宅隆
  - 宮下遥
  - 秋山誠
  - 林沙織
  - 清水拓也
  - 斎藤悦子
  - 関口浩一
  - 池田絵里
  - 橋本悠斗
  - 石川久美子
  - 前田亮太

# ⚠️ **`attached` は宣言であって記録ではない。**（親の註）
#    ここに書いてあるのは「何を添付するつもりか」であって、「何を添付したか」ではない。
#    **記録はテイクの側に在る**（`take.params.references`）——⚠️ **`takes/` は無い。**
#    **ゆえに、実際に何が添付されたかは、どこにも記録されていない。これは穴である。**
#    ⚠️ **`attached: []` と書いてはいけない。** 空欄は「何も添付しなかった」という**別の主張**になる。
attached:
  - 碓氷千夏.identity
  - 碓氷千夏.negatives
  - 名札.base
  - 名札.geography

# ⚠️ **台帳の `disclosure` と対である。**（`L7b`）
disclosure_state:
  名札.姓: present
