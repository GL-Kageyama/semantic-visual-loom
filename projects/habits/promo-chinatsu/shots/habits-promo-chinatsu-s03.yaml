# プロモーション 第三ショット / 対話 / motion —— 名を出さずに、用件から切り出す
#
# **出典**
#   拍は **`expression.md` の第三の拍**である。「**③用件から話し始める。**」
#
#   出所: run-06 の癖——`誰かを名で呼ばずに用件から話し始める。`
#         run-09——`立てる人称＝私`／`欠けている人称＝あなた`／`地の文に呼びかけが一度も出ない`
#
# ⚠️ **このショットに、声は無い。**（決定 2026-09-18、この一段）
#    理由は二つである——
#      ① `bible.yaml` の規則——「**この作品に、発音される名は無い。** 声そのものを置かない。
#         音は紙と手の音である。」
#      ② **用件の中身は、出典に一行も無い。** 声を置けば、**この一段が台詞を発明することになる。**
#    ⚠️ **ゆえに、このショットは無音である。** 口が動き、**名だけが来ない。**
#       **聞こえないことは、この作品では情報である。**
#
# ⚠️ **聞き手は、枠の外にいる。**
#    `bible.yaml` の規則——「**この作品は、彼女以外の誰も画面に置かない。** 呼ぶ者も、聞く者も、枠の外にいる。」
#    ゆえに `rolemap` の `対話` が持つ固有基準「**聞き手の反応**」「**声との同期**」は、
#    **このショットでは空欄である。** ⚠️ **これは検査の穴ではなく、記録された不在である**——
#    **引けない基準を、引けたことにしない。**

shot: habits-promo-chinatsu-s03
spec: specs/video/shot-03-matter.md
# ⚠️ **この1枚は、このショットの動画へ添付（参照画像）として渡る**——最初のコマではない。
#    ⚠️ **視線は枠の外へ行く。レンズへは来ない**——**参照画像においても同じである。**
#       レンズを見るのは、この作品で第五ショットの一枚だけである。
key_image: specs/image/shot-03-matter.md

unit:
  before: "**口が、まだ動いていない。**"
  after: "**用件から話し始めている。名は、一度も来ない。**"

# 対話——**この一変化は、名の来ない会話である。**
# 固有基準のうち、このショットで生きているのは「間・沈黙」と「視線」である（上の註）。
role: 対話

place: 名札

time: 2026年の勤務日の日中

mode: motion

# ⚠️ **五つの中で最も短い。** 用件は、この作品の主題ではない——
#    **主題は「名が来ないこと」であり、それは短いほど見える。**
duration: 4s

motion:
  subject: 碓氷千夏の口と視線
  quality: >-
    **口が動き出す。名を出さない。** 視線は、聞き手のいる側へ行く——
    ⚠️ **聞き手は枠の外にいるので、視線は枠の外へ向かう。** カメラへは向かない。
  law: >-
    luminous-anime の物理。**止まるのは主題であって、画面ではない**——蛍光灯の下で、
    埃と光は動き続ける。⚠️ 様式カードの中身は `distill-essence-engine` に在る。

beats:
  - range: 0-2s
    density: sparse
    what: >-
      **口が動き出す。** 名を出さずに、用件から切り出す。
      ⚠️ **名前が来るはずの位置が、空いている。**
  - range: 2-4s
    density: held
    what: >-
      話し続ける。**名は、最後まで来ない。** 声は無い。**紙と手の音も無い**——
      このショットだけ、音が無い。

reference_set:
  - 碓氷千夏.identity
  - 碓氷千夏.negatives
  - 名札.base
  - 名札.geography

forbidden_set:
  - 暮林蒼
  - 侘田すみれ
  - さくら
  - 佐藤美咲
  - 鈴木和彦
  - 高橋由美
  - 片山大翔
  - 篠原麻衣
  - 大森徹
  - 川上桜
  - 関翔太
  - 長田美穂
  - 根本湊
  - 木村智美
  - 山田健太
  - 田村彩
  - 三宅隆
  - 宮下遥
  - 秋山誠
  - 林沙織
  - 清水拓也
  - 斎藤悦子
  - 関口浩一
  - 池田絵里
  - 橋本悠斗
  - 石川久美子
  - 前田亮太

attached:
  - 碓氷千夏.identity
  - 碓氷千夏.negatives
  - 名札.base
  - 名札.geography

# ⚠️ **変化点は無い。** 第二ショットと同じである——**状態は、持っている。**
disclosure_state:
  名札.姓: present

# ⚠️ **`text_channel` を置かない。**（`bible.yaml`——「この作品に、焼かれる文字は無い」）
#    置かなければ、この欄は「無い」——**空の配列を書けば、「何も焼かない」という別の主張になる。**
