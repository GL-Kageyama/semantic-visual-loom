#
# ✅ **決定（2026-09-18、著者）——この作品は、画像 → 動画の二経路を持つ。**
#
#    ⚠️ **これは基盤の決定（2026-09-13、著者）そのものである。この一段は、それに戻った。**
#
#    ⚠️ **一度、この一段がこれを切った。**（発明・要承認）
#       **その記録を消さずに残す**——**反転として読めることが、この節の役目である。**
#
#       切ったときの理由（**どちらも、この一段の誤りであった**）——
#
#         ① **参照が既に二枚で凍結されている。** 生成された三枚目が食い違えば、
#            同一性を壊すのは後から足した側である。→ **経路の値を、片側しか数えていなかった。**
#            画像は**確認点**でもある——**外れた一枚は、一枚の値段で棄却できる。**
#            文→動画では、外れは**テイクを払った後**にしか分からない。
#            **著者の問い「画像→動画の方が、安定しませんか？」が、これを突いた。**
#
#         ② **この作品の主題は、すべて「変化」である。** 変化の途中の一コマを切れば、
#            ショットは「その瞬間」を持たないことになる。→ **基盤が、既に解いていた。**
#            その画像は**最初のコマではない**——**動画へ添付する参照画像である。**
#            実測（`projects/hitosara/specs/image/shot-01-mill-shelf.md`）——
#            「**この1枚は、このショットの動画へ添付（参照画像）として渡る**——最初のコマではない。
#            最初のコマにすると、**そのショットの変化が画面上で起きなくなる**」。
#            **参照画像は、ショットが到達すべき姿を固定する。変化を殺さない。**
#            **逆である**——**外れた一枚を、テイクの前に落とせる。**
#
#    ✅ **戻した中身は三つである。**
#       ① `specs/image/shot-01..05-*.md` 五枚——**§1–20 を持たない**（1段落の `Prompt` と
