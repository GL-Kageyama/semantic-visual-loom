#    ⚠️ **語の置換が一つある**（2026-09-18）——**`breast` を `the left of the chest` に戻した。**
#
#       理由は二つである。**一つは規律の話であり、一つは事故である。**
#
#         ① **出典は `胸の左` である**（run-10「第3話 三文字をなぞる」——
#            「**名札は胸の左に着ける。**」）。**`breast` は、この一段の訳語であった**——
#            **原文より狭く、原文より強い。** 置換は、**規律の側では、原文へ寄せたことに当たる。**
#         ② **著者が画像生成器へ投入し、`specs/image/shot-02-cloth.md` が
#            コンテンツポリシーで棄却された**（2026-09-18）。
#            ⚠️ **棄却の理由は告知されない。** ゆえにこれは**推定であって、確証ではない**——
#            **「これが原因であった」と書けば、測っていないことを測ったことにする。**
#            推定の根拠は、①で置換した語が**この一段の最も強い語**であり、
#            かつ**このショットで最も近い枠を名指ししていた**ことである。
#            ⚠️ **再投入で通らなければ、次の被疑は「学校という場」と「`no outer garment`」である。**
#
#       置換の範囲——`specs/` と `shots/` の**五ショット・両経路、49箇所。**
#         `at her left breast` → `at the left of her chest`
#         `at the left breast of 碓氷千夏` → `at the left of 碓氷千夏's chest`
#         `the left-breast nameplate` → `the nameplate at the left of the chest`
#         `the left breast` → `the left of the chest`
#         `her left breast` → `the left of her chest`
#       ⚠️ **`Negative` は一字も変わらない**——`breast` は Negative に無かった。
#          **ゆえに `L21` の判定は無傷である**（覆う相手は `bible.negative_base` であって、
#          `Prompt` の語ではない）。
#       ⚠️ **第二ショットには、置換のほかに手当てが三つある**——**両経路に効かせた。**
#          ① 画像の `Prompt` の重複した位置句を除いた。
#          ② 最も近い枠を名指しする句——「**on the left of the chest and the hand**」→
#             「**on the hand and the cloth**」（画像の `Prompt`・動画の §10・§18 `Camera Prompt`）。
#          ③ 影の落ちる先——「**across the chest**」→「**across the shirt**」
#             （画像の `Prompt`・動画の §13 と §18 の `Visual`／`Motion Prompt`）。
#          **いずれも、狭い枠の中で体の部位を二度名指ししていたことを減らす手当てである。**
#          ⚠️ **題材は一字も変えていない。** 手が布の上で止まること、留め具が閉じないこと、
#             **三文字が布の下にあること**——**このショットの中身は、そのままである。**
#       ⚠️ **旧い語は、どこにも残っていない。** `projects/habits/promo-chinatsu/` は
#          **未追跡である**（`git status` が `??` を返す。コミットの履歴を持たない）。
#          **戻す手掛かりは、この註と上の対応表だけである。**
#       ⚠️ **同じ語を二通りに書かない。** 片側だけ直せば、**作品が同じ場所を二つの名で呼ぶ**——
#          **ゆえに五ショット両経路を一度に置換した。**
#
# ─────────────────────────────────────────────────────────────── 字を招かない
#
# ✅ **決定（2026-09-18、著者）——文字が必須でないなら、文字は出さない。**
#
#    ⚠️ **二つの実測から出た規則である。どちらも、生成器が字を描いた。**
#
#     ① **第二ショット——指先になぞった先に、異世界漢字のようなものが現れた。**
#        **原因は、この一段の書き方である。** `§18` が「**three characters of the surname
#        traced through the cloth**」と書いていた。**布の下にあるものを名指せば、モデルは描く。**
#        ⚠️ **この作品では、その三文字は一度も見えない**（`§16` MUST、`§17` 第二位）。
#        **見えないものは、投入文字列にも書かない。**
#
#     ② **第三ショット——中国語の字幕が焼かれた。**
#        **原因は、同じ形である。** `§18` が「**she keeps talking**」「**Ends mid-sentence**」と
#        書いていた。**Wan 3.0 は発話を検出すると字幕を焼く。**
#        ⚠️ **この作品に発音される名は無い。** ⚠️ **しかし声は在る**（下の言語の項——
#           決定 2026-09-18 で、**この一段は日本語で話すことになった**）。
#        **ゆえに字幕は、存在しない音の影ではなく、在る音の影である。**
#        ⚠️ **それでも消さねばならない理由は変わらない**——**語は、この作品では一度も読まれない。**
#
#    ✅ **打った手は三つである。**
#
#      ① **字を名指す語を、投入文字列から落とした。**
#         · 第二ショット——「three characters of the surname traced」→
#           「**one finger making three slow passes over the cloth, reading a surname that
#           stays underneath it**」。**数（三）は動きの側に残した。字は落とした。**
#         · 第二ショット `Visual`——「**carrying an older layer of writing beneath the present one;
#           neither legible**」→「**the cloth stays plain, its weave unbroken**」。
#           ⚠️ **古い層は、そもそも見えない。見えないものを名指せば、描かれる。**
#         · 各ショットの名札——「**its writing does not resolve**」→
#           「**its printed face lost to the key**」。**光が消している、という肯定形にした。**
#         · 第三ショット——「keeps talking」→「**the mouth keeps moving**」、
#           「mid-sentence」→「**with the mouth still moving**」。
#           ⚠️ **この一手は、2026-09-18 に反転した**——**この一段は喋るからである。**
#              **落とした語は `Master Prompt` に戻った**（「**she is still speaking**」）。
#              **字幕を止める担い手は、`Master Prompt` から `Negative` へ移った**（下の言語の項）。
#         · 第一ショット——「**a name called with no voice in the mix**」→
#           「**the head beginning to move — no voice in the mix at all**」。
#           ⚠️ **「呼ばれた名」は、字幕として現れうる。**
#
#      ② **五つの `Master Prompt` に、同じ一行を足した**——
#         「**The frame stays clean throughout — the room, the light, the dust and her, and
#         nothing laid over the image.**」
#         ⚠️ **禁止ではなく、画面にあるものを数え上げる形にした**（肯定形）。
#
#      ③ **共通の `Negative` に四節を足した**（五ショット両経路、10本）——
#         「**no invented characters, no nonsense glyphs, no pseudo-kanji, no glyph-like marks
#         on any surface**」、および字幕の側を
#         「**no on-screen subtitles, no captions, no burned-in subtitles, no subtitles in any
#         language, no translated captions**」へ強めた。
#         ⚠️ **`no on-screen subtitles` は前から在った。それでも焼かれた。**
#            **ゆえに、これは語を足したのであって、規則を作ったのではない。**
#
#    ✅ **言語は、作品の側で名指した**（決定 2026-09-18、著者——「**日本語の言語指定で
#       触っているなら、必ず日本語を話すべき。**」）。**この作品の言語は日本語である。**
#         · `bible.language: Japanese`——**作品定数として置いた。** 読む者は `L27` である。
#         · `Audio Prompt`（**五ショット共通**）——「**The language of this work is Japanese** …
#           **if any speech is placed in it, that speech is Japanese.**」
#         · `Master Prompt`（**第三ショットだけ**）——「**a Japanese room in a Japanese work,
#           and Japanese is its only language**」、および「**she is still speaking**」。
#       ⚠️ **口が動くのは、五つのうち第三ショットだけである**——**ゆえに発話の名指しも、
#          そこにだけ要る。** 他の四つは、口が開かないか、開いても名が来ない
#          （ゆえに他の四つの `Audio Prompt` は「**No speech is placed in this shot.**」と書く）。
#
#       ⚠️ **この項は、一度、逆を書いていた。****消さずに残す**——
#          **反転として読めることが、この項の役目である。**
#
#          旧（同日の直前まで）——
#            · **規則:** 「**この作品に、発音される名は無い。** **声そのものを置かない。**」
#            · **言語の名指しは保険であった**——「発話を招かない形で書いた。言語は部屋と言葉の
#              性質として置き、**「何かを発音せよ」とは一行も書いていない。声は置かれないままである。**」
#            · 「**規則そのものは動いていない。声を置かないという規則は、一字も変わっていない**——
#              **言語を名指すことは、発話を許すことではない。**」
#
#          ✅ **いま（決定 2026-09-18）——**
#            · **規則:** 「**発話があるなら、それは必ずこの作品の言語である。**」
#              **発話を禁じる規則は、もう無い。**
#            · **名指しは、保険ではなく指定である。** 第三ショットは喋る——
#              **ゆえに「何語で喋るか」は、この作品が決めることである。**
#            · **台詞を発明しないことと、声を置かないことは、別である。**
#              **この作品は、言葉を一字も書かないまま、日本語で喋る。**
#          ⚠️ **変わっていないこと——** **Wan の既定は中国語である。** ゆえに言語の名指しは、
#             反転しても要る。**効いたかどうかは、再投入の結果だけが言う。**
#          ⚠️ **変わっていないこと——** **字幕は出さない。** ただし**担い手が移った**——
#             **`Master Prompt` から `Negative` へ**（下の「字幕は、基盤が必ず禁じる」）。
#
#    ⚠️ **`no Japanese kanji or kana` は、この作品で使えない**（下の「人名はローマ字にしない」）。
#       **字種を禁じれば、名そのものが消える。** 禁じたのは**字ではなく、字が現れること**である。
#       ⚠️ **この区別は崩れやすい。** 崩れれば、名札の名が消えるか、異世界漢字が戻るかのどちらかである。
#
#    ⚠️ **§17 第二位は、既にこの失敗を予見していた**——第四ショットは
#       「**no pseudo-kanji that reads as a name**」と書く。**語は前から在った。**
#       足りなかったのは、**第二位に書くことではなく、投入文字列から招きを消すことである。**
#
#    ⚠️ **検査は、この規則を読まない。** 字が現れたかどうかは、**生成物を見なければ分からない。**
#       `L21` が読むのは `bible.negative_base` を覆っているかであって、
#       **投入文字列が字を招いていないかではない。** **穴のまま記録する。**
#
# ─────────────────────────────────────────────────────────────── 仕様
#
# ✅ **②design を走らせた**（2026-09-18）。`specs/video/shot-01..05-*.md` に §1–20 がある。
#    ⚠️ **生成器へ投入するのは §18 の七欄だけである。** §1–17 は下敷き、§19–20 は我々の記録。
#    ✅ **五ショットの §18 `Negative Prompt` は同一である。** 理由は第一ショットの仕様のヘッダ。
#    **これは検査を避けた結果ではなく、そう設計した結果である**（`ledger.yaml` の開示の註）。
#
# ⚠️ **値はすべて親からの写しである。**（親の `bible.yaml` と同じ約束）
#    欄ごとに `出所:` を付ける。**⚠️ 写しは黙ってずれる**——鳴らす者が要る。
#    **⚠️ 食い違ったら、出典が勝つ。**

project: habits-promo-chinatsu

bible:
  # 作品の様式。**様式カードの名前である。**
  # 出所: 親 `projects/habits/bible.yaml` の同じ欄（写し）。カードの中身は `distill-essence-engine` に在る。
  # ⚠️ この欄が §18 の7つ目のスロット `Style Motion` の出所である（`specmap.PROMPT_SLOTS`）。
  style: luminous-anime

  # 作品が話す言語。**作品定数である**——ショットごとに変わらない。
  # 決定（2026-09-18、著者）——「**言語指定で触っているなら、必ず日本語を話すべき。**」
  # ⚠️ **値は英語で書く。** 生成に渡る文字列は英語であり、訳してはならない。
  # ⚠️ **読む者は `L27` である**——**宣言があり、かつ §18 `Audio Prompt` に届いていること**を見る。
  # ⚠️ **かつてこの欄は、この基盤のどこにも無かった。** ゆえに作品の言語は空欄であり、
  #    **空欄は生成器の既定で埋まった**——実測（2026-09-18）: 第三ショットに**中国語の字幕が焼かれた。**
  # ⚠️ **生成物が実際にその言語で喋ったかは、この基盤からは見えない**（生成は外で起きる）——穴である。
  language: Japanese

  world:
    # 出所: run-10【世界観】——一字も変えない。親の同じ欄と同一である。
    concept: >-
      2026年、日本。埼玉県川口市、東京都足立区、神奈川県横浜市戸塚区。
      **魔法も、制度も、秘密の組織もない。あるのは、記名の作法が行き届いた日常だけである。**

    # ⚠️ **親の八つの規則のうち、この二十八秒に掛かるものだけを置く。** 落とした規則は三つ——
    #    運搬・一話一カット・地の文の削除規則である。**理由: この作品は一話を持たない。**
    #    落としたことは、免除ではない。**規則が掛からないのであって、破るのではない。**
    rules:
      # 出所: run-10【アニメ化を前提とする、その意味】——一字も変えない。
      # ⚠️ **この一行に、この作品で唯一の免除がある**（上の「免除」）。免除は第五ショットだけである。
      - "**作中の人物は、自分が映像の中にいることを知らない。**"
      # 出所: run-10【ルックとカメラ】——一字も変えない。
      - "**手が先にあり、顔が後に来る。順序は入れ替えない。顔は、呼ばれた後にだけ置かれる。**"
      # 出所: run-10【音と声】——一字も変えない。**第一ショットの設計そのものである。**
      - "**音は、呼び声ではなく、紙と手の音である。**"
      # 出所: run-10:71——一字も変えない。**この作品の存在理由である**（上の「名は、枠の外で呼ばれる」）。
      - "**作品の外に、はじめて掛け声をかける者が現れる。ただし、作中では最後まで発音されない。外で発音されることは、内で発音されないことを打ち消さない。代償は消さずに持つ。**"

      # ⚠️ **以下は出典に一文も無い。** この作品が足した規則である（発明・要承認）。
      #    親の `world.rules` は「この作品の運搬」「一話一カット」を持つが、**宣伝の規則を持たない。**
      - "**この作品は、彼女以外の誰も画面に置かない。** 呼ぶ者も、聞く者も、枠の外にいる。ゆえに第二ショットの名札は、彼女の胸の上でしか映らない。"
      - "**この作品に、焼かれる文字は無い。**（発明・要承認——`no legible name text` の決定から導かれる）"
      # ⚠️ **この一行は、2026-09-18 に書き換わった**（決定、著者——「**日本語で話す**」）。
      #    **旧:** 「**この作品に、発音される名は無い。** 声そのものを置かない。音は紙と手の音である。」
      #    **理由:** 第三ショットの口が動くのは、**喋っているからである**——
      #    声を置かない規則を保てば、**この一段は口の形だけを写すことになる。**
      #    ⚠️ **禁じられているのは名であって、声ではない。** その区別が、この一行である。
      - "**この作品に、発音される名は無い。** 発話があるなら、それは必ずこの作品の言語である。音は紙と手の音である。"
      - "**四つの拍が同じ日であるかを、この作品は決めない。** 決めれば、それは一話になる。"

    # ⚠️ **この欄だけ英語である。** 生成に渡す文字列は英語であり、訳してはならない。
    #    出典は日本語である。**ゆえにこの欄は「写し」ではなく「移し替え」である。**
    #    出所: run-10【ルックとカメラ】——親の同じ欄と同一である。
    visual_language:
      art_direction: >-
        A Japanese record-keeping site, 2026. Three resolutions of the written name —
        print, ballpoint pen, pencil. Nameplate plastic, the thickness of a register's
        left sleeve, glue traces on an address slip, layered pencil on a claim tag.
        Fluorescent light. One close shot of a hand per episode.
        Sound is not a calling voice but the sound of paper and hands.
      # 出所: run-10【世界観】「2026年、日本。」／台帳 `series-bible.md` 三、年表。
      era: "2026, Japan. The setting does not move across all four volumes."

  constants:
    # 出所: run-10。親の同じ欄からの写しである。**四つとも一字も変えない。**
    運搬: "**完了しない。** 事件とは、運搬が完了することである。"
    音: "**呼び声ではなく、紙と手の音。** 効果音としての呼び声は要らない。呼び声が聞こえるのは、呼ばれた本人の側だけである。"
    顔: "**呼ばれた後にだけ置かれる。** 手が先にあり、顔が後に来る。順序は入れ替えない。"
    名: "**本体は、書かれた側ではなく呼ばれた側にある。** 名は呼ばれた回数でできている。"

    # §1 の作品定数。**ショットに依らない4つである。**
    # 出所: 親 `projects/habits/bible.yaml` の同じ欄（写し）。⚠️ 出典にこの4つは無い——要承認である。
    # ⚠️ **`duration` はここに無い。** 尺はショットごとに違う——家は `shot.duration`、読む者は `L23`。
    # ⚠️ **値を変えるときは、`specs/` の §1 を全部とも直すこと。** `L26` が食い違いを鳴らす。
    # ⚠️ **この作品は、親と同じ枠で出す。** 縦型は採らない——理由は下の註。
    video:
      aspect: "16:9"
      resolution: "1920x1080"
      frame_rate: "24fps"
      orientation: "Landscape"

  # 全ショットに必ず付く禁制。**英語不変部——訳してはならない。**
  # 出所: 親 `projects/habits/bible.yaml` の同じ欄（写し）。**順序も含めて同じである。**
  # ⚠️ `no legible name text` の第三行の註（要承認）は、**この作品で解かれた**——
  #    上の「名は、枠の外で呼ばれる」を読む。**他の四行の註は親のままである。**
  negative_base:
    - "no calling voice as a sound effect"   # run-10【音と声】
    - "no face before the name is called"    # run-10【ルックとカメラ】
    - "no legible name text"                 # ✅ 決定（2026-09-18、著者）——承認済み
    - "no watermark"                         # 基盤の共通禁制
    - "no on-screen subtitles"               # 基盤の共通禁制
    # ⚠️ **以下はこの作品が足した三行である**（発明）。
    - "no second person in frame"            # 上の規則「彼女以外の誰も画面に置かない」
    - "no cardigan"                          # 凍結した二枚に無い。採らなかった改訂稿3の上着を復活させない
    - "no pseudo-kanji"                      # ✅ 決定（2026-09-18、著者）——指先に字が出た（下の「字を招かない」）
