# 作品台帳 — 『ハビッツ！！！』碓氷千夏 キャラクタープロモーション（habits-promo-chinatsu）
#
# ⚠️ **これは本編ではない。宣伝である。**
#    出典は本編と同じ二つ——
#      ① `elevate-draft-engine/examples/habits-ja/handoff/run-10/artifacts/elevated.md`（**層**）
#      ② `soul-voice-teller/examples/habits/台帳/`（**正**）
#    **本編の規則を採る。** 採らないのは、下の「免除」に記録した一点だけである。
#
# ⚠️ **置き場。** `projects/habits/` の下である。**一ディレクトリ＝一作品**（`CLAUDE.md`——
#    「One directory = one work (one bible, one ledger)」）。ゆえにここに `bible.yaml` と
#    `ledger.yaml` を切った。**親の台帳は読まない。写さない。**
#    親（`projects/habits/`）は六十三話の連続性を持つ。**この作品は二十八秒しかない。**
#    二つは別の作品であり、**同じ台帳を共有しない。**
#
# ✅ **決定（2026-09-18、著者）——四つ。**
#    ① **規則の扱い＝(ウ) 部分免除。** 免除は一点だけである。→ 下の「免除」
#    ② **置き場＝サブディレクトリ。** → 上
#    ③ **誰に見せるか＝作品を知らない人。尺＝4ショット×4〜8秒＝20〜30秒（少し伸ばしてもよい）。**
#       → 下の「尺」
#    ④ **参照は二枚一組で凍結する。** → 下の「参照の凍結」
#
# ─────────────────────────────────────────────────────────────── 免除
#
# ⚠️ **免除は一点である。**（決定 2026-09-18、著者）
#
#     **彼女は、こちらを見る。**
#
#    本編の規則は「**作中の人物は、自分が映像の中にいることを知らない**」と書く
#    （run-10【アニメ化を前提とする、その意味】）。**この一点だけを免れる。**
#
#    ⚠️ **二点目を足してはならない。** 免除が二つになれば、この作品はもはや本編の規則の下にない。
#       記録の側でも、免除は**一箇所にしか現れない**——第五ショットの `unit.after` である。
#       他のどのショットにも、`attached` にも、`negative_base` にも、この語は置かない。
#       **免除を一箇所に保つことが、この作品を本編の系に留めている唯一の留め具である。**
#
#    ⚠️ **これは規則の破れではなく、規則が予見していたものである。** run-10:71 は書く——
#       「**作品の外に、はじめて掛け声をかける者が現れる。ただし、作中では最後まで発音されない。
#        外で発音されることは、内で発音されないことを打ち消さない。代償は消さずに持つ。**」
#       **この作品は、その「外」である。** ゆえに免除は、規則の外ではなく、**規則が置いた席である。**
#
# ─────────────────────────────────────────────────────────────── 名は、枠の外で呼ばれる
#
# ⚠️ **`no legible name text` は、この作品で決定された。**（決定 2026-09-18、著者）
#
#    親の `bible.yaml` はこの一行を**「初稿（要承認）」**として持つ。**要承認が、ここで承認になった。**
#    **理由は、この作品の用途そのものである**——見る者は**作品を知らない人**である。
#    知らない人に渡すのに名を隠す、という判断が要る。**その判断を、ここで下した。**
#
#    **名は、枠の外で呼ばれる。** 投稿の題と説明文がそれを負う。**frame の中では、
#    名は一度も発音されず、一度も読めない。** これは制約ではなく、この二十八秒の**主題である**——
#    run-10:71 の「**代償は消さずに持つ**」を、宣伝という形式で払う。
#
# ─────────────────────────────────────────────────────────────── 尺
#
# ✅ **著者の指定は「4ショット×4〜8秒＝20〜30秒（もう少し伸ばしてもOK）」である。**
#
#    ⚠️ **この作品は五ショット、二十八秒である。**（発明・要承認）
#       理由は固定方針「**The shot is the unit. One shot exists for one change——
#       Do not load it with anything more.**」である。**四つの拍は四つの変化である。
#       「こちらを見る」は、そのどれでもない五つ目の変化である。**
#       四つ目のショットに視線を足せば、そのショットは二変化を持つ——
#       そして**免除が、ショットの中に埋もれる。**
#
#       **五つ目を切ることは、免除を数えられる形にする。** 免除は一つのショットであり、
#       一つの `unit` であり、**台帳の一行である。** 埋もれていないから、数えられる。
#
#    ⚠️ **著者の指定（四ショット）に戻すことは、この一段を消すことである**——
#       可能である。**そのとき免除は、第四ショットの末尾に移る。**
