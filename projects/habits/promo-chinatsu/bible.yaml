#       **参照画像は、テイクが到達すべき姿を固定する。途中を渡せば、途中が標準になる。**
#       ⚠️ **第二ショットだけ、`§7` の Peak と `after` が離れる**（Peak はなぞる最中、
#          `after` は止まったところ）。**あちらは `after` を採った**——§17 第一位が
