# 制作台帳 — 『ハビッツ！！！』碓氷千夏 キャラクタープロモーション（habits-promo-chinatsu）
#
# **連続性（世界の状態）と開示（観客の知識の状態）を同じファイルに持つ。**
# ⚠️ **二つに割ってはならない**（`CLAUDE.md`）。
#
# ⚠️ **これは親（`projects/habits/ledger.yaml`）の台帳ではない。** 別の作品である。
#    親は二十八名を「人として」置く。**この作品は一人だけを置く。**
#    親は六十三話の変化点を持つ。**この作品は二十八秒の変化点を二つだけ持つ。**
#    **写さない。親を読まない。** 値が要る箇所は、出典から直接引く。
#
# ⚠️ **人物の事実は、ここに複製しない。**
#    **呼ばれ方の履歴・癖・生活・記名は `soul-voice-teller/examples/habits/台帳/人物/メイン/01_碓氷千夏.md` に在る。**
#    このファイルが持つのは**カメラが要る語彙だけ**である——キーと、identity の意図と、禁制。
#
# ⚠️ **外見の記述は、出典に一行も無い。**（親と同じ）
#    あるのは**性別と年齢**、および生活の行政的データだけである。**この不在は空白ではなく設計である。**
#    ゆえに `states:` は `{}` である——**衣装の記述が、出典にも初稿にも無い。**
#    ⚠️ **この作品では、その不在が少しだけ解けた**——凍結した二枚が衣装を持つ（下の註）。
#    **一枚に写っていることは、出典が書いたことではない。** ゆえに `states` ではなく **`identity` の註**に置く。

characters:
  碓氷千夏:
    # メイン 1/4。**全巻。第一巻『残った名』の語り手。**
    # 台帳は `人物/メイン/01_碓氷千夏.md`。**この作品に、彼女以外の誰も画面に置かない**（`bible.yaml`）。
    #
    # ⚠️ **`identity` は、凍結した一枚を指す。**（決定 2026-09-18、著者）
    #    親の `identity` は**プロンプト**（`prompt.md`）を指し、**画像は未生成**と書いていた。
    #    **この作品では、画像が二枚ある。** ゆえに指し先が変わる——
    #    親の一行が「作る前」の記録であるのに対し、この一行は「作った後」の記録である。
    #
    # ✅ **凍結（決定 2026-09-18、著者）——二枚一組である。**
    #    **同一性** `ChatGPT Image 2026年9月18日 20_29_36.png`（設定画・**改訂稿4**）
    #    **拍**     `ChatGPT Image 2026年9月17日 21_56_32.png`（表情シート・**改訂稿2**）
    #
    #    ⚠️ **前者は未追跡である**（git に入っていない）。本文 `prompt.md` の改訂稿4 とは一致する。
    #    ✅ **後者は `93f9ff2` にコミット済みで、作業ツリーも無変更である。**
    #
    #    ⚠️ **採らなかった一枚がある**——`ChatGPT Image 2026年9月18日 20_32_40.png`
    #       （表情シート・**改訂稿3**）。**四つの頭すべてが濃紺のジャケットを羽織っている。**
    #       出典の衣装は`洗えるシャツ、学校指定の名札`（run-10）であり、設定画 改訂稿4 も
    #       上着を描かず、`prompt.md` の Negative は `no cardigan` を持つ。
    #       **`expression.md` の改訂稿3の註は「地の値は、動かない」と書き、衣装が動いたことを書いていない。**
    #       ゆえにこの上着は、**出典にも設定画にも無い差である。**
    #       **二枚一組のうち、拍の側がこれである理由は、一つも無い。**
    identity: >-
      ChatGPT Image 2026年9月18日 20_29_36.png ＋ ChatGPT Image 2026年9月17日 21_56_32.png
      ——**凍結した二枚一組**（`distill-essence-engine/examples/habits/character/メイン/01_碓氷千夏/`）。
      前者が**同一性**（設定画・改訂稿4。**未追跡**）、後者が**拍**（表情シート・改訂稿2。`93f9ff2` に在る）。
      `character-sheet` / `key-pose-board` × `luminous-anime`（様式カードは登録済み）。
      ⚠️ **前者は、この作品のために git へ入れる必要がある**——いま作業ツリーにしか無い。
      **入れるかどうかは著者が決める**（`git push` は著者が行う。`CLAUDE.md`）。
      ⚠️ 衣装は`洗えるシャツ、学校指定の名札`（run-10）。**二枚とも上着を持たない。**
      これは出典の衣装と一致する——**ゆえに `states` ではなく、この註に置く。**
      ✅ **下半身は、スカートである**（決定 2026-09-18、著者）。⚠️ **出典は下半身を一行も書かない**——
      `prompt.md` にも `expression.md` にも、その git 履歴にも、スカート／ズボン／パンツ／
      skirt／trouser は零件である（実測）。**凍結した改訂稿4 がスカートを着ていることが、
      この決定の根拠である**——**一枚に写っていることは、出典が書いたことではない。**
      経緯は `bible.yaml`「参照の凍結」。⚠️ **書くのは、全身が枠に入る第四ショットだけである。**
      ⚠️ **`no trousers` は書かない**——五ショットの `Negative` は §18 と同一であり、
      **§18 にその一行は無い**（`bible.yaml`「参照の凍結」）。
      ⚠️ **記録の穴を二つ、ここにも写す**（`bible.yaml`「参照の凍結」の実測）——
        ① **`expression.md` はディスクも git も改訂稿3である**（`93f9ff2` が唯一のコミット、
           作業ファイルとバイト一致）。**ゆえに表情シート・改訂稿2 の本文は存在しない**——
           **凍結されているのは画像だけである。**
        ② **`ChatGPT Image 2026年9月17日 21_54_53.png` は追跡されているが、この台帳は
           名指ししていない**——**設定画・改訂稿3**（朱記）であり、**ズボンを穿いている。**
           **採らなかったのではなく、記録が無かった。**
    states: {}
    negatives:
      # 親の `negatives` からの写しである。**床の二行は、親が二十八名に共通で置いている。**
      - "no face before the name is called"           # run-10【ルックとカメラ】
      - "no identifying clothing, hairstyle, or prop" # 方針 §5a（衣装・髪型で識別しない）
      # 以下は凍結した二枚の Negative から。**親では「要承認」だった。**
      # ✅ **この作品で承認された**——`bible.yaml`「名は、枠の外で呼ばれる」を読む。
      - "no legible name on any in-world prop"
      - "no romaji in place of the Japanese name"
      - "no handwriting by the subject"
      - "no signature"
      - "no cardigan"                           # 棄却された版（run-04 / run-05）と、採らなかった改訂稿3 を復活させない

# ─────────────────────────────────────────────────────────────── 場所
#
# ⚠️ **`place` は「記名の現場」である。**（決定 2026-09-15、著者）
#    **部屋ではない。地理でもない。** この作品は**その定義をそのまま引き継ぐ。**
#
# ⚠️ **この作品は、現場を二つ持つ。** 親は「この段では一つしか切らない」と決めた（決定 2026-09-15）。
#    **この作品はその決定の下にない**——親の一行は六十三話をこれから増やす段についてのものであり、
#    **この二十八秒は、既に全部がここに在る。**
#    二つ要る理由は、拍そのものである——**第一から第三は彼女が身につけている名の現場に立ち、
#    第四と第五は紙に書かれた名の現場に立つ。** それが、この作品の唯一の移動である。
locations:
  名札:
    # 第一・第二・第三ショットの記名の現場。**彼女が身につけている名。**
    # 出所: run-10 第一巻「第3話 三文字をなぞる」——`名札は胸の左に着ける。`／
    #       run-10 層——`名札を留める前に、布の上から姓の三文字を指でなぞる`（**著者決定により採用**）／
    #       run-09——「**胸に着けている名札は、自分で書いたものではない。**」
    base: >-
      胸の左に着ける名札。姓が三文字。**本人の手で書かれたものではない**——印刷である。
      ⚠️ **外見は出典に無い。** 凍結した設定画（改訂稿4）の第八パネルが答える——
      先代の字が残る名札、上の三文字を指でなぞる、ピンは未装着。
      方針 §2 により、**これは規則ではなく発明（要承認）である。**
    geography: >-
      左胸。名札の上に、指が一人分入る。**布の上からなぞる**ので、指と姓のあいだに布がある。
      出所: 凍結した設定画（改訂稿4）第六パネル——**左胸のピンホール（上：昨年までの位置 下：現在の位置）**。
      ⚠️ **穴が二つあることは、出典に一行も無い**（発明・要承認）。
    states: {}

  出席簿の転出欄:
    # 第四・第五ショットの記名の現場。**紙に書かれた名。**
    # 出所: run-09「第1話「転出欄」4,000字 ── 前年度の出席簿を綴じる。転出欄に、
    #       **誰も消さなかった一行が残っている。**」／第14話「空いたまま」。
    # ⚠️ **この作品は、その一行を開示しない。** 紙は映るが、**判読できない**（`no legible name text`）。
    #    開示しないことと、見せないことは違う——**見せて、読めないことが、この作品の第五ショットである。**
    base: >-
      habits-tenshutsu-ran-board（前年度の出席簿。転出欄に、誰も消さなかった一行が残っている）
      ⚠️ **この作品のために作る。** 親の `projects/habits/ledger.yaml` の同じ欄は
      「まだ無い。意図であって資産ではない」と書く——**この作品でも、まだ無い。**
      ⚠️ **紙の外観は出典に無い。** 凍結した設定画（改訂稿4）の第九パネルが答える——
      転出の記録欄、一年分が空欄、他の誰かの手で書かれたもの。
      **その字は判読できない。**
    geography: >-
      碓氷千夏の勤め先の区立小学校の職員室。出席簿は**開かれた状態で、机の上にある。**
      出所: run-10 第一巻「十、この巻の動きの設計」——「**範囲は一つの学校の一室。**
      カメラは、机上の手、左袖の名札、めくられる名簿の三箇所に置かれる」。
      ⚠️ **彼女がこの紙から半歩下がる距離が、この作品の最後の一変化である。**
      **その距離は、出典に一行も無い**——`半歩` という語だけが在る（台帳 変化弧／run-05 姿勢）。
    states: {}

# ─────────────────────────────────────────────────────────────── 開示
# 変化点だけを持つ。全ショットは並べない。変化点の間は直前の状態が続く。
#
# ⚠️ **この作品の開示は二点である。** 親の台帳は「この段では §18 が一本も無い」と書き、
#    ゆえに `negative:` を書かなかった。**この作品は §18 を切った**（②design、2026-09-18）——
#    ゆえに**二点とも `negative:` を名乗る**。**読む相手のいない宣言は書かない。相手が生まれた。**
#
# ⚠️ **二点とも `covered` である。** これは検査を避けた結果ではない——**そう設計した結果である。**
#    `changed`（この変化点で §18 の禁止が変わった）ではない。**この二十八秒で、禁止は一度も変わらない。**
#    名が読めないことは、第一ショットの前から `negative_base` に在る（`no legible name text`）。
#    紙が現れる第四ショットでも、`no legible text on any surface` は既に在る。
#    **禁止が消えれば、モデルが描いてよいものが増える。この作品は、それを一度もしない。**
#    ⚠️ **ゆえに `L14`（宣言を超えた区間）は、この作品で一度も鳴らない。**
#
# ⚠️ **免除（第五ショット）は、ここに現れない。** 免除は規則の側の出来事であって、開示ではない——
#    **観客の知識は一つも増えない。** ゆえに `disclosure` は二点のままである。
disclosure:
  - shot: habits-promo-chinatsu-s01
    # 不在（名は呼ばれない）→ **名が在る。ただし、読めない。**
    # **この一点が、この二十八秒の全部である。**
    名札.姓: present
    negative: covered   # 禁止は変わらない。`no legible name text` は変化点の前から在る
  - shot: habits-promo-chinatsu-s04
    # 名札の名 → **紙の名。** 身につけているものから、書かれたものへ。
    出席簿の転出欄.一行: present
    negative: covered   # 禁止は変わらない。`no legible text on any surface` は第一ショットから在る

# ⚠️ **`at` は「鍵」ではない。人が読むための群れである**（親の註）。
#    親は四巻を並べる。**この作品は巻を持たない**——ゆえに一群である。
at:
  プロモーション（五ショット・二十八秒）:
    range: "promo"
