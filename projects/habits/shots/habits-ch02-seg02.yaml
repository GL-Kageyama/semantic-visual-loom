# 第二巻『重なった名』 第1話「八十軒目」 / 所作 / motion —— 箱が、玄関の前に置かれ、一行が、目に入る
#
# **出典**
#   場面表 **`examples/habits-02/構想/各話/01_八十軒目.md`**——**第2場面（足立区の路上／日中。
#   承・1,700字・内面 A。一拍の位置）。** 本文は `examples/habits-02/草稿/draft_02-01_八十軒目.md` の ## 2。
#   台帳 `series-bible.md` 二、年表——**第二巻の紙は「重なった宛名票」。**
#
# ⚠️ **このショットは、この話の「一拍」である。**
#    場面表——「**一拍の位置＝第2場面。運搬が止まる場所。** 箱は玄関の前に置かれ、写真が撮られ、
#    **宛名票の一行が目に入る**——**八十軒目である。**」
#    ⚠️ **運搬は、ここでも完了しない。** 置くことは、届けることではない。
#
# ⚠️ **このショットは、このサンプルで最も長い。**（14秒。他は 10 秒と 12 秒。）
#    **一拍に最大の秒を与える**——**コマ数は3枚とも4である。差は、密度ではなく、秒である。**
#
# ⚠️ **このショットは「一話そのもの」ではない。** 場面表の三場面のうちの②である。
#    ①（営業所／朝）は `habits-ch02-seg01`、③（日没前）は `habits-ch02-seg03`。
#
# ⚠️ **`spec:` は `specs/video/habits-ch02-seg02.md` である。**

shot: habits-ch02-seg02

# 動画の仕様（§1–20 を持つ）。**§18 の見出しがモデルを名乗る**——
# **`18. MINIMAX H3 PROMPT MAPPING`** である。
# ⚠️ **画像の仕様（`key_image:`）は無い**（①の絵コンテ画像は `key_image` ではない）。
spec: specs/video/habits-ch02-seg02.md

unit:
  before: 箱が荷台のいちばん手前にあり、**宛名票は、まだ、目に入っていない**
  after: 箱が玄関の前に置かれ、**宛名票のいちばん上の行が、目に入っている。目は、上げていない。**

# 所作——**この一変化は、手が置き、目が行くことである。**
# ⚠️ **開示ではない。**（`role: 開示` の固有基準は「見せ方の順序・情報量・何を隠したか」である。）
#    **この変化点の開示は台帳が持ち、`negative: covered` を宣言している**（`ledger.yaml`）。
role: 所作

# **話の記名の現場**（決定 2026-09-15、著者）。
# ⚠️ **この場面では、その紙が実際に画面の内側に在る**——三つの場面のうち、
#    `place` の鍵そのものが見えるのは、ここだけである。
place: 宛名票の一行

# ⚠️ **場面表の「足立区の路上／日中」である。**
#    ⚠️ **この話は、朝から日没前までを跨ぐ**（場面表「時刻——この話の設計上の判断」）。
#       **ゆえにこのショットは、その一日のうちの一つだけを持つ**——
#       **跨がせた瞬間、一つのショットが三つの変化を運ぶ**（固定方針——1ショット＝1変化）。
#       ⚠️ **`L3` は鳴らない。**（訂正 2026-09-20）閾値は時刻語が3種であり、
#          朝と昼では2種である。**鳴らないことは、許していることではない。**
#          **ゆえにこの一話は、場面表の三場面が、そのまま三ショットである**——
#          ⚠️ **発明（要承認）である**（場面表は「三場面」と書くが「三ショット」とは書かない）。
time: 昼（八十軒目）

mode: motion

# ⚠️ **発明（要承認）**（方針 §5a）。**この一枚で、出典に無い唯一の値である。**
#    **根拠にしたのは `L3` と生成器の上限だけである**——**「一拍だから長い」は、根拠ではない。**
#    ⚠️ **MiniMax H3 の出力は 4〜15 秒**（`specmap.MODELS` の註。2026-09-20 に確認）。
duration: 14s

motion:
  subject: 暮林蒼の両手と、四角いもの（撮る側）と、目
  quality: >-
    箱が荷台から降ろされ、砂利を三歩わたって玄関の前に置かれ、
    **四角いものが二度、箱へ向けられ、** そのあいだに
    **目が、宛名票のいちばん上の行へ行き、そこで止まる。**
    ⚠️ **目は、上げない。** 段差は、足の側で処理される。
  law: >-
    luminous-anime の物理。**止まるのは主題であって、画面ではない**——砂利は靴の下で動き、
    埃は浮いた端のところで動きつづける。
    ⚠️ **音は、呼び声ではなく、紙と手の音である**（run-10【ルックとカメラ】）。
    **この場面の音は、砂利の三歩と、四歩目の無音である。**

beats:
  - range: 0-4s
    density: sparse
    what: >-
      車を、止める。エンジンを止める。**鍵は、抜かない。**
      後ろの扉を、開ける。扉は、上へ、上がる。
  - range: 4-7s
    density: sparse
    what: >-
      荷台に、箱がある。**いちばん手前を、取る。** 重さがある。腕が下がる。
      **下がってから、持ち直す。** 歩き出す。歩幅は、狭い。
      **砂利が、三歩、ある。四歩目は、音が、しない。**
  - range: 7-10s
    density: sparse
    what: >-
      玄関の前に、段差がある。**箱を、置く。手を、離す。**
      四角いものを、箱へ、向ける。画面が光る。**もう一度、撮る。**
  - range: 10-14s
    density: held
    what: >-
      箱の側面に、宛名票が、貼ってある。**剥がれかけている。端が浮いている。欄が、四つである。**
      **いちばん上の行が、目に入る。**
      そのあいだに、足は、段差を、上がっている。**目は、上げていない。** 誰も、出てこない。

# ⚠️ **`reference_set` の鍵は、すべて `ledger.yaml` に在る。**（`L8`）
#    ⚠️ **このショットは `宛名票の一行.geography` を引く**——①の側は引かなかった。
#       **同じ話の、同じ鍵である。参照が割れるのは、地理が割れているからである。**
#    ⚠️ **宛名票の外観は出典に一行も無い。**（方針 §5a——場所と同じ扱いである）
#       **浮いた端・入り込んだ埃・四つの欄だけは、本文の語である。**
reference_set:
  - 暮林蒼.identity
  - 暮林蒼.negatives
  - 宛名票の一行.base
  - 宛名票の一行.geography

