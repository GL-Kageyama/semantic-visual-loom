# 第二巻『重なった名』 第1話「八十軒目」 / 所作 / motion —— 指が、束の端にかかり、めくられない
#
# **出典**
#   場面表 **`examples/habits-02/構想/各話/01_八十軒目.md`**——**第3場面（足立区の路上／日没前。
#   転・結・1,300字・内面 C）。** 本文は `examples/habits-02/草稿/draft_02-01_八十軒目.md` の ## 3。
#   台帳 `series-bible.md` 一——**第二巻の返却の行為は「読む」、返却の話は第14話である。**
#
# ⚠️ **このショットは、この話の「止まる側」である。**
#    場面表——「**置いた後の一歩は、第3場面にある**」「**第三場面＝C**（**「手が止まる」——
#    次の番地の伝票をめくらない。反応軸の「解放しない」が、そのまま為まいの宣言になる**）」。
#    ⚠️ **一拍は②である**（宛名票の一行が目に入ること）。**この③は、その一拍のあとの静止である。**
#       **二つを一つのショットにしない**——**目に入ることと、めくらないことは、別の変化である。**
#
# ⚠️ **このショットは「一話そのもの」ではない。** 場面表の三場面のうちの③である。
#
# ⚠️ **この作品の運搬は、ここでも完了しない。**（run-10【動きの単位】）
#    **止まるのは手であって、運搬ではない**——**束は、助手席に、残る。**
#
# ⚠️ **`spec:` は `specs/video/habits-ch02-seg03.md` である。**

shot: habits-ch02-seg03

# 動画の仕様（§1–20 を持つ）。**§18 の見出しがモデルを名乗る**——
# **`18. MINIMAX H3 PROMPT MAPPING`** である。
# ⚠️ **画像の仕様（`key_image:`）は無い**（①の絵コンテ画像は `key_image` ではない）。
spec: specs/video/habits-ch02-seg03.md

unit:
  before: 蒼が車に戻り、**手は、まだ、束に触れていない**
  after: "**指が、束の端にかかったまま、めくられていない。** エンジンは、かかっていない。"

# 所作——**この一変化は、手が行って、止まることである。**
# ⚠️ **`反応`（固有基準＝抑制・微細な身体・表情の段階）ではない。**
#    **このショットに顔は置かれない**——台帳 `bible.yaml` の `顔`——
#    「**呼ばれた後にだけ置かれる。** 手が先にあり、顔が後に来る。」
#    ゆえに**抑制を顔で測らない。****測るのは指の側である。**
role: 所作

# **話の記名の現場**（決定 2026-09-15、著者）。
# ⚠️ **この場面に宛名票は無い**（①と同じである）。**それでも `place` は宛名票である。**
place: 宛名票の一行

# ⚠️ **場面表の「足立区の路上／日没前」である。**
#    ⚠️ **このショットは、日が低くなってから、光が消えるまでである**——
#       **本文の最後の一行は「束の上から、光が、消える。」** ゆえに**夜ではない。**
time: 日没前（八十軒目を出たあと）

mode: motion

# ⚠️ **発明（要承認）**（方針 §5a）。**この一枚で、出典に無い唯一の値である。**
#    ⚠️ **②より短く、①より長い。** **根拠は「転・結だから」ではない**——
#       根拠は、**この場面が「下がる・戻る・座る・止まる」の四つを持ち、②が「置く」の一つを持つ**
#       ということだけである。⚠️ **MiniMax H3 の出力は 4〜15 秒**（`specmap.MODELS` の註）。
duration: 12s

motion:
  subject: 暮林蒼の右手と、助手席の束
  quality: >-
    一歩下がり、段差を下り、砂利を三歩わたって車に戻り、座り、
    **手が助手席の束へ行き、端に指がかかり、そこで止まる。**
    ⚠️ **めくらない。エンジンをかけない。ライトをつけない。動かない。**
    **止まるのは指であって、画面ではない。**
  law: >-
    luminous-anime の物理。**止まるのは主題であって、画面ではない**——日没前の車の中で、
    埃は動き、外の音は入り、光は束の上から少しずつ消えていく。
    ⚠️ **音は、呼び声ではなく、紙と手の音である。** この場面の外の音は、
    **自転車が遠くなる音と、犬が一度だけ鳴く音である**（run-10【音と声】——
    「呼び声が聞こえるのは、呼ばれた本人の側だけである」）。

beats:
  - range: 0-3s
    density: sparse
    what: >-
      一歩、下がる。段差を、下りる。**砂利が、三歩、鳴る。**
      車まで、戻る。十歩である。**行きと、同じである。** 後ろの扉は、開いたままである。
  - range: 3-6s
    density: sparse
    what: >-
      運転席のドアを、開ける。座る。**沈み方は、一日の終わりに、いちばん、深い。**
      鍵は、ささったままである。**回していない。** 足は、ブレーキの上にあり、**踏んでいない。**
  - range: 6-9s
    density: held
    what: >-
      助手席に、束がある。**朝に、置いたところである。** 輪ゴムは、二本のままである。
      **束は、薄くなっている。** 空が、赤い。**束の上にも、光が、来ている。**
  - range: 9-12s
    density: held
    what: >-
      **手が、束へ、行く。端に、指が、かかる。** 指の腹が、紙に、当たっている。
      一枚目の、角である。**めくらない。**
      エンジンは、かけない。ライトは、つけない。**動かない。** 束の上から、光が、消える。

# ⚠️ **`reference_set` の鍵は、すべて `ledger.yaml` に在る。**（`L8`）
#    ⚠️ **`宛名票の一行.base` を、このショットは引く。** **画面の内側には無い**——
#       **それでも引く。** **この束が、その紙と同じ話の運搬だからである。**
#       ⚠️ **参照は「画面に在るものの一覧」ではない。**
reference_set:
  - 暮林蒼.identity
  - 暮林蒼.negatives
  - 伝票の束.appearance
  - 伝票の束.negative
  - 宛名票の一行.base
  - 宛名票の一行.geography

