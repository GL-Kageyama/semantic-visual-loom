# ⚠️ **`attached` は宣言であって記録ではない。** `takes/` はまだ無い。
#    ⚠️ **H3 の経路では、添付は `key_image` ではない**——**絵コンテの画像そのものが渡る**（資料②）。
#    ⚠️ **`伝票の束.negative` を、ここへ足した**（2026-09-20）。**`L6` が食い違いを挙げていた**
#       ——意図（`reference_set`）には在るのに、添付（`attached`）に無かった。
#       ⚠️ **このショットは、束を画面に持つ。** 指がかかるのは、その一枚である——
#          **ゆえに「紙に読める名を描かない」は、この一枚のボードにも掛かる。**
#          **`reference_set` の側を削るのではなく、`attached` の側を直した。**
attached:
  - 暮林蒼.identity
  - 暮林蒼.negatives
  - 伝票の束.appearance
  - 伝票の束.negative
  - 宛名票の一行.base
  - 宛名票の一行.geography

# ⚠️ **変化点ではない。ゆえに変化点を書かない。**
#    **書くのは「その変化点のあとの状態が続いている」ことだけである。**
#    台帳の規約——**「変化点の間は直前の状態が続く」**（`schemas/ledger.schema.json`）。
#    ⚠️ **`present` と書くのは、この場面で新たに何かが起きたからではない**——
