# ─────────────────────────────────────────────────────────────── 文字チャンネル
#
# ⚠️ **このショットが `SEEDANCE 2.5` を要する理由が、ここに在る。**
#    **この話は、二つの字を持ち、そのどちらも読ませない。**
#    表札の字は**彫ってあり、へこみに黒が入っている**。宛名票の字は**印刷である**。
#    **この二つは、同じ「文字」ではない**——**彫りと印刷の別が見える字形**である。
#    ⚠️ **合成（`timeline`）では置けない。** 合成で置けるのは**画面上で動かない文字**である——
#       この二つは**ショットの内側で、視差と手ぶれで動く**（`README.md` の表）。
#       ⚠️ **だからこの文字は、生成器が描く。** **これが `lettering` の意味である。**
#    ⚠️ **`lettering` は「読ませる」ではない。** **可読度は名乗らない**——
#       **読ませないことを決めるのは、この話の §18 `Negative Prompt` である**
#       （`schemas/shot-record.schema.json` の註）。
#       **同じ作品の中に、両方がある**——第8話は「橋本」を読ませ、第7話は読ませない。
#
# ⚠️ **`content` は英語である。**（「生成器へ渡る文字列は英語」——`CLAUDE.md`）
#    ⚠️ **人名はローマ字にしない**（決定）。ゆえに `content` は**字そのものではなく、字の記述**である
#       ——**「彫られた二字」「印刷された二字」**。**モデルへ渡す文に、名の綴りは一度も現れない。**
#    ⚠️ **行き先は `prompt:Master Prompt` である**（`specmap.TEXT_CHANNEL_KINDS`）。
#       **`overlay` の `edit:timeline` ではない**——**焼かない。描かせる。**
text_channel:
  - t: "0.0-12.0"
    kind: lettering
    content: >-
      two characters carved into the wooden nameplate on the gatepost — recessed into the grain,
      the hollow filled with black, the upper half of the plate faded lighter than the lower,
      and no character of either word can be made out
  - t: "3.0-12.0"
    kind: lettering
    content: >-
      two characters printed in black ink in the topmost ruled field of the address slip glued to
      the side of the box — flat, even-edged print, unlike the carved characters above it,
      and no character of either word can be made out

# ⚠️ **開示状態を、このショットは持たない。**
#    台帳 `disclosure` は、この話の変化点を**まだ宣言していない**——照合する相手が無い。
#    ⚠️ **`L7` はこれを註で報告する**（「開示状態を持たないショットが N 本ある」）。
#       **違反0件ではない。この一枚は、開示の検査を受けていない。**
#    ⚠️ **変化点を台帳に立てるのは、著者の裁定である**（開示の台帳は作品のものである）。
#       この話の変化点は**第三場面の側にある**（`:593` 「私は、読みを、直しません。」）——
#       **このショット（第二場面の前半）は、変化点の手前である。**
#
# ⚠️ **このショットに、受付の者は出ない**（上の註）。
#    **その人物は二十八名の誰でもない。** 台帳に鍵が無いので、参照も禁制もできない——
#    ⚠️ **`attached` にも `forbidden_set` にも、その人の欄が無い。**
#    **これは穴であって、書き忘れではない**——`habits-ch01-seg01` の「事務の同僚」、
#    `habits-ch02-seg01` の「営業所の受付」と同じ穴である。
#    ⚠️ **ゆえに「戸を開けない」ことは、`forbidden_set` では守られない。**
#       **守るのは §16 `MUST NOT` と §18 の文字列である**——**弱い守りである。穴として書く。**
