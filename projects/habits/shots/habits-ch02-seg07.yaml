unit:
  before: 宛名票の名が、**紙の上にあり、まだ表札へ運ばれていない**
  after: 運ばれた名が**表札のところで無く**、目が、**重ならないところで止まっている**

# 所作——**この一変化は、目が運ぶことである。**
# ⚠️ **腕は運ばない。** 箱は下にあり、指は動かない（本文 :313「指は、動かない。」）。
#    **この話の運搬は、二つある**——**箱（腕）と、名（目）である。**
#    ⚠️ **そして、どちらも届かない。** run-10【動きの単位】——「この作品の運搬は一度も完了しない」。
#       **第三場面で箱が降りる。そこで箱の運搬は止まるが、名の運搬は止まらない**
#       （本文 :593「私は、読みを、直しません。」）。
role: 所作

# **話の記名の現場**（決定 2026-09-15、著者）。**巻の紙でも、地理でもない。**
# ⚠️ **この話の三場面は、どれもこの鍵を `place` に持つ。**
#    **第一場面の紙は伝票である**（場面表 2026-09-21 の裁定——「車の中の束は、この巻では伝票である」）。
#    **それでも `place` は表札と宛名票である**——`place` が指すのは**その話の記名の現場**であって、
#    **その場面の小道具ではない。** **一話に一つである。**
#    ⚠️ **第1話の鍵（`宛名票の一行`）と混ぜてはならない。** **別の話の、別の現場である。**
place: 表札と宛名票

# ⚠️ **場面表の「届け先の玄関／昼」である。** 第一場面（車の中）と第三場面（同じ玄関）も昼である——
#    **この話の三場面は、足立区綾瀬の一つの昼に置かれている**（場面表「昼の二つの場所」）。
time: 昼（届け先の玄関の前）

# ⚠️ **主題は動く**——動くのは**目**である。**画面は止まらない**（埃と木の葉は動きつづける）。
mode: motion

# ⚠️ **この一枚で、出典に無い唯一の値である。**
#    場面表も話割りも本文も、尺を書かない。**ゆえにこの `12s` は「発明（要承認）」である**（方針 §5a）——
#    **承認されていない。**
# ⚠️ **この経路の上限は 30 秒である**（4〜30秒。`specmap.MODELS` の註。2026-09-21 に確認）——
#    **だが、その 30 秒は、この値を決めていない。**
#    ⚠️ **固定方針は「30秒セグメントで割らない」である。** **上限が伸びたことを、尺を伸ばす理由にしない。**
#       **この 12s は、この一変化が要する長さとして置いた**——**経路の都合ではない。**
#    ⚠️ **姉妹の三枚は 10s／14s／12s である**（同じ一話の、同じ一日）。**この一枚は、その真ん中の側にある。**
# ⚠️ 家は `shot.duration`、読者は `L23`、導出は `engine/shot/print_spec.py` の §1 である。
duration: 12s

motion:
  subject: 暮林蒼の目と、玄関の前に立っている両足
  quality: >-
    **名を、紙から表札へ、目で運ぶ。** ⚠️ **腕は運ばない**——箱は腕の内側にあり、
    指の腹は紙の端にかかったままで、**動かない。**
    目は、紙にあり、それから上へ行く。**行って、無い。戻って、名を持つ。また上へ行く。**
    **行き方は、同じである。** **同じ行き方で、同じところへ行き、同じところで、無い。**
    ⚠️ **速さは変わらない**（本文 :361「行く、速さは、同じである。」）——
    **速くなることが、感情である。ここでは速くならない。**
    ⚠️ **顔は置かれる**が、**表情は置かれない**——**目だけが動き、口は動かない。**
  law: >-
    luminous-anime の物理。**止まるのは主題であって、画面ではない**——昼の玄関の前では、
    埃と、柱の木の葉と、表札にかかる影の端が動きつづける。
    ⚠️ **音は、呼び声ではなく、紙と埃の音である**（run-10【ルックとカメラ】）。
    **このショットに、呼び声は一度も無い。**
    ⚠️ 様式カードの中身は `distill-essence-engine` に在る。ここに置くのは**名前だけ**である。

beats:
  - range: 0-3s
    density: sparse
    what: >-
      玄関の前。**足は、もう止まっている。** 腕の内側に箱が当たり、指の腹が紙の端にかかっている。
      柱。木である。**表札も、木である。** **字が、二つ、ある。彫って、ある。へこんで、いる。**
      へこみに、色が入っている。**色は、黒い。上の、ほうが、薄い。**
      日は、表札の**右の半分**に当たっている。**左の半分は、影である。**
  - range: 3-6s
    density: sparse
    what: >-
      箱の、側面。**宛名票がある。紙は、こちらを、向いている。欄が、いくつか、ある。**
      **いちばん、上の、欄に、名が、ある。字が、二つ、ある。**
      **紙の、字は、印刷である。黒い、インクである。** 車で見た字と、同じである。
      目は、紙に、ある。**それから、上へ、行く。** **紙の、名を、持って、行く。**
  - range: 6-9s
    density: sparse
    what: >-
      **持って、行って、表札の、ところへ、来る。来た、名が、そこに、無い。**
      無いので、下へ、戻る。戻って、名を、持つ。持って、また、上へ、行く。上で、また、無い。
      **行く、速さは、同じである。** 上で、一度、止まる。止まってから、戻る。
      下でも、一度、止まる。下の、字を、見る。それから、また、上へ、行く。
      ⚠️ **この往復のあいだに、音は、しない。**
  - range: 9-12s
    density: held
    what: >-
      **重ならない、ところで、止まる。** **止まって、動かない。**
      **目は、まだ、上に、ある。** ねじの、一つが、新しい。
      **まばたきが、遅く、なる。** 息は、浅い。肩は、動かない。
      紙は、下に、ある。表札は、上に、ある。**運んだ、名が、目の、奥に、残る。**
      **残った、名は、読めない。**

# ⚠️ **`reference_set` の鍵は、すべて `ledger.yaml` に在る。**（`L8`）
#    ⚠️ **`表札と宛名票.geography` を、このショットは引かない。**
