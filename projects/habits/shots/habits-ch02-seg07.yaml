# 第二巻『重なった名』 第7話「表札と宛名票」 / 所作 / motion —— 宛名票の名が、目で、表札へ運ばれ、
#                                                                            **重ならないところで、止まる**
#
# **出典**
#   話名・字数・扱う癖・記名は **話割り `habits-02/構想/話割り.md` の第7話の節**
#   （**4,300字**。**扱う癖＝暮林蒼「読みを、届け先の表札で確かめる」**。
#    **記名＝宛名票の名。現場・一拍＝届け先の玄関／表札と宛名票。**
#    **この話で名を目で読む者＝暮林蒼。動き＝◆宛名票の名を、暮林蒼の目で表札へ運ぶ。
#    二つの字が合わないところで止まる。**）
#   場面の内部の順序は **`habits-02/構想/各話/07_表札と宛名票.md`（場面表、2026-09-19）**。
#   本文は **`habits-02/草稿/draft_02-07_表札と宛名票.md`**。
#
# ⚠️ **このショットは「第7話そのもの」ではない。**
#    場面表は**場面を三つ**に切る——① 足立区綾瀬の路上／昼（起・1,200字・内面 B）／
#    ② 届け先の玄関／昼（承・1,800字・内面 A）／③ 届け先の玄関／昼（転・結・1,300字・内面 C）。
#    **このショットは、その②である。**
#
# ⚠️ **そして②を、このショットは分割している。これが発明（要承認）である。**
#    場面表の②（本文 **:201–:493**）は、**三つのことをする**——
#      (i)   荷台から箱を降ろし、玄関の前まで運ぶ（本文 **:203–:299**）
#      (ii)  名を、目で表札へ運び、重ならないところで止まる（本文 **:301–:417**）
#      (iii) 戸が開き、受付の者が出て、姓の読みを訊く（本文 **:419–:493**）
#    ⚠️ **このショットは (ii) だけを持つ。**
#       (i) は**落ちていない。このショットの入口の状態である**——`unit.before` は
#       「名が、まだ表札へ運ばれていない」であり、**箱は既に腕の内側にあり、足は止まっている。**
#    ⚠️ **このショットに、受付の者は出ない。** **戸は開かない。**
#       **訊く語も、答えの二つの音も、このショットの中に無い。**（ゆえに §14 `Dialogue` は `None`。）
#    ⚠️ **落ちたのではない。撮っていない。** **(iii) は、まだ無いショットである**——
#       **記録として書く**（`habits-ch02-seg02.yaml` の同じ註）。
#    ⚠️ **分割の根拠は、私の発明ではない——話割りが既に分けている。**
#       話割りの「**動き**」の欄は `◆宛名票の名を、暮林蒼の目で表札へ運ぶ。二つの字が合わないところで止まる。`
#       ——**(ii) そのものである。**
#       話割りの「**会話**」の欄は `暮林蒼と受付の者。姓の読みを訊く。`——**(iii) である。**
#       **別の欄である。** 場面表が②に両方を詰めたので、**ショットは分けざるを得ない。**
#    ⚠️ **固定方針は「1ショットは1変化」である**——(ii) と (iii) は別の変化である。
#       **ゆえにこのショットは (ii) だけを持つ。**
#       ⚠️ **ゆえに、この分割を退けるなら、この一枚はこの形では成立しない**——
#          **「足しものを削る」では済まない**（別の切り方の裁定が要る）。
#
# ⚠️ **`spec:` は `specs/video/habits-ch02-seg07.md` である。**
#    **このファイルは②breakdown の側であり、§1–20 を持たない。**
#
# ⚠️ **これは第二巻で2枚目の経路である。** 第1話の三枚（`habits-ch02-seg01`–`seg03`）は
#    **`MINIMAX H3`** である。**この一枚は `SEEDANCE 2.5`** ——**§18 の見出しが名乗る**（`L18`）。
#    ⚠️ **同じ作品が二つの経路を持つことは、決定（2026-09-13）の想定内である**
#       （「一つの作品が複数のモデルを使えるようにするためである」——`specmap.SECTION_FAMILIES` の註）。
#    ⚠️ **この一枚が、この経路の1本目である。** 経路は**まだ1本も撮っていない**——
#       ゆえに `specmap.MODEL_ROUTE` の `SEEDANCE 2.5` は**空のタプル**である
#       （**「禁じる語が無い」ではなく「測っていない」**。`WAN 3.0` の空とは意味が違う）。

shot: habits-ch02-seg07

# 動画の仕様（§1–20 を持つ）。**§18 の見出しがモデルを名乗る**——この一枚は
