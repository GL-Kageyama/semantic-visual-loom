# 第二巻『重なった名』 第1話「八十軒目」 / 所作 / motion —— 伝票の束が、受付の机から、助手席へ
#
# **出典**
#   話名・字数・扱う癖・記名は **台帳 `series-bible.md`**（第二巻第1話。**4,200字**。
#   扱う癖＝暮林蒼「受け取る人の名前を覚えないまま、その家の玄関の段差だけを覚えている」。
#   **記名＝宛名票の一行。**）
#   場面の内部の順序は **`examples/habits-02/構想/各話/01_八十軒目.md`（場面表、2026-09-19）**。
