#
# ⚠️ **このショットは「第二巻第1話そのもの」ではない。**
#    場面表は**場面を三つ**に切る——① 営業所／朝（起・1,200字・内面 B）／
#    ② 足立区の路上／日中（承・1,700字・内面 A）／③ 足立区の路上／日没前（転・結・1,300字・内面 C）。
#    **このショットは、その①である。**
#
# ⚠️ **一話を何ショットに割るかは、決まっていない**——撮る段の未決として残す
#    （`habits-ch01-seg01.yaml` の同じ註）。**このサンプルは、その未決に一つだけ答えた**——
#    **場面表の三場面が、そのまま三ショットである。** ⚠️ **これは発明（要承認）である。**
#    **場面表は「三場面」と書くが、「三ショット」とは書いていない。**
#    ⚠️ **このサンプルは、著者の裁定の「12コマ」を3枚に分けて持つ**（4＋4＋4）。
#       **裁定の文面は「1枚のボードに12コマ」であった**——**ずれである。**
#       理由と宣言は `specs/board/habits-ch02-seg01-board.md` の見出しに書いた。
#
# ⚠️ **`role` は 所作 である。だが、この場面には会話がある。**
#    場面表——「**第一場面は、この話で会話のある唯一の節でもある**」。
#    ゆえに **`対話` の固有基準（間・沈黙・聞き手の反応・視線・**声との同期**）も、
#    このショットに掛かる。** **どちらの基準で読むかを、ここでは決めていない**——
#    ⚠️ **決めたのは「このショットの仕事は運搬である」ということだけである。**
#    **声の側は、`specs/video/habits-ch02-seg01.md` の §18 `Audio Prompt` が持つ。**
#
# ⚠️ **`spec:` は `specs/video/habits-ch02-seg01.md` である。**
#    **このファイルは①breakdown の側であり、§1–20 を持たない。**

shot: habits-ch02-seg01

# 動画の仕様（§1–20 を持つ）。**§18 の見出しがモデルを名乗る**——この一枚は
# **`18. MINIMAX H3 PROMPT MAPPING`** である（`L18` が読む）。
# ⚠️ **画像の仕様（`key_image:`）は無い。** この経路の①は**絵コンテの画像**であって、
#    `key_image` ではない（`specmap.MODELS` の `MINIMAX H3` の註）——
#    **ゆえに `key_image` の欄は、この経路では埋まらない。** 穴である。
spec: specs/video/habits-ch02-seg01.md

unit:
  before: 伝票の束が、受付の机の端に寄せられ、**蒼の手には無い**
  after: 束が助手席に置かれ、シートが少しへこんでいる。**手は、もう、束に無い**

# 所作——**この一変化は、手が運ぶことである。**
# ⚠️ **運搬は、ここで完了しない**（run-10【動きの単位】——「この作品の運搬は一度も完了しない」）。
#    助手席に置くことは、到着ではない。**この束は、日没まで手から手へ減りつづける。**
role: 所作

# **話の記名の現場**（決定 2026-09-15、著者）。**巻の紙でも、地理でもない。**
# ⚠️ **この場面に宛名票は無い。** それでも `place` は宛名票である——
#    **`place` が指すのは、その話の記名の現場であって、その場面の小道具ではない。**
#    **一話に一つである**（`ledger.yaml` の「場所」の註）。
place: 宛名票の一行

# ⚠️ **場面表の「営業所／朝」である。** 出典の語では——run-10 第一巻 十「**速度は遅い**」の側ではなく、
#    場面表が「**この話の速さは、呼ばないことから来る**」と書く側である。
time: 朝（営業所を出るまで）

mode: motion

# ⚠️ **この一枚で、出典に無い唯一の値である。**
#    場面表は尺を書かない。**ゆえにこの `10s` は「発明（要承認）」である**（方針 §5a）——
#    **承認されていない。** ⚠️ **上限は生成器の側の都合である**——MiniMax H3 の出力は 4〜15 秒
#    （`specmap.MODELS` の註。2026-09-20 に確認）。
# ⚠️ **12コマを3枚に分けたのは、この上限ではない。**（訂正 2026-09-20）
#    **固定方針である**——**1ショットは1変化・1場所・一時刻**であり、
#    場面表は三つの場面を三つの時刻（朝／日中／日没前）で立てている。
#    **一話を1枚のボードにすれば、一つの生成が三つの変化を運ぶことになる。**
#    ⚠️ **`L3` はそれを鳴らさない**——閾値は時刻語が3種であり、朝と昼では2種である。
#       **鳴らないことは、許していることではない。**（この穴は `specs/board/` に記録した）
# ⚠️ 家は `shot.duration`、読者は `L23`、導出は `engine/shot/print_spec.py` の §1 である。
duration: 10s

motion:
  subject: 暮林蒼の両手と、受付の手
  quality: >-
    **名を呼ばずに、用件から入る。** 束が机に置かれ、受け取られ、
    **腕を伸ばさずに胸の下で持たれ、助手席に置かれる。**
    ⚠️ **顔は、呼ばれた後にだけ置かれる**（run-10【ルックとカメラ】）——
    ゆえに**顔を先に置かない。** 受付の人が顔を上げるのは、**呼ばれた後である。**
  law: >-
    luminous-anime の物理。**止まるのは主題であって、画面ではない**——朝の営業所では、
    台車の車輪と、引き出しの音と、紙の端が動きつづける。
    ⚠️ **音は、呼び声ではなく、紙と手の音である**（run-10【ルックとカメラ】）。
    ⚠️ 様式カードの中身は `distill-essence-engine` に在る。ここに置くのは**名前だけ**である。

beats:
  - range: 0-3s
    density: sparse
    what: >-
      営業所。受付の前に立つ。**名を呼ばずに、用件から入る。**
      「おはようございます。昨日のぶん、ありますか。」
      **顔は置かれない**——「手が先にあり、顔が後に来る」。
  - range: 3-5s
    density: held
    what: >-
      受付の人が、顔を上げる。**上げるまでに、少し、ある。** 手は、まだ、机の上にある。
      「暮林さん、おはようございます。ありますよ。」——**名は、あとから来る。**
  - range: 5-8s
    density: sparse
    what: >-
      引き出しが開き、閉まる。閉まる音が、少し遅れて来る。
      束が机の上に置かれる。**置く前に、指で、端をそろえる。** そろえる音が、する。小さい。
  - range: 8-10s
    density: sparse
    what: >-
      受け取る。片手で持てる。**腕を伸ばさない。胸の下で持つ。**
      助手席に置く。シートが、少し、へこむ。鍵を回す。エンジンがかかる。**ラジオは、つけない。**

# ⚠️ **`reference_set` の鍵は、すべて `ledger.yaml` に在る。**（`L8`）
#    ⚠️ **`宛名票の一行.geography` を、このショットは引かない。**
#       **この場面は営業所であって、足立区の路上ではない。**
#       ⚠️ **台帳の `geography` 自身がそう書いている**——「`geography` が指すのは第1話の後半である。
#          前半（朝の営業所）はこの鍵の外にある」。
#       **ゆえに、`place` が一話に一つであることと、参照が一話に一つであることは、別である。**
#    ⚠️ **画像は、まだ一枚も無い。** 鍵は引けるが、指し先は**プロンプトである**
#       （`distill-essence-engine/examples/habits/character/メイン/02_暮林蒼/prompt.md`）。
#       **`attached` は宣言であって記録ではない**（下）。
