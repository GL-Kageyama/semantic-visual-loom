# ⚠️ **`attached` は宣言であって記録ではない。**（`hitosara` の同じ註）
#    ここに書いてあるのは「何を添付するつもりか」であって、「何を添付したか」ではない。
#    **記録はテイクの側に在る**（`take.params.references`）——⚠️ **`takes/` は無い。**
#    **ゆえに、実際に何が添付されたかは、どこにも記録されていない。これは穴である。**
