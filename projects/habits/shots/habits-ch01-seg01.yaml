# 第一巻『残った名』 第1話「消さなかった一行」 / 所作 / motion —— 出席簿が、棚から机へ
#
# **出典**
#   仮題・字数・扱う癖・記名は **run-09**（台帳 `series-bible.md` 三、連載レコード 3 が決定）。
#   動きと会話は **run-10**。人物の事実は `台帳/人物/` を読む——**ここに複製しない。**
#
#   run-09「第1話「転出欄」4,000字 ── 前年度の出席簿を綴じる。転出欄に、誰も消さなかった
#           一行が残っている。／扱う癖：碓氷千夏（手引きの綴じ目を、開いた頁のまま置いておく）
#           ／記名：出席簿の転出欄の一行。」
#   run-10 第一巻 章立て 第1話「動き＝出席簿を職員室の棚から机へ、碓氷千夏の手で運ぶ。
#           名の欄の手前で止まる。／会話＝碓氷千夏と事務の同僚。用件のみ。」
#
# ⚠️ **run-10 の仮題は「出席簿」、run-09 は「転出欄」である。** 決着は台帳に在る——**run-09。**
# ⚠️ **run-10 の字数は 4,300字、run-09 は 4,000字である。** 同じく **run-09。**
#
# ✅ **話名（正）は「消さなかった一行」である**（2026-09-16、著者）。
#    **巻題も正は『残った名』である。** 正の側は旧題を新題に置き換えた
#    ——**出典（run-09／run-10）の仮題は、上の引用の中だけに残る。**
#
# ⚠️ **このショットは「第一巻第1話そのもの」ではない。**
#    run-10【動きの単位——運搬と、一話一カット】は「**この一行は、アニメなら一カットで
#    描ける動作でなければならない**」と書く。だがこのリポジトリの固定方針は
#    「**The shot is the unit.** One shot exists for **one change**——**Do not divide by
#    episode**」である。**この二つは、まだ繋がっていない。**
#    ここに切ったのは、**第1話の運搬の一行のうち、最初の一変化**である。
#    **一話を何ショットに割るかは、決まっていない**——撮る段の未決として残す。
#
# ⚠️ **`spec:` が無い。**（方針 §7——最小形は `bible.yaml` ＋ `ledger.yaml` ＋ `shots/*.yaml`。
#    **`specs/` を切らない。**）ゆえに §1–20 も §18 も無い。
#    **②design の段がまだ走っていない**——下の `beats` `mode` `duration` `motion` は
#    ②の持ち物であり、**ここに在るのは、場所（§6-2）が決まったので一手だけ置いたためである。**

shot: habits-ch01-seg01

unit:
  before: 前年度の出席簿が、棚に閉じられている
  after: 出席簿が机に開かれ、**転出欄の一行の手前で、手が止まっている**

# 所作——**この一変化は、手が運び、止まることである。**
# ⚠️ 開示ではない。**転出欄の一行は、この巻の開示であって、この一変化の仕事ではない。**
#    `rolemap` の 所作 は 既定モード `motion` を持つ（`engine/ledger/rolemap.py`）。
role: 所作

# **話の記名の現場**（決定 2026-09-15、著者）。**巻の紙でも、地理でもない。**
place: 出席簿の転出欄

# ⚠️ **〔導出〕** 出典は月を書かない。run-09「**前年度の**出席簿を綴じる」からのみ導いた。
#    ⚠️ run-10 第一巻 章立て 第1話の「扱う癖」は名札の癖である——**同一話に二つの現場がある。**
time: 年度替わり（三月から四月）

mode: motion

# ⚠️ **この一枚で、出典に無い唯一の値である。**
#    run-10 は尺を書かない。八点の初稿も §1 に尺を持たない。
#    **ゆえにこの `8s` は「発明（要承認）」である**（方針 §5a）——**承認されていない。**
#    **埋めるなら——この作品の運搬一変化は何秒か。**「速度は遅い」（run-10 第一巻 十）。
#    ⚠️ 家は `shot.duration`、読む者は `L23` である（`bible.yaml` の `constants.video` に置かない）。
duration: 8s

motion:
  subject: 碓氷千夏の右手
  quality: >-
    出席簿を棚から机へ運び、開き、**転出欄の一行の手前で止まる。**
    ⚠️ **完了しない**——「この作品の運搬は一度も完了しない」（run-10【動きの単位】）。
    止まるのは**手**であって、めくることではない。run-10 第一巻 十——
    「この巻で動きは**紙を一枚めくる手前で止まる**」
  law: >-
    luminous-anime の物理。**止まるのは主題であって、画面ではない**——蛍光灯の下で、
    埃と光は動き続ける（`hitosara` の `mode: still` の註と同じ規則）。
    ⚠️ 様式カードの中身は `distill-essence-engine` に在る。ここに置くのは**名前だけ**である。

beats:
  - range: 0-5s
    density: sparse
    what: >-
      職員室。棚。前年度の出席簿が閉じられている。手が入り、出席簿を取る。
      **顔は置かれない**——「手が先にあり、顔が後に来る」（run-10【ルックとカメラ】）。
  - range: 5-8s
    density: held
    what: >-
      机。出席簿が開かれる。**転出欄の一行の手前で、指が止まる。**
      紙と手の音だけが在る。呼び声は無い。

# ⚠️ **`reference_set` の鍵は、すべて `ledger.yaml` に在る。**（`L8`）
#    ⚠️ **実在するものは、いま一つも無い。**
#       2026-09-16 まで、`碓氷千夏.identity` が指す初稿の一枚だけが実在していた
#       （`distill-essence-engine`）。**その一枚は旧題を持つため退避された**
#       （`distill-essence-engine/examples/habits/_backup_20260916/`）。
#       **他は元から無い。**（方針 §5c——この段では資産を作らない）
#    ⚠️ **このショットは、いま何も添付できない。** `attached` は宣言であって記録ではない（下）。
reference_set:
  - 碓氷千夏.identity      # 初稿の設定画（`habits-usui-chinatsu-character-sheet-luminous-anime`）——⚠️ **2026-09-16 退避。いま実在しない。**
  - 碓氷千夏.negatives
  - 名札.appearance        # 第1話の「扱う癖」の対象
  - 出席簿の転出欄.base
  - 出席簿の転出欄.geography

# ⚠️ **この一話に居ない者を、名で禁じる。** 省略すれば、モデルは「他の誰か」を描く。
#    ⚠️ **この一覧は手で書いた。** 二十八名から「この一話に立つ者」を引いたものであり、
#       **台帳から機械で導いたものではない**——台帳は「誰がどの話に立つか」を持つが、
#       このファイルはそれを読んでいない。**ずれる。**
forbidden_set:
  - 暮林蒼          # 第一巻第10話が初出。**第1話には居ない。**
  - 侘田すみれ      # 第三巻の語り手
  - さくら          # 第四巻の語り手。**人物そのものが禁制である**
