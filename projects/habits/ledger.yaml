      ⚠️ **2026-09-16——この初稿は退避された**（旧題・第二巻第12話「振り向く」を持つため）。
      退避先は `distill-essence-engine/examples/habits/_backup_20260916/`（**凍結した記録**）。
      **ゆえに、いま `identity` は実在しない。**
    states: {}
    negatives:
      - "no face before the name is called"
      - "no identifying clothing, hairstyle, or prop"
      # 初稿 `habits-kurebayashi-ao-.../prompt.md` の Negative から。**要承認**（方針 §2）。
      - "no legible name on any in-world prop"
      - "no romaji in place of the Japanese name"
      - "no field for a name in the step chart"   # 段差の図に名の欄が無い

