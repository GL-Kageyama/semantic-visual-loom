      ⚠️ 初稿であり、作り直され得る（`方針 §2`）。⚠️ 外見の記述は出典に一行も無い（`方針 §5a`）。
      ⚠️ 四枚のうち、**この一枚だけは顔を四度置くことが作品の規則に反しない**——
      彼女は**呼ばれる側**の人間である（`prompt.md` の註）。
      ⚠️ **2026-09-16——旧題を持つ初稿を採り、題だけを新しくした。** 凍結した記録は
      `distill-essence-engine/examples/habits/_backup_20260916/` に在る。
      **この段では資産を作らない**（`方針 §5c`）——**切ったのはプロンプトだけである**（`方針 §7` 実行の記録 ④）。
    states: {}
    negatives:
      - "no face before the name is called"           # run-10【ルックとカメラ】
      - "no identifying clothing, hairstyle, or prop" # 方針 §5a
