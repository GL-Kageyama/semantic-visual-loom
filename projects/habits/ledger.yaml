    # 第一巻第1話「消さなかった一行」4,000字。記名＝出席簿の転出欄。
    # 台帳は `人物/メイン/01_碓氷千夏.md`。
    identity: >-
      habits-usui-chinatsu-character-sheet-luminous-anime
      ——**初稿**（`distill-essence-engine/examples/habits/`）。
      ⚠️ 初稿であり、作り直され得る（`方針 §2`）。⚠️ 外見の記述は出典に一行も無い（`方針 §5a`）。
      ⚠️ 四枚のうち、**この一枚だけは顔を四度置くことが作品の規則に反しない**——
      彼女は**呼ばれる側**の人間である（初稿 `prompt.md` の註）。
      ⚠️ **2026-09-16——この初稿は退避された。** 旧題（巻題『左袖』・第3話「左袖」）を
      本文に持っていたためである。退避先は
      `distill-essence-engine/examples/habits/_backup_20260916/`（**凍結した記録**）。
      **ゆえに、いま `identity` は実在しない**——画像は退避先に在るが、**そこは実体側ではない。**
      **この段では資産を作らない**（`方針 §5c`）。**作り直すのは、資産の段である。**
    states: {}
    negatives:
      - "no face before the name is called"           # run-10【ルックとカメラ】
      - "no identifying clothing, hairstyle, or prop" # 方針 §5a
      # 以下は初稿 `habits-usui-chinatsu-.../prompt.md` の Negative から。**要承認**（方針 §2）。
      - "no legible name on any in-world prop"  # 名札も転出欄の一行も判読不能
      - "no romaji in place of the Japanese name"
      - "no handwriting by the subject"
      - "no signature"
      - "no cardigan"                           # 棄却された版（run-04 / run-05）を復活させない

