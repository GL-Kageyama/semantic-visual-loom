# ─────────────────────────────────────────────────────────────── 場所
#
# ⚠️ **`place` は「話の記名の現場」である。**（決定 2026-09-15、著者）
#    **巻の紙ではない。地理でもない。** 出典の語では——**毎話、記名の現場を一つ定め、
#    書く手・書かれる物・読む手を実物として置く**（台帳 `series-bible.md` 二、世界「記名の三点」）。
#    **ゆえに鍵は、その話の記名の紙そのものである。**
#
# ⚠️ **この段では一つしか切らない。**（決定 2026-09-15、著者——「一本だけ」）
#    六十三話ぶんの鍵は、撮る段が進むにつれて増える（③ ledger が「育つ語彙」を持つ）。
#
# ⚠️ **場所の外観は、出典に一行も無い。**（方針 §5a——人物と同じ扱いである）
#    出典に在るのは**行政的データだけ**である。**作るなら「発明（要承認）」の表を要る。**
locations:
  出席簿の転出欄:
    # 第一巻『残った名』第1話の記名。**前年度の出席簿を綴じる。転出欄に、誰も消さなかった一行が残っている。**
    # 出所: run-09「第1話「転出欄」4,000字」／run-10 第一巻 章立て 第1話「出席簿」。
    # ⚠️ **仮題は run-09 が決定**（台帳 三、連載レコード 3）——**「転出欄」。** run-10 は「出席簿」とする。
    # ⚠️ **字数も run-09 が決定**——**4,000字。** run-10 は 4,300字とする。
    # ✅ **話名（正）は「消さなかった一行」である**（2026-09-16、著者）。
    #    **上の二行は、出典が何と言ったかの記録である**——**仮題は出典の語のまま残す。**
    #    正の側は旧題を新題に置き換えた（台帳 `series-bible.md` 五、改稿履歴）。
    base: >-
      habits-tenshutsu-ran-board（前年度の出席簿。転出欄に、誰も消さなかった一行が残っている）
      ⚠️ **まだ無い。意図であって資産ではない**（方針 §5c）。
      ⚠️ **紙の外観は出典に無い**——初稿は「紙の欄は記入済みだが**判読できない**」と答えたが、
      方針 §2 により**それは規則ではない。**
    geography: >-
      碓氷千夏の勤め先の区立小学校の職員室。出席簿は**棚から机へ**運ばれる。
      出所: run-10 第一巻「十、この巻の動きの設計」——「**範囲は一つの学校の一室。**
      カメラは、机上の手、左袖の名札、めくられる名簿の三箇所に置かれる」／
      第1話「動き＝出席簿を職員室の棚から机へ、碓氷千夏の手で運ぶ。名の欄の手前で止まる」。
      ✅ **決定（2026-09-15、著者）——この学校は都内の区立小学校である**（下の註）。
    states: {}

# ✅ **地理について——決定（2026-09-15、著者）。この一枚で見つけ、この日に解いた。**
#
#    台帳 `series-bible.md` 三、年表 は、第一巻『残った名』の **場所** を「**川口市の小学校**」としていた。
#    **これを「川口市」に直した。**（台帳の改稿履歴・「決定——年表の第一巻の『場所』」）
#
#    **年表の「場所」の列は、四巻の舞台を並べている。** 出典は四巻の舞台を三つに絞って書く——
#      「2026年、日本。**埼玉県川口市、東京都足立区、神奈川県横浜市戸塚区。**」（run-09:14・run-10:93）
#    ——**この三つが、そのまま一・二・三の三巻である。**
#
#    **川口市は、碓氷千夏が住む場所である**——run-09:33・run-10:129
#      「埼玉県川口市の単身マンション（築二十八年、一LDK）から、
#        **京浜東北線で都内の区立小学校へ**通う。会計年度任用職員（事務）。」
#    ——**勤め先は都内である。** 台帳 `人物/メイン/01_碓氷千夏.md` の「通勤」も同じ。
#
#    **川口市の小学校は、木村智美の勤め先である**——run-09:69「勤め先＝市立小学校、教職員28名、
#       児童410名、4年の担任」／川口市／第一巻第7話「いちばん上の一枚」。**別人の職場である。**
#
#    ⚠️ **誤りは、「川口市の小学校」という一語に、住む場所と、勤め先の種別が、畳まれていたことである。**
#       **訂正で失われる記述は無い**——碓氷千夏は都内へ通い、木村智美は川口市に勤める。どちらもそのまま。
#
#    ⚠️ **この訂正が効く先は `geography` だけではない。** 第一巻の第1話・第3話・第5話・
#       第8話・第10話・第12話・第14話は**碓氷千夏の職場（都内）**で起きる。第7話は**木村智美の
#       職場（川口市）**、第2話・第4話・第6話・第9話・第11話・第13話は**他の現場**である。
#       **第一巻は一つの学校ではない。**
#
#    ⚠️ **2026-09-15、軸が三つあることが分かった。この台帳は、そのうち二つを持つ。**
#       **同じ「場所」に当たる語で、三つの別の問いが答えられていた**——**それが
#       「川口市の小学校」という一語を作った。**
#
#         舞台——その話の担い手がいる側。**四巻の `design.md` の「### 世界」が持つ**
#                （**巻に一つなら台帳 `series-bible.md` の年表「場所」の欄**）。
#                第一巻＝川口市（第1・3・5・6・7・8・10・12・14話）ほか五つ。
#         現場——その話が立つ場所。**この台帳の `shots/` が持つ。** 第一巻の七話は職員室。
#         範囲——その巻の動きが及ぶ広さ。**この台帳の `geography` が持つ。**
#                run-10 の「**運搬の速度と範囲**」の表——第一巻＝**一つの学校の一室。**
#
#       **三つは矛盾しない。** 碓氷千夏は川口市に住み（舞台）、都内の区立小学校へ通い
#       （現場はその職員室）、その一室から出ない（範囲は一つの学校の一室）。
#
#    ⚠️ **2026-09-15、四巻の「### 世界」を「舞台」の軸に揃えた（著者）。** それまで
#       **二・三・四巻の「### 世界」は、この台帳が `shots/` に置く「現場」を書き写していた**
#       ——**語だけ違えて。** ゆえに**二巻に三件、四巻に四件の食い違いが出ていた**
#       （二・第10話「同じ番地」対 営業所／同・第11話「届け先の玄関」対 玄関の前／
#        同・第12話が二重／四・第10話「路線バスの運転席」対 点呼簿、ほか三件）。
#       **軸を揃えたことで、この七件は消滅した**——**突き合わせる相手が変わったからである。**
#
#       **規則**——**その話の「扱う癖」の持ち主がいる側。**
#       「ずれがないので、癖がない」と記された話（三・第16話）は、**巻の語り手の側。**
#       **この規則を第一巻に当てると、承認済みの十四話の一覧と一字も違わない。**
#
#    ⚠️ **`geography` の値は、run-10 の「範囲」の欄と、四つのうち三つが同じ語である**
#       （二＝足立区から埼玉南部／三＝戸塚区／四＝紙の上）。**第一巻だけが違う**——
#       **run-10 は「一つの学校の一室」と書き、年表は「川口市」と書く。**
#       **これは食い違いではない。軸が違うのである。**
#       **⚠️ 三つが同じ語で呼ばれているので、片方の表を、もう片方の欄に書き写せてしまう。
#          突き合わせるときは、軸の名を先に確かめる。**

# ─────────────────────────────────────────────────────────────── 道具
props:
  名札:
    # 碓氷千夏の癖の対象。**名札を左袖に留める前に、布の上から姓の三文字を指でなぞる。**
    # 出所: run-10 第一巻 章立て 第1話／run-10【主要キャラクター】「胸に着けている名札は、自分で書いたものではない。」
    appearance: >-
      胸に着ける名札。姓が三文字。**本人の手で書かれたものではない**——印刷である。
      ⚠️ **外見は出典に無い。** 初稿（`habits-usui-chinatsu-.../prompt.md`）は
      「左胸の針穴二つ」を**発明（要承認）**として表に残している（方針 §2-3——**この型だけを採る**）。
    negative:
      - "no legible name on the nameplate"
      - "no romaji in place of the Japanese name"
      - "no handwriting by the subject"

# ─────────────────────────────────────────────────────────────── 開示
# 変化点だけを持つ。全ショットは並べない。変化点の間は直前の状態が続く。
#
# 各変化点の `negative:` は、**モデルに渡る文（§18 Negative Prompt）がこの点で
# どうなったか**の宣言である。検査 L10 が、§18 を実際に読んで両方向に検算する。
#
#   changed  この変化点で §18 の節が変わった
#   covered  §18 は変わらない。**既にその状態を持っていた**
#
# ⚠️ **この段では、§18 が一本も無い**（方針 §7——最小形は `bible.yaml` ＋ `ledger.yaml` ＋
#    `shots/*.yaml`。**`specs/` を切らない**）。
#    **ゆえに `negative:` を書く相手が居ない**——**読む相手のいない宣言を書かない**
#    （`hitosara` の台帳が同じ規則を記録している。あちらは `mode: still` で画像の仕様しか
#    持たなかった回に `negative:` を書かなかった）。
#    ⚠️ **だが、変化点そのものは書ける。** `negative:` はこの欄で必須ではない
#       （`schemas/ledger.schema.json` の `required` は `shot` だけである）。
#    ⚠️ **ショットが1本しか無いので、変化点も1個である。** 六十三話ぶんはこれから増える。
disclosure:
  - shot: habits-ch01-seg01
    # 不在（転出欄は、消されているのが常である）→ **残っている。**
    # 出所: run-09「第1話「転出欄」4,000字 ── 前年度の出席簿を綴じる。転出欄に、
    #       **誰も消さなかった一行が残っている。**」
    # ⚠️ **値の型は未決定である**（`schemas/shot-record.schema.json` の `disclosure_state`
    #    の註——「値の型は未決定（U20・U21 の残件）」）。ここでは `ukebi-v2` の
    #    `HANA: present` と同じ語を使った。**同じ語を使ったことは、型が決まったことではない。**
    出席簿の転出欄.一行: present
    # ⚠️ **`negative:` を書かない。** §18 がまだ無いので、`changed` と `covered` の
    #    どちらであるかを**決められない**。**決められないものを、決まった形で書かない。**
    #    §18 が生まれた時点で、ここに一行が入る。

# `at` は「鍵」ではない。**人が読むための群れである**（`ukebi-v2` の註）。
at:
  第一巻『残った名』:
    range: "01"
  第二巻『重なった名』:
    range: "02"
  第三巻『書き直した名』:
    range: "03"
  第四巻『書いていない名』:
