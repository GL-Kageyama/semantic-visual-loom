    #    `HANA: present` と同じ語を使った。**同じ語を使ったことは、型が決まったことではない。**
    出席簿の転出欄.一行: present
    # ⚠️ **`negative:` を書かない。** §18 がまだ無いので、`changed` と `covered` の
    #    どちらであるかを**決められない**。**決められないものを、決まった形で書かない。**
    #    §18 が生まれた時点で、ここに一行が入る。

  - shot: habits-ch02-seg02
    # 不在（宛名票のいちばん上の行は、読まれないのが常である）→ **目に入る。**
    # 出所: 台帳 `series-bible.md` 二、年表 ②——第二巻「**重なった宛名票**」。
    #       本文 第2場面——「**いちばん上の行が、目に入る。**」／
    #       「そのあいだに、足は、段差を、上がっている。**目は、上げていない。**」
