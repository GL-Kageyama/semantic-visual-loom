# 制作台帳 — 『ハビッツ！！！』（habits）
#
# **連続性（世界の状態）と開示（観客の知識の状態）を同じファイルに持つ。**
# ⚠️ **二つに割ってはならない**——参照集合も禁制集合も、この一点から導かれる（`CLAUDE.md`）。
#
# ⚠️ ここにあるのは**設計**である。**生成の記録ではない**——記録は `takes/` に在る。
#    台帳は「世界がどうなっているか」を持ち、「何が生成されたか」は持たない。
#
# ⚠️ **人物の事実は、ここに複製しない。**（方針 §3-1②）
#    **呼ばれ方の履歴・癖・生活・記名は `soul-voice-teller/examples/habits/台帳/人物/` に在る。**
#    このファイルが持つのは**カメラが要る語彙だけ**である——キーと、identity の意図と、禁制。
#    下の各人物の註に、台帳のどのファイルを読むかを一行で指す。**中身は写さない。**
#
# ⚠️ **外見の記述は、出典に一行も無い。**（方針 §5a）
#    あるのは**性別と年齢**、および生活の行政的データだけである。**この不在は空白ではなく設計である**
#    ——この作品では、人が何者かは**呼ばれ方と癖と動きの署名**で決まる。
#    ゆえに `states:` は全員 `{}` である——**衣装の記述が、出典にも初稿にも無い**
#    （初稿の四枚は設定画であり、衣装は各状態のものではない）。
#
# ⚠️ **出典が二つある。** run-09＝**正**（呼ばれ方の履歴・癖・配属）／run-10＝**層**（動きの署名）。
#    台帳 `series-bible.md` 三、連載レコード 3 が食い違いの決着を持つ——
#    **話数・並び・仮題・字数配分・扱う癖・記名・主役回＝run-09／動きと会話＝run-10。**
#    **この規則を再掲しない。指す。**

characters:
  # ⚠️ **二十八名すべてを「人として置く」。**（決定 2026-09-15、著者）
  #
  #    ⚠️ **2026-09-16——著者がこの一線を決めた。** 二十四名も**人のかたちの設定画**を持つ。
  #    一枚ずつは `distill-essence-engine/examples/habits/character/` に在る——中核四人が `メイン/`、
  #    ストック層二十四名が `サブ/`。**ゆえに下の identity は、その一枚を指す。**
  #    ⚠️ **画像はまだ一枚も生成していない。切ったのはプロンプトだけである**（`方針 §7` 実行の記録 ④）。
  #
  #    ⚠️ **「一組にしない」は、解かれていない。**（`方針 §5b①` の 2026-09-16 の項）
  #    「**二十四名の設定画を、一組にしない。**一個ずつは動き、並べれば図鑑。
  #      担保は、どの癖も持ち主を持たないことだけである」（run-10【動きが入ると壊れるもの】）。
  #    **解かれたのは「人のかたちを置かない」の側だけである。** 移った先の条件は——
  #    「**どの一枚も、他の二十三枚を名指ししない**」。**移った先は、移る前より弱い。**
  #    ⚠️ **人のかたちを置くことは、癖に持ち主を与えることである。** そこは、もう切れている。
  #
  #    ⚠️ **`negatives` の二行は、二十八名に共通である**——読み手が一人の欄だけを読んでも
  #       その人物の床が分かるように、意図的に繰り返している。**層の床であり、個人の禁制ではない。**
  #       - `no face before the name is called`   …… run-10【ルックとカメラ】
  #       - `no identifying clothing, hairstyle, or prop` …… 方針 §5a（衣装・髪型で識別しない）
  #    ⚠️ **床を厚くするのは `bible.yaml` の `negative_base` である。** ここは重複ではない。

