      #    **可読度は、その話の §18 が負う**——`bible.yaml` の註を見る。
      - "no romaji in place of the Japanese name"
      - "no handwriting by the subject"
      - "no signature"
      - "no cardigan"                           # 棄却された版（run-04 / run-05）を復活させない

