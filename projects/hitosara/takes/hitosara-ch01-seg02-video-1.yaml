      "§3 The Water — Behavior（It does not arrive）": |
        映像の中に水の出所が無いのに、水が粉から湧いて増えた。
        **仕様が「触れる」と書き、「どこから来るか」を書いていない以上、これは仕様の側の穴である。**
      "§1 Generation Intent（a single change: two substances stop being two）": |
        「水が来る」は**2つ目の変化**である。このショットの変化は1つでなければならない
        ——§1 が名乗る唯一の変化は「two substances stop being two」であって、「水が来る」ではない。
      "§16 MUST NOT（No water splash, no drops flying in the air）": |
        水は飛沫ではなかった。**飛沫より悪い**——出所の無い液体が画面の中で増えた。
        このショットに器は無い（§5）。**だから増える先は粉の中しかない。**
