# 10 / モンタージュ / motion — 盛り付けから食卓
#
# ⚠️ **決定（2026-09-13、著者）で `mode` が変わった。** 以前は `composite` だった。
#    このショットの主題は**皿と、そこへ至る断片**であり、断片は動く——だから `motion`。
#    ⚠️ **`text_channel` は残る。** `motion` のショットも文字を持てる
#    ——`composite` ⇒ `text_channel` 非空は片方向の規則である。
# ⚠️ **ここで `motion.law` が様式と正面から噛み合う。** 様式 `luminous-anime` の
#    Motion character は「何かが常に動いている」と言う。モンタージュは
#    **1ショットの中で連続して動かない**——切れ目で動く。
#    だから `law` がその衝突を明示している: **断片のそれぞれの中で満たされる。**
#    ⚠️ **この噛み合わせを機械が読むことは、いま無い**（§11 の小節は4つ、欄は3つ。
#    `motion.law` と様式カードの `Motion character` を突き合わせる照合は未実装）。
