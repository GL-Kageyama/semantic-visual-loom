# 第一ショット / 運動（自然現象） / motion —— 角砂糖が、花の形を結ぶ
#
# ⚠️ **この作品には、この1本しか無い。**
#    前のショットも次のショットも無い——**ゆえに `L10` は註で
#    「先行する §18 を持つショットが無い」と言う。****違反ではない。**
#
# ⚠️ **このショットの出典は、形式カード `transformation` の4つの欄である。**
#      `FROM`  ＝紅茶の中の、角の立った白い立方体
#      `TO`    ＝花の形
#      `TRIGGER`＝熱——**茶は既に熱く、枠の中に新しい原因は現れない**
#      `KEEP`  ＝**白さ。** 花は砂糖であり、砂糖は白い
#    **⚠️ 中間の段階は置かれない。** それがこの文法の主張である。
#
# ⚠️ **このショットの変化は1つだけである。**「角砂糖が、花の形を結ぶ。」
#    **それ以外のことは何も起こらない**——人物も、移動も、光の変化も無い。

shot: grammar-transformation-s01
spec: specs/video/shot-01-sugar.md

# ⚠️ **`key_image` を置かない。** この作品の画像の経路はまだ1度も走っていない
#    （`ledger.yaml` の `紅茶.base` は「未作成」である）。
#    ⚠️ **空の `key_image:` を書けば「画像の仕様が在って空」になる。**
#       **書かないことは、無いことである。**
#    ⚠️ **`L18` はこの不在を1件の註に畳んで報告する**——
#       「記録が無いのであって、食い違っているのではない」。

aim: >-
  **形式カード `transformation` を1度だけ実際に使う。** 角砂糖が花になる——
  **切らず、途中の段階を置かず、白を保ったまま。**
  ⚠️ この試しが成り立たなければ、**7枚の文法のうちの1つが、この基盤では立てない**ことになる。
  ⚠️ **確かめているのは文法が効いたかどうかではない。** 文法を仕様に落とせたかどうかである。

unit:
  before: "**角砂糖は、角の立った白い立方体である。** 面は粒立っており、熱い紅茶の中に在る。"
  after: "**同じ白さのまま、その塊は花の形を結んでいる。** 切られておらず、途中の段階も置かれていない。"

# ⚠️ **種別は `運動（自然現象）` である。** 固有基準は「物理の説得力・スケール・主体との干渉」——
#    **この1本が裁かれるのは、その3つである。**
#    ⚠️ **限定つきの綴りを使えるのは `運動` だけである**（`rolemap.QUALIFIABLE`）。
#       `L15` は綴りを違反にせず、**註**で報告する。
role: 運動（自然現象）

place: 紅茶

# ⚠️ **時刻を持たない。** 空欄ではない——**この作品に時計が無い**という宣言である
#    （`bible.yaml`「時計は無い」）。
time: 時刻を持たない

# ⚠️ **`motion` である**——`mode` の意味は「**主題が動くか**」である。
#    主題は角砂糖であり、**その輪郭は動く。** ゆえに `still` ではない。
mode: motion

duration: 8s

# ⚠️ **運動の層は、この作品の主題そのものである。**
motion:
  subject: 紅茶の中の角砂糖
  quality: >-
    **角が先に落ち、次に塊が花の形を結ぶ。** 動くのは輪郭であって、位置ではない——
    **角砂糖は紅茶の中の同じ場所に留まったまま、形だけが変わる。**
    花は**一度だけ結ばれ**、この1本の中では崩れない。
  law: >-
    macro-photo の物理。**焦平面は極端に薄い**——主題はその面の中に保たれ、
    外れたものは滑らかな丸いボケへ溶ける。**拡大された時間**——
    この尺度では、最も小さな動きが最も大きな出来事である。
    ⚠️ **様式カードは `SVL_STYLES_DIR=references/styles` を張らねば読まれない。**

beats:
  - range: 0-2s
    density: sparse
    what: >-
      **角砂糖は、まだ角砂糖である。** 6つの面と、8つの角が立っている。
      熱い紅茶の中に在り、**面の粒が、まだ崩れていない。**
  - range: 2-5s
    density: held
    what: >-
      **角が落ちていく。** 立方体の輪郭が、外へ向かって緩む——
      **これは通過であって、途中の段階ではない。** 花になる前の形が、
      説明のために保持されることはない。**この3秒が、このショットの主題である。**
  - range: 5-7s
    density: dense
    what: >-
      **塊が、花の形を結ぶ。** 一度だけである——**結び直されない。**
      白は保たれたまま、輪郭だけが花になる。
  - range: 7-8s
    density: held
    what: >-
      **花は、まだ花である。** 崩れない。戻らない。
      **この1本は、変化が終わりきる前で終わる。**

# ⚠️ **参照画像は1枚も無い。** ゆえに集合は空である——
#    **空を書くことは、書き忘れではない。**（`ledger.yaml` の `紅茶.base` を見よ）
#    ⚠️ **`attached` を書く。** 欄そのものが無いと `L6` は
#       「記録が無い」と註で言う——**この作品は記録できる：渡していない。**
#    ⚠️ **2つは一致していなければならない**（`L6` が両方向に引く）。
reference_set: []
attached: []

forbidden_set:
  - 2つ目の主題
  - 匙
  - 手
  - カップの縁
  - 読み取れる文字
  - 湯気
  - 泡
  - 説明のための途中の形
  - カメラの移動

# ⚠️ **開示の変化点は、この1本である。** 台帳の `disclosure` が
#    「**角砂糖の形が、花になる**」をこのショットに置いている——
#    **この1本の出来事そのものが、この作品で観客が知る唯一のことである。**
#    ⚠️ **台帳と一致していなければならない**（`L7a` = 早すぎる開示／`L7b` = 台帳が予測していない）。
disclosure_state:
  角砂糖.形: 花
