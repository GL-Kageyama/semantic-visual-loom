# 制作台帳 — 角砂糖（grammar-transformation）
#
# ⚠️ **人物は居ない。** この作品の登場物は角砂糖1つであり、
#    それは人物でも場所でもない——**ゆえに `characters: {}` である。**
#    ⚠️ **`ippitsu` と同じく、この空は空欄ではなく作品の内容である。**
#       §2 の規則「**この作品に、人物は居ない。**」が、台帳の側で同じことを言っている。
#
# ⚠️ **開示の変化点は1つ在る。** `ippitsu` は `disclosure: []` であり、
#    それが `L0` の違反になった（**開示の検査は走らない**）。
#    この作品は違う——**観客がいつ何を知るかが、この1本には実際に在る。**
#    **角砂糖が花になったこと**が、この作品で観客が知る唯一のことである。

# ⚠️ **人物は居ない。** 生成へ渡る参照のうち、人物に由来するものは1つも無い。
characters: {}

locations:
  紅茶:
    # ⚠️ **この作品の唯一の場所である。** 角砂糖は紅茶の中に在り、
    #    枠の外には何も無い——**カップの縁も、匙も、卓も写らない。**
    #    `base` は基準画像を指す。
    #    ⚠️ **まだ作られていない。** **「無い」と書くことは、書き忘れではない。**
    base: >-
      **未作成。** この作品は**生成の前に書かれた**——`media/` は空である。
      最初の1枚は、著者が画像の経路を1度走らせたときにここへ入る。
      ⚠️ **この1枚は、動画へ渡すためではない**（`reference_set` を見よ）。
      **角砂糖の見た目は、§3 と §4 の文が固定する。**

    # ⚠️ **`geography` は「位置関係を示すボード」。**
    #    この作品の位置関係は1つだけである——**角砂糖は紅茶の中に在り、紅茶の外は無い。**
    geography: >-
      **紅茶の外は無い。** 枠に入るのは紅茶の面と、その中の角砂糖1つだけである。
      **角砂糖は動かない**——動くのはその輪郭であって、位置ではない。

    states: {}

# ⚠️ **開示の変化点は1つである。**
#    「**角砂糖の形が、花になる**」——**この1本の出来事そのものが、
#    この作品で観客が知る唯一のことである。**
#    ⚠️ **`negative: changed` は「この変化点で §18 の Negative が動いた」の意味である。**
#       この作品には先行するショットが無いので、`L10` は**註**で
#       「先行する §18 を持つショットが無い」と言う——**違反ではない。**
#       **「変わった」を言える相手が、まだ居ないのである。**
disclosure:
  - shot: grammar-transformation-s01
    角砂糖.形: 花
    negative: changed
