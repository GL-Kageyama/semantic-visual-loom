# 第一ショット / 余白 / still —— 言葉の一拍後に、ひびが一本
#
# ⚠️ **この作品には、この1本しか無い。**
#    前のショットも次のショットも無い——**ゆえに `L10` は註で
#    「先行する §18 を持つショットが無い」と言う。****違反ではない。**
#
# ⚠️ **このショットの出典は、形式カード `meaning-responsive` の4つの欄である。**
#      `BEARER`＝**「大丈夫」という言葉。** 名指され、そして行為しない
#      `ANSWER`＝**ひびが一本、走る。** 答えは世界の側に在る
#      `DELAY` ＝**一拍。** 即答せず、終端でもない
#      `LIMIT` ＝**一本で止まる。** 割れず、落ちず、二本目は来ない
#    **⚠️ 因果は枠の中に無い。** 物も、光の変化も、行為も無い——
#       **意味そのものに、絵が答えている。**
#
# ⚠️ **⚠️ `mode: still` はこの1本のためにある。**
#    7作品のうち、**主題が実際に停まっているのはこれだけである**——
#    「大丈夫」を置いたあと、**誰も動かない。** 動くのは光と、ひびだけである。

shot: grammar-meaning-responsive-s01
spec: specs/video/shot-01-crack.md

# ⚠️ **`key_image` を置かない。** この作品の画像の経路はまだ1度も走っていない。
#    ⚠️ **空の `key_image:` を書けば「画像の仕様が在って空」になる。**
#       **書かないことは、無いことである。**
#    ⚠️ **`L18` はこの不在を1件の註に畳んで報告する**——
#       「記録が無いのであって、食い違っているのではない」。

aim: >-
  **形式カード `meaning-responsive` を1度だけ実際に使う。** 「大丈夫」の一拍後、
  **窓ガラスにひびが一本だけ走り、そこで止まる。誰も動かない。**
  ⚠️ この試しが成り立たなければ、**7枚の文法のうちの1つが、この基盤では立てない**ことになる。
  ⚠️ **確かめているのは文法が効いたかどうかではない。** 文法を仕様に落とせたかどうかである。

unit:
  before: "**昼下がりの台所に、人が1人座っている。** 窓は無傷であり、**言葉が一度だけ置かれる。**"
  after: "**窓ガラスにひびが一本走り、そこで止まっている。** 人は同じ姿勢のままで、**誰も動いていない。**"

# ⚠️ **種別は `余白` である。** 固有基準は「何が*言われないか*」——
#    **この1本は、ひびの意味を一度も名指さない。** 名指すのは観客のほうである。
role: 余白

place: 台所

# ⚠️ **昼下がりである。** 空欄ではない——**窓から入る光が、
#    この1本の唯一の光源である**という宣言である。
#    ⚠️ **時刻語はこれ1つだけである**——`L3` は**ビート本文**の族の数を数えるので、
#       ビートには時刻の語を置かない。
time: 昼下がり

# ⚠️ **`still` である**——`mode` の意味は「**主題が動くか**」である。
#    主題は窓辺の人物であり、**この1本のあいだ一度も動かない。**
#    ⚠️ **`still` は「画面が凍る」ではない**——**光は動き、ひびは走る。**
#       `still` は「主題が停まる」であって、**絵が止まることではない。**
mode: still

duration: 5s

# ⚠️ **運動の層は、主題が停まっていることと、光が動いていることを同時に持つ。**
motion:
  subject: 台所の窓辺に座る1人
  quality: >-
    **主題は停まっている。** 窓辺の人物は、この5秒のあいだ同じ姿勢であり、
    顔を窓の外へ向けたままである。**動くのは光と、ひびだけである。**
    ひびは**一本だけ走り、そこで止まる**——割れず、落ちず、二本目は来ない。
    **誰も動かない。**
  law: >-
    oil-painting の物理。**油は最も遅い動く者である**——流れず、落ち着く。
    **変わるのは形ではなく、面である**——絵の具が深まり、 glaze が沈む。
    **光が動く者である**——盛り上げた絵の具の上を渡っていくので、
    同じ筆が、少しあとには違って読める。**絵の具は留まり、読みが変わる。**
    ⚠️ **様式カードは `SVL_STYLES_DIR=references/styles` を張らねば読まれない。**

beats:
  - range: 0-2s
    density: sparse
    what: >-
      **「大丈夫」が、一度だけ置かれる。** 窓辺の人物は窓の外へ顔を向けており、
      **それだけである。** 物は入ってこない。光は変わらない。
      誰も動かない——**この2秒は、答えの来る前の枠である。**
  - range: 2-3s
    density: held
    what: >-
      **一拍。** 何も起こらない——**この1秒が、遅れそのものである。**
      ⚠️ **即答でもなく、終端でもない。****この間が、このショットの時間である。**
  - range: 3-4s
    density: dense
    what: >-
      **ひびが、一本走る。** 窓ガラスの上を、端から端までではない——
      **走って、そこで止まる。** 誰も動かない。**物は何も触れていない。**
  - range: 4-5s
    density: held
    what: >-
      **止まったままである。** 割れず、落ちず、二本目は来ない。
      **人は同じ姿勢のままである**——**この1秒で、観客はこの部屋の正体を知る。**

# ⚠️ **参照画像は1枚も無い。** ゆえに集合は空である——
#    **空を書くことは、書き忘れではない。**（`ledger.yaml` の `台所.base` を見よ）
reference_set: []
attached: []

forbidden_set:
  - 見える原因
  - カメラの移動
  - 意味に答えるカメラ
  - ラックフォーカス
  - 行為する人物
  - 2本目のひび
  - 割れること
  - 落ちるガラス
  - 音楽の合図
  - 意味を名指す説明

# ⚠️ **開示の変化点は、この1本である。** 台帳の `disclosure` が
#    「**窓ガラスに、ひびが一本走った**」をこのショットに置いている——
#    **世界が言葉に答えたことが、この作品で観客が知る唯一のことである。**
#    ⚠️ **台帳と一致していなければならない**（`L7a` / `L7b`）。
disclosure_state:
  窓ガラス.ひび: 一本
