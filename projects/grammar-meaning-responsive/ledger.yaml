# 制作台帳 — 台所（grammar-meaning-responsive）
#
# ⚠️ **人物が1人だけ居る。** 前の4作品と違い、**この作品には人が要る**——
#    「**誰も動かない**」を言うには、動かない誰かが枠の中に居なければならない。
#    ⚠️ **ただしこの人物は、何も起こさない。** 台帳に人物を立てるのは
#       **継続のためであって、行為のためではない。**
#
# ⚠️ **開示の変化点は1つ在る。** この作品で観客が知るのは、
#    **この部屋では、言葉に世界が答えている**ということである。
#    それはひびが走った瞬間に届く——**そして、一本で止まることで確定する。**

characters:
  窓辺の人物:
    # ⚠️ **この人物は、一度も動かない。** 台帳に在るのは、
    #    **この1本のあいだ同じ人物であり続ける**ことを固定するためである。
    identity: >-
      **台所の窓辺に座っている1人。** 顔は窓の外へ向いており、
      この1本のあいだ**同じ姿勢のままである。**
      ⚠️ **この人物は答えを起こさない**——「大丈夫」を置いたあと、
      **何もせず、何も見ず、動かない。**

locations:
  台所:
    # ⚠️ **この作品の唯一の場所である。** 窓があり、窓辺に人が座っている。
    #    カメラはここを出ない——**しかも動かない。**
    #    `base` は基準画像を指す。
    #    ⚠️ **まだ作られていない。** **「無い」と書くことは、書き忘れではない。**
    base: >-
      **未作成。** この作品は**生成の前に書かれた**——`media/` は空である。
      最初の1枚は、著者が画像の経路を1度走らせたときにここへ入る。
      ⚠️ **この1枚は、動画へ渡すためではない**（`reference_set` を見よ）。
      **台所と窓の見た目は、§2 と §4 の文が固定する。**

    # ⚠️ **`geography` は「位置関係を示すボード」。**
    #    この作品の位置関係は1つだけである——**窓辺に人が座り、窓がその前に在る。**
    #    ⚠️ **この関係は動かない。** **ひびが走っても、人の位置も窓の位置も変わらない。**
    geography: >-
      **窓が奥に、窓辺の人物がその手前に在る。** 人は窓の外へ顔を向けており、
      カメラはその横から入っている。**ひびは窓ガラスの上を走る**——
      **人と窓のあいだの距離は、この1本のあいだ変わらない。**

    states: {}

# ⚠️ **開示の変化点は1つである。**
#    「**窓ガラスに、ひびが一本走った**」——**この作品で観客が知る唯一のことは、
#    世界が言葉に答えたということである。**
#    ⚠️ **`negative: changed` は「この変化点で §18 の Negative が動いた」の意味である。**
#       この作品には先行するショットが無いので、`L10` は**註**で
#       「先行する §18 を持つショットが無い」と言う——**違反ではない。**
disclosure:
  - shot: grammar-meaning-responsive-s01
    窓ガラス.ひび: 一本
    negative: changed
