# 第一ショット / 開示 / motion —— 庭の形が滑り、絵だけが滑らない
#
# ⚠️ **この作品には、この1本しか無い。**
#    前のショットも次のショットも無い——**ゆえに `L10` は註で
#    「先行する §18 を持つショットが無い」と言う。****違反ではない。**
#
# ⚠️ **このショットの出典は、形式カード `remembered-world` の4つの欄である。**
#      `WITNESS` ＝この家で育った者の記憶である——**見ている者は枠の外に居る**
#      `DRIFT`   ＝**窓の外の庭の形。** 滑り、そして戻る
#      `CONSTANT`＝**部屋そのもの。** 壁も、畳も、窓枠の位置も動かない
#      `EXACT`   ＝**冷蔵庫に貼った子供の絵。** 寸分違わない
#    **⚠️ 時は過ぎない。** 過ぎるのは世界のほうである——**ゆえに `time-fold` ではない。**
#
# ⚠️ **この文法は §15 と衝突する。** 免除されるのは**庭の形だけ**である——
#    **部屋と絵は免除されない。****すべてを免除すれば、記憶ではなく雑音になる。**

shot: grammar-remembered-world-s01
spec: specs/video/shot-01-house.md

# ⚠️ **`key_image` を置かない。** この作品の画像の経路はまだ1度も走っていない。
#    ⚠️ **空の `key_image:` を書けば「画像の仕様が在って空」になる。**
#       **書かないことは、無いことである。**
#    ⚠️ **`L18` はこの不在を1件の註に畳んで報告する**——
#       「記録が無いのであって、食い違っているのではない」。

aim: >-
  **形式カード `remembered-world` を1度だけ実際に使う。** 部屋が少しずつ違うのに、
  **冷蔵庫の子供の絵だけが寸分違わない。**
  ⚠️ この試しが成り立たなければ、**7枚の文法のうちの1つが、この基盤では立てない**ことになる。
  ⚠️ **確かめているのは文法が効いたかどうかではない。** 文法を仕様に落とせたかどうかである。

unit:
  before: "**畳の部屋がある。** 窓の外に庭があり、冷蔵庫に子供の絵が貼ってある。**すべてが、記憶のまま在る。**"
  after: "**庭が元の形に戻っている。** 部屋は動かず、**冷蔵庫の絵は一度も動かなかった。**"

# ⚠️ **種別は `開示` である。** 固有基準は「何が明かされ、何が明かされないか」——
#    **この1本が明かすのは、この枠の正体である**（記録ではなく記憶）。
role: 開示

place: 実家

# ⚠️ **時刻ではなく、夢の中である。** 空欄ではない——**この一瞬は、
#    一日のどの時刻でもない**という宣言である（`remembered-world` は
#    「one moment × a single point」を要求する）。
#    ⚠️ **庭が滑っても、時刻は動かない。** 動くのは世界のほうである。
time: 夢の中

# ⚠️ **`motion` である**——`mode` の意味は「**主題が動くか**」である。
#    主題は部屋であり、**時のほうは動かない。** しかし**世界は滑る**——
#    **滑りは運動である。** ゆえに `still` ではない。
mode: motion

duration: 9s

# ⚠️ **運動の層が、この作品の滑りそのものである。**
motion:
  subject: 夢で見た実家の畳の部屋
  quality: >-
    **時は過ぎない。滑るのは、世界のほうである。** 窓の外の庭の形が変わり——
    木の数、塀の高さ、地面の傾きが、少しずつ違う。**滑りは、そして戻る。**
    部屋は動かない。畳も、壁の傷も、窓枠の位置も動かない。
    **冷蔵庫に貼った子供の絵は、一度も動かない。**
  law: >-
    instant-photo の物理。**プリントは面であり、動くのはその化学である**——
    像が浮かび、斑が出て、わずかに落ち着く。**主題の側は、乳剤の下で保たれる。**
    **フラッシュは変わらない**——この1本の光はそれであり、**光は二度ともらない。**
    **枠は保たれた物体である**——白い縁は動かず、**絵はそこから出ない。**
    ⚠️ **様式カードは `SVL_STYLES_DIR=references/styles` を張らねば読まれない。**

beats:
  - range: 0-3s
    density: sparse
    what: >-
      **畳の部屋が、記憶のままに在る。** 窓の外に庭があり、右に冷蔵庫があり、
      その扉に**子供の絵が1枚、貼ってある。** **まだ何も滑っていない。**
  - range: 3-6s
    density: dense
    what: >-
      **滑りはじめる。** 窓の外で、庭の木の数が変わり、塀の高さが変わり、
      地面の傾きが変わる。**それでも庭は庭である。**
      部屋は動かない。**冷蔵庫の絵は、一寸も動かない。**
  - range: 6-9s
    density: held
    what: >-
      **戻ってくる。** 庭は元の形へ戻り、**滑りは何も残さない。**
      部屋はそのままであり、**冷蔵庫の絵は、一度も動かなかった。**
      **この3秒で、観客はこの枠の正体を知る**——**これは記録ではなく、記憶である。**

# ⚠️ **参照画像は1枚も無い。** ゆえに集合は空である——
#    **空を書くことは、書き忘れではない。**（`ledger.yaml` の `実家.base` を見よ）
reference_set: []
attached: []

forbidden_set:
  - 人物
  - 姿
  - 2つ目の部屋
  - 開く扉
  - カメラの移動
  - 安定して正確になる色
  - 読み取れる文字
  - 溶ける顔
  - 戻らない滑り

# ⚠️ **開示の変化点は、この1本である。** 台帳の `disclosure` が
#    「**この部屋は、記録ではなく記憶である**」をこのショットに置いている——
#    **庭が滑った瞬間に、観客はこの枠の正体を知る。**
#    ⚠️ **台帳と一致していなければならない**（`L7a` / `L7b`）。
#    ⚠️ **冷蔵庫の絵はここに入れない。** あれは**開示されるものではなく、
#       ずっと見えている物差しである。**
disclosure_state:
  実家.性質: 記憶
