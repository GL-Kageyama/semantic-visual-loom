# 制作台帳 — 実家（grammar-remembered-world）
#
# ⚠️ **人物は居ない。** 見ている者は枠の外に居る——**記憶を見ている者は、
#    記憶の中には写らない。** ゆえに `characters: {}` である。
#    ⚠️ **この空は空欄ではなく作品の内容である。**
#
# ⚠️ **開示の変化点は1つ在る。** この作品で観客が知るのは、
#    **この部屋が記録ではなく記憶であるということ**である。
#    それは庭の形が滑った瞬間に届く——**滑っていると気づくことが、
#    この作品の開示そのものである。**
#    ⚠️ **冷蔵庫の絵は、開示の対象ではない。** あれは**物差し**である——
#       **観客はあれを最初から最後まで見ており、何も知らないまま使っている。**

# ⚠️ **人物は居ない。** 生成へ渡る参照のうち、人物に由来するものは1つも無い。
characters: {}

locations:
  実家:
    # ⚠️ **この作品の唯一の場所である。** 畳の部屋——窓があり、冷蔵庫があり、
    #    冷蔵庫に子供の絵が貼ってある。**カメラはここを出ない。**
    #    `base` は基準画像を指す。
    #    ⚠️ **まだ作られていない。** **「無い」と書くことは、書き忘れではない。**
    base: >-
      **未作成。** この作品は**生成の前に書かれた**——`media/` は空である。
      最初の1枚は、著者が画像の経路を1度走らせたときにここへ入る。
      ⚠️ **この1枚は、動画へ渡すためではない**（`reference_set` を見よ）。
      **部屋の見た目は、§3 と §4 の文が固定する。**

    # ⚠️ **`geography` は「位置関係を示すボード」。**
    #    この作品の位置関係は1つだけである——**窓が左に、冷蔵庫が右に在る。**
    #    ⚠️ **この関係は滑らない。** 滑るのは**窓の外の庭の形**であって、
    #       **窓の位置ではない。**
    geography: >-
      **窓が左、冷蔵庫が右、畳が下にある。** カメラは部屋の中に据えられ、動かない。
      ⚠️ **滑るのは庭の形だけである**——**窓枠の位置も、冷蔵庫の位置も、
      絵の位置も動かない。****動かないものが、この枠の物差しである。**

    states: {}

# ⚠️ **開示の変化点は1つである。**
#    「**この部屋は、記録ではなく記憶である**」——**庭が滑った瞬間に、
#    観客はこの枠の正体を知る。**
#    ⚠️ **`negative: changed` は「この変化点で §18 の Negative が動いた」の意味である。**
#       この作品には先行するショットが無いので、`L10` は**註**で
#       「先行する §18 を持つショットが無い」と言う——**違反ではない。**
disclosure:
  - shot: grammar-remembered-world-s01
    実家.性質: 記憶
    negative: changed
