# 制作台帳 — 『灯を返す』（drama-pilot）
#
# **連続性（世界の状態）と開示（観客の知識の状態）を同じファイルに持つ。**
# ⚠️ **二つに割ってはならない**——参照集合も禁制集合も、この一点から導かれる（`CLAUDE.md`）。
#
# ⚠️ **この作品は、第三の登録簿 `dramaturgy` を持つ最初の作品である。**
#    **台帳は分割しない**——劇作は同じファイルの中に在る。
#    **`dramaturgy` が「何を決めたか」であり、`bible` は「何が与えられたか」のままである。**

characters:
  あかり:
    # ⚠️ **顔は一度も寄らない。** ゆえに**顔の identity lock は要らない**——
    #    本編の規則「顔は、呼ばれた後にだけ置かれる」——この作品で彼女は一度も呼ばれない。
    # ⚠️ **しかし「要らない」は「参照が無い」ではない。** 固定したいのは顔ではなく、
    #    **後ろ姿・白いシャツ・提灯を提げる手**であり、それは5本を通して同じでなければならない。
    #    だから**身体と衣装の参照**を1枚作る——`specs/image/drama-pilot-akari-character-sheet.md`。
    #    ⚠️ **顔のカウンターは積まない**（参照に顔が在れば、生成器にはそれを写す誘因が生まれる）。
    identity: >-
      **未作成。** この作品は生成の前に書かれた——`media/` はまだ無い。
      **要るのは顔ではなく、後ろ姿・白いシャツ・提灯を提げる手**である
      （正面と横顔を持たないシート。仕様は `specs/image/drama-pilot-akari-character-sheet.md`）。
      ⚠️ **画像が出来るまで、この欄は「未作成」のままである**——無いファイルを指す語は嘘である。
    states: {}

locations:
  峠の道:
    # ⚠️ **この作品の唯一の場所である。** 谷の上のスイッチバックの一本道。
    #    `base` は基準画像を指す。
    #    ⚠️ **まだ作られていない。** **「無い」と書くことは、書き忘れではない。**
    base: >-
      **未作成。** この作品は**生成の前に書かれた**——`media/` は空である。
      最初の1枚は、著者が画像の経路を1度走らせたときにここへ入る。

    # ⚠️ **位置関係は1つだけである。** 道は峠の斜面を横切り、外側にガードレール、
    #    その向こうが谷——**谷は常に下で、空は常に上である。**
    geography: >-
      峠の斜面を横切る一本道。外側（谷側）に低いガードレール。
      道の内側は切り通しの壁。**谷は常に下、空は常に上**——
      カメラが谷へ降りるのは `s03` の1本だけである。
    states: {}

# ⚠️ **開示の変化点は4つである。** この作品が観客に渡す事実は、4つだけである——
#    ① `s02` **ガードレールが割れている**（この場所が、あの場所である）
#    ② `s03` **谷の底には、何も無い**（美しかったのは、遠かったからだ）
#    ③ `s04` **提灯は彼女の手を離れ、ガードレールの上に在る**
#    ④ `s05` **最後の光は、火ではなく、太陽の残光である**
#    ⚠️ **彼が死んだことは、開示されない。** 割れたガードレールが言うだけで、
#       誰もそれを言葉にしない。**言わないことは、決めていないことではない。**
#
#    ⚠️ **`s01` は変化点ではない。** そこは出発点である——ガードレールは
#       「まだ見えていない」。**初出は遷移ではない**（`L9` の註と同じ規律）。
#       ⚠️ **出発点を変化点として宣言しない。** 宣言は「ここで変わった」と言う欄であり、
#          `s01` では何も変わっていない。
#
#    ⚠️ **`negative: changed` は「この変化点で §18 の `Negative Prompt` の節が
#       動いた」の意味である**（`L10` が §18 を実際に読んで検算する）。
#       この作品の5本は**それぞれ違う禁止を持つ**——`s03` は少女を禁じ、
#       `s04` は台詞を禁じ、`s05` は炎を禁じる。**ゆえに4点とも `changed` である。**
#       ⚠️ **この4行が無ければ、`L14` が「宣言を超えた区間」として3箇所を鳴らす**——
#          §18 の禁止が戻らない変化は、台帳に宣言されなければ誰も検収していない。
disclosure:
  - shot: drama-pilot-s02
    ガードレール.様子: 割れている
    negative: changed
  - shot: drama-pilot-s03
    谷.底: 何も無い
    negative: changed
  - shot: drama-pilot-s04
    提灯.状態: 置かれている
    negative: changed
  - shot: drama-pilot-s05
    灯.源: 残光
    negative: changed

# ⚠️ **劇作の登録簿。** 連続性（世界）・開示（知識）と並ぶ第三の登録簿であり、
#    **同じファイルの中に置く。**
#    ⚠️ **ショットは単位のままである。** 幕とシーケンスは**その上に重なる眺め**であって、
#       生成単位ではない。1ショットはやはり1変化である。
dramaturgy:
  version: 1
  premise: "少女が、兄の死んだ峠へ、火の入っていない提灯を持って登る。"
  question: "彼女はその灯を点けられるのか——点けないまま、帰れるのか。"
  argument: >-
    光は死者へ運べない。運べるのは、**光を受けるものを置いていくこと**だけである。
  visual_thesis: >-
    光は常に彼女より大きく、彼女より先に在る。**最後の1本で初めて、光は彼女の置いたものの中に在る。**

  value_poles:
    - ja: 闇
      en: dark
    - ja: 光
      en: light
    - ja: 運ぶ
      en: carry
    - ja: 手放す
      en: release

  acts:
    - id: act-1
      shots: [drama-pilot-s01, drama-pilot-s02, drama-pilot-s03, drama-pilot-s04, drama-pilot-s05]
      turn: "`s04` — 火を点けようとして、点けない。**運ぶことが終わる。**"
      climax: drama-pilot-s03
      value_from: 闇
      value_to: 光
      rhythm: "質感 → 発見 → 上昇 → 転換 → 余韻"

  sequences:
    - id: seq-1
      shots: [drama-pilot-s01, drama-pilot-s02, drama-pilot-s03]
      contrast: "**彼女を見る（s01・s02）→ 彼女を捨てて谷へ降りる（s03）**"
      escalation: "光の意味が「美しい」から「届かない」へ反転する。"
      transition: "`s03` の終わりで、カメラは谷底から彼女の立つ路面へ戻る。"
      payoff: drama-pilot-s05
      # ⚠️ **この作品は、顔を一度も見せない。** だからこそ、世界が答えた瞬間に
      #    観客が欲しがるのは顔である——そして、渡さない。
      withheld:
        - shot: drama-pilot-s02
          wanted: "**世界が答えた瞬間の、彼女の顔。** 谷の光が立ち上がる1本で、観客は「彼女がどう変わったか」を見たくなる。"
          given: "**谷の光だけ。** 彼女は光の手前に立ったままで、顔は枠に入らない——答えは世界の側にだけ起きる。"
      # ⚠️ **8秒が3本続く。** これは意図して平らである——**罠である。**
      #    並びは風景映画の顔をして、観客に「美しい映像が続く」と信じさせる。
      #    それを裏切るのが `seq-2` の9秒と、`s05` の切れ目である。
      tempo: [8, 8, 8]
      flat: true
      note: >-
        **3本とも8秒。** この平らさは失敗ではなく設計である——溜めの3本は
        同じ呼吸で進み、`seq-2` の9秒が最初のズレになる。
    - id: seq-2
      shots: [drama-pilot-s04, drama-pilot-s05]
      contrast: "**火を点けない（s04）→ 火が無くても光る（s05）**"
      escalation: "無いことが、在ることになる。"
      transition: "`s04` でガードレールに置いた提灯が、`s05` の背後に残る。"
      payoff: drama-pilot-s05
      # ⚠️ **この作品の欠けは、ここである。** 観客はマッチが紙に触れる画を待っている。
      #    **火は、一度も映らない。**
      withheld:
        - shot: drama-pilot-s04
          wanted: "**火が入る瞬間。** マッチの先が紙に触れ、提灯が点く画——観客は「ここで点く」と信じて待っている。"
          given: "**点かない。** 手は止まり、提灯はガードレールに置かれる。火はこの作品に一度も入らない。"
      # ⚠️ **切れ目は、ショットではなく並びが持つ。** `s05` の5秒で硬く切る。
      cuts: [drama-pilot-s05]
      tempo: [9, 9]

  motifs:
    - id: 提灯
      first: drama-pilot-s01
      recurrences: [drama-pilot-s04]
      payoff: drama-pilot-s05

  set_pieces:
    - shot: drama-pilot-s02
      format: recognizing-world
      why: >-
        谷の光が彼女の到着に答える——**世界が彼女を認める瞬間**であり、
        `闇 → 光` の転換を一手に負う。接地ショット（`s01`）の直後に在る。
    - shot: drama-pilot-s03
      format: impossible-camera
      why: >-
        カメラが彼女を捨てて谷へ降りる。**`光 → 闇` の反転は、人が行けない所へ
        カメラが行くことでしか起きない**——この文法でなければ、この反転は台詞になる。
        直後に接地ショット（`s04`）が在る。

  sound_arc:
    silence: [drama-pilot-s05]
    score_enters: drama-pilot-s01
    diegetic: [drama-pilot-s01, drama-pilot-s04, drama-pilot-s05]
    note: >-
      **音楽は生成には入れない。** 各ショットの §18 `Negative Prompt` は
      `no background music` を保つ——床は動かさない。音楽は**連結ののち**に一度だけ敷く:
      `soft-weightless-hours`（61.5bpm, D minor）。s01 から s04 まで、作中の音の下に。
      **s05 で止む。** 風、紙、マッチ、靴——作中の音が場面を負い、
      **最後の1本で、音が全部止む。**

  ending_image: >-
    峠を下りていく彼女の背後で、ガードレールの上に置かれた提灯が、
    **最後の残光を受けて白く光っている。** 火は入っていない。
