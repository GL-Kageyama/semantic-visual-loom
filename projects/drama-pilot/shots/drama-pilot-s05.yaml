# 第五ショット / 離脱 / motion —— 下りていく彼女と、光る提灯
#
# ⚠️ **このショットの変化は「余韻」であり、値は `闇 → 光` である。**
#    火は入っていない。**それでも提灯は光る**——太陽の残光を受けて。
#    **無いことが、在ることになる。** これがこの作品の主張である。
#
# ⚠️ **接地ショットである。** デバイスは使わない。**最後の一枚は、一番静かに撮る。**
#
# ⚠️ **この1本は、内側に切れ目を持つ**（`cut: internal`）。5秒、同じ枠のまま硬く切る。
#    切れ目の向こうに**彼女は居ない**——観客は、彼女が去るのを見せてもらえない。
#    切れ目はショットの判断ではない（`ledger.dramaturgy.sequences[].cuts` が持つ）。
#    ⚠️ **`s02` の `闇 → 光` と語が同じである。** 意図した韻である——
#       **同じ転換が、二度目は違う意味で起きる**（世界の光 → 彼女の置いたものの光）。

shot: drama-pilot-s05
spec: specs/video/drama-pilot-s05.md

aim: >-
  **彼女を、後ろから見送る。** カメラは置かれたまま。彼女は下りていく。
  背後のガードレールの上で、**提灯が光り始める**——**火ではなく、残光で。**

unit:
  before: "提灯はガードレールの上に置かれ、火は入っていない。彼女はまだその前に立っている。"
  after: "**彼女は道を下っていく。** 置かれた提灯が、最後の残光を受けて白く光っている。"

role: 離脱
place: 峠の道
time: 夕暮れ
mode: motion
duration: 9s
# ⚠️ **この枠に映る人数は、同時に一人までである**——5秒で切れたあとは**誰も居ない**。
#    数は「同時に映る最大」なので 1 である（実測 2026-10-29: `s02`・`s04` で**二人目が現れた**）。
population: 1
cut: internal

motion:
  subject: 少女の後ろ姿と、置かれた提灯
  quality: >-
    **彼女が遠ざかる。** 提灯は動かない。**光は、彼女と反対の方向へ動く**——
    太陽が最後に落ち、その光が提灯の紙を通過する。**一瞬だけ、提灯が光る。**
  law: >-
    Luminous realist anime の物理。**最後の光は低い。** 太陽が地平線に触れる数秒、
    光は水平に走り、**置かれたものだけを照らす**——歩いている彼女には届かない。

beats:
  - range: 0-5s
    density: held
    what: >-
      彼女が背を向ける。**歩き出す。** 提灯は枠の手前に残る。
      彼女が遠ざかるあいだに、**太陽が地平線に触れ、光が水平になり、
      提灯の紙が内側から白くなる**——**火は入っていない。**
    intensity: 3
    audience: "**光った。** ……火は、入っていないのに。"
  - range: 5-9s
    density: sparse
    what: >-
      **切れ目。** 枠はそのままで、**彼女はもう居ない。** 道は空いている。
      紙はまだ白い。やがて光が消え、**提灯はただの紙の塊に戻る。**
      道だけが残る。**音が止む。**
    intensity: 2
    audience: "**見送らせてもらえなかった。** 置いていったものだけが、まだ光を受ける。"

reference_set: []
attached: []

forbidden_set:
  - 少女の顔
  - 火の入った提灯
  - 振り返る動作
  - 読み取れる文字
  - 台詞
  - カメラの移動（この1本は置かれたまま）

disclosure_state:
  ガードレール.様子: 割れている
  提灯.状態: 置かれている
  谷.底: 何も無い
  灯.源: 残光

dramatic:
  function: 余韻
  value:
    from: 闇
    to: 光
    stake: "手放したものが、まだ光を受けること"
  audience:
    feel: "**静かに、報われる。** 誰も救われていないのに。"
    expect: "彼女は振り返る。"
    know: "光は、火ではなく、残光である。**それでも光っている。**"
  button: "**下っていく後ろ姿の向こうで、火の入っていない提灯が白く光っている一枚。**"
  # ⚠️ **離脱の演技は「歩くこと」ではない。** 願望は帰ること、障害は
  #    **置いていったものが光を返してくること**——`L47` が同じ語を鳴らす。
  performance:
    objective: "置いて、帰ること"
    obstacle: "置いたものが、背中で光り始める"
    tactic: "振り返らずに、歩き続ける"
    subtext: "見なければ、まだ手元にある"
    intensity: 4
