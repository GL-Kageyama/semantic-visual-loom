# 第一ショット / 情景 / motion —— 峠の道と、まだ点かない提灯
#
# ⚠️ **このショットの変化は「世界の肌」である。** 物語はまだ動かない——
#    動くのは光と埃だけである。**`unit` の変化を物語の変化と混同しない。**
#
# ⚠️ **`dramatic.function` は `質感` である。** 非物語の関数であり、
#    **値の転換を持たなくてよい**（`L40` の対象外）。
#    それでも `button` は要る——**どのショットも一枚で終わるからである。**

shot: drama-pilot-s01
spec: specs/video/drama-pilot-s01.md

aim: >-
  **光を、この作品の主語として置く。** 少女はまだ小さい。彼女が提げている提灯は、
  火が入っていない。**観客はまだ、ここがどこなのかも、誰が死んだのかも知らない。**

unit:
  before: "峠の道は、光と埃だけの風景である。少女は遠く、小さく、まだ歩いている。"
  after: "同じ風景の中で、少女が一歩ぶん近づいている。**光の角度だけが、はっきりと変わっている。**"

role: 情景
place: 峠の道
time: 夕暮れ
mode: motion
duration: 8s
# ⚠️ **この枠に映る人数は、同時に一人までである**（実測 2026-10-29: `s02`・`s04` で**二人目が現れた**——`L51` が数を見る）。
population: 1

motion:
  subject: 峠の道と、その上を歩いてくる少女
  quality: >-
    **空気が動く。** 埃が光の柱の中を落ち、雲がゆっくり形を変え、路面の照り返しが
    少しずつ西へ伸びる。**少女は歩くが、彼女より先に光が動く。**
  law: >-
    Luminous realist anime の物理。**光源は枠の中か、枠のすぐ外**。
    広く空が重い構図、低い地平線。人物は光に従属する——
    **彼女の輪郭は、空の明るさに負ける。**

# ⚠️ **強度は曲線である。** この1本は最も低い——`L44` が曲線を見る。
beats:
  - range: 0-2s
    density: sparse
    what: "空。層を成す雲と、空気を通る光の柱。**誰も居ない。**"
    intensity: 1
    audience: "きれいだ、と思う。まだ何も始まっていない。"
  - range: 2-5s
    density: sparse
    what: >-
      路面。埃が光の中を落ちていく。**乾いたアスファルトが、空を丸ごと映している**——
      道そのものが、二つ目の空である。
    intensity: 2
    audience: "この道が、どこかへ続いていることだけが分かる。"
  - range: 5-8s
    density: held
    what: >-
      遠くから、少女が歩いてくる。**小さい。** 白いシャツ。手に提灯——**火は入っていない。**
      彼女はこちらへ来るが、まだ顔は分からない。**光は彼女より明るい。**
    intensity: 3
    audience: "誰かが来る。**手に持っているものは、点いていない。**"

# ⚠️ **参照画像は1枚も無い。** 空を書くことは、書き忘れではない。
reference_set: []
attached: []

forbidden_set:
  - 少女の顔の寄り
  - 点いた提灯
  - 読み取れる文字
  - 人工の光源
  - ガードレールの破損（まだ見せない）
  - カメラの移動（この1本は置かれたまま）

disclosure_state:
  ガードレール.様子: まだ見えていない
  提灯.状態: 提げている

# ⚠️ **劇的記録。** `function` は非物語の `質感` であり、`value` を持たない。
dramatic:
  function: 質感
  audience:
    feel: "胸が澄む。まだ何も起きていないのに、何かが終わろうとしている気配。"
    expect: "この道を、誰かが歩いてくる。"
    know: "ここが峠であること。夕暮れであること。"
  button: "**点いていない提灯**が、光の中に提げられている一枚。"
