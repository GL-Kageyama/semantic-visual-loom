# 第四ショット / 所作 / motion —— マッチは点くが、提灯は点けない
#
# ⚠️ **このショットの変化は「転換」である。** 彼女は火を点けようとして、
#    **点けない。** 提灯をガードレールの上に置いて、手を離す。
#    **`運ぶ → 手放す`**——この作品の値の転換は、この1本で起きる。
#
# ⚠️ **ここは接地ショットである。** `s03` のデバイスの直後に在り、
#    **同じ世界を、普通のカメラで見せる。** 転換は、一番地味な撮り方で撮る——
#    **派手に撮れば、手放したことではなく、手放し方が主題になる。**

shot: drama-pilot-s04
spec: specs/video/drama-pilot-s04.md

aim: >-
  **点けない、という決断を撮る。** 彼女はマッチを擦り、火が点き、
  それから——**提灯に近づけない。** 火を消し、提灯を置き、手を離す。

unit:
  before: "彼女は提灯を片手に持ち、もう片方の手にマッチを持っている。"
  after: "**提灯はガードレールの上に在り、火は入っていない。** 彼女の両手は空いている。"

role: 所作
place: 峠の道
time: 夕暮れ
mode: motion
duration: 9s
# ⚠️ **この枠に映る人数は、同時に一人までである**（実測 2026-10-29: `s02`・`s04` で**二人目が現れた**——`L51` が数を見る）。
population: 1
# ⚠️ **この枠は、身体の一部しか写さない**——だから人数では足りない。
#    実測（2026-10-29）: 同じ仕様から2回生成し、**1本に3本目の手が現れた**。
#    人数は正しかった（人は一人である）——**失敗は肢で起きた。**
#    ⚠️ **`L52` が、この数から導かれた句を §18 の両側に読む。**
body_parts:
  hand: 2

motion:
  subject: 少女の両手と、提灯
  quality: >-
    **手だけが動く。** マッチを擦る、火を庇う、提灯の口元まで持っていく——
    そこで止まる。**火を吹き消し、提灯を置く。** 手が離れる。
    **身体はほとんど動かない。** 動くのは手と、手が決めるまで。
  law: >-
    Luminous realist anime の物理。**マッチの火は小さい。** 谷の光に比べて、
    それはほんの一点である——**この1本は、その小ささを隠さない。**

beats:
  - range: 0-3s
    density: held
    what: >-
      手元。**マッチを擦る。** 火が点く。**小さい。** 手が、火を風から庇う。
    intensity: 7
    audience: "点けるのだ。**ようやく。**"
  - range: 3-6s
    density: dense
    what: >-
      火が提灯の口元まで来る。**来て——止まる。** 火はまだ点いている。
      提灯の紙が、火の色を映している。**彼女は、近づけない。**
    intensity: 6
    audience: "**なぜ止まる。** 点ければいい。点けろ。"
  - range: 6-9s
    density: sparse
    what: >-
      **火を消す。** 提灯を、ガードレールの上に置く。**手を離す。**
      両手が空になる。**彼女は、まだそこに立っている。**
    intensity: 5
    audience: "**置いていくのか。** ……置いていくのだ。"

reference_set: []
attached: []

forbidden_set:
  - 少女の顔の寄り
  - もう一人の人間
  - 涙
  - 点いた提灯
  - 台詞
  - 読み取れる文字
  - カメラの移動（この1本は置かれたまま）

disclosure_state:
  ガードレール.様子: 割れている
  提灯.状態: 置かれている
  谷.底: 何も無い

dramatic:
  function: 転換
  value:
    from: 運ぶ
    to: 手放す
    stake: "彼に何かを届けられるという信念"
  audience:
    feel: "**止めたい。** 点けさせたい。**そして、点けないほうが正しいと分かっている。**"
    expect: "火が提灯に入る。"
    know: "彼女は、届かないことを知っている。**知ったうえで、置いていく。**"
  button: "**ガードレールの上の提灯と、空になった両手。**"
  performance:
    objective: "この場所に、火を一つ灯すこと"
    obstacle: "この場所には、火を灯す相手がもう居ない"
    tactic: "マッチを擦り、火を庇い、提灯の口元まで運ぶ——そこで止まる"
    subtext: "点けたら、帰らなければならない"
    intensity: 8
