# 第三ショット / 運動 / motion —— 谷へ降りる（彼女を捨てて）
#
# ⚠️ **このショットの変化は「反転」である。** `s02` で美しかった光は、
#    降りてみれば**ただの空の照り返し**であり、谷の底は暗い。
#    **光の意味が、「美しい」から「届かない」へ変わる。**
#
# ⚠️ **文法は `impossible-camera`。** 人が行けない所へカメラが行く——
#    この反転は、台詞でも演技でもなく、**カメラが行くことでしか起きない。**
#    ⚠️ **直後に接地ショット（`s04`）が在る。**

shot: drama-pilot-s03
spec: specs/video/drama-pilot-s03.md

aim: >-
  **光を、彼女から引き離す。** 観客はカメラと一緒に谷へ降り、
  **「ここに何かが残っている」という期待を、降りきる前に捨てる。**

unit:
  before: "割れ目の向こうの谷が、光で満ちている。彼女の後ろ姿が、枠の縁に残っている。"
  after: "**谷の底は暗い。** 光は、濡れた岩の上に映った空でしかない。彼女は枠に居ない。"

role: 運動
place: 峠の道
time: 夕暮れ
mode: motion
duration: 8s
# ⚠️ **この枠に映る人数は、同時に一人までである**（実測 2026-10-29: `s02`・`s04` で**二人目が現れた**——`L51` が数を見る）。
population: 1

motion:
  subject: カメラと、谷の斜面
  quality: >-
    **カメラが降りる。** 割れ目を越え、斜面を滑り、岩と木の間を抜ける——
    **落ちるのではなく、渡っていく。** 降りるにつれ、光は光源から遠ざかり、
    谷の底では、空の照り返しだけが残る。
  law: >-
    Luminous realist anime の物理。**光は距離に対して正直である**——
    太陽に近い所は明るく、谷の底は暗い。**この1本は、その正直さを反転に使う。**

beats:
  - range: 0-2s
    density: held
    what: >-
      割れ目。**その向こうへ、カメラが越える。** 彼女はもう枠の縁に居ない。
    intensity: 4
    audience: "行くのか、そこへ。"
  - range: 2-6s
    density: dense
    what: >-
      斜面を渡っていく。光の柱を、横から抜ける。**粒子が、上へ流れていく**——
      降りているのはカメラであって、空気ではない。岩、木、折れた枝。
      **明るさが、一段ずつ落ちる。**
    intensity: 8
    audience: "何かが、下に在るはずだ。**在ってくれ。**"
  - range: 6-8s
    density: held
    what: >-
      谷の底。**暗い。** 濡れた岩がある。水がある。**光は、水面に映った空だけである。**
      何も残っていない——**残っているのは、空が映っていることだけ。**
    intensity: 7
    audience: "**何も無い。** 美しかったのは、遠かったからだ。"

reference_set: []
attached: []

forbidden_set:
  - 少女（この1本には居ない）
  - 遺品・遺体・車
  - 谷底の人工物
  - 点いた提灯
  - 読み取れる文字
  - ファンタジーの光（光は物理の範囲で答える）

disclosure_state:
  ガードレール.様子: 割れている
  提灯.状態: 提げている
  谷.底: 何も無い

dramatic:
  function: 上昇
  value:
    from: 光
    to: 闇
    stake: "その場所に、まだ何かが残っているという期待"
  audience:
    feel: "**落ちていく。** 期待が、明るさと一緒に削られていく。"
    expect: "谷の底に、何かがある。**あるはずだ。**"
    know: "光は遠かったから美しかった。**谷の底には、何も無い。**"
  button: "**濡れた岩に映った空**——光源は、はるか上にある。"
