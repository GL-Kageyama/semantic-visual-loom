# 第二ショット / 反応 / motion —— 曲がり角と、割れたガードレール
#
# ⚠️ **このショットの変化は「発見」である。** 観客が知るのは1つだけ——
#    **ガードレールが割れている。** 誰もそれについて何も言わない。
#
# ⚠️ **文法は `recognizing-world`。** 世界が彼女の到着に答える——
#    太陽が落ち、谷の光が立ち上がる。**`闇 → 光` の転換を、この1本が一手に負う。**
#    ⚠️ **接地ショット（`s01`）の直後に在る。** デバイスは接地を要る。

shot: drama-pilot-s02
spec: specs/video/drama-pilot-s02.md

aim: >-
  **観客に、割れたガードレールを見せる。** そして同時に——
  **その場所が、美しいことを見せる。** この二つが同じ1本に在ることが、
  この作品の主張である（世界は悼まない）。

unit:
  before: "少女は曲がり角の手前に立っており、枠には光に満ちた空と道だけがある。"
  after: "**ガードレールの割れ目が枠に入り、その向こうの谷が、光で満ちている。**"

role: 反応
place: 峠の道
time: 夕暮れ
mode: motion
duration: 8s
# ⚠️ **この枠に映る人数は、同時に一人までである**（実測 2026-10-29: `s02`・`s04` で**二人目が現れた**——`L51` が数を見る）。
population: 1

motion:
  subject: 少女と、曲がり角の向こうの谷
  quality: >-
    **彼女は止まる。** 止まった瞬間に、太陽が1段落ち、谷の底の光が立ち上がる——
    **彼女が動かないのに、世界のほうが動く。**
  law: >-
    Luminous realist anime の物理。**光の変化はショットの中で起きる**——
    太陽が落ち、光の柱の角度が変わり、粒子が浮き直す。

beats:
  - range: 0-3s
    density: sparse
    what: >-
      彼女が曲がり角を曲がる。**後ろ姿。** 提灯は右手で、まだ点いていない。
      **ガードレールは枠の外**——まだ見えない。
    intensity: 2
    audience: "何かが、角の向こうに在る。"
  - range: 3-6s
    density: dense
    what: >-
      **彼女が止まる。** その一拍遅れて、太陽が落ちる——**谷の底が、光で立ち上がる。**
      光は彼女の輪郭を越えて、枠の外へ溢れる。**ガードレールの割れ目が、そこに在る。**
    intensity: 5
    audience: "**ここだ。** そして——**ここは、きれいだ。**"
  - range: 6-8s
    density: held
    what: >-
      **彼女は動かない。** 光だけがまだ動いている。提灯を持った手が、
      わずかに下がる。**火は入らない。**
    intensity: 4
    audience: "彼女は、ここで何もできない。**世界は、何も悪びれていない。**"

reference_set: []
attached: []

forbidden_set:
  - 少女の顔の寄り
  - もう一人の人間
  - 泣く演技
  - 点いた提灯
  - 読み取れる文字
  - 人工の光源
  - カメラの移動（この1本は置かれたまま）

disclosure_state:
  ガードレール.様子: 割れている
  提灯.状態: 提げている

dramatic:
  function: 発見
  value:
    from: 闇
    to: 光
    stake: "彼が死んだ場所が、どんな場所だったのか"
  audience:
    feel: "息を呑む。**美しさに、罪悪感が混ざる。**"
    expect: "彼女は、ここで立ち尽くすのだろう。"
    know: "**ガードレールが割れている。** この場所が、あの場所である。"
  button: "**割れたガードレールの向こうに、光で満ちた谷**——彼女は動かない。"
  # ⚠️ **願望と障害は、同じ語では書けない。** 彼女は「違う場所だ」と言い切りたく、
  #    障害は「ここがその場所であること」——`L47` が同じ語を鳴らす。
  performance:
    objective: "ここが違う場所だと、言い切ること"
    obstacle: "ガードレールの割れ目が、ここがその場所だと言っている"
    tactic: "目を逸らさずに、谷を見る"
    subtext: "来なければよかった——**来なければ、知らずに済んだ**"
    intensity: 6
