# 制作台帳 — 一筆（ippitsu）
#
# ⚠️ **この台帳は、このリポジトリで最も小さい。**
#    人物が1人も居ない（`characters: {}`）。開示の変化点が1つも無い（`disclosure: []`）。
#    **これは空欄ではなく、この作品の内容である**——§2 の規則
#    「**この作品に、人物は居ない。**」が、台帳の側で同じことを言っている。
#
# ⚠️ **空であることを、書き忘れと読まないこと。**
#    `check.py` は `characters` と `disclosure` の**欄そのもの**を要求する（形の層）。
#    **欄は在り、中身が無い**——この2つは別である（`README.md`「空ファイルは内容でない」）。

# ⚠️ **人物は居ない。** 生成へ渡る参照のうち、人物に由来するものは1つも無い。
characters: {}

locations:
  紙:
    # ⚠️ **この作品の唯一の場所であり、唯一の「世界」である。**
    #    `base` は基準画像を指す——**この作品の最初の1枚は、2026-09-22 に作られた。**
    #    ⚠️ **「無いことを書く」から「在ることを書く」へ移った。** 台帳が自分でそう書いていた
    #       （「生成のあと、最初の1枚がここへ入る」）。
    base: >-
      **在る。** `media/01_ChatGPT Image 2026年9月22日 00_10_37.png`
      （テイク `takes/ippitsu-s01-image-1.yaml`）——`scene-board` × `sumi-e` で引いた1枚である。
      ⚠️ **測ったこと**: 1672×941、**単色**（彩度>40 の画素は 11）、**一筆**、**筆は枠に無い**。
      **墨は左半分（x 0.000-0.486）に収まり、右半分の 99.7% が明るい紙である。**
      ⚠️ **名はまだ無い。** `hitosara` の `base` は ID（`hitosara-mill-board` のような）を書くが、
      **この作品はボードの目録を持たない**——**名を与えるかどうかは著者が決める。**
      ⚠️ **著者は、この1枚そのものの採否を、まだ言っていない。** ゆえにこれは
      **「最初に在る1枚」であって、「採用された1枚」ではない。**
      ⚠️ **下の裁定は、この1枚の採否ではない。****この1枚を動画へ渡すかどうかである。**
      **2つを混ぜないこと。**
      ⚠️ **この1枚は、動画へは渡さない。**（**著者の裁定、2026-09-22**）
      **著者の言葉**: 「**参照イメージがない方が自然だったよ。参照があると、筆跡が画面上に、
      すでに乗ってしまう**」——**1本目はこの1枚を参照として渡して生成され、2本目は渡さずに
      生成され、著者は2本目を採った**（`takes/ippitsu-s01-video-1.yaml` ／ `…-video-2.yaml`）。
      ⚠️ **この行は、前は逆を書いていた**——「**参照画像は、この作品では動画の側の添付でもある**——
      §6 の `REF_LOCATION` がそれを名指す」。**著者がそれを否定した。**
      ⚠️ **ゆえにこの1枚は、動画の側の基準画像ではない。**
      **`unit.after` の姿を1枚で持つ、画像の側の基準である。**
      ⚠️ **動画へ渡ったものは、ショットの欄では表せない**（ショット記録の `attached` を見よ）——
      **テイクが2本あり、渡したものが違うからである。**

    # ⚠️ **`geography` は「位置関係を示すボード」。**
    #    この作品の位置関係は1つだけである——**墨は紙の中に在り、紙の外には何も無い。**
    geography: >-
      **紙の外は無い。** 枠に入るのは紙と、その上の墨と、一度だけ墨を置く筆だけである。
      筆は紙の外から入り、紙の外へ出る。**出たあと、枠には紙と墨だけが残る。**

    states: {}

# ⚠️ **開示の変化点は1つも無い。**
#    開示とは「いつ、観客が何を知るか」である。**この作品には観客が知るべきことが無い**
#    ——紙が墨を持つこと以外に、何も起こらないからである。
#    ⚠️ **`L7` は台帳の意図とショットの実際を突き合わせる。** どちらも空である。
disclosure: []
