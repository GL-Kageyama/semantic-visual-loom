# 制作台帳 — 一筆（ippitsu）
#
# ⚠️ **この台帳は、このリポジトリで最も小さい。**
#    人物が1人も居ない（`characters: {}`）。開示の変化点が1つも無い（`disclosure: []`）。
#    **これは空欄ではなく、この作品の内容である**——§2 の規則
#    「**この作品に、人物は居ない。**」が、台帳の側で同じことを言っている。
#
# ⚠️ **空であることを、書き忘れと読まないこと。**
#    `check.py` は `characters` と `disclosure` の**欄そのもの**を要求する（形の層）。
#    **欄は在り、中身が無い**——この2つは別である（`README.md`「空ファイルは内容でない」）。

# ⚠️ **人物は居ない。** 生成へ渡る参照のうち、人物に由来するものは1つも無い。
characters: {}

locations:
  紙:
    # ⚠️ **この作品の唯一の場所であり、唯一の「世界」である。**
    #    `base` は基準画像を指す——**この作品では、まだ1枚も作っていない。**
    #    **無いことを、ここに書く。** 生成のあと、最初の1枚がここへ入る。
    base: >-
      **まだ無い。** 置かれるべきは、この作品のために引く1枚である——
      `scene-board` × `sumi-e`（`distill-essence-engine` の2軸）。
      ⚠️ **この1枚が、この作品で最初に作られる画像である**（`key_image` の仕様は在る）。
      ⚠️ **参照画像は、この作品では動画の側の添付でもある**——§6 の `REF_LOCATION` がそれを名指す。

    # ⚠️ **`geography` は「位置関係を示すボード」。**
    #    この作品の位置関係は1つだけである——**墨は紙の中に在り、紙の外には何も無い。**
    geography: >-
      **紙の外は無い。** 枠に入るのは紙と、その上の墨と、一度だけ墨を置く筆だけである。
      筆は紙の外から入り、紙の外へ出る。**出たあと、枠には紙と墨だけが残る。**

    states: {}

# ⚠️ **開示の変化点は1つも無い。**
#    開示とは「いつ、観客が何を知るか」である。**この作品には観客が知るべきことが無い**
#    ——紙が墨を持つこと以外に、何も起こらないからである。
#    ⚠️ **`L7` は台帳の意図とショットの実際を突き合わせる。** どちらも空である。
disclosure: []
