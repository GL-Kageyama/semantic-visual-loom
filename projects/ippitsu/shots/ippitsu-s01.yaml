# 第一ショット / 様式美 / motion —— 白い紙が、墨を持つ
#
# ⚠️ **この作品には、この1本しか無い。**
#    物語ではないので、前のショットも次のショットも無い。
#    **それでもショットとして記録する**——このリポジトリの単位はショットであり、
#    試すのは「1本の動画として様式が立つか」である。
#
# ⚠️ **出典が無い唯一のショットである。**
#    他のショットは台帳の先の原作から拍を取る。**このショットは、様式カードの
#    `## Motion character` から取る**——とくに次の2項目である。
#      ① **The stroke is the event, and it happens once.**（一筆は出来事であり、1回しか起きない）
#      ② **The ink keeps moving after the brush has stopped.**（筆が止まってからも墨は動く）
#    **この2つが、このショットの全体である。**
#
# ⚠️ **このショットの変化は1つだけである。**「白い紙が、墨を持つ。」
#    **それ以外のことは何も起こらない**——人物も、物語も、開示も無い。
#    ⚠️ **`unit.before`／`unit.after` がこの作品で最も鋭いのは、そのためである。**

shot: ippitsu-s01
spec: specs/video/shot-01-stroke.md

# ⚠️ **この1枚は、このショットの動画へは渡さない。**（**著者の裁定、2026-09-22**）
#    ⚠️ **この行は、前は逆を書いていた**——「**この1枚は、このショットの動画へ添付（参照画像）
#       として渡る。**」**著者がそれを否定した。**
#    **著者の言葉**: 「**参照イメージがない方が自然だったよ。参照があると、筆跡が画面上に、
#       すでに乗ってしまう**」——
#    ⚠️ **この1枚は `after` の側である**（墨は既に紙の上にあり、広がっている）。
#       **このショットの主題は「墨が紙へ移る」という出来事そのもの**である——
#       ゆえに**出来事の後の姿を参照として渡すことは、出来事と食い違う。**
#    ⚠️ **この1枚は、それでもこのショットの基準画像である**（`unit.after` の姿を1枚で持つ）。
#       **動画へ渡さないことは、要らないことではない。**
#    ⚠️ **同じ文が2箇所に在った**——画像仕様の「渡す先」の節にも在り、**両方を直した。**
#       ⚠️ **画像仕様は版を持たない**——だから「版を上げた」とは書かない（動画の仕様を見よ）。
key_image: specs/image/shot-01-stroke.md

# ⚠️ **この欄は、このリポジトリで最初に書かれた「狙い」である**（決定 2026-09-21、著者。D-13）。
#    **自由文である。目録にしない**——**15の文法は、このリポジトリの中に目録を持たない。**
#    ⚠️ **この欄を読む検査は、まだ1つも無い。** 書いても何も鳴らない。
#       **穴のまま記録する**（`engine/ledger/README.md`「What Is Still Missing」）。
#    ⚠️ **狙いはショットの欄であって、テイクの欄ではない。** 同じショットを2度生成しても、狙いは1つである。
aim: >-
  **Style 4.3「動く絵画」を試す。** 一筆が置かれたあと、墨が紙の中を動き続ける——
  **手が止まってからも動くものがある**、という1点である。
  ⚠️ この試しが成り立たなければ、**15の文法のうちの1つが、この基盤では立てない**ことになる。

unit:
  before: "**紙は白い。墨はまだ紙の外にあり、紙の中に無い。**"
  after: "**墨は紙の中にあり、広がり続けている。狭まらない。戻らない。**"

# ⚠️ **種別は `様式美`（tableau）である。** 固有基準は「構図・余白・静止の強度」——
#    **この1本が裁かれるのは、その3つである。**
#    ⚠️ **`rolemap` の既定モードは `still` だが、このショットは `motion` である。**
#       理由は `mode` の註に書く。**食い違いを黙って置かない。**
role: 様式美

place: 紙

# ⚠️ **時刻を持たない。** 空欄ではない——**この作品に時間が無い**という宣言である
#    （`bible.yaml`「時計が無いのではない——時間が無い」）。
time: 時刻を持たない

# ⚠️ **`motion` である**——`mode` の意味は「**主題が動くか**」である。
#    主題は墨であり、**墨は動く。** ゆえに `still` ではない。
#    ⚠️ **`rolemap` の `様式美` の既定モードは `still` である。**
#       それでも `motion` を採る——**この1本は「静止の強度」ではなく
#       「止まった手のあとも動く」を試すからである。**
#       **既定と食い違うことは、判断の記録がここに在ることで足りる。**
mode: motion

duration: 6s

# ⚠️ **運動の層はこの作品の主題そのものである。**
motion:
  subject: 紙の上の墨
  quality: >-
    **一筆が置かれ、そのあと墨が紙の中へ広がる。** 広がるのは一度きりの出来事の続きであり、
    **新しい動きではない**——手はもう無い。**墨は広がる方向にしか動かない。**
  law: >-
    sumi-e の物理。**一筆は1回で、直されない。筆が止まってからも墨は動く。**
    ⚠️ **この作品だけ、様式カードがこのリポジトリの中に在る**
    （`references/styles/sumi-e.md`）——⚠️ 読ませるには `SVL_STYLES_DIR` を張る。

beats:
  - range: 0-2s
    density: sparse
    what: >-
      **白い紙。** 枠に入っているのは紙だけである。**筆が紙の外から入り、まだ触れていない。**
      ⚠️ 余白は、この時点で既に構図である。
  - range: 2-3s
    density: dense
    what: >-
      **一筆が置かれる。** 1回だけである——**直さない。なぞらない。二度目は無い。**
      墨は筆の先から紙へ移り、**筆は紙を離れる。**
  - range: 3-6s
    density: held
    what: >-
      **筆はもう枠に無い。** 墨が紙の繊維へ入り、**広がり続ける。**
      ⚠️ **狭まらない。戻らない。白へ乾かない。** この3秒が、このショットの主題である。

# ⚠️ **参照も禁止も、台帳の `紙` からしか引けない。** 人物が1人も居ないからである。
#
# ⚠️ **`紙.base` は、この欄に残る。**（**著者の裁定、2026-09-22**）
#    **この欄は「当時の意図」である。** **裁定は「渡さない」だったが、**
#    **意図そのものは書き換えない**——**書き換えれば、意図が裁定に最初から従っていたことになる。**
#    ⚠️ **それは `aim` と同じ作法である**（`schemas/shot-record.schema.json`）——
#      「**遡って埋めもしない**——後から書いた狙いは、狙いではなく説明である」。
#    ⇒ **ゆえにこの欄と裁定は、食い違ったまま並ぶ。****食い違いは、消すものではなく記録するものである。**
#    ⚠️ **この食い違いは、`L6` が鳴ることの理由でもある**（下の註を見よ）。
reference_set:
  - 紙.base
  - 紙.geography

forbidden_set:
  - 二度目の一筆
  - なぞり直し
  - 色
  - 落款・印・署名
  - 読み取れる文字
  - 紙の外の事物
  - 人物
  - 埃・靄・光の筋

# ⚠️ **`attached` を書かない。**（意図してである）
#    この作品は、**このリポジトリで最初に「生成の前に記録された」作品である。**
#    ⚠️ **この註は2度書き換わった。** 経緯を残す——**理由が、理由を変えたのである。**
#       **① 生成の前**: 添付する画像が存在しないから、記録も存在しない。
#       **② 生成のあと**: **画像は在り、動画より 7分24秒 早く在った**（この1枚 2026-09-22 00:10:47 ／
#         動画のファイル 00:18:11）。**だが、渡したかどうかは著者だけが知っていた。**
#       **③ 2026-09-22、テイク2本**: **著者が答えた。** 2本目を「**参照イメージ無し**」と名付けて
#         生成したのである——**ゆえに1本目には渡されている**（`takes/ippitsu-s01-video-1.yaml` を見よ）。
#       **④ 2026-09-22、裁定**: **著者が採否を決めた。** 採用は**2本目（参照なし）**、
#         不採用は1本目（参照あり）。**著者の理由**（そのまま）:
#         「**参照イメージがない方が自然だったよ。参照があると、筆跡が画面上に、すでに乗ってしまう**」
#         ⇒ **このショットの動画には、この1枚を渡さない。** **そして、渡さなかったほうが良い。**
#         ⚠️ **これは `attached` を空ける理由を、さらに強くする**——
#           **空欄が「まだ分からない」から「渡していない」へ変わった。**
#    ⚠️ **それでも `attached` は書けない。****理由が②から変わった。**
#       **この作品は、いまテイクを2本持ち、渡したものが違う**——1本目は参照あり、2本目は `references: []`。
#       **`attached` はショットに1つである。****どちらかを書けば、もう片方を偽ることになる。**
#       ⇒ **ゆえに空のままにする。****渡したものはテイクが持つ**（`params.references`）。
#       **⑤ 2026-09-22、裁定（欄の扱い）**: **著者が、この欄をどう扱うかを決めた。**
#         **`reference_set` は当時の意図のまま残し、`attached` は空のままにする。**
#         ⇒ **ゆえに `attached` が空なのは、いまは「書けない」ではなく「書かない」である。**
#         ⚠️ **遡って埋めない**——**後から書いた添付の記録は、記録ではなく説明である**
#           （`aim` の欄と同じ作法である）。
#    ⚠️ **`attached: []` と書いてはならない。** `L6` の註が言うとおり、
#       それは「意図にあるのに1つも添付されていない」と**偽って鳴る**——
#       **書かなかったことと、書いて空だったことは違う。**
#    ⚠️ **`L6` は鳴る**（「添付の記録が無い」）。**そして、この裁定の下では、鳴るのが正しい。**
#       ① では**鳴るのが正しかった**——**分からないことを、分かったことにしないためである。**
#       **⑤ でも鳴るのが正しい**——**`reference_set` が `紙.base` を持ったまま、
#       `attached` が何も言わないからである。****これはこの記録の実際の状態である。**
#       **鳴りを消すために欄を埋めれば、記録ではなくなる。**
#       ⚠️ **ただし、これは検査器の側の穴でもある**——**`L6` はショットの欄しか見ず、
#         テイクの `references` を読まない。** **ゆえに「テイクごとの参照」は、
#         どこからも検査されない。****穴のまま記録する。**

# ⚠️ **開示の変化点は無い。** 台帳の `disclosure` も空である——**どちらも空であることが一致である。**
disclosure_state: {}

# ⚠️ **`text_channel` を置かない。** この作品に焼かれる文字は無い
#    （`bible.yaml`「この作品に、読み取れる文字は無い」）。
#    **空の配列を書けば、「何も焼かない」という別の主張になる。**
