# 第一ショット / 様式美 / motion —— 白い紙が、墨を持つ
#
# ⚠️ **この作品には、この1本しか無い。**
#    物語ではないので、前のショットも次のショットも無い。
#    **それでもショットとして記録する**——このリポジトリの単位はショットであり、
#    試すのは「1本の動画として様式が立つか」である。
#
# ⚠️ **出典が無い唯一のショットである。**
#    他のショットは台帳の先の原作から拍を取る。**このショットは、様式カードの
#    `## Motion character` から取る**——とくに次の2項目である。
#      ① **The stroke is the event, and it happens once.**（一筆は出来事であり、1回しか起きない）
#      ② **The ink keeps moving after the brush has stopped.**（筆が止まってからも墨は動く）
#    **この2つが、このショットの全体である。**
#
# ⚠️ **このショットの変化は1つだけである。**「白い紙が、墨を持つ。」
#    **それ以外のことは何も起こらない**——人物も、物語も、開示も無い。
#    ⚠️ **`unit.before`／`unit.after` がこの作品で最も鋭いのは、そのためである。**

shot: ippitsu-s01
spec: specs/video/shot-01-stroke.md

# ⚠️ **この1枚は、このショットの動画へ添付（参照画像）として渡る。**
key_image: specs/image/shot-01-stroke.md

# ⚠️ **この欄は、このリポジトリで最初に書かれた「狙い」である**（決定 2026-09-21、著者。D-13）。
#    **自由文である。目録にしない**——**15の文法は、このリポジトリの中に目録を持たない。**
#    ⚠️ **この欄を読む検査は、まだ1つも無い。** 書いても何も鳴らない。
#       **穴のまま記録する**（`engine/ledger/README.md`「What Is Still Missing」）。
#    ⚠️ **狙いはショットの欄であって、テイクの欄ではない。** 同じショットを2度生成しても、狙いは1つである。
aim: >-
  **Style 4.3「動く絵画」を試す。** 一筆が置かれたあと、墨が紙の中を動き続ける——
  **手が止まってからも動くものがある**、という1点である。
  ⚠️ この試しが成り立たなければ、**15の文法のうちの1つが、この基盤では立てない**ことになる。

unit:
  before: "**紙は白い。墨はまだ紙の外にあり、紙の中に無い。**"
  after: "**墨は紙の中にあり、広がり続けている。狭まらない。戻らない。**"

# ⚠️ **種別は `様式美`（tableau）である。** 固有基準は「構図・余白・静止の強度」——
#    **この1本が裁かれるのは、その3つである。**
#    ⚠️ **`rolemap` の既定モードは `still` だが、このショットは `motion` である。**
#       理由は `mode` の註に書く。**食い違いを黙って置かない。**
role: 様式美

place: 紙

# ⚠️ **時刻を持たない。** 空欄ではない——**この作品に時間が無い**という宣言である
#    （`bible.yaml`「時計が無いのではない——時間が無い」）。
time: 時刻を持たない

# ⚠️ **`motion` である**——`mode` の意味は「**主題が動くか**」である。
#    主題は墨であり、**墨は動く。** ゆえに `still` ではない。
#    ⚠️ **`rolemap` の `様式美` の既定モードは `still` である。**
#       それでも `motion` を採る——**この1本は「静止の強度」ではなく
#       「止まった手のあとも動く」を試すからである。**
#       **既定と食い違うことは、判断の記録がここに在ることで足りる。**
mode: motion

duration: 6s

# ⚠️ **運動の層はこの作品の主題そのものである。**
motion:
  subject: 紙の上の墨
  quality: >-
    **一筆が置かれ、そのあと墨が紙の中へ広がる。** 広がるのは一度きりの出来事の続きであり、
    **新しい動きではない**——手はもう無い。**墨は広がる方向にしか動かない。**
  law: >-
    sumi-e の物理。**一筆は1回で、直されない。筆が止まってからも墨は動く。**
    ⚠️ **この作品だけ、様式カードがこのリポジトリの中に在る**
    （`references/styles/sumi-e.md`）——⚠️ 読ませるには `SVL_STYLES_DIR` を張る。

beats:
  - range: 0-2s
    density: sparse
    what: >-
      **白い紙。** 枠に入っているのは紙だけである。**筆が紙の外から入り、まだ触れていない。**
      ⚠️ 余白は、この時点で既に構図である。
  - range: 2-3s
    density: dense
    what: >-
      **一筆が置かれる。** 1回だけである——**直さない。なぞらない。二度目は無い。**
      墨は筆の先から紙へ移り、**筆は紙を離れる。**
  - range: 3-6s
    density: held
    what: >-
      **筆はもう枠に無い。** 墨が紙の繊維へ入り、**広がり続ける。**
      ⚠️ **狭まらない。戻らない。白へ乾かない。** この3秒が、このショットの主題である。

# ⚠️ **参照も禁止も、台帳の `紙` からしか引けない。** 人物が1人も居ないからである。
reference_set:
  - 紙.base
  - 紙.geography

forbidden_set:
  - 二度目の一筆
  - なぞり直し
  - 色
  - 落款・印・署名
  - 読み取れる文字
  - 紙の外の事物
  - 人物
  - 埃・靄・光の筋

# ⚠️ **`attached` を書かない。**（意図してである）
#    この作品は、**このリポジトリで最初に「生成の前に記録された」作品である。**
#    参照画像は1枚もまだ無い（`ledger.yaml` の `紙.base` を見よ）——ゆえに
#    **添付の記録は存在しない。**
#    ⚠️ **`attached: []` と書いてはならない。** `L6` の註が言うとおり、
#       それは「意図にあるのに1つも添付されていない」と**偽って鳴る**——
#       **書かなかったことと、書いて空だったことは違う。**
#    ⚠️ **それでも `L6` は鳴る**（「添付の記録が無い」）。**鳴るのが正しい**——
#       この作品がまだ生成されていないことは、事実だからである。
#       四つの手の①（生成する）は著者のものであり、**まだ行われていない。**

# ⚠️ **開示の変化点は無い。** 台帳の `disclosure` も空である——**どちらも空であることが一致である。**
disclosure_state: {}

# ⚠️ **`text_channel` を置かない。** この作品に焼かれる文字は無い
#    （`bible.yaml`「この作品に、読み取れる文字は無い」）。
#    **空の配列を書けば、「何も焼かない」という別の主張になる。**
