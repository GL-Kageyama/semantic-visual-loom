#      **が、「一方向」という語が指す形は、4.0s 以降は保たれていない。**
#      ⚠️ **これは仕様の側の矛盾である**——§8 は「筆が止まってからも墨は動く」を3秒間求め、
#      §4 は「余白は枠の半分を保て」と求める。**18% から始まる染みが3秒広がれば、比は必ず逆転する。**
#
# ⚠️ **著者の裁定が要るもの——この1本は §16 の MUST NOT に1つ触れている。**
#    **手が枠に入っている**（筆を握る指）。
#    実測（**1920×1080 で全 180 フレームを走査**）: **肌を持つフレームは 14 本**、
#    **fr26–fr68 = 0.87–2.27s**、**最大 30159 画素 = 枠の 1.45%**（fr63 = 2.10s）、
#    位置は **x[0.000,0.052] y[0.609,0.999]**——**左下、枠の左の縁から入っている。**
#    ⚠️ **肌画素の総数は 0.0623%** であり、**この作品で彩度を持つ画素はこれだけである。**
#    つまり**手は、この作品が自分の世界から離れた唯一の点であり、同時に2度離れている**
#    ——§2「No person, no figure, **no hand** is in the frame at any point.」と
#      §2「The ink stays monochrome. No colour and no colour-temperature shift.」の両方に。
#
#    ⚠️ **そして、これは仕様の欠陥である**（[02] §5 の③）。**仕様が2つを同時に求めた。**
#      ・§4「Nothing else is in the frame but the paper, the ink, and — for one beat — the brush.」
#      ・§5「The brush. **It enters from the frame's edge** before the stroke, lays the mark once,
#         and leaves before the shot ends.」
#        ——**主体の無い筆を求めている。** 枠の縁から入る筆を握る手は、ほぼ必ず付いてくる。
