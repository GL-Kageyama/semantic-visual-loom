#    ・**カメラは1画素も動いていない。** 2つの方法が一致した——
#      ①位相相関（fr0 との比較で全時刻 (0,0)）
#      ②**墨の無い紙片をテンプレートにして追う方法**（右上 x0.72-0.98 / y0.06-0.30、960×540 で測定、
#        全時刻でずれ (0,0)、1920 の尺度でも 0 画素）。
#      ⚠️ **§10 の「Camera Behavior: Still. No push, no drift, no pan, no handheld, no whip」は満たされた。**
#    ・**紙そのものは暗くならない。** 四隅の紙（40×40）の中央輝度は全時刻で 231-236 である。
#      ⚠️ **ゆえに余白の減少は、光でも露出でもなく、墨の成長そのものである。**
#    ・**余白は使われる。** 暗い画素（<100）は 0.0%（0.00s）→ 36.0%（5.90s）、
#      明るい紙（>200）は 99.7% → 27.2%。**終わりでは、墨のほうが余白より広い。**
#      ⚠️ **§4 の「The void stays empty for the whole shot」・§16 の PREFER
#      「the void given as much of the frame as the subject」は、終わりでは満たされない。**
#    ・**広がりは途中から全方向になる。** 重心は 2.85s の (0.436,0.516) から 5.90s の (0.472,0.512) まで
#      ほとんど動かないのに、**広がり σ は (0.155,0.095) → (0.192,0.218) と、縦に2倍以上になる。**
#      2.5s と 3.5s のコマは一筆の形をしている。**4.5s のコマでは、墨の縁が全方向へ放射している。**
#      ⚠️ **§18 の「The ink moves one way only」は、その文自身が「終わりで最大・狭まらない・戻らない」と
