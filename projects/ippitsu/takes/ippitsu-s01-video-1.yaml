#      **手は参照から来ていない。**
#
# ⚠️ **画素から測ったこと（②の一部であり、`measured` の欄には入らないもの）。**
#    ⚠️ **尺度を明記する**——下の数はすべて **480×270 に落として測った値**である（断りのあるものを除く）。
#    ・**墨はほぼ一方向に増えた。** 第三拍（3.0-5.9s、90 フレーム）で、暗い画素（輝度<100）は
#      **16076 → 47272 画素**。**89 の段のうち減ったのは2つだけ**である
#      （5.47s に −15、5.83s に −65——いずれも値の 0.15% 未満）。
#      ⚠️ **§20 の最優先の risk（墨が戻る＝呼吸になる）は、起きなかった。**
#         **呼吸なら何十段も続けて減る。**
#    ・**外接箱は、遠い2辺だけが単調である。** x1（396→424）と y1（206→269）は **89 段すべてで広がった**。
