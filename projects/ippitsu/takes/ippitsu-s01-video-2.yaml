#    ⚠️ **名は名乗りであって証明ではない**（`schemas/take.schema.json`）。**しかし、ここでは名が唯一の記録である。**
#
# ⚠️ **測った値には、すべて尺度と範囲を書く。**
#    ⚠️ **そして、2本を同じ物差しで測る。** これは前の読みで2度踏んだ穴である——
#      ① 外接箱を2点だけで比べた  ② カメラのずれを墨の重心と取り違えた。
#      **物差しが違えば、差は作品の差ではなく物差しの差になる。**
#    ⚠️ **肌の基準は1本目の記録値から復元した**（下を見よ）。**新しい基準を発明していない。**
#
# ============================================================================
# ⚠️ **1本目との比較——これが、このテイクの答えである。**
#
#   肌の基準（**両方に同じ物差し**）: `sat差 > 40 かつ r>=g>=b かつ r-b > 40`、**1920×1080、全180フレーム**。
#   ⚠️ **この基準は1本目の記録値を厳密に再現する**——**14 フレーム / fr26-fr68 (0.87-2.27s) /
#      最大 30159 (fr63) / 総数 0.0623%**。**ゆえに物差しは一致している。**
#
#   |                  | 1本目（参照あり） | **2本目（参照なし）** |
#   |------------------|------------------|----------------------|
#   | 肌を持つフレーム | 14               | **78**               |
#   | 肌の範囲         | 0.87-2.27s       | **0.97-3.53s**       |
#   | 肌の最大         | 30159 (1.45%)    | 34917 (1.68%)        |
#   | 肌の総数         | 0.0623%          | **0.2436%**          |
#   | 肌の位置         | 左下 x[0,0.052] y[0.609,0.999] | **右上 x[0.624,0.999] y[0,0.36]** |
#   | 肌の連続区間     | (26,26),(56,68)  | **(29,106) 切れ目なし** |
#
#   ⚠️ **参照を外しても、手は消えなかった。むしろ増えた。**
#      1本目 1.40秒 → 2本目 **2.57秒**。総量で **3.9倍**。**5.6倍のフレーム数。**
#   ⚠️ **ゆえに「参照画像が手を呼んだ」は、この1本で反証された。**
#      **反証には1つの反例で足りる。** 参照なしでも手は出る。
#      ⇒ **手の原因は、仕様の側に在る**（1本目の註に書いた §4/§5 と §2/§16 の衝突）。
#      ⚠️ **これは n=1 対 n=1 である。** 生成器は確率的であり、
#        **「参照なしのほうが手が多い」を一般則としては言えない。**
#        **言えるのは「参照なしでも手が出た」——これだけである。** **そしてそれで足りる。**
#
# ⚠️ **2本目は、仕様の側の緩い条件さえ満たしていない。**
#    §20 の risk は「**The brush may stay in frame.** It must be gone before the third beat」と書いた
#    （1本目はこれを満たした——手は 2.27s に去り、第三拍は 3.0s からである）。
#    **2本目の手は 3.53s まで在る**——**第三拍に入って 0.53秒 残っている。**
#    **§20 の緩い条件も、破られている。**
#
# ============================================================================
# ⚠️ **§13 LIGHTING——2本目は満たしていない。1本目は満たしている。**
#    §13「Base Lighting: Flat, even, frontal light on the sheet.
#    **No directional key, and no shadow cast across the paper.**」
#    実測（**240×135、fr0——筆がまだ入っていない時刻**、最小二乗で平面を当てた）:
#      ・**1本目**: 勾配の大きさ **2.8 レベル**、四隅の差 **4.5**（230.2/233.2/228.7/230.2）、最も明るい角=右上
#      ・**2本目**: 勾配の大きさ **25.3 レベル**、四隅の差 **27.6**（226.7/205.4/202.6/199.1）、
#        **最も明るい角=左上**——**左→右で −13.7、上→下で −21.3 レベル。**
#    ⚠️ **ゆえに2本目には方向を持つ光が在る**（左上から）。**平均輝度も 214.9 対 230.4 と暗い。**
#    ⚠️ **判定は著者のものである。** 測って言えるのはここまで——
#      **「平らで均一」と「25.3 レベルの勾配」は同じではない。**
#
# ⚠️ **§14 AUDIO——2本目は満たしていない。1本目は満たしている。**
#    §14「Sound Effects: **Almost none** — the dry contact of the brush **for a fraction of a second**
#    as the stroke lands. ／ Music: None. ／ Environment: The room tone of a dry room, unbroken.」
#    実測（**48000Hz モノラル、0.05秒ごとの RMS 包絡**）:
#      ・**1本目**: 平坦である。0.1秒ごとの包絡は **−47〜−41 dB** を動くだけ（変調 18.1%）。
#      ・**2本目**: **床は −55 dB。2.15s に跳ね上がり、3.45s に最大 −20.0 dB、3.9s に床へ戻る。**
#        **1.7秒 続く出来事であり、床から 35 dB 上である。**
#      ・ピーク振幅 **0.3310**（1本目は 0.0344）——**10倍。**
#      ・パワースペクトルで 200Hz 以下が占める割合: **1本目 90.6% ／ 2本目 43.4%。**
#        ⚠️ **1本目の記録値は 92% である。この物差し（パワー、hanning）は 90.6% を出す**——
#          **1.4 ポイントの差であり、同じ物差しと見なす。**
#    ⚠️ **「almost none」「a fraction of a second」と、1.7秒・35 dB の山は同じではない。**
#       ⚠️ **そして山の頂点 3.45s は、筆が紙に触れた時刻ではない**（筆はおよそ 2.0-2.5s に触れ、
#         3.53s まで枠に在る）。**「stroke lands」の音ではない。**
#    ⚠️ **判定は著者のものである**——** Foley を環境音と読むかは、仕様の読み方である。**
#
# ============================================================================
# ⚠️ **2本目のほうが良い点が、1つ在る。**
#    §16 PREFER「The stroke placed off-centre, with **the larger part of the sheet left empty**」／
#    §16 MUST「The void stays empty for the whole shot」——**どちらも2本とも満たしていない**
#    （「larger part」は半分を超えることを要する）。**が、2本目のほうが余白が残る。**
#      ・明るい紙（>200、**960×540、最終フレーム**）: 1本目 **25.4%** ／ 2本目 **41.7%**
#      ・暗い墨（<100、同じ）:                     1本目 **37.0%** ／ 2本目 **14.9%**
#      ・**fr0 の紙から変わった画素**（差>12、同じ）: 1本目 **82.9%** ／ 2本目 **57.8%**
#    ⚠️ **2本目の墨は、濃い核が小さく、淡い光背が広い**——だから
#      **「変わった画素」では1本目に劣るのに、中間調では勝っている**（1本目 37.6% ／ 2本目 43.4%）。
#      **尺度を書かないと、この2つは逆に見える。**
#
# ============================================================================
