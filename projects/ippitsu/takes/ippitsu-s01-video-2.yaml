# ippitsu-s01 / 動画 / 2 — 6.0s / 30fps / 180 フレーム（⚠️ 仕様の §1 は `24fps`）
#
# ⚠️ **このテイクは、問いに答えるために在る。**
#    著者は問うた——「**参照イメージ無しで生成した方がよかった？**」
#    そして**参照を外して生成し、ファイルに `01(参照イメージ無し)_…` と名付けた。**
#    **この名が、このテイクの来歴そのものである。** ゆえに `params.references` は `[]` である
