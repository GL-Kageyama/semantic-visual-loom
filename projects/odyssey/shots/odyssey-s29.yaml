motion:
  subject: "水面、水平線、空。"
  quality: "**前の2本と同じ動きを、いちばん静かに。**近い水面だけが流れ、遠い水平線は動かない。カメラは動かない。"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **3度目に、この作品は何も足さない。****足せば、この行が「特別な3度目」になる**——**曲は3度同じことを言っている。****画面も3度同じことをする。**

