shot: odyssey-s21

unit:
  before: "舟は水の上にある。海は一様である。"
  after: "**海の全体と、その上の舟とが、同じ画にある。**距離が、初めて見える。"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
