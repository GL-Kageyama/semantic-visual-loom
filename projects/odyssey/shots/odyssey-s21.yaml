# 動画の仕様（§1–20）。**§18 に、この経路のプロンプトが入る。**
# ⚠️ **§18 の7つのスロットは `specmap.PROMPT_SLOTS` が定める**——`L17` が確かめる。
spec: specs/video/odyssey-s21.md

# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  **海の大きさを、一度だけ正面から見せられるか。**⚠️ **壮大さは、広さではなく、着かなさから来る。**

motion:
  subject: "波面の全体、舟、そしてその航跡。"
  quality: "**波は同じ方向へ流れ続ける。**舟は小さく、航跡だけが長い。**カメラは高さを上げ続ける**——上げるほど、舟が小さい。"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **この作品に、他の船は一隻も無い**（`ledger.props.舟.negative`——「**no boat, no ship, no hull, no keel, no planking**」／`ledger.locations.海.base`——「**No land, no sail, no bird, no other vessel.**」）。
    ⚠️ **出所を直した（2026-09-29）。** 前の稿はこれを `bible.negative_base` に帰していたが、**同欄の8行に船の行は1つも無い**（実測）——「no watermark／no on-screen subtitles／no background music／no legible text／no bow…／no classical architecture…／no armour…／no face for the goddess」。**引用の形にした句は出典として読まれる。ゆえに宛先を実測に合わせた。**

# **ビート。不均等に配分する。**
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
# ⛔ **末尾のビートは `dense` である。** **変化は切れ目のコマで終わる。**
#    ⚠️ **切れ目はすべて曲の事象である**——行の頭、または実測の山である。
# ⚠️ **`held` を1つも使わない。** 止まるのは主題であって、画面ではない
#    （`shot-record.schema.json` の `motion`）。
beats:
  - range: "0-1.499s"
    density: transition
    what: "舟と、その周りの海。**まだ近い。**"
  - range: "1.499-3.999s"
    density: sparse
    what: "**カメラが上がる。**舟が小さくなる。**航跡だけが長い。**"
  - range: "3.999-6.143s"
    density: dense
    what: "**海の全体が入る。**舟は点である——**点になるのが、切れ目のコマである。**"

