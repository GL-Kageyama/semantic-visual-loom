# ⛔ **末尾のビートは `dense` である。** **変化は切れ目のコマで終わる。**
#    ⚠️ **切れ目はすべて曲の事象である**——行の頭、または実測の山である。
# ⚠️ **`held` を1つも使わない。** 止まるのは主題であって、画面ではない
#    （`shot-record.schema.json` の `motion`）。
beats:
  - range: "0-1.997s"
    density: transition
    what: "一点と、その周りの海。**距離がある。**"
  - range: "1.997-4.504s"
    density: sparse
    what: "**波が一つの周期を描く。**寄せて、返す。**一点は動かない。**"
  - range: "4.504-6.702s"
    density: dense
    what: "**もう一度、同じ周期が始まる。**一点は同じ位置にある——**周期が始まることが、切れ目のコマである。**"

