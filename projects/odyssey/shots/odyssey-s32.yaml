# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  **同じ一行の2度目に、別の何かを返せるか。**⚠️ **`s31` が「近づかない」であり、この1本は「その時間そのもの」である。**

motion:
  subject: "水面、あの一点、そして時間。"
  quality: "**波が、同じ形で何度も寄せる。**あの明るさは動かない。**カメラは三脚の上で、波の一つの周期を丸ごと写す。**"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠. **`time-fold` の4本目である**（`s03` の註を見る）。⛔ **この4本目では、時間が「過ぎる」のでも「止まる」のでもない**——**時間が、距離に変わらない。**

# **ビート。不均等に配分する。**
