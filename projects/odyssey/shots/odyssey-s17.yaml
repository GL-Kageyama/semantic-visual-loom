# verse-2 / motion / 質感 / transformation —— 布が、帆になる
#
# 行: l15 ／ 場所: 舟の置き場 ／ 時刻: 夜明け ／ 尺: 6.543秒
# ⚠️ **形式（`transformation`）は ② で §6 `REF_FORMAT` に書く提案である。**
#    **ショット記録に `REF_FORMAT` の欄は無い**——形式は仕様（§6）の側にある。
#    ⚠️ **ゆえにここに書いた形式は、まだ検査されていない。**
#
# ⚠️ **`world.rules` の二番が、この1本に出る**——
#    「**女神は差し出したあとも、道具を与える。**斧・錐・帆の布・星の道——
#    **断られた側が、出発の術を教える。**」
#    ⛔ **ゆえにこの帆は、この作品で唯一の「与えられた物」である。**
#    ⚠️ **誰から来たのかを、この作品は一度も言わない。** **言わないことが、この規則の実装である。**
#
# ⚠️ **`props.帆.negative` の1行が効く**——「**no sail worn as a garment by any person**」。
#    ⚠️ **詩では、この布は彼の身にも掛かる。この作品では掛からない**——
#    **曲の `l15`「帆を縫って風を待つ」が、布の行き先を帆に決めている。**
#
# ⚠️ **形式は `transformation`。** **`s16` と同じである**——
#    **`s16` は木が筏になり、この1本は布が帆になる。****この作品は2本を対にして置いた。**
#
# ============================================================================
# ⚠️ **`attached` を書かない。** 書けば「意図にあるのに添付が無い」と鳴るのではなく、
#    「**記録が無い**」と言う（`L6`）。**この作品は、まだ1本も生成していない。**
#    ⚠️ **生成した日に、生成した者が書く。****私ではない**——
#    何が実際に添付されたかを、私は見ていない。**推測で書けば、記録が測定になる。**
#
# ⚠️ **`key_image` を書かない。** 裁定②により、**この作品は参照画像を生成器へ渡さない**
#    ——ゆえに「見せ場の1枚」を参照として作る必要が無い。
#    ⚠️ **人が顔の同一性を目で確かめるための道具としては使える**（生成器は受け取れないが、
#    著者と読者は見られる）。**やるかどうかは著者が決める**（計画の ⚠️6）。
#    **決まるまで、この欄は空である。**
# ============================================================================
shot: odyssey-s17

unit:
  before: "布は浜に平らに広げられ、石で四隅を押さえられている。"
  after: "**布は帆になっている。**縫い目が浮き、風を孕んでいる。"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
# ⚠️ **値は日本語である。** 生成器へ渡る文字列ではない——§1–20 に欄が無い。
role: "質感"

# ⚠️ **`ledger.locations` の鍵である。** **この作品の `place` は6つしかない。**
place: "舟の置き場"

# ⚠️ **一時刻である。** この作品は一日のうちの三つの時刻しか使わない
#    ——`日没`／`夜`／`夜明け`。⚠️ **方位も季節も無い。**
time: "夜明け"

mode: "motion"

# ⚠️ **従属変数である。** この作品では**さらに曲に従属する**——
#    出所は `bible.song.lines[].at` の差、または `intro` の実測の山である。
#    ⛔ **「4秒より短いから伸ばす」をしない**（`docs/seedance-route.md` の明示の規則）。
duration: "6.543s"

# 動画の仕様（§1–20）。**§18 に、この経路のプロンプトが入る。**
# ⚠️ **§18 の7つのスロットは `specmap.PROMPT_SLOTS` が定める**——`L17` が確かめる。
spec: specs/video/odyssey-s17.md

# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  ⛔ **縫うことを、布の変化として写せるか。**そして**この布が誰から来たのかを、一度も言わずに知らせられるか。**

motion:
  subject: "布、針、糸、そして風。"
  quality: "**針が出入りするたびに、布の形が決まっていく。**縫い目が浮き、布が張り、風が入って膨らむ。**カメラは布の面に沿って低く滑る**——動機は「縫い目を追うこと」である。"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **糸は手で撚られている。機械の縫い目は無い**（`props.帆.negative`）。**この作品に、後の時代の物は一つも無い**（`world.rules` の七番）。

# **ビート。不均等に配分する。**
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
# ⛔ **末尾のビートは `dense` である。** **変化は切れ目のコマで終わる。**
#    ⚠️ **切れ目はすべて曲の事象である**——行の頭、または実測の山である。
# ⚠️ **`held` を1つも使わない。** 止まるのは主題であって、画面ではない
#    （`shot-record.schema.json` の `motion`）。
beats:
  - range: "0-1.498s"
    density: transition
    what: "布が平らに広がっている。**まだ帆ではない。**"
  - range: "1.498-3.998s"
    density: sparse
    what: "**針が出入りする。**縫い目が浮いていく。"
  - range: "3.998-6.543s"
    density: dense
    what: "**風が布に入る。**布が膨らみ、張る——**張りきるのが、切れ目のコマである。**"

# ⚠️ **`L8` が、これらの鍵が台帳に在るかを確かめる。**
# ⚠️ **`L5` が、参照集合と禁制集合の衝突を確かめる。**
