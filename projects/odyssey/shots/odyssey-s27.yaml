shot: odyssey-s27

unit:
  before: "舟は水の上にあり、島は無い。"
  after: "**男が漕いでいる。**舟が前に進んでいる。"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
# ⚠️ **値は日本語である。** 生成器へ渡る文字列ではない——§1–20 に欄が無い。
role: "所作"

# ⚠️ **`ledger.locations` の鍵である。** **この作品の `place` は6つしかない。**
place: "海"

# ⚠️ **一時刻である。** この作品は一日のうちの三つの時刻しか使わない
#    ——`日没`／`夜`／`夜明け`。⚠️ **方位も季節も無い。**
time: "夜"

mode: "motion"

# ⚠️ **従属変数である。** この作品では**さらに曲に従属する**——
#    出所は `bible.song.lines[].at` の差、または `intro` の実測の山である。
#    ⛔ **「4秒より短いから伸ばす」をしない**（`docs/seedance-route.md` の明示の規則）。
duration: "7.500s"

# 動画の仕様（§1–20）。**§18 に、この経路のプロンプトが入る。**
# ⚠️ **§18 の7つのスロットは `specmap.PROMPT_SLOTS` が定める**——`L17` が確かめる。
spec: specs/video/odyssey-s27.md

# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  **3度目のサビの1行目に、初めて「労働」を置けるか。**⚠️ **`s13` は意図、`s20` は島の応答、そしてこの1本は手である。**

motion:
  subject: "男の背中、腕、そして漕ぎ手の柄。"
  quality: "**漕ぐ。**柄が水に入り、引き、抜ける。**その繰り返しだけがこの1本である。**カメラは舟の後ろから、彼の背中を写す。"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠. **この作品の労働はすべて手である**——`s16` の斧、`s17` の針、そしてこの1本の櫂。**機構は一つも無い**（`斧.negative` の「no steel blade, no iron」）。

# **ビート。不均等に配分する。**
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
# ⛔ **末尾のビートは `dense` である。** **変化は切れ目のコマで終わる。**
#    ⚠️ **切れ目はすべて曲の事象である**——行の頭、または実測の山である。
# ⚠️ **`held` を1つも使わない。** 止まるのは主題であって、画面ではない
#    （`shot-record.schema.json` の `motion`）。
beats:
  - range: "0-2.002s"
    density: transition
    what: "舟の後ろ姿。**まだ漕いでいない。**"
  - range: "2.002-5.003s"
    density: sparse
    what: "**柄が水に入る。**引き、抜ける。**繰り返す。**"
  - range: "5.003-7.5s"
    density: dense
    what: "**もう一度、柄が水に入る。**舟が進む——**進むことが、切れ目のコマである。**"

# ⚠️ **`L8` が、これらの鍵が台帳に在るかを確かめる。**
# ⚠️ **`L5` が、参照集合と禁制集合の衝突を確かめる。**
