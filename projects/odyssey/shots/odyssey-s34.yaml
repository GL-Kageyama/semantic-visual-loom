  - "no boat, no ship, no hull, no other vessel"
  - "no blood, no wound, no corpse, no slaughter, no carcass"
  - "no fire, no torch, no lamp, no flame used as a light source"
  - "no modern object, no machine, no synthetic material, no clothing of any later age"

# **このショットが実際に持つ開示状態。**（台帳の `disclosure` は「意図」、こちらが「実際」）
