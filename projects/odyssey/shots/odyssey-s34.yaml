shot: odyssey-s34

unit:
  before: "男が漕いでいる。海がある。"
  after: "**海がある。**舟はまだ沖にあり、**どこにも着いていない。**"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
# ⚠️ **値は日本語である。** 生成器へ渡る文字列ではない——§1–20 に欄が無い。
role: "離脱"

# ⚠️ **`ledger.locations` の鍵である。** **この作品の `place` は6つしかない。**
place: "海"

# ⚠️ **一時刻である。** この作品は一日のうちの三つの時刻しか使わない
#    ——`日没`／`夜`／`夜明け`。⚠️ **方位も季節も無い。**
time: "夜"

mode: "motion"

# ⚠️ **従属変数である。** この作品では**さらに曲に従属する**——
#    出所は `bible.song.lines[].at` の差、または `intro` の実測の山である。
#    ⛔ **「4秒より短いから伸ばす」をしない**（`docs/seedance-route.md` の明示の規則）。
duration: "8.431s"

# 動画の仕様（§1–20）。**§18 に、この経路のプロンプトが入る。**
# ⚠️ **§18 の7つのスロットは `specmap.PROMPT_SLOTS` が定める**——`L17` が確かめる。
spec: specs/video/odyssey-s34.md

# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  ⛔ **歌が終わったあとの8.4秒で、この作品を閉じられるか。**⛔ **着かせずに閉じる**——**それがこの作品の最後の一変化である。**

motion:
  subject: "海面、舟の影、そして水平線。"
  quality: "**舟は進み続ける。**しかし**水平線との距離は、この8.431秒では測れない。**波が寄せ、舟が上下し、暗さが少しだけ濃くなる。**カメラは舟から離れ、海の画になる。**"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠. **基盤の床の3行目が、この1本で最も効く**——「**no background music**」。**この8.431秒は無音である**（曲はここで終わっている）。

# **ビート。不均等に配分する。**
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
# ⛔ **末尾のビートは `dense` である。** **変化は切れ目のコマで終わる。**
#    ⚠️ **切れ目はすべて曲の事象である**——行の頭、または実測の山である。
# ⚠️ **`held` を1つも使わない。** 止まるのは主題であって、画面ではない
#    （`shot-record.schema.json` の `motion`）。
beats:
  - range: "0-2.496s"
    density: transition
    what: "舟が進んでいる。**まだ近い。**"
  - range: "2.496-5.497s"
    density: sparse
    what: "**カメラが舟から離れる。**暗さが少し濃くなる。**舟が小さくなる。**"
  - range: "5.497-8.431s"
    density: dense
    what: "**海の画になる。**舟はまだ沖にある——**着いていないことが、切れ目のコマである。**"

