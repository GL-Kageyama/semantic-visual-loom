# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  ⛔ **「死なない」を、否定形でなく肯定形で写せるか。**⚠️ **人を止めて写すのではない**——**光と空気だけが動き、そこにいる者が時間から外れている**ことを、10秒保てるか。

motion:
  subject: "洞の黒、潅木の葉、男の髪と裾。**時間そのものが主題である。**"
  quality: "**光は動く。**月の光がゆっくり角度を変え、葉の裏の温度が変わり、男の髪が揺れる。**しかし一度も「進んだ」と言えない。**カメラは三脚の上で、髪の一筋へ寄っていく。"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **「動くが進まない」は、様式の物理である。** `cinematic-still` は演出的な照明を許す——**その許しが、ここで時間を作る。**

# **ビート。不均等に配分する。**
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
# ⛔ **末尾のビートは `dense` である。** **変化は切れ目のコマで終わる。**
#    ⚠️ **切れ目はすべて曲の事象である**——行の頭、または実測の山である。
# ⚠️ **`held` を1つも使わない。** 止まるのは主題であって、画面ではない
#    （`shot-record.schema.json` の `motion`）。
beats:
  - range: "0-2.498s"
    density: transition
    what: "洞の黒。**葉が一枚、裏返る。**"
  - range: "2.498-5.999s"
    density: sparse
    what: "**光が角度を変える。**髪が揺れる。**しかし何も進まない。**"
  - range: "5.999-8.497s"
    density: dense
    what: "**カメラが髪の一筋へ寄る。**光はまだ動いている。**同じ一筋が、まだ同じ場所にある。**"
  - range: "8.497-10.452s"
    density: dense
    what: "**歌の無い 0.452秒が、この1本の末尾に在る。**光だけが動き、**何も変わらないまま切れ目が来る。**"

