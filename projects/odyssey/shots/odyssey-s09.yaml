# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  ⛔ **画面に居ない者に喋らせられるか。**そして**観客に、彼女が本当にそこに居ると信じさせられるか**——**姿を一度も見せずに。**

motion:
  subject: "男の背中と、洞の黒。**そして、洞から出てくる空気。**"
  quality: "男は動かない。**潅木が洞の側だけ揺れる**——風向きが説明できない。カメラは彼の後ろから洞口へ寄り、**黒が画面の大半を占めたところで止まる。**"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **この経路は参照画像を受け取らない**（裁定②）。**ゆえに彼女の不在は、文だけが運ぶ**——`女神.negatives` の6行がそれである。

# **ビート。不均等に配分する。**
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
# ⛔ **末尾のビートは `dense` である。** **変化は切れ目のコマで終わる。**
#    ⚠️ **切れ目はすべて曲の事象である**——行の頭、または実測の山である。
# ⚠️ **`held` を1つも使わない。** 止まるのは主題であって、画面ではない
#    （`shot-record.schema.json` の `motion`）。
beats:
  - range: "0-1.498s"
    density: transition
    what: "男の背中と、黒い洞。**音はまだ無い。**"
  - range: "1.498-3.499s"
    density: sparse
    what: "**潅木が洞の側だけ揺れる。**風向きが説明できない。**声はまだ来ない。**"
  - range: "3.499-5.027s"
    density: dense
    what: "**黒が画面の大半を占める。**彼は動かない。**口が閉じたままであることが、切れ目のコマである。**"

