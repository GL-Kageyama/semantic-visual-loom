shot: odyssey-s04

unit:
  before: "海はもう色を持たない。岸の砂は判別できない。"
  after: "岸がほぼ黒であり、**水平線だけが細く残っている。**次の瞬間に声が入る。"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
# ⚠️ **値は日本語である。** 生成器へ渡る文字列ではない——§1–20 に欄が無い。
role: "情景"

# ⚠️ **`ledger.locations` の鍵である。** **この作品の `place` は6つしかない。**
place: "岸"

# ⚠️ **一時刻である。** この作品は一日のうちの三つの時刻しか使わない
#    ——`日没`／`夜`／`夜明け`。⚠️ **方位も季節も無い。**
time: "日没"

mode: "motion"

# ⚠️ **従属変数である。** この作品では**さらに曲に従属する**——
#    出所は `bible.song.lines[].at` の差、または `intro` の実測の山である。
#    ⛔ **「4秒より短いから伸ばす」をしない**（`docs/seedance-route.md` の明示の規則）。
duration: "11.399s"

# 動画の仕様（§1–20）。**§18 に、この経路のプロンプトが入る。**
# ⚠️ **§18 の7つのスロットは `specmap.PROMPT_SLOTS` が定める**——`L17` が確かめる。
spec: specs/video/odyssey-s04.md

# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  **53秒を、声の入りの1コマ手前で閉じられるか。**そして**男が現れる前の島を、最後にもう一度だけ見せられるか。**

motion:
  subject: "波の白だけが明るい。砂、海藻、小石はもう見えない。"
  quality: "波は低く、白だけが残る。**カメラは引きながら、ゆっくり後ろへ下がる**——動機は「島から離れること」ではなく「**島を置くこと**」である。"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **この1本の末尾は、この作品で最も強い音の事象と一致する。**

# **ビート。不均等に配分する。**
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
# ⛔ **末尾のビートは `dense` である。** **変化は切れ目のコマで終わる。**
#    ⚠️ **切れ目はすべて曲の事象である**——行の頭、または実測の山である。
# ⚠️ **`held` を1つも使わない。** 止まるのは主題であって、画面ではない
#    （`shot-record.schema.json` の `motion`）。
beats:
  - range: "0-2.998s"
    density: transition
    what: "日の道が消え、海が一色になる。**岸はまだ判別できる。**"
  - range: "2.998-6.999s"
    density: sparse
    what: "砂が黒くなり、**波の白だけが残る。**"
  - range: "6.999-11.399s"
    density: dense
    what: "**水平線だけが細く残る。**カメラが下がりきり、**島が画面から出るのが、切れ目のコマである**——その直後に声が入る。"

# ⚠️ **`L8` が、これらの鍵が台帳に在るかを確かめる。**
# ⚠️ **`L5` が、参照集合と禁制集合の衝突を確かめる。**
