motion:
  subject: "海面、水平線、そして水平線の上の空気。"
  quality: "**水平線の一点だけが、わずかに明るい。**波は動き、その明るさは動かない。**カメラはその一点へ、ごくゆっくり寄る。**"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠. **この作品に陸は現れない**（`world.rules` の五番）。**明るさは、陸の証明ではない。****「そこに何かがある」という最小の画である。**

