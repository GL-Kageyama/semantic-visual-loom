motion:
  subject: "水面、水平線、そしてその上の空。"
  quality: "**二つの遠さが、同時に動く。**近い水面は速く流れ、遠い水平線は動かない。カメラはゆっくり後ろへ引く——**引くほど、二つとも遠くなる。**"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **様式は一つである。****この1本は「様式美」を役に持ち、形式の側で二つの現実を並べる**——**様式と形式は別の軸である**（裁定①と §6）。

