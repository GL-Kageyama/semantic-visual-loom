motion:
  subject: "海面と水平線。**そして、そこに在るはずのものの形。**"
  quality: "水面の反射の中に、**家の屋根の形と、立っている人の形が、一瞬だけ結ばれて、崩れる。**波が動くたびに結ばれ、崩れる。**カメラは動かない**——動くのは水面だけである。"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **この1本の危険は、`world.rules` の五番にある**——「**この作品は、帰り着かない。**」**家を写せば、帰還の物語になる。**

