#    ⚠️ **人が顔の同一性を目で確かめるための道具としては使える**（生成器は受け取れないが、
#    著者と読者は見られる）。**やるかどうかは著者が決める**（計画の ⚠️6）。
#    **決まるまで、この欄は空である。**
# ============================================================================
shot: odyssey-s02

unit:
  before: "森の斜面が、日の残りを受けて橙色である。洞口はまだ黒くならない。"
  after: "洞口が完全に黒い。**岩の割れ目だけが、最後の光を受けて細い線になっている。**"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
# ⚠️ **値は日本語である。** 生成器へ渡る文字列ではない——§1–20 に欄が無い。
role: "質感"

# ⚠️ **`ledger.locations` の鍵である。** **この作品の `place` は6つしかない。**
place: "森の洞口"

# ⚠️ **一時刻である。** この作品は一日のうちの三つの時刻しか使わない
#    ——`日没`／`夜`／`夜明け`。⚠️ **方位も季節も無い。**
time: "日没"

mode: "motion"

# ⚠️ **従属変数である。** この作品では**さらに曲に従属する**——
#    出所は `bible.song.lines[].at` の差、または `intro` の実測の山である。
#    ⛔ **「4秒より短いから伸ばす」をしない**（`docs/seedance-route.md` の明示の規則）。
duration: "13.000s"

# 動画の仕様（§1–20）。**§18 に、この経路のプロンプトが入る。**
# ⚠️ **§18 の7つのスロットは `specmap.PROMPT_SLOTS` が定める**——`L17` が確かめる。
spec: specs/video/odyssey-s02.md

# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  **女神が居る場所を、彼女を写さずに立てられるか。****内側を一度も見せないことで、内側があると信じさせられるか。**

motion:
  subject: "岩の面、潅木の葉、洞口の黒。**そして洞の内側から出てくる気配としての空気。**"
  quality: "木の葉は風で裏返り、岩の面の光がゆっくり斜めへ滑る。**黒は動かない**——動くのは黒の縁である。カメラは潅木の間を抜けながら洞口へ寄る。"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **この作品に火は一つも無い**（`bible.negative_base`）。洞の内側が温かいのは、**光ではなく気配である。**

# **ビート。不均等に配分する。**
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
# ⛔ **末尾のビートは `dense` である。** **変化は切れ目のコマで終わる。**
#    ⚠️ **切れ目はすべて曲の事象である**——行の頭、または実測の山である。
# ⚠️ **`held` を1つも使わない。** 止まるのは主題であって、画面ではない
#    （`shot-record.schema.json` の `motion`）。
beats:
  - range: "0-3.003s"
    density: transition
    what: "潅木の間から、洞の入り口が現れる。**まだ遠い。**"
  - range: "3.003-8.996s"
    density: sparse
    what: "岩の面を光が滑り、葉が裏返る。**洞口はまだ灰である。**"
  - range: "8.996-13s"
    density: dense
    what: "**洞口が黒くなる。**最後の光が岩の割れ目に細い線を残し、**その線が消えるのが、切れ目のコマである。**"

# ⚠️ **`L8` が、これらの鍵が台帳に在るかを確かめる。**
# ⚠️ **`L5` が、参照集合と禁制集合の衝突を確かめる。**
