# intro / motion / 質感 / remembered-world —— 女神が居る場所を、彼女を写さずに立てる
#
# 行: — ／ 場所: 森の洞口 ／ 時刻: 日没 ／ 尺: 13.000秒
# ⚠️ **形式（`remembered-world`）は ② で §6 `REF_FORMAT` に書く提案である。**
#    **ショット記録に `REF_FORMAT` の欄は無い**——形式は仕様（§6）の側にある。
#    ⚠️ **ゆえにここに書いた形式は、まだ検査されていない。**
#
# ⚠️ **10.500–23.500。曲が置いた境界が無い区間の2本目である。**
#    **切れ目は実測の山（10.500秒の +14.6 dB）の直後に在る。**
#
# ⛔ **この1本で島の内陸を見せる。男はまだ入らない。**
#    **入らないことが、`world.rules` の一番である**——
#    「**返事は、この作品の中で一度も返されない。**」
#    彼女の場所へ入れば、返事をすることになる。
#
# ⚠️ **形式は `remembered-world`**（記録でなく記憶。保たれた瞬間の中で中身が滑る）。
#    ⚠️ **この作品で洞窟を使うのは3本だけである**（`s02`・`s09`・`s10`）。
#    **この1本が最初であり、そして最も外側である。**
#
# ============================================================================
# ⚠️ **`attached` を書かない。** 書けば「意図にあるのに添付が無い」と鳴るのではなく、
#    「**記録が無い**」と言う（`L6`）。**この作品は、まだ1本も生成していない。**
#    ⚠️ **生成した日に、生成した者が書く。****私ではない**——
#    何が実際に添付されたかを、私は見ていない。**推測で書けば、記録が測定になる。**
#
# ⚠️ **`key_image` を書かない。** 裁定②により、**この作品は参照画像を生成器へ渡さない**
