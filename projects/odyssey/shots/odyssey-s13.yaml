# 動画の仕様（§1–20）。**§18 に、この経路のプロンプトが入る。**
# ⚠️ **§18 の7つのスロットは `specmap.PROMPT_SLOTS` が定める**——`L17` が確かめる。
spec: specs/video/odyssey-s13.md

# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  ⛔ **島を出ることを、島を写さずに写せるか。**そして**この一変化が、3回反復される最初の1回として立てられるか。**

motion:
  subject: "海面と、後ろへ遠ざかる島の輪郭。**そして岸の水際の白。**"
  quality: "**島がゆっくり小さくなる。**波だけが前に流れ、島は後ろへ下がる。**カメラは島から海へ、左へ回る**——動機は「彼が離れること」ではなく「**島が離れること**」である。"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **この作品の様式は一つである**（裁定①）。**34本とも `cinematic-still` の物理に従う**——**様式は作品定数であり、ショットは名乗れない。**

# **ビート。不均等に配分する。**
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
# ⛔ **末尾のビートは `dense` である。** **変化は切れ目のコマで終わる。**
#    ⚠️ **切れ目はすべて曲の事象である**——行の頭、または実測の山である。
# ⚠️ **`held` を1つも使わない。** 止まるのは主題であって、画面ではない
#    （`shot-record.schema.json` の `motion`）。
beats:
  - range: "0-1.997s"
    density: transition
    what: "岸が画面の下端にまだある。**海は島のものである。**"
  - range: "1.997-4.999s"
    density: sparse
    what: "**島が小さくなる。**波が前に流れる。"
  - range: "4.999-7.739s"
    density: dense
    what: "**岸が枠の外へ出る。**海だけが残る——**島が消えるのが、切れ目のコマである。**"

