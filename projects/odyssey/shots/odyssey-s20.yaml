    what: "**輪郭が揺れる。**波の動きに合わせて、一度だけ。"
  - range: "4.498-6.942s"
    density: dense
    what: "**輪郭が消える。**海だけが残る——**島が在ることをやめるのが、切れ目のコマである。**"

