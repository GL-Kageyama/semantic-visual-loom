motion:
  subject: "海面、島の輪郭、そして航跡。"
  quality: "**島の輪郭が、波の動きに合わせて一度だけ揺れる**——それから消える。航跡は後ろへ伸びる。**カメラは舟の上で、島へ向かって回る**——動機は「島が応えるのを見ること」である。"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **この作品の禁制は、全ショットで同一である**（`bible.negative_base` の8行）。**開示が動いても §18 の節は動かない**——`ledger.disclosure` の4行が、4つとも `covered` である理由。

