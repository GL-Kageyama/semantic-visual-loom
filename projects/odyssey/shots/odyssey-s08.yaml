# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  ⛔ **何も起こらない8秒を、退屈にせずに持てるか。**そして**この作品の返事がここで既に「無い」ことを、台詞なしで立てられるか。**

motion:
  subject: "男の横顔（⚠️ **顔がここで初めて近くに出る**）、喉、顎。そして前の海。"
  quality: "**彼は動かない。**喉が一度だけ動く。**それがこの1本で唯一の身体の事象である**——飲み込んだのであって、喋ったのではない。髪と裾は風で動き続ける。カメラはごくゆっくり、横顔へ寄る。"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **`mode: still`。** **止まるのは主題である**——**言わないことが、静止として現れる。**

