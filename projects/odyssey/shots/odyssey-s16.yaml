# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  ⛔ **17秒で、木が筏になるのを見せられるか。**⚠️ 切って繋ぐのでなく、**一つの画の中でそうなっている**ことを。**そして7.234秒の歌の無い間を、斧の音だけで持てるか。**

motion:
  subject: "丸太、板、鉋屑、縄。**そして男の手と斧。**"
  quality: "**斧が入るたびに、木が変わる。**削り屑が舞い、板が組み合わさり、縄が結ばれる。⚠️ **速くしない。**一つずつ起きる。**7.234秒の歌の無い間、斧の音だけが続く。**カメラは作業台の周りを半周する。"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **`props.斧` の物理である**——青銅の両刃、オリーグの柄、革で縛った頭。**銅は鈍く、刃の側だけが明るい。****この作品に、鋼も鉄も無い**（`斧.negative`）。

