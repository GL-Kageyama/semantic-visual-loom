shot: odyssey-s23

unit:
  before: "海は空であり、何も無い。"
  after: "**牛の群れが、水際に立っている。**誰もそれを見ていない。"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
