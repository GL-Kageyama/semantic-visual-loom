#    **この食い違いは事故ではなく、この作品の設計である。**
#
# ⚠️ **参照集合に `男.identity` を入れない。** **彼はこの記憶の中に居ない**——
#    **`l24`「私だけが浮いていた」が、彼の位置を決めている。**
#    ⚠️ **`太陽の牛.negative` の3行目**——「**no cattle in any other scene of this work**」
#    **この牛は、この1本にしか現れない。**
#
# ⚠️ **形式は `remembered-world`**（記録でなく記憶。保たれた瞬間の中で中身が滑る）。
#    ⚠️ **この作品で3本あるうちの3本目である**（`s02` の註を見る）。
#
# ============================================================================
# ⚠️ **`attached` を書かない。** 書けば「意図にあるのに添付が無い」と鳴るのではなく、
#    「**記録が無い**」と言う（`L6`）。**この作品は、まだ1本も生成していない。**
#    ⚠️ **生成した日に、生成した者が書く。****私ではない**——
#    何が実際に添付されたかを、私は見ていない。**推測で書けば、記録が測定になる。**
#
# ⚠️ **`key_image` を書かない。** 裁定②により、**この作品は参照画像を生成器へ渡さない**
