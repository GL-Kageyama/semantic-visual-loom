# ⚠️ **§18 の7つのスロットは `specmap.PROMPT_SLOTS` が定める**——`L17` が確かめる。
spec: specs/video/odyssey-s23.md

# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  ⛔ **歌が歌ったことを、画面が否定せずに、しかし写さずに済ませられるか。**⛔ **この作品の抑制がいちばん強く試される1本である。**

motion:
  subject: "牛の群れ、水面、そして最後の光。"
  quality: "**牛は動かない。**水面だけが動く。光が低く、牛の脚の間を抜ける。**カメラは群れの前を左へ流れる**——動機は「数えること」である。**1.649秒の歌の無い間、牛だけが居る。**"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **この作品に血も死体も無い**（`bible.negative_base`——「**no blood, no wound, no corpse, no slaughter, no carcass**」）。**その一行が、この1本のために在る。**

# **ビート。不均等に配分する。**
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
# ⛔ **末尾のビートは `dense` である。** **変化は切れ目のコマで終わる。**
#    ⚠️ **切れ目はすべて曲の事象である**——行の頭、または実測の山である。
# ⚠️ **`held` を1つも使わない。** 止まるのは主題であって、画面ではない
#    （`shot-record.schema.json` の `motion`）。
beats:
  - range: "0-3.005s"
    density: transition
    what: "空の海。**何も無い。**"
  - range: "3.005-7.001s"
    density: sparse
    what: "**牛の群れが現れる。**水際に、白と淡い金。**動かない。**"
  - range: "7.001-11.649s"
    density: dense
    what: "**光が脚の間を抜ける。**⚠️ **ここから 1.649秒、歌は無い。****牛が立ったままであることが、切れ目のコマである。**"

