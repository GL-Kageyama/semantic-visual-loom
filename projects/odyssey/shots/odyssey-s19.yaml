# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  **一つの星が沈まないことを、12秒で写せるか。**⚠️ **時間が経っていることが見えなければ、沈まないことは見えない。**

motion:
  subject: "空、星、そして明るくなっていく東の空。"
  quality: "**星が次々に消える。**空の色が青から灰白へ移る。**北斗だけが高さを変えない。**カメラは三脚の上で、北斗へゆっくり寄る。"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **`time-fold` の4本目である**（`s03` の註を見る）。⛔ **ここでは、一つの星だけが時間の外にある。****他の全部が動いているから、一つが動かないことが見える。**

