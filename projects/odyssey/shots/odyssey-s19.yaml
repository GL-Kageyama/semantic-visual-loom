  - range: "0-2.995s"
    density: transition
    what: "空に星がある。**まだ全部出ている。**"
  - range: "2.995-7.494s"
    density: sparse
    what: "**星が消えはじめる。**空が青くなる。**北斗は高いままである。**"
  - range: "7.494-12.127s"
    density: dense
    what: "**他の星が全部消える。**空は灰白である。**北斗だけが同じ高さにあるのが、切れ目のコマである。**"

