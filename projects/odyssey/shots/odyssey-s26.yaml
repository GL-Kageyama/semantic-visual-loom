    what: "海と水平線。**何も無い。**"
  - range: "2.995-6.998s"
    density: sparse
    what: "**舟がわずかに向きを変える。**海は動き続ける。"
  - range: "6.998-11.091s"
    density: dense
    what: "**舳先が水平線の一点を指す。**⚠️ **そこに何も現れない**——**現れないことが、切れ目のコマである。**"

