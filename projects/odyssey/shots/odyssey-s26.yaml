# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  ⛔ **「帰る先がひとつある」と歌いながら、それを一度も写さないで済ませられるか。**⛔ **この作品の主題が、いちばん強く禁じられる場所である。**

motion:
  subject: "海面、水平線、そして舟の舳先。"
  quality: "**舟が、わずかに向きを変える。**それだけである。海は動き続け、水平線は動かない。**カメラは舳先の先へ、まっすぐ前へ進む**——動機は「彼が見ている方へ行くこと」であり、**着くことではない。**"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **この様式は、動機の無いカメラ移動を禁じる。** **この1本のカメラの動機は明確である**——**「彼と同じ方向を見ること」。****着くことは、動機にならない。**

