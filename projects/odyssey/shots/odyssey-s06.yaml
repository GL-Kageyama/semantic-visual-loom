# verse-1 / still / 反応 / meaning-responsive —— 見る——この作品で最初の行為
#
# 行: l02 ／ 場所: 岸 ／ 時刻: 日没 ／ 尺: 6.143秒
# ⚠️ **形式（`meaning-responsive`）は ② で §6 `REF_FORMAT` に書く提案である。**
#    **ショット記録に `REF_FORMAT` の欄は無い**——形式は仕様（§6）の側にある。
#    ⚠️ **ゆえにここに書いた形式は、まだ検査されていない。**
#
# ⚠️ **`mode: still` である。** この作品で `still` を使うのは6本だけである
#    （`s06`・`s08`・`s11`・`s24`・`s31`・`s32`）。
#    ⛔ **2026-09-29 に「5本」から直した。** 前の稿は `s24` を落としていた——
#    ⚠️ **`s24` 自身の法の行も「5本のうちの1本」と言っていた。6本目が、5本の中に自分を数えていた。**
#    実測: `shots/*.yaml` で `mode: still` を持つのは6本、検査器 `L24` も「motion 28本／still 6本」と言う。
#    **2つの独立した実測が一致する。**
#    ⛔ **6本に共通する性質がある——ここは、この作品が何かを言わない場所である。**
#    **見る（`s06`）・言わない（`s08`）・見られる（`s11`）・浮いている（`s24`）・着かない（`s31`・`s32`）。**
#    **沈黙が、静止として現れる。**
#
# ⚠️ **役は `反応` である。** 固有基準は「抑制・微細な身体・表情の段階」——
#    **この1本では、その3つが全部「動かないこと」の中にある。**
#
# ⚠️ **形式は `meaning-responsive`**（起きたことではなく意味に反応して画面が変わる）。
#    ⛔ **この1本では、彼が海を見るという「意味」に、海の側が反応する。**
#    **何も起きていないのに、画面が彼の行為を知っている。**
#
# ============================================================================
# ⚠️ **`attached` を書かない。** 書けば「意図にあるのに添付が無い」と鳴るのではなく、
#    「**記録が無い**」と言う（`L6`）。**この作品は、まだ1本も生成していない。**
#    ⚠️ **生成した日に、生成した者が書く。****私ではない**——
#    何が実際に添付されたかを、私は見ていない。**推測で書けば、記録が測定になる。**
#
# ⚠️ **`key_image` を書かない。** 裁定②により、**この作品は参照画像を生成器へ渡さない**
#    ——ゆえに「見せ場の1枚」を参照として作る必要が無い。
#    ⚠️ **人が顔の同一性を目で確かめるための道具としては使える**（生成器は受け取れないが、
#    著者と読者は見られる）。**やるかどうかは著者が決める**（計画の ⚠️6）。
#    **決まるまで、この欄は空である。**
# ============================================================================
shot: odyssey-s06

unit:
  before: "男は水際に立っている。海は彼の前にある。"
  after: "**海が、彼の視線の先でだけ広がっている。**彼は一歩も動いていない。"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
# ⚠️ **値は日本語である。** 生成器へ渡る文字列ではない——§1–20 に欄が無い。
role: "反応"

# ⚠️ **`ledger.locations` の鍵である。** **この作品の `place` は6つしかない。**
place: "岸"

# ⚠️ **一時刻である。** この作品は一日のうちの三つの時刻しか使わない
#    ——`日没`／`夜`／`夜明け`。⚠️ **方位も季節も無い。**
time: "日没"

mode: "still"

# ⚠️ **従属変数である。** この作品では**さらに曲に従属する**——
#    出所は `bible.song.lines[].at` の差、または `intro` の実測の山である。
#    ⛔ **「4秒より短いから伸ばす」をしない**（`docs/seedance-route.md` の明示の規則）。
duration: "6.143s"

# 動画の仕様（§1–20）。**§18 に、この経路のプロンプトが入る。**
# ⚠️ **§18 の7つのスロットは `specmap.PROMPT_SLOTS` が定める**——`L17` が確かめる。
spec: specs/video/odyssey-s06.md

# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  **止まっている人間を6秒保てるか。**そして**「見る」という行為だけで画面を変えられるか**——**この作品で最初の行為がそれである。**

motion:
  subject: "男の顔、肩、そして彼の前の海。⚠️ **主題は止まる。**動くのは波と、彼の髪と裾と、埃である。"
  quality: "**彼は動かない。**波だけが寄せては返す。風が髪を押し、tunic を押す。**カメラは彼の背中から海へ寄っていく**——ゆえに彼は小さくなり、海が大きくなる。"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **`mode: still` である。****止まるのは主題であって、画面ではない。光と埃とカメラは動く**（`shot-record.schema.json` の `motion`）。**ゆえに末尾のビートは `dense` である。**

# **ビート。不均等に配分する。**
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
# ⛔ **末尾のビートは `dense` である。** **変化は切れ目のコマで終わる。**
#    ⚠️ **切れ目はすべて曲の事象である**——行の頭、または実測の山である。
# ⚠️ **`held` を1つも使わない。** 止まるのは主題であって、画面ではない
#    （`shot-record.schema.json` の `motion`）。
beats:
  - range: "0-2.003s"
    density: transition
    what: "彼の背中。**海はまだ遠い。**"
  - range: "2.003-4.503s"
    density: sparse
    what: "**カメラが海へ寄る。**彼が小さくなり、波が大きくなる。"
  - range: "4.503-6.143s"
    density: dense
    what: "**海が画面の大半を占める。**波が返り、**彼の髪が一度だけ強く押されるのが、切れ目のコマである。**"

# ⚠️ **`L8` が、これらの鍵が台帳に在るかを確かめる。**
# ⚠️ **`L5` が、参照集合と禁制集合の衝突を確かめる。**
