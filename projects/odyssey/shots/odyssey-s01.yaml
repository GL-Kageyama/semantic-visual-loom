# intro / motion / 情景 / video-spec —— 島と海と、まだ人の居ない光
#
# 行: — ／ 場所: 岸 ／ 時刻: 日没 ／ 尺: 10.500秒
# ⚠️ **形式（`video-spec`）は ② で §6 `REF_FORMAT` に書く提案である。**
#    **ショット記録に `REF_FORMAT` の欄は無い**——形式は仕様（§6）の側にある。
#    ⚠️ **ゆえにここに書いた形式は、まだ検査されていない。**
#
# ⚠️ **53秒の頭——歌が1行も無い区間の、最初の1本である。**
#    出所: `bible.song.sections` の `intro`。**曲の17.6%を、この4本が負う。**
#
# ⚠️ **実測（2026-09-29、PCM 8kHz モノラル・0.25秒窓）**: 頭 0→1.5秒は
#    −63.5 → −29.1 dB の立ち上がりである。**この1本は、その立ち上がりを丸ごと負う。**
#    そして**切れ目の 10.500秒は、頭の中で最大の跳び（+14.6 dB）である**——
#    ゆえに末尾のビートは `dense` であり、**跳びが切れ目のコマで起きる。**
#
# ⛔ **この1本に、人は一人も居ない。** `intro` の4本はすべてそうである——
#    **島が先にあり、人は後に来る。**（曲の最初の行は 52.899秒の「日のあるかぎり岸に出て」である。）
#
# ⚠️ **形式は `video-spec`（基盤）である。** **最初の画に文法を足さない**——
#    足せば、この作品は「幻想の作品」として始まり、**実写であることが後から分かる。**
#
# ============================================================================
# ⚠️ **`attached` を書かない。** 書けば「意図にあるのに添付が無い」と鳴るのではなく、
#    「**記録が無い**」と言う（`L6`）。**この作品は、まだ1本も生成していない。**
#    ⚠️ **生成した日に、生成した者が書く。****私ではない**——
#    何が実際に添付されたかを、私は見ていない。**推測で書けば、記録が測定になる。**
#
# ⚠️ **`key_image` を書かない。** 裁定②により、**この作品は参照画像を生成器へ渡さない**
#    ——ゆえに「見せ場の1枚」を参照として作る必要が無い。
#    ⚠️ **人が顔の同一性を目で確かめるための道具としては使える**（生成器は受け取れないが、
#    著者と読者は見られる）。**やるかどうかは著者が決める**（計画の ⚠️6）。
#    **決まるまで、この欄は空である。**
# ============================================================================
shot: odyssey-s01

unit:
  before: "海は色を持たず、岸は灰色である。人の姿はどこにも無い。"
  after: "日が傾き、水面に一本の道ができている。**砂の粒と、乾いた海藻と、寄せた小石が見えている。**"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
# ⚠️ **値は日本語である。** 生成器へ渡る文字列ではない——§1–20 に欄が無い。
role: "情景"

# ⚠️ **`ledger.locations` の鍵である。** **この作品の `place` は6つしかない。**
place: "岸"

# ⚠️ **一時刻である。** この作品は一日のうちの三つの時刻しか使わない
#    ——`日没`／`夜`／`夜明け`。⚠️ **方位も季節も無い。**
time: "日没"

mode: "motion"

# ⚠️ **従属変数である。** この作品では**さらに曲に従属する**——
#    出所は `bible.song.lines[].at` の差、または `intro` の実測の山である。
#    ⛔ **「4秒より短いから伸ばす」をしない**（`docs/seedance-route.md` の明示の規則）。
duration: "10.500s"

# 動画の仕様（§1–20）。**§18 に、この経路のプロンプトが入る。**
# ⚠️ **§18 の7つのスロットは `specmap.PROMPT_SLOTS` が定める**——`L17` が確かめる。
spec: specs/video/odyssey-s01.md

# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  53秒の頭で、**島と海と光だけで観客を止められるか。**そして**この作品に人が現れない4本**の1本目として、不在を退屈にせずに立てられるか。

motion:
  subject: "海面と、そこを渡る日の道。砂の上の小石、乾いた海藻、風で動く低い潅木。"
  quality: "波は低く、寄せては返し、形を保たない。日の道は水面で細かく砕け、網目のように揺れる。**カメラは寄りながら右へ流れる**——動機は「日の道を追うこと」である。"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ この作品の色の基準が、ここで決まる。以後の34本は、この1本の色から外れてはならない。

# **ビート。不均等に配分する。**
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
# ⛔ **末尾のビートは `dense` である。** **変化は切れ目のコマで終わる。**
#    ⚠️ **切れ目はすべて曲の事象である**——行の頭、または実測の山である。
# ⚠️ **`held` を1つも使わない。** 止まるのは主題であって、画面ではない
#    （`shot-record.schema.json` の `motion`）。
beats:
  - range: "0-1.501s"
    density: transition
    what: "暗い青から、画が立ち上がる。**水面だけが先に見え、岸はまだ判別できない。**"
  - range: "1.501-5.995s"
    density: sparse
    what: "波の面と、砂の粒。**カメラは低く、水面すれすれを右へ。**"
  - range: "5.995-10.5s"
    density: dense
    what: "**日の道ができ、砕け、網目になる。**砂の粒が一つずつ見えはじめ、乾いた海藻が風で転がる——**転がりきるのが、切れ目のコマである。**"

# ⚠️ **`L8` が、これらの鍵が台帳に在るかを確かめる。**
# ⚠️ **`L5` が、参照集合と禁制集合の衝突を確かめる。**
reference_set:
  - "岸"
  - "岸.geography"
  - "岸.states.日没"

# ⚠️ **34本すべてで同一である。** 出所は `bible.negative_base` の8行
#    ＋ この作品の `characters`／`props` の禁制のうち、全編に掛かるもの。
#    ⛔ **この作品の禁制は、全ショットで変わらない**——
#    **ゆえに `ledger.disclosure` の4つの変化点は、4つとも `negative: covered` である。**
forbidden_set:
  - "no watermark"
  - "no on-screen subtitles"
  - "no background music"
  - "no legible text on any surface"
  - "no bow, no arrow, no quiver, no archery"
  - "no classical architecture, no columns, no marble, no temple"
  - "no armour, no helmet, no shield, no sword"
  - "no face for the goddess"
  - "no woman in frame at all, at any distance, in any focus"
  - "no other human being in frame — no companion, no crowd, no second person"
  - "no boat, no ship, no hull, no other vessel"
  - "no blood, no wound, no corpse, no slaughter, no carcass"
  - "no fire, no torch, no lamp, no flame used as a light source"
  - "no modern object, no machine, no synthetic material, no clothing of any later age"

# **このショットが実際に持つ開示状態。**（台帳の `disclosure` は「意図」、こちらが「実際」）
# ⚠️ **34本すべてが4つの属性を持つ。** 持たないショットは開示の検査を受けない（`L7` の `bare`）。
# ⚠️ **`unknown` は「観客がまだ知らない」である。** 台帳の4つの変化点で値が動く。
#    ⚠️ **`absent` は「まだ知らない」ではない**——**「それが無いと知った」である**（`s25`）。
