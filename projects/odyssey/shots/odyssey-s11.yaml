# pre-chorus / still / 反応 / impossible-camera —— 私の顔を見ている——見る主体を写さない
#
# 行: l08 ／ 場所: 森の洞口 ／ 時刻: 夜 ／ 尺: 6.782秒
# ⚠️ **形式（`impossible-camera`）は ② で §6 `REF_FORMAT` に書く提案である。**
#    **ショット記録に `REF_FORMAT` の欄は無い**——形式は仕様（§6）の側にある。
#    ⚠️ **ゆえにここに書いた形式は、まだ検査されていない。**
#
# ⛔ **この一行が、女神に顔を与えない設計の出所である**（`characters.女神` の註）。
#    出所: 曲の `l08`「私の顔を見ている」。
#    ⛔ **写るのは、見られている男の顔である。** **彼女の顔ではない。**
#    ⚠️ **この読み替えが、裁定②（参照なし）と `world.rules` の二番を同時に満たす。**
#
# ⛔ **形式は `impossible-camera`**——**物理的に存在しえない視点**。
#    **彼女の位置は、この作品で唯一カメラが立てる場所である。**
#    ⚠️ **この形式をこの作品で使うのは4本である**（`s11`・`s21`・`s28`・`s33`）。
#
# ⚠️ **`mode: still`。** **止まるのは主題である**——**見られている者は動かない。**
#
# ============================================================================
# ⚠️ **`attached` を書かない。** 書けば「意図にあるのに添付が無い」と鳴るのではなく、
#    「**記録が無い**」と言う（`L6`）。**この作品は、まだ1本も生成していない。**
#    ⚠️ **生成した日に、生成した者が書く。****私ではない**——
#    何が実際に添付されたかを、私は見ていない。**推測で書けば、記録が測定になる。**
#
# ⚠️ **`key_image` を書かない。** 裁定②により、**この作品は参照画像を生成器へ渡さない**
#    ——ゆえに「見せ場の1枚」を参照として作る必要が無い。
#    ⚠️ **人が顔の同一性を目で確かめるための道具としては使える**（生成器は受け取れないが、
#    著者と読者は見られる）。**やるかどうかは著者が決める**（計画の ⚠️6）。
#    **決まるまで、この欄は空である。**
# ============================================================================
shot: odyssey-s11

unit:
  before: "洞の黒の前に、男の横顔がある。"
  after: "**男は視線を動かしていない。****誰かが見ていることが、画面の側に残っている。**"

# **種別（主役）**——`rolemap.ROLES` の15種から。**検収の基準を決める。**
