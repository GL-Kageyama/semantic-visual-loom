# 動画の仕様（§1–20）。**§18 に、この経路のプロンプトが入る。**
# ⚠️ **§18 の7つのスロットは `specmap.PROMPT_SLOTS` が定める**——`L17` が確かめる。
spec: specs/video/odyssey-s11.md

# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  ⛔ **見る主体を一度も写さずに、「見られている」を写せるか。**⚠️ **不可視の視点が、この1本の全部である。**

motion:
  subject: "男の顔。**そして、彼の顔の上を動く光**——光源は枠の外にある。"
  quality: "**彼は動かない。**闇の中の彼の頬に、**誰かの体温のような、ごく弱い光が当たり続ける。**光源は動かず、彼も動かない。**カメラだけが、彼の目と同じ高さへゆっくり上がる。**"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **`mode: still`。** この作品の6本のうちの1本である（`s06` の註を見る）。

# **ビート。不均等に配分する。**
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
# ⛔ **末尾のビートは `dense` である。** **変化は切れ目のコマで終わる。**
#    ⚠️ **切れ目はすべて曲の事象である**——行の頭、または実測の山である。
# ⚠️ **`held` を1つも使わない。** 止まるのは主題であって、画面ではない
#    （`shot-record.schema.json` の `motion`）。
beats:
  - range: "0-2.001s"
    density: transition
    what: "暗い中に横顔がある。**光は当たっていない。**"
  - range: "2.001-4.503s"
    density: sparse
    what: "**頬に、ごく弱い光が当たりはじめる。**光源は枠の外である。**彼は動かない。**"
  - range: "4.503-6.782s"
    density: dense
    what: "**光が当たり続ける。**彼は一度も視線を動かさない——**動かさないことが、切れ目のコマである。**"

