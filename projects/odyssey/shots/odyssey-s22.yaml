# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  **2度目であることを、退屈にせずに持てるか。**⚠️ **`s15` より、少しだけ遠くにあるように見えるか。**

motion:
  subject: "水面、水平線、空。"
  quality: "**`s15` とほぼ同じ動きを、より遠い位置から。**近い水面は速く、遠い水平線は動かない。カメラは三脚の上で、動かない。"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **この作品は、サビの反復に同じ手当てを2度する**——**差分は、曲が2度目に置いたものが持つ。****この方針は3度目（`s29`）でも同じである。**

# **ビート。不均等に配分する。**
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
# ⛔ **末尾のビートは `dense` である。** **変化は切れ目のコマで終わる。**
#    ⚠️ **切れ目はすべて曲の事象である**——行の頭、または実測の山である。
# ⚠️ **`held` を1つも使わない。** 止まるのは主題であって、画面ではない
#    （`shot-record.schema.json` の `motion`）。
beats:
  - range: "0-2.995s"
    density: transition
    what: "水面と水平線。**遠さが二つある。**"
  - range: "2.995-6.996s"
    density: sparse
    what: "**近い水面が流れる。**遠い水平線は動かない。"
  - range: "6.996-10.931s"
    density: dense
    what: "**二つの遠さが、同じ一枠にある。****`s15` より遠い**——**それが切れ目のコマである。**"

