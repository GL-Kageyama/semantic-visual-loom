spec: specs/video/odyssey-s03.md

# **狙い。** このショットが何を試すのか。⚠️ **この欄を読む検査は、まだ1つも無い。**
aim: >-
  ⛔ **切らずに、時間そのものを画面上で通過させられるか。**53秒の無音区間の真ん中で、**観客に「時間が経っている」と信じさせられるか。**

motion:
  subject: "水面、雲、そして光そのもの。**主題は時間である。**"
  quality: "波は同じ速さで寄せ続けるが、**その色が18秒のあいだに段階的に落ちる。**影が伸び、雲が流れ、星が一つ、二つと出る。カメラはほぼ動かない——**三脚の上で、わずかに左へ回るだけである。**"
  law: >-
    `cinematic-still` の運動である。**この様式は、動機のあるカメラ移動だけを許す**——ドリー・クレーン・ステディカムは動いてよいが、**動機の無い移動は禁じられる。**ゆえにこの作品のカメラは、常に何かを追っているか、何かへ寄っているか、何かから離れている。⚠️ **第二のセットアップへのカットをしない**——1本は1つの画である。⚠️ **均平なテレビ照明をしない**——光は演出的である。⚠️ **手ぶれをしない。** ⚠️ ⚠️ **主題は「時間の運動」である**（`rolemap.MOTION_PATTERNS` の「時間の運動」——「その速度である理由・速度が開示するもの」）。**速さは、この1本の内容である。**

# **ビート。不均等に配分する。**
# ⚠️ **`L37` が敷き詰めを検算する**——0 から始まり、`duration` で終わり、隣が接していること。
# ⛔ **末尾のビートは `dense` である。** **変化は切れ目のコマで終わる。**
#    ⚠️ **切れ目はすべて曲の事象である**——行の頭、または実測の山である。
# ⚠️ **`held` を1つも使わない。** 止まるのは主題であって、画面ではない
#    （`shot-record.schema.json` の `motion`）。
beats:
  - range: "0-3.996s"
    density: transition
    what: "日がまだ高い。**水面は一つの色で、影は短い。**"
  - range: "3.996-9s"
    density: sparse
    what: "光が斜めになり、水面の反射が長くなる。**雲が右から左へ渡る。**"
  - range: "9-14.004s"
    density: dense
    what: "**日が水面に接する。**反射が一本の道になり、割れる。**空の色が橙から灰へ移る。**"
  - range: "14.004-18s"
    density: dense
    what: "**日が沈む。**星が二つ出て、海と空の境が消える——**境が消えるのが、切れ目のコマである。**"

