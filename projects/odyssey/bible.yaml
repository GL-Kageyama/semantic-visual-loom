# 作品台帳 — 主題歌MV『永遠より遠い』（odyssey）
#
# ⚠️ **これは本編でも宣伝でもない。主題歌MVである。**
#    **時間の主が曲である**（`bible.time_source: song`）——`L34`（尺）と `L36`（歌詞の覆い）が、
#    **この作品でだけ鳴る。**
#
# ⚠️ **出所が二つある。どちらも配布物であり、このリポジトリの外にある。**
#    ① 曲: `soul-voice-teller/examples/odyssey/出力/`（Suno の出力4本）
#    ② 歌詞と設計: `soul-voice-teller/examples/odyssey/theme-song.md`
#    ⚠️ **この作品は、そのどちらも複製しない。** 曲は入れない。歌詞は
#       `bible.song.lines` に**引く**——**引くことは、複製することではない。**
#
# ⚠️ **原作はホメロス『オデュッセイア』である。このリポジトリはそれを書いていない。**
#    ゆえに `projects/odyssey/` は**本編を持たない**——**本編が無い主題歌MVである。**
#    これは欠陥ではない。**曲が与えられ、画面を配る**という形は、本編の有無に依らない。
#
# ─────────────────────────────────────────────────────────── 裁定（2026-09-29、著者）
#
# ⚠️ **以下の4つは著者が選んだ。この作品はその下で書かれている。**
#    ① **様式は `cinematic-still`**（実写の1枚。7枚の写真カードを読んで比較した——
#       ドリー・クレーン・ステディカムを許し、演出された照明を許すのはこれだけである。
#       ⚠️ **他の6枚は「壮大」と両立しない**——`landscape-photo` は人物の入場を禁じ、
#       `documentary-photo` は劇的なカメラ移動を禁じ、`instant-photo` は連続動作を禁じる）。
#    ② **人物の同一性は、参照なし・プロンプトのみ。**
#       ⚠️ **これは選好ではなく、経路の事実である**——`docs/seedance-route.md`:
#       「The vendor states that this route **does not accept reference images or reference
#       videos containing real human faces**. **A work whose people are real cannot take
#       this route.**」 **実写の作品は、顔の参照を渡せない。**
#    ③ **物語の境界は、歌と同じである。** 第五巻の岸と、放浪の記憶まで。
#       **帰還・上陸・犬・弓・殺害・床・和睦を映さない。**
#    ④ **16:9 / 1920×1080 / 24fps / Landscape。**
#
#    ⚠️ **①と③は、この作品の `negative_base` と `world.rules` に落ちている。**
#       裁定は、置き場を持たなければ効かない。

project: odyssey

bible:
  # 作品の様式。**様式カードの名前である。** 作品定数——**ショットは様式を名乗れない。**
  # 出所: 著者の裁定①（2026-09-29）。
  #       ⚠️ **この欄が §18 の7つ目のスロット `Style Motion` の出所である**（`specmap.PROMPT_SLOTS`）。
  #       ⚠️ **`L31` が、§6 の `REF_STYLE` とこの欄の一致を読む。**
  style: cinematic-still

  # 作品が話す言語。**値は英語で書く**（生成に渡る文字列は英語である——訳してはならない）。
  # ⚠️ **空欄は中立ではない。** 実測: 発話を検出した動画に**中国語の字幕が焼かれた**。
  #    だから**症状を禁じるのではなく、言語を名指す**（`L27`）。
  # ⚠️ **この作品は、歌以外に何も喋らない。** それでも名指す——
  #    **歌は日本語であり、この作品の言語は日本語である。**
  language: Japanese

  # ─────────────────────────────────────────────────── 時間の主は、曲である
  #
  # ⚠️ **この一行が門である。** これを書かない限り、`bible.song` は註のために在るだけになる。
  # 出所: 裁定③（物語の境界は歌と同じ）と、habits-mv の同じ欄。
  time_source: song

  song:
    # 採用された1本。
    # ⚠️ **実体は、このリポジトリに無い。** 曲は入れない——**著作権と利用条件の記録は
    #    作品側に置く**（habits-mv の同じ欄の註を読む）。置き場は `media/` である
    #    ——**そこが「標本の置き場」だからである**（`renders/` は作品、`media/` は標本）。
    # ⚠️ **この欄を読む層は無い。** 書くのは、人が後から辿れるようにするためである。
    master: media/永遠より遠い.wav

    # ⚠️ **実測値である。頼んだ尺ではない。**
    #    出所: `ffprobe -show_entries format=duration`（実測 2026-09-29）。
    #    ⚠️ **Suno の4つの出力は尺が違う**——`wav` 299.920／`m4a` 299.920／
    #       `mp3` 299.952／`mp4` 299.605。**この作品は `wav` と `m4a` を採る。**
    #    ⚠️ **`mp4` は素材にできない**——実測で `h264 824×1464`（9:16 の縦）であり、
    #       **Suno の mp4 はジャケット画と歌詞の焼き込みを持つ。**
    #       焼かれた歌詞は `L21` の床（`no on-screen subtitles`）に触れる。
    #       **MV は `wav` か `m4a` から作る。**
    #    ⚠️ **`duration` は `L34` が読む唯一の数である。実物を開く層は無い**
    #       ——ゆえに**この数が本当にそのファイルの尺であるかは、誰も確かめない**（穴である）。
    duration: 299.920

    # ─────────────────────────────────────────────── 曲の区切り（9節）
    #
    # ⚠️ **曲の中に既に在る区切りは材料である。**（habits-mv の同じ欄）
    #    下の8節は、**Suno が返した節マーカーをそのまま採った**ものである。
    #    マーカーは8つ——`[Verse 1]`(52.899) `[Pre-Chorus: distant female voice]`(81.622)
    #    `[Chorus]`(113.617) `[Verse 2]`(138.032) `[Chorus]`(181.037) `[Bridge]`(205.053)
    #    `[Final Chorus]`(240.878) `[Outro]`(281.489)。
    #
    # ⚠️ **`intro` だけは、マーカーが無いので書き足した。** 実測:
    #    **`[Intro]` のキューは 52.899秒に在り、`[Verse 1]` と同じ時刻である**——
    #    **これは区切りではなく、最初の行の直前に置かれた印である。**
    #    ⚠️ **ゆえに頭 52.899秒には、曲の内側の区切りが一つも無い。**
    #    ⚠️ **足さなければ `Σ` は `duration` に届かない**（`L34` がそれを鳴らす）。
    #
    # ⚠️ **節の名は、曲の語である。** **作品の語に訳さない。**
    #    同名の節が2つ以上あるので番号を振る（`chorus-1` / `chorus-2`）。
    #    **これは名の重複を避けるためであって、順番の主張ではない。**
    #
    # ⚠️ **`regime` は、この作品が決めたことである。** 決め方は habits-mv と同じ——
    #      **長回し＝明かす／ビート＝響かせる。**
    #      **歌詞の1行が2.4〜2.5秒で畳みかけてくる節は `beat`。1行が息を長く持つ節は `long-take`。**
    #
    # ⛔ **この曲は、9節すべてが `long-take` である。** これは判断ではなく実測である——
    #    **節ごとの1行あたりの秒数**: intro 該当なし／verse-1 5.744／pre-chorus 7.999／
    #    chorus-1 6.104／verse-2 8.601／chorus-2 6.004／bridge 7.165／
    #    final-chorus 6.769／outro 18.431。
    #    ⚠️ **この曲で最も短い歌詞行は 3.510秒である**（`l04` 向こうに妻がいる、
    #       `l17` 北斗は沈まない）。**2.4〜2.5秒の行が、この曲には1行も無い。**
    #    ⚠️ **habits-mv は `beat` の節を4つ持っていた。この作品は1つも持たない。**
    #       **「重厚で壮大」という要望が、実測にそう出ている。**
    #
    # ⚠️ **`bpm` と `meter` は、この作品のどこにも無い。** Suno は BPM もキーも書かない。
    #    `theme-song.md` は「68 bpm・4/4」と**指定**しているが、それは指定であって
    #    **届いた音の実測ではない。指定を実測として書かない。** `L35` は予約のままである。
    sections:
      # 0.000–52.899。**マーカーが無いので書き足した唯一の節である。**
      # 1行も歌われない。**ここは `L36` の「歌を持たない区間」であり、画面が全部を負う**
      # ——ゆえに `ledger.song_coverage` は、この節だけを**節ごとに**受ける。
      # ⚠️ **52.899秒は、この曲の17.6%である。**
      - { id: intro, at: 0.000, until: 52.899, regime: long-take }
      # 52.899–81.622（28.723秒・5行）。1行 3.5〜8.0秒。**日のあるかぎり、岸に出ていた。**
      - { id: verse-1, at: 52.899, until: 81.622, regime: long-take }
      # 81.622–113.617（31.995秒・4行）。**女神が差し出し、男が返事をしない。**
      # ⚠️ **この節の中に 0.452秒の歌の無い間が在る**（96.649–97.101。`l07` と `l08` の間）。
      - { id: pre-chorus, at: 81.622, until: 113.617, regime: long-take }
      # 113.617–138.032（24.415秒・4行）。**最初のサビ。ここだけ言葉が4行で反復する。**
      - { id: chorus-1, at: 113.617, until: 138.032, regime: long-take }
      # 138.032–181.037（43.005秒・5行）。**夜明け。斧が木を叩く。舟ができる。**
      # ⚠️ **この曲で最も長い節である**（9節を並べた実測——43.005秒）。
      # ⚠️ **`l14` の直後に 7.234秒の歌の無い間が在る**（148.032–155.266）。
      #    これは**この曲で最も長い、歌の無い間である**——**斧の音だけが鳴る7秒。**
      - { id: verse-2, at: 138.032, until: 181.037, regime: long-take }
      # 181.037–205.053（24.016秒・4行）。**サビの反復。言葉は `chorus-1` と同一である。**
      - { id: chorus-2, at: 181.037, until: 205.053, regime: long-take }
      # 205.053–240.878（35.825秒・5行）。**この曲で唯一、島と海の外へ出る節である**
      # ——太陽の牛、仲間の死、そして「誰でもない」という名。
      # ⚠️ **`l23` の直後に 1.649秒、`l27` の直後に 1.091秒の歌の無い間が在る。**
      - { id: bridge, at: 205.053, until: 240.878, regime: long-take }
      # 240.878–281.489（40.611秒・6行）。**言葉が `chorus-1` と2点だけ違う**——
      #   ① `なんでもない島へ` が 3.910秒から **6.542秒** へ伸びる。
      #   ② `まだ着かない` が**2行に増える**（`chorus-1`・`chorus-2` には無い）。
      # ⚠️ **サビ3回のうち、この回だけが違う。** 差分はここに在る。
      - { id: final-chorus, at: 240.878, until: 281.489, regime: long-take }
      # 281.489–299.920（18.431秒・1行）。**最後の1行が10.000秒を1人で持ち、
      # そのあと 8.431秒の後奏が続く。** **この作品の最後の画面は、この8.4秒である。**
      - { id: outro, at: 281.489, until: 299.920, regime: long-take }

    # ─────────────────────────────────────────────── 歌詞行（34行）
    #
    # ⚠️ **`id` は、この基盤の側で振った。** Suno の字幕から引けるのは `at` と `text` までであり、
    #    **行の ID は引けない。** ゆえに `l01`〜`l34` は**この一枚が与える名である**
    #    ——`ledger.song_coverage` が引く。
    #
    # ⚠️ **`at` は Suno の字幕の時刻である**（実測 2026-09-29、`m4a` の `mov_text` トラックから
    #    `ffmpeg -f srt` で取り出した43キュー）。**推測ではない。**
    #
    # ⚠️ **それが「歌われた時刻」である保証は無い。** ——**この曲では、それが見えている。**
    #    実測: **ちょうど 10.000秒の行が5本ある**（`l07` 86.649–96.649／`l14` 138.032–148.032／
    #    `l23` 205.053–215.053／`l27` 229.787–239.787／`l34` 281.489–291.489）。
    #    ⚠️ **これは字幕キューの上限が10秒であることを疑わせる。**
    #       **ゆえに「10.000秒の行は10秒歌われた」と読まない。**
    #    ⚠️ **この一点は、`L34` と `L36` の前提ではない**——両層が読むのは
    #       「対応が在るか」と「合計が合うか」だけである。
    #
    # ⚠️ **空の行を作らない。** 歌を持たない区間は、**節で受ける**（`intro` がそれである）
    #    か、**隣の行のショットが吸う**（下の註を見る）。
    #    ⚠️ **歌の無い間に、専用の行を作らない**——**それは容器である。**
    lines:
      # [Verse 1] 52.899–81.622（5行）
      - { id: l01, at: 52.899, section: verse-1, text: "日のあるかぎり岸に出て" }
      - { id: l02, at: 60.479, section: verse-1, text: "海の方を見ていた" }
      - { id: l03, at: 66.622, section: verse-1, text: "向こうに家がある" }
      - { id: l04, at: 70.133, section: verse-1, text: "向こうに妻がいる" }
      - { id: l05, at: 73.644, section: verse-1, text: "それを口にしない" }
      # [Pre-Chorus: distant female voice] 81.622–113.617（4行）
      # ⚠️ **`l07` と `l08` の間に 0.452秒の歌の無い間が在る**（96.649–97.101）。
      #    **この作品は `l07` のショットに吸わせる**——10.452秒である。
      - { id: l06, at: 81.622, section: pre-chorus, text: "女神は言う ここにいれば" }
      - { id: l07, at: 86.649, section: pre-chorus, text: "老いない 死なない" }
      - { id: l08, at: 97.101, section: pre-chorus, text: "私の顔を見ている" }
      - { id: l09, at: 103.883, section: pre-chorus, text: "私は海を見ている" }
      # [Chorus] 113.617–138.032（4行）
      - { id: l10, at: 113.617, section: chorus-1, text: "死なない島を出て" }
      - { id: l11, at: 121.356, section: chorus-1, text: "海を渡る" }
      - { id: l12, at: 127.101, section: chorus-1, text: "永遠より遠い" }
      - { id: l13, at: 134.122, section: chorus-1, text: "なんでもない島へ" }
      # [Verse 2] 138.032–181.037（5行）
      # ⚠️ **`l14` の直後に 7.234秒の歌の無い間が在る**（148.032–155.266）。
      #    **この曲で最も長い、歌の無い間である。** **`l14` のショットが吸う**——17.234秒。
      - { id: l14, at: 138.032, section: verse-2, text: "木を削って舟にする" }
      - { id: l15, at: 155.266, section: verse-2, text: "帆を縫って風を待つ" }
      - { id: l16, at: 161.809, section: verse-2, text: "星を数えて舵を取る" }
      - { id: l17, at: 168.910, section: verse-2, text: "北斗は沈まない" }
      - { id: l18, at: 172.420, section: verse-2, text: "沈まない星を見ている" }
      # [Chorus] 181.037–205.053（4行）。**言葉は `chorus-1` と同一である。**
      - { id: l19, at: 181.037, section: chorus-2, text: "死なない島を出て" }
      - { id: l20, at: 187.979, section: chorus-2, text: "海を渡る" }
      - { id: l21, at: 194.122, section: chorus-2, text: "永遠より遠い" }
      - { id: l22, at: 201.144, section: chorus-2, text: "なんでもない島へ" }
      # [Bridge] 205.053–240.878（5行）
      # ⚠️ **`l23` の直後に 1.649秒、`l27` の直後に 1.091秒の歌の無い間が在る。**
      - { id: l23, at: 205.053, section: bridge, text: "あの者たちは太陽の牛を屠った" }
      - { id: l24, at: 216.702, section: bridge, text: "私だけが浮いていた" }
      - { id: l25, at: 221.410, section: bridge, text: "誰でもないと名乗った" }
      - { id: l26, at: 225.000, section: bridge, text: "誰でもない者にも" }
      - { id: l27, at: 229.787, section: bridge, text: "帰る先がひとつある" }
      # [Final Chorus] 240.878–281.489（6行）。**`chorus-1` との差分は2点である。**
      - { id: l28, at: 240.878, section: final-chorus, text: "死なない島を出て" }
      - { id: l29, at: 248.378, section: final-chorus, text: "海を渡る" }
      - { id: l30, at: 254.122, section: final-chorus, text: "永遠より遠い" }
      - { id: l31, at: 261.144, section: final-chorus, text: "なんでもない島へ" }
      - { id: l32, at: 267.686, section: final-chorus, text: "まだ着かない" }
      - { id: l33, at: 274.787, section: final-chorus, text: "まだ着かない" }
      # [Outro] 281.489–299.920（1行）
      # ⚠️ **`l34` のあとに 8.431秒の後奏が続く**（291.489–299.920）。**歌は無い。**
      - { id: l34, at: 281.489, section: outro, text: "耐えよ わが心よ" }

  # ─────────────────────────────────────────────────────────── 世界
  world:
    # 出所: 裁定③（物語の境界は歌と同じ）と、`theme-song.md` の「歌う場面」。
    concept: >-
      **オギュギエ島の岸。** 海に囲まれた島の、低い波の打つ浜。
      **この島は、死なない島である。** 女神カリュプソが住み、彼女は男に不死を差し出す。
      ⚠️ **島の内側（森と洞窟）は在るが、この作品はそこへ入らない**——
      **男は岸にいて、海の方を見ている。** 洞窟は**口から外へ向かって**だけ写る。
      ⚠️ **固有名は、画面にも歌にも一度も現れない。** 「オギュギエ」「カリュプソ」
      「オデュッセウス」「イタケ」——**どれも置かない。** ゆえに台帳の鍵も
      **`男`・`女神`・`岸`** であり、**人名ではない。**

    # ⚠️ **規則は、ショットの中で検査できる形で書く。** 検査はしない——**人が読む。**
    #    ゆえに**散文の標語ではなく、「この作品に一度も現れないもの」として書く。**
    rules:
      - "**返事は、この作品の中で一度も返されない。** 女神は差し出し、男は何も言わない。**口を開くショットが1本も無いことが、この作品の形である。**"
      - "**女神は差し出したあとも、道具を与える。** 斧・錐・帆の布・星の道——**断られた側が、出発の術を教える。** ゆえにこの作品に、女神を退けるショットは1本も無い。"
      - "**固有名は、画面にも歌にも一度も現れない。** 名を書けば、この作品は「彼の作品」でなく「彼についての作品」になる。"
      - "**弓は、この作品に一度も現れない。** 弓は結末である——**裁定③が閉じた側にある。斧は第五巻の内側にあり、弓は外にある。**"
      - "**この作品は、帰り着かない。** 上陸・犬・乳母・殺害・床・和睦を映さない。**最後の画面でも、舟はまだ沖にある。**"
      - "**字は、どの面にも一度も現れない。** この作品は書かない——**名は呼ばれるが、書かれない。**"
      - "**神話のギリシアは、この作品の様式ではない。** 大理石も円柱も神殿も無い——**詩は古典以前である。** 石は荒い。木と布と青銅がある。"

    # ⚠️ **この欄だけ英語である。** 生成に渡す文字列は英語であり、訳してはならない。
    #    出所は日本語である——ゆえにこの欄は「写し」ではなく「移し替え」である。
    visual_language:
      art_direction: >-
        A bronze-age Mediterranean island shore at the end of the day. Rough wet stone,
        coarse sand, low dense scrub, sea-worn driftwood. Undyed wool and stiff salt cloth;
        a bronze double-axe with a patina; a raft of unseasoned timber and a sail of hand-sewn
        cloth. The sea is the largest object in every frame that contains it. Light is the
        sun's own — low, raking, and going down — and after it there is only firelight,
        starlight, and the moon's reflected path on the water. No marble, no columns, no
        architecture of any later age. No legible text on any surface.
      era: "The age of the poem — bronze-age Mediterranean, before classical Greece. It does not move."

